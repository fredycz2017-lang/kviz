<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz Davis Cup 2026</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#202124;--muted:#666;--line:#d8d8d8;--accent:#2f6fed;--choice:#e8edff;--choice-border:#c8d3ff;--ok:#e9f7ee;--ok-border:#69a77a;--bad:#fdecec;--bad-border:#cf7777}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:100%;max-width:700px;margin:0 auto;padding:22px 10px 18px}.head{text-align:center;padding:0 10px 14px}
h1{margin:0 0 10px;font-size:29px;line-height:1.15}.sub{margin:0 auto 8px;max-width:620px;font-size:16px;line-height:1.45;color:#444}.note{margin:0;font-size:13px;color:var(--muted)}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 20px 22px;min-height:430px}
.progress{text-align:center;color:var(--muted);font-size:14px;margin:0 0 12px}.q{text-align:center;font-size:23px;line-height:1.28;color:var(--accent);margin:12px 0 22px}.answers{max-width:520px;margin:0 auto}
.answer{display:block;width:100%;border:1px solid var(--choice-border);background:var(--choice);color:var(--text);padding:16px 14px;margin:10px 0;font-size:17px;cursor:pointer}
.answer:hover{filter:brightness(.98)}.answer.correct{background:var(--ok);border-color:var(--ok-border)}.answer.wrong{background:var(--bad);border-color:var(--bad-border)}.answer:disabled{cursor:default;filter:none}
.feedback{display:none;max-width:550px;margin:18px auto 0;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.45;color:#444}.feedback.show{display:block}
.next{display:none;margin:16px auto 0;border:0;border-radius:6px;padding:12px 22px;background:#222;color:white;font-size:16px;cursor:pointer}.next.show{display:block}
.result{display:none;text-align:center;padding:34px 20px}.result.show{display:block}.score{font-size:48px;font-weight:800;margin:8px 0 12px}
.retry{border:0;border-radius:6px;padding:12px 22px;background:#222;color:#fff;font-size:16px;cursor:pointer}
@media(max-width:560px){.app{padding-top:14px}h1{font-size:24px}.sub{font-size:15px}.quizbox{padding:10px 12px 18px;min-height:410px}.q{font-size:20px;margin-bottom:18px}.answer{font-size:16px;padding:14px 12px}}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>Jak dobře znáte Davis Cup?</h1>
    <p class="sub">O2 arena, drama s USA, Shelton, Menšík, Lehečka i české tituly. Patnáct otázek pro fanoušky, kteří sledovali víc než jen poslední míček.</p>
    <p class="note">Aktualizováno po duelu Česko–USA 3:2 z 18.–19. září 2026.</p>
  </div>
  <div class="quizbox">
    <div id="play">
      <div id="progress" class="progress"></div>
      <div id="question" class="q"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="next">Další otázka</button>
    </div>
    <div id="result" class="result">
      <div>Váš výsledek</div>
      <div id="score" class="score"></div>
      <p id="verdict"></p>
      <button id="retry" class="retry">Zkusit znovu</button>
    </div>
  </div>
</div>
<script>
const questions = [{"q": "Kde se hrál duel Česko–USA v kvalifikaci Davis Cupu 2026?", "opts": ["O2 arena v Praze", "Winning Group Arena v Brně", "Horácká aréna v Jihlavě", "KV Arena v Karlových Varech"], "correct": 0, "explain": "Česko hostilo USA 18. a 19. září 2026 v pražské O2 areně."}, {"q": "Jak skončil celý duel Česko–USA v Praze?", "opts": ["3:0 pro Česko", "3:1 pro USA", "3:2 pro Česko", "2:3 pro USA"], "correct": 2, "explain": "Český tým zvítězil 3:2 a postoupil na Final 8."}, {"q": "Kdo získal první bod celého utkání?", "opts": ["Jakub Menšík", "Learner Tien", "Jiří Lehečka", "Ben Shelton"], "correct": 1, "explain": "Learner Tien porazil Jakuba Menšíka 6:2, 6:4 a poslal USA do vedení 1:0."}, {"q": "Koho porazil Jiří Lehečka v pátek a srovnal stav na 1:1?", "opts": ["Bena Sheltona", "Learnera Tiena", "Austina Krajicka", "Christiana Harrisona"], "correct": 0, "explain": "Lehečka porazil americkou jedničku Bena Sheltona 6:4, 6:4."}, {"q": "Jak skončila sobotní čtyřhra?", "opts": ["Vyhráli Pavlásek s Riklem ve dvou setech", "Vyhráli Američané po třech setech", "Zápas se nehrál", "Rozhodl supertiebreak místo třetího setu"], "correct": 1, "explain": "Christian Harrison s Austinem Krajickem vyhráli 5:7, 6:3, 7:6 a poslali USA do vedení 2:1."}, {"q": "Kolik mečbolů český pár v deblu nevyužil?", "opts": ["Jeden", "Dva", "Tři", "Čtyři"], "correct": 3, "explain": "Adam Pavlásek a Patrik Rikl měli čtyři mečboly, ale americký pár všechny odvrátil."}, {"q": "Kdo za stavu 1:2 udržel Česko ve hře výhrou nad Benem Sheltonem?", "opts": ["Jiří Lehečka", "Jakub Menšík", "Patrik Rikl", "Adam Pavlásek"], "correct": 1, "explain": "Jakub Menšík otočil duel se Sheltonem a vyhrál 5:7, 6:4, 6:3."}, {"q": "Kdo rozhodl pátý zápas a celý duel ve prospěch Česka?", "opts": ["Jakub Menšík", "Jiří Lehečka", "Adam Pavlásek", "Tomáš Macháč"], "correct": 1, "explain": "Jiří Lehečka v rozhodujícím utkání porazil Learnera Tiena 6:3, 7:5."}, {"q": "Kam Česko vítězstvím nad USA postoupilo?", "opts": ["Na United Cup", "Na Final 8 Davis Cupu", "Do finále Australian Open", "Na Laver Cup"], "correct": 1, "explain": "Výhra poslala český tým na listopadový Final 8 Davis Cupu."}, {"q": "Ve kterém městě se koná Final 8 Davis Cupu 2026?", "opts": ["Madrid", "Málaga", "Bologna", "Turín"], "correct": 2, "explain": "Final 8 je v roce 2026 naplánováno do italské Boloni."}, {"q": "Kdy se hraje Final 8 Davis Cupu 2026?", "opts": ["24.–29. listopadu", "1.–6. října", "12.–17. prosince", "20.–25. září"], "correct": 0, "explain": "Finálový turnaj osmi týmů je naplánovaný na 24.–29. listopadu 2026."}, {"q": "Kdo byl kapitánem českého daviscupového týmu v duelu s USA 2026?", "opts": ["Tomáš Berdych", "Radek Štěpánek", "Jaroslav Navrátil", "Ivan Lendl"], "correct": 0, "explain": "Český tým vedl jako kapitán Tomáš Berdych."}, {"q": "Kolik diváků sledovalo podle reportáží Lehečkův páteční duel se Sheltonem v O2 areně?", "opts": ["Přes 13 tisíc", "Přibližně 5 tisíc", "Méně než 3 tisíce", "Přes 25 tisíc"], "correct": 0, "explain": "Reportáže uváděly více než 13 tisíc diváků v pražské O2 areně."}, {"q": "Kolikrát Česko vyhrálo Davis Cup v letech 2012 a 2013?", "opts": ["Ani jednou", "Jednou", "Dvakrát po sobě", "Třikrát po sobě"], "correct": 2, "explain": "Český tým získal titul v letech 2012 i 2013, tedy dvakrát za sebou."}, {"q": "Kde Česko vyhrálo finále Davis Cupu 2012?", "opts": ["V pražské O2 areně", "V Bělehradě", "V Madridu", "V Ostravě"], "correct": 0, "explain": "Finále 2012 proti Španělsku se hrálo v pražské O2 areně a Česko zvítězilo 3:2."}];
let index=0,score=0,locked=false;
const progress=document.getElementById('progress'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),play=document.getElementById('play'),result=document.getElementById('result');

function renderQuestion(){
  locked=false;feedback.className='feedback';next.className='next';
  const item=questions[index];
  progress.textContent=`Otázka ${index+1} / ${questions.length}`;
  question.textContent=item.q;answers.innerHTML='';
  item.opts.forEach((opt,oi)=>{
    const btn=document.createElement('button');btn.className='answer';btn.textContent=opt;
    btn.addEventListener('click',()=>choose(oi,btn));answers.appendChild(btn);
  });
}
function choose(oi,clicked){
  if(locked)return;locked=true;const item=questions[index];
  const buttons=[...answers.querySelectorAll('.answer')];
  buttons.forEach((btn,i)=>{btn.disabled=true;if(i===item.correct)btn.classList.add('correct');});
  if(oi===item.correct)score++;else clicked.classList.add('wrong');
  feedback.textContent=item.explain;feedback.classList.add('show');
  next.textContent=index===questions.length-1?'Zobrazit výsledek':'Další otázka';next.classList.add('show');
}
next.addEventListener('click',()=>{index++;if(index>=questions.length)showResult();else renderQuestion();});
function showResult(){
  play.style.display='none';result.classList.add('show');
  document.getElementById('score').textContent=`${score}/15`;
  let verdict='';
  if(score<=4)verdict='Davis Cup jste možná sledovali hlavně kvůli atmosféře. A upřímně, v O2 areně to není špatný důvod.';
  else if(score<=8)verdict='Slušný základ. Berdych by vás ještě do nominace nevzal, ale na tribuně byste se neztratili.';
  else if(score<=12)verdict='Velmi dobré. Pražské drama s USA máte očividně pořád v hlavě.';
  else if(score<=14)verdict='Výborný výkon. Jeden detail a bylo by to bez chyby.';
  else verdict='15/15. Tohle už je úroveň člověka, který by mohl po osmihodinovém dni v O2 areně ještě vysvětlovat ostatním formát Davis Cupu.';
  document.getElementById('verdict').textContent=verdict;
}
document.getElementById('retry').addEventListener('click',()=>{index=0;score=0;result.className='result';play.style.display='block';renderQuestion();});
renderQuestion();
</script>
</body></html>
