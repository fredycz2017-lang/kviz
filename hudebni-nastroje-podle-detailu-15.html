ts span{border:1px solid #35322d;border-radius:8px;padding:8px;font-size:10px;color:#777}.parts span.done{border-color:#e6c46b;color:#f0dc9b}.result{display:none;text-align:center;padding:70px 10px}.score{font-size:76px;font-weight:1000;color:#e6c46b}.restart{border:1px solid #e6c46b;background:#171717;color:#e6c46b;padding:13px 19px;font-weight:900;border-radius:8px}@media(max-width:820px){.bench{grid-template-columns:1fr}.rack{order:-1;position:static}.parts{grid-template-columns:repeat(5,1fr)}.scope{height:270px;border-width:8px}.opts{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body><div class="shop"><header><div><div class="k">ORCHESTRÁLNÍ SERVIS // DETAIL POD LUPOU</div><h1>Kvíz: Klarinet, fagot, trombon. Poznáte 15 hudebních nástrojů jen podle jednoho detailu?</h1></div><div id="prog">01/15</div></header><div class="bench"><main class="stage"><div id="quiz"><div class="scope" id="scene"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">ODKRÝT DALŠÍ DETAIL →</button></div><section class="result" id="result"><div class="k">SERVISNÍ PROTOKOL UZAVŘEN</div><div class="score" id="score"></div><h2 id="grade"></h2><button class="restart" id="restart">PROJÍT NÁSTROJE ZNOVU</button></section></main><aside class="rack"><div class="k">SERVISNÍ STOJAN</div><h3>15 kontrolních bodů</h3><div class="parts" id="parts"></div></aside></div></div><script>const Q=[{"kind":"clarinet","q":"Detail ukazuje hubičku s jedním plátkem přichyceným ligaturou. Který nástroj je nejpravděpodobnější?","e":"Klarinet používá jednoduchý plátek upevněný na hubičce; hoboj a fagot používají dvojitý plátek.","o":["Klarinet","Hoboj","Příčná flétna","Fagot"],"a":0},{"kind":"oboe","q":"Dva tenké plátky jsou svázané proti sobě a hráč je vkládá přímo mezi rty. Který nástroj odpovídá detailu?","e":"Hoboj je dvojplátkový dřevěný dechový nástroj.","o":["Klarinet","Trombon","Příčná flétna","Hoboj"],"a":3},{"kind":"bassoon","q":"Z dlouhého dřevěného těla vystupuje zahnutá kovová trubička – bocal – zakončená dvojitým plátkem. Co servisujeme?","e":"Fagot má charakteristický zahnutý bocal, na němž je nasazen dvojitý plátek.","o":["Lesní roh","Violoncello","Fagot","Klarinet"],"a":2},{"kind":"trombone","q":"Na stole leží dlouhé dvojité trubice, které se zasouvají do sebe a mění délku nástroje. Co je to?","e":"Trombon mění výšku tónu především posouváním teleskopického snižce.","o":["Fagot","Trombon","Trumpeta","Lesní roh"],"a":1},{"kind":"horn","q":"Detail tvoří kruhově stočené trubice a tři pákové rotační ventily. Který žesťový nástroj to je?","e":"Lesní roh má dlouhou trubici stočenou do kompaktního kruhu a běžně používá rotační ventily.","o":["Lesní roh","Trombon","Trumpeta","Tuba"],"a":0},{"kind":"trumpet","q":"Tři pístové ventily v jedné řadě a malý miskovitý nátrubek: který nástroj poznáváte?","e":"Typická orchestrální trumpeta má tři pístové ventily a žesťový nátrubek.","o":["Trombon","Hoboj","Příčná flétna","Trumpeta"],"a":3},{"kind":"flute","q":"Na hlavici je kulatý otvor pro proud vzduchu, ale žádný plátek. Co to je?","e":"Příčná flétna vytváří tón proudem vzduchu přes hranu nátiskového otvoru a nepoužívá plátek.","o":["Hoboj","Fagot","Příčná flétna","Klarinet"],"a":2},{"kind":"violin","q":"Detail ukazuje kobylku, čtyři struny a jeden výrazný otvor ve tvaru písmene f na malém smyčcovém těle. Který nástroj?","e":"Housle mají čtyři struny vedené přes kobylku a typické f-otvory v rezonanční desce.","o":["Klarinet","Housle","Harfa","Akordeon"],"a":1},{"kind":"cello","q":"Ze spodní části velkého smyčcového nástroje vyjíždí kovový bodec opřený o podlahu. Co je to?","e":"Violoncello se při hře opírá o podlahu pomocí výsuvného bodce, tzv. endpinu.","o":["Violoncello","Housle","Harfa","Trumpeta"],"a":0},{"kind":"harp","q":"U paty nástroje je sedm pedálů propojených s dlouhými strunami nad nimi. Který nástroj má tento detail?","e":"Moderní koncertní pedálová harfa používá sedm pedálů pro změnu výšky strun jednotlivých tónových tříd.","o":["Klavír","Tympány","Akordeon","Koncertní harfa"],"a":3},{"kind":"accordion","q":"Dvě skříně nástroje spojuje skládací měch, který se při hře roztahuje a stlačuje. Co vidíte?","e":"Akordeon používá měch k proudění vzduchu přes jazýčky.","o":["Varhany","Marimba","Akordeon","Klavír"],"a":2},{"kind":"piano","q":"Pod víkem jsou řady plstěných kladívek mířících ke strunám. Který nástroj využívá tento mechanismus?","e":"U akustického klavíru stisk klávesy spustí mechanismus, který udeří plstěným kladívkem do struny.","o":["Tympány","Klavír","Harfa","Marimba"],"a":1},{"kind":"timpani","q":"Velká měděná mísa s blánou má u podstavce pedál pro změnu napětí blány. Co je to?","e":"Orchestrální tympány mění výšku tónu napětím blány, často pomocí pedálu.","o":["Tympány","Velký buben","Marimba","Činely"],"a":0},{"kind":"marimba","q":"Pod dřevěnými kameny visí svislé rezonanční trubice různých délek. Který nástroj?","e":"Marimba má pod laděnými dřevěnými kameny rezonátory, které zesilují zvuk.","o":["Klavír","Tympány","Triangl","Marimba"],"a":3},{"kind":"triangle","q":"Jediný kovový prut je ohnutý do otevřeného trojúhelníku a rozeznívá se kovovou paličkou. Co je to?","e":"Triangl je kovový prut ohnutý do trojúhelníku s mezerou v jednom rohu.","o":["Gong","Zvonkohra","Triangl","Činely"],"a":2}],V={"clarinet":"<rect x='250' y='205' width='290' height='48' rx='24' fill='#151515'/><rect x='180' y='214' width='90' height='30' rx='15' fill='#393939'/><path d='M195 208 L270 225 L195 242Z' fill='#d9b77d'/><rect x='270' y='198' width='35' height='62' fill='none' stroke='#c8a84e' stroke-width='8'/>","oboe":"<path d='M365 115 Q390 90 415 115 L400 220 L380 220Z' fill='#d9b77d'/><path d='M390 220 L390 370' stroke='#151515' stroke-width='44'/><g fill='#d7d7d7'><circle cx='360' cy='270' r='10'/><circle cx='420' cy='305' r='10'/><circle cx='360' cy='340' r='10'/></g>","bassoon":"<path d='M460 120 Q520 165 475 230' fill='none' stroke='#d8d8d8' ='#888'/>","harp":"<path d='M210 410 Q250 180 560 105 L610 410Z' fill='none' stroke='#b8842f' stroke-width='28'/><g stroke='#dfc96c' stroke-width='5'><line x1='280' y1='200' x2='300' y2='385'/><line x1='312' y1='190' x2='325' y2='385'/><line x1='344' y1='180' x2='350' y2='385'/><line x1='376' y1='170' x2='375' y2='385'/><line x1='408' y1='160' x2='400' y2='385'/><line x1='440' y1='150' x2='425' y2='385'/><line x1='472' y1='140' x2='450' y2='385'/><line x1='504' y1='130' x2='475' y2='385'/></g><g fill='#d6b24d'><rect x='270' y='400' width='24' height='55' rx='8'/><rect x='312' y='400' width='24' height='55' rx='8'/><rect x='354' y='400' width='24' height='55' rx='8'/><rect x='396' y='400' width='24' height='55' rx='8'/><rect x='438' y='400' width='24' height='55' rx='8'/><rect x='480' y='400' width='24' height='55' rx='8'/><rect x='522' y='400' width='24' height='55' rx='8'/></g>","accordion":"<rect x='140' y='150' width='170' height='250' rx='24' fill='#531d25'/><rect x='500' y='150' width='150' height='250' rx='24' fill='#531d25'/><path d='M310 165 L500 185 L500 365 L310 385Z' fill='#ded7c8' stroke='#5a5a5a' stroke-width='8'/><path d='M335 180 L335 375 M370 178 L370 372 M405 178 L405 370 M440 182 L440 368 M475 185 L475 365' stroke='#7c7164' stroke-width='8'/>","piano":"<g stroke='#8a5f34' stroke-width='6'><line x1='150' y1='140' x2='250' y2='395'/><line x1='205' y1='140' x2='285' y2='395'/><line x1='260' y1='140' x2='320' y2='395'/><line x1='315' y1='140' x2='355' y2='395'/><line x1='370' y1='140' x2='390' y2='395'/><line x1='425' y1='140' x2='425' y2='395'/><line x1='480' y1='140' x2='460' y2='395'/><line x1='535' y1='140' x2='495' y2='395'/><line x1='590' y1='140' x2='530' y2='395'/></g><g fill='#d9d0bd'><ellipse cx='220' cy='190' rx='24' ry='42' transform='rotate(-25 220 190)'/><ellipse cx='265' cy='190' rx='24' ry='42' transform='rotate(-25 265 190)'/><ellipse cx='310' cy='190' rx='24' ry='42' transform='rotate(-25 310 190)'/><ellipse cx='355' cy='190' rx='24' ry='42' transform='rotate(-25 355 190)'/><ellipse cx='400' cy='190' rx='24' ry='42' transform='rotate(-25 400 190)'/><ellipse cx='445' cy='190' rx='24' ry='42' transform='rotate(-25 445 190)'/><ellipse cx='490' cy='190' rx='24' ry='42' transform='rotate(-25 490 190)'/></g>","timpani":"<ellipse cx='390' cy='160' rx='180' ry='55' fill='#e8e8e8' stroke='#777' stroke-width='10'/><path d='M230 160 Q250 390 390 430 Q530 390 550 160Z' fill='#a86628'/><path d='M470 400 L580 455' stroke='#777' stroke-width='12'/><rect x='565' y='440' width='95' height='22' rx='10' fill='#999'/>","marimba":"<g><rect x='130' y='140' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='200' y='152' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='270' y='140' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='340' y='152' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='410' y='140' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='480' y='152' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='550' y='140' width='58' height='155' rx='10' fill='#8e5c31'/><rect x='620' y='152' width='58' height='155' rx='10' fill='#8e5c31'/></g><g fill='#777'><rect x='145' y='310' width='28' height='120'/><rect x='215' y='310' width='28' height='102'/><rect x='285' y='310' width='28' height='84'/><rect x='355' y='310' width='28' height='66'/><rect x='425' y='310' width='28' height='120'/><rect x='495' y='310' width='28' height='102'/><rect x='565' y='310' width='28' height='84'/><rect x='635' y='310' width='28' height='66'/></g>","triangle":"<path d='M390 105 L215 405 H565 L430 165' fill='none' stroke='#d9d9d9' stroke-width='22' stroke-linecap='round'/><line x1='610' y1='180' x2='525' y2='360' stroke='#b9b9b9' stroke-width='11'/>"};let i=0,score=0;const parts=document.getElementById('parts');for(let n=0;n<15;n++)parts.innerHTML+=`<span data-p="${n}">DETAIL ${String(n+1).padStart(2,'0')}</span>`;function art(k){return `<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg"><rect width="780" height="520" fill="#24231f"/><path d="M0 430H780" stroke="#4f493e" stroke-width="4"/>${V[k]}</svg>`}function show(){const x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;scene.innerHTML=art(x.kind);q.textContent=x.q;opts.innerHTML='';x.o.forEach((v,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){const x=Q[i];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;document.querySelector(`[data-p="${i}"]`).classList.add('done');fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'DETAIL SEDÍ.':'SERVIS HLÁSÍ ZÁMĚNU.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('score').textContent=`${score} / 15`;grade.textContent=score>=13?'Mistr orchestru':score>=9?'Solidní servisní oko':'Ještě pár detailů pod lupu'}restart.onclick=()=>{i=0;score=0;document.querySelectorAll('.parts span').forEach(x=>x.classList.remove('done'));result.style.display='none';quiz.style.display='block';show()};show();</script></body></html>
