<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz z češtiny: Jenž, jež, jehož. Dáte 15 tvarů bez chyby?</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1e7;color:#1f2b26;font-family:Arial,sans-serif}.page{max-width:1180px;margin:auto;padding:18px}header{border-bottom:5px solid #263e35;padding:12px 4px 18px}.kicker{letter-spacing:.17em;font-weight:900;font-size:12px;color:#5a776b}h1{font:900 clamp(28px,4vw,50px)/1.03 Georgia,serif;margin:7px 0}header p{max-width:900px;color:#54665e;line-height:1.5}.bridgeWorld{margin-top:18px;background:#f8f7ef;border:1px solid #b9c3b8;box-shadow:0 18px 45px #2a43331a;padding:18px}.status{display:flex;align-items:center;gap:12px;justify-content:space-between}.planks{display:flex;gap:4px;flex:1}.plank{height:10px;flex:1;background:#cbd2c8;transform:skewX(-18deg)}.plank.done{background:#497a61}.count{font-weight:900;color:#355b49;white-space:nowrap}.sentence{display:grid;grid-template-columns:1fr 135px 1fr;align-items:center;gap:10px;margin:26px 0 20px}.bank{min-height:140px;border:2px solid #627b70;background:#fff;padding:18px;font:700 clamp(20px,2.5vw,30px)/1.3 Georgia,serif;display:flex;align-items:center}.gap{height:90px;border-bottom:12px solid #816044;position:relative;display:flex;align-items:center;justify-content:center;color:#816044;font-weight:900}.gap:before,.gap:after{content:"";position:absolute;bottom:-12px;width:18px;height:80px;background:#816044}.gap:before{left:0}.gap:after{right:0}.tokens{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.token{padding:14px;border:2px solid #466455;background:#fdfdf8;font-size:18px;font-weight:900;cursor:pointer}.token:hover{background:#e8eee9}.token.good{background:#d9efd9;border-color:#2e7147}.token.bad{background:#f3d5d0;border-color:#9a4339}.feedback{display:none;margin-top:14px;background:#e9eee5;padding:13px;border-left:5px solid #497a61;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:14px 0 0 auto;border:0;background:#2f5946;color:white;padding:12px 18px;font-weight:900}.result{display:none;text-align:center;padding:55px}.result.show{display:block}.score{font-size:74px;font-weight:1000;color:#2f5946}.restart{padding:12px 18px;background:#2f5946;color:#fff;border:0;font-weight:900}@media(max-width:760px){.sentence{grid-template-columns:1fr;gap:7px}.gap{height:55px;border:3px dashed #816044}.gap:before,.gap:after{display:none}.tokens{grid-template-columns:1fr 1fr}.bank{min-height:90px}}@media(max-width:430px){.page{padding:9px}.bridgeWorld{padding:11px}.tokens{grid-template-columns:1fr}}
</style></head><body><div class="page"><header><div class="kicker">STŘIŽNA VĚT // GRAMATICKÝ MOST</div><h1>Jenž, jež, jehož. Dáte 15 tvarů vztažného zájmena bez chyby?</h1><p>Každá věta má uprostřed vynechaný jediný tvar. Vyberte ho tak, aby rod, číslo i pád seděly — bez archaických pastí a dvojznačných variant.</p></header><section class="bridgeWorld"><div class="status"><div class="planks" id="planks"></div><div class="count" id="count"></div></div><div id="quiz"><div class="sentence"><div class="bank" id="left"></div><div class="gap" id="gap">DOPLŇTE MOST</div><div class="bank" id="right"></div></div><div class="tokens" id="tokens"></div><div class="feedback" id="fb"></div><button class="next" id="next">PROPOJIT DALŠÍ VĚTU →</button></div><div class="result" id="result"><div>VĚTY PROPOJENY</div><div class="score" id="score"></div><p id="res"></p><button class="restart" id="restart">ROZEBRAT MOST</button></div></section></div><script>
const questions=[{"q": "Dům, ___ stojí na rohu, se bude opravovat.", "o": ["jež", "jehož", "jenž", "jemuž"], "c": 2, "e": "„Dům“ je mužský neživotný, v této větě je zájmeno v 1. pádě jednotného čísla: jenž.", "v": "1"}, {"q": "Kniha, ___ leží na stole, patří Evě.", "o": ["jež", "již", "jíž", "jejíž"], "c": 0, "e": "„Kniha“ je ženského rodu a zájmeno je v 1. pádě: jež.", "v": "2"}, {"q": "Město, ___ leží u řeky, rychle roste.", "o": ["jenž", "jež", "jehož", "němž"], "c": 1, "e": "„Město“ je středního rodu a zájmeno je podmětem v 1. pádě: jež.", "v": "3"}, {"q": "Muž, ___ jsme včera potkali, pracuje v knihovně.", "o": ["jejž", "jenž", "jemuž", "jehož"], "c": 3, "e": "U mužského životného v 4. pádě jednotného čísla je tvar jehož.", "v": "4"}, {"q": "Most, ___ město právě opravuje, zůstane měsíc zavřený.", "o": ["jehož", "jejž", "jenž", "jímž"], "c": 1, "e": "U mužského neživotného v 4. pádě jednotného čísla je tvar jejž.", "v": "5"}, {"q": "Žena, ___ jsme oslovili, nám poradila cestu.", "o": ["jíž", "jež", "již", "jejíž"], "c": 2, "e": "Ženský rod ve 4. pádě jednotného čísla má tvar již.", "v": "6"}, {"q": "Dítě, ___ jsme zahlédli na hřišti, má červenou bundu.", "o": ["jež", "jehož", "jemuž", "němž"], "c": 0, "e": "Střední rod ve 4. pádě jednotného čísla má tvar jež.", "v": "7"}, {"q": "Kolega, ___ jsme poděkovali, odjel domů.", "o": ["jehož", "jímž", "němž", "jemuž"], "c": 3, "e": "Sloveso „poděkovat komu“ vyžaduje 3. pád; u mužského rodu je jemuž.", "v": "8"}, {"q": "Autorka, ___ jsme poslali rukopis, odpověděla druhý den.", "o": ["již", "jíž", "jež", "jejíž"], "c": 1, "e": "„Poslat komu“ vyžaduje 3. pád; u ženského rodu je tvar jíž.", "v": "9"}, {"q": "Dům, v ___ bydlíme, má nové výtahy.", "o": ["jemuž", "jehož", "němž", "jímž"], "c": 2, "e": "Po předložce „v“ je 6. pád a počáteční j- se mění na n-: v němž.", "v": "10"}, {"q": "Kavárna, v ___ sedíme, zavírá v deset.", "o": ["níž", "jíž", "již", "jež"], "c": 0, "e": "Po předložce „v“ je u ženského rodu tvar v níž.", "v": "11"}, {"q": "Nástroj, ___ jsme otvor změřili, leží na stole.", "o": ["jemuž", "jehož", "němž", "jímž"], "c": 3, "e": "Zde jde o 7. pád: změřili jsme čím? nástrojem – jímž.", "v": "12"}, {"q": "Metoda, ___ jsme výsledek ověřili, je velmi přesná.", "o": ["již", "jež", "jíž", "níž"], "c": 2, "e": "Bez předložky jde o 7. pád ženského rodu: jíž.", "v": "13"}, {"q": "Lidé, s ___ pracujeme, jsou z několika měst.", "o": ["jimiž", "nimiž", "nichž", "jimž"], "c": 1, "e": "Po předložce „s“ se v množném čísle používá tvar s nimiž.", "v": "14"}, {"q": "Smlouvy, ___ platnost právě ověřujeme, jsou v archivu.", "o": ["jejichž", "jichž", "jež", "jimiž"], "c": 0, "e": "Zájmeno přivlastňuje „platnost“ více smlouvám: jejichž platnost.", "v": "15"}];let i=0,score=0,locked=false;const pl=document.getElementById('planks');for(let n=0;n<15;n++){let s=document.createElement('span');s.className='plank';s.id='p'+n;pl.appendChild(s)}
function splitQ(s){let parts=s.split('___');return parts}function show(){locked=false;let q=questions[i],p=splitQ(q.q);document.getElementById('count').textContent=(i+1)+' / 15';document.getElementById('left').textContent=p[0];document.getElementById('right').textContent=p[1];document.getElementById('gap').textContent='DOPLŇTE MOST';let t=document.getElementById('tokens');t.innerHTML='';q.o.forEach((x,j)=>{let b=document.createElement('button');b.className='token';b.dataset.index=j;b.textContent=x;b.onclick=()=>pick(j);t.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function pick(j){if(locked)return;locked=true;let q=questions[i],ok=j===q.c;if(ok)score++;document.querySelectorAll('.token').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');if(k===j&&k!==q.c)b.classList.add('bad')});document.getElementById('gap').textContent=q.o[q.c];document.getElementById('p'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=q.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<15?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('res').textContent=score>=13?'Paradigma drží. Jenž vás jen tak nerozhodí.':score>=9?'Většinu tvarů máte, pár pádů ještě klouže.':'Most párkrát spadl. Druhý průchod už bude milosrdnější.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.plank').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
