let idx=0,score=0,locked=false;
const $=q=>document.querySelector(q);
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function render(){
 if(idx>=QA.length){$('#play').innerHTML=`<div class="done"><div class="kicker">ZÁVĚREČNÝ VÝSLEDEK</div><div class="score">${score} / ${QA.length}</div><h2>${score===15?'Perfektní výkon!':score>=11?'Skvělá práce!':score>=7?'Solidní výsledek':'Každý pokus má cenu.'}</h2><p>Patnáct zastavení je za tebou. Otázky i jejich vysvětlení můžeš projít znovu.</p><button id="reset" class="main">Hrát znovu ↻</button></div>`;$('#reset').onclick=()=>{idx=0;score=0;render()};$('#progress').style.width='100%';return}
 const o=QA[idx];locked=false;$('#progress').style.width=`${idx/QA.length*100}%`;
 $('#play').innerHTML=`<div class="meta"><span>ZASTAVENÍ ${String(idx+1).padStart(2,'0')} / 15</span><span>${esc(o.difficulty)}</span><span>Body: ${score}</span></div>
 ${o.map?`<img class="map" src="${o.map}" alt="Mapa s vyznačenou polohou, bez názvu ostrova"/>`:''}${o.svg?`<div class="skeleton">${o.svg}</div>`:''}
 <h2>${esc(o.q)}</h2><div class="options">${o.options.map((v,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div>
 <div id="feedback" aria-live="polite"></div><button class="next" id="next" hidden>Další zastavení →</button>
 <div class="hint">Volba: klikni, nebo stiskni klávesu A–D.</div>`;
 document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
 $('#next').onclick=()=>{idx++;render();window.scrollTo({top:0,behavior:'smooth'})};
}
function answer(n){if(locked)return;locked=true;const o=QA[idx];if(n===o.answer)score++;
 document.querySelectorAll('.option').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===o.answer)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});
 $('#feedback').innerHTML=`<strong>${n===o.answer?'✓ Správně!':'✕ Tentokrát ne.'}</strong> ${esc(o.explain)}`;$('#next').hidden=false;$('#next').focus();}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const v=e.key.toUpperCase();if(!locked&&'ABCD'.includes(v)&&v.length===1&&idx<QA.length){const n='ABCD'.indexOf(v);document.querySelectorAll('.option')[n]?.click()}});
render();
