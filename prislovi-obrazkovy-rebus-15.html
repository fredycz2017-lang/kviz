function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});if(ok)score++;document.getElementById('p'+i).classList.add('done');let f=document.getElementById('fb');f.className='feedback show';f.textContent=x.e;document.getElementById('next').style.display='block'}
