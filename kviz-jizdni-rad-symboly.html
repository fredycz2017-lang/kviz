<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umíte opravdu číst železniční jízdní řád?</title>
<style>
:root{--accent:#0e5f4f;--accent2:#f7c843;--bg:#eff9f6;--ink:#17332e;--muted:#55746e;--ok:#187a45;--bad:#b33131}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{padding:10px}.quiz{max-width:700px;margin:0 auto;background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.10)}
.hero{background:var(--bg);padding:20px 22px 16px}.hero svg{display:block;width:100%;height:auto;max-height:190px;margin:0 auto 14px}.badge{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:900;letter-spacing:.09em;padding:7px 10px;border-radius:999px}
h1{font-size:clamp(25px,5vw,38px);line-height:1.05;margin:12px 0 8px}.subtitle{font-size:15px;line-height:1.5;color:var(--muted);margin:0}
.status{padding:14px 22px 0}.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;color:var(--muted)}.bar{height:9px;border-radius:999px;background:#e8eceb;margin-top:9px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.stage{padding:18px 22px 22px}.qnum{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}.question{font-size:22px;line-height:1.25;font-weight:900;margin:8px 0 16px}
.answers{display:grid;gap:10px}button.answer{width:100%;text-align:left;border:1px solid #d8dfdd;background:#fff;color:var(--ink);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.35;font-weight:700;cursor:pointer;transition:.15s ease}button.answer:hover{transform:translateY(-1px);border-color:var(--accent)}button.answer:disabled{cursor:default;transform:none}button.answer.correct{border-color:var(--ok);background:#e9f7ef;color:#0f6036}button.answer.wrong{border-color:var(--bad);background:#fff0f0;color:#8f2525}
.feedback{display:none;margin-top:14px;border-left:5px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;padding:13px 14px;font-size:14px;line-height:1.48}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}
.next{display:none;width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;padding:13px 16px;font-size:15px;font-weight:900;cursor:pointer}.next.show{display:block}.result{display:none;text-align:center;padding:8px 0 4px}.result.show{display:block}.scoreBig{font-size:56px;font-weight:900;color:var(--accent);line-height:1}.resultText{font-size:17px;font-weight:800;margin:10px auto 18px;max-width:500px}.restart{border:0;border-radius:14px;background:var(--ink);color:#fff;padding:12px 18px;font-weight:900;cursor:pointer}
.footer{padding:0 22px 18px;color:var(--muted);font-size:11px;line-height:1.4}.footer a{color:inherit}@media(max-width:440px){body{padding:4px}.quiz{border-radius:18px}.hero,.stage,.status{padding-left:15px;padding-right:15px}.question{font-size:19px}button.answer{font-size:14px}}
</style>
</head><body>
<main class="quiz" id="quiz">
<section class="hero"><svg viewBox="0 0 560 180" role="img" aria-label="Stylizovaná železniční odjezdová tabule a nádražní hodiny">
<rect width="560" height="180" rx="24" fill="#153c36"/><g transform="translate(28 25)"><rect width="390" height="128" rx="12" fill="#102c28" stroke="#5b817a" stroke-width="2"/><text x="18" y="28" fill="#f7c843" font-size="14" font-weight="800">ODJEZDY / DEPARTURES</text><g font-family="monospace" font-weight="700" font-size="20"><text x="20" y="60" fill="#f7f1d1">07:42</text><text x="104" y="60" fill="#f7f1d1">Rx 882</text><text x="235" y="60" fill="#f7f1d1">PRAHA</text><text x="20" y="91" fill="#f7f1d1">08:03</text><text x="104" y="91" fill="#f7f1d1">Sp 1451</text><text x="235" y="91" fill="#f7f1d1">BRNO</text><text x="20" y="122" fill="#f7f1d1">08:17</text><text x="104" y="122" fill="#f7f1d1">Os 6904</text><text x="235" y="122" fill="#f7f1d1">KOLÍN</text></g></g><g transform="translate(455 31)"><circle cx="45" cy="45" r="43" fill="#f7f1d1" stroke="#f7c843" stroke-width="5"/><line x1="45" y1="45" x2="45" y2="18" stroke="#17332e" stroke-width="5" stroke-linecap="round"/><line x1="45" y1="45" x2="66" y2="56" stroke="#17332e" stroke-width="5" stroke-linecap="round"/><circle cx="45" cy="45" r="5" fill="#17332e"/><rect x="11" y="105" width="68" height="22" rx="11" fill="#f7c843"/><text x="45" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#17332e">NÁST. 3</text></g></svg><span class="badge">ŽELEZNICE</span><h1>Umíte opravdu číst železniční jízdní řád?</h1><p class="subtitle">Rx, Sp, „jen pro výstup“, zastávka na znamení, přípoje i místenky. Patnáct situací, které mohou rozhodnout, jestli vlak stihnete.</p></section>
<section class="status"><div class="row"><span id="progressText">Otázka 1 z 15</span><span id="scoreText">Skóre 0</span></div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section class="stage"><div id="game"><div class="qnum" id="qnum">OTÁZKA 1</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Další otázka</button></div><div class="result" id="result"><div class="scoreBig" id="scoreBig"></div><div class="resultText" id="resultText"></div><button class="restart" id="restart">Zkusit znovu</button></div></section>
<div class="footer">Fakta ověřena podle: <a href="https://www.cd.cz/sluzby/dobre-rady/vysvetlivky-symbolu/-14470/" target="_blank" rel="noopener">České dráhy – Vysvětlivky symbolů v jízdním řádu</a>.</div>
</main>
<script>
const questions=[{"q": "Co v jízdním řádu znamená zkratka Rx?", "o": ["Rychlík vyšší kvality", "Regionální expres bez zastavení", "Rezervační expres", "Rychlík s povinným lůžkem"], "a": 0, "e": "České dráhy uvádějí Rx jako rychlík vyšší kvality."}, {"q": "Co označuje zkratka Sp?", "o": ["Speciální vlak", "Spěšný vlak", "Služební přepravu", "Spoj s povinnou rezervací"], "a": 1, "e": "Sp je označení spěšného vlaku."}, {"q": "Co označuje zkratka Os?", "o": ["Osobní vlak", "Omezený spoj", "Obslužný expres", "Oddílový spoj"], "a": 0, "e": "Os je osobní vlak; v některých tabulkách se může objevit i bez výslovného označení ve sloupci vlaku."}, {"q": "Co znamená symbol povinné rezervace míst?", "o": ["Místenku lze koupit, ale není nutná", "Je nutné zakoupit místenku", "Rezervace platí jen pro kola", "Vlak je bez místenek"], "a": 1, "e": "Vysvětlivky ČD u tohoto symbolu výslovně uvádějí povinnou rezervaci míst."}, {"q": "Co znamená odlišný symbol, který říká, že do označených vozů lze zakoupit místenku?", "o": ["Místenka je možná, nikoli automaticky povinná", "Místenky jsou zakázané", "Vlak jede bez rezervací", "Místenka platí jen do první stanice"], "a": 0, "e": "ČD rozlišují povinnou rezervaci od pouhé možnosti zakoupit místenku do označených vozů."}, {"q": "U stanice je poznámka „vlak zastavuje jen pro výstup“. Co z toho plyne?", "o": ["Můžete nastoupit i vystoupit", "Můžete pouze nastoupit", "Můžete pouze vystoupit", "Vlak stanicí projede"], "a": 2, "e": "Tato značka znamená, že zastavení je určeno pouze pro výstup cestujících."}, {"q": "U stanice je poznámka „vlak zastavuje jen pro nástup“. Co z toho plyne?", "o": ["Je určena jen pro nástup", "Je určena jen pro výstup", "Vlak čeká 5 minut", "Vlak nezastaví"], "a": 0, "e": "Tato značka znamená zastavení pouze pro nástup cestujících."}, {"q": "Chcete nastoupit ve stanici, kde vlak zastavuje jen na znamení nebo požádání. Co mají podle vysvětlivek ČD udělat cestující na nástupišti?", "o": ["Schovat se pod přístřešek", "Postavit se tak, aby byli včas vidět, a dát zřetelné znamení", "Zavolat dispečerovi", "Stoupnout si výhradně k poslednímu vozu"], "a": 1, "e": "ČD uvádějí, že cestující má být strojvedoucím včas spatřen a dát zřetelné znamení, například zvednutím ruky."}, {"q": "Co se podle vysvětlivek stane u zastávky na znamení, pokud soupravu tvoří více vozů bez signalizačního zařízení?", "o": ["Vlak zastaví vždy", "Vlak nikdy nezastaví", "Zastaví jen první vůz", "Rozhodne průvodčí až po průjezdu"], "a": 0, "e": "ČD výslovně uvádějí, že v takovém případě vlak zastaví vždy."}, {"q": "Co znamená značka, že vlak v celé trase nečeká na žádné přípoje?", "o": ["Přípoj se garantuje 15 minut", "Vlak na zpožděné přípoje nečeká", "Vlak čeká jen na EC", "Vlak vyjíždí až po souhlasu průvodčího"], "a": 1, "e": "Značka říká, že vlak v celé trase nečeká na žádné přípoje."}, {"q": "Jiná značka říká, že vlak čeká na zpožděné přípojné vlaky maximálně jak dlouho po pravidelném odjezdu?", "o": ["2 minuty", "5 minut", "10 minut", "15 minut"], "a": 1, "e": "Ve vysvětlivkách ČD je uvedeno maximálně 5 minut."}, {"q": "Co znamená označení náhradní autobusové dopravy v železničním jízdním řádu?", "o": ["Platí jen autobusový tarif", "Platí železniční tarif", "Jízda je vždy zdarma", "Jde jen o školní autobus"], "a": 1, "e": "ČD uvádějí náhradní autobusovou dopravu s platností železničního tarifu."}, {"q": "Co znamená symbol „230 V“ u vybavení vlaku?", "o": ["Maximální rychlost 230 km/h", "Vůz má elektrickou přípojku 230 V", "Vlak má 230 míst", "Napětí trakčního vedení"], "a": 1, "e": "Symbol informuje, že je ve vlaku řazen vůz s přípojkou 230 V."}, {"q": "Co znamená označení tichého oddílu?", "o": ["Oddíl bez osvětlení", "Oddíl určený k omezení hlučného chování", "Oddíl jen pro spící cestující", "Vůz bez hlášení zastávek"], "a": 1, "e": "Vysvětlivky ČD mají samostatný symbol pro tichý oddíl."}, {"q": "U konečné stanice je značka, že vlak může odjet ihned po ukončení výstupu. Co to prakticky znamená?", "o": ["Musí čekat do uvedeného času", "Může odjet i před uvedeným časem příjezdu", "Smí odjet jen po pěti minutách", "Musí pokračovat jako autobus"], "a": 1, "e": "ČD uvádějí, že do konečné stanice může vlak po ukončení výstupu odjet i před uvedeným časovým údajem příjezdu."}];
let i=0,score=0,locked=false;
const el={q:document.getElementById('question'),a:document.getElementById('answers'),f:document.getElementById('feedback'),n:document.getElementById('next'),pt:document.getElementById('progressText'),st:document.getElementById('scoreText'),fill:document.getElementById('fill'),qnum:document.getElementById('qnum'),game:document.getElementById('game'),result:document.getElementById('result'),scoreBig:document.getElementById('scoreBig'),resultText:document.getElementById('resultText'),restart:document.getElementById('restart')};
function render(){locked=false;const x=questions[i];el.q.textContent=x.q;el.qnum.textContent='OTÁZKA '+(i+1);el.pt.textContent='Otázka '+(i+1)+' z '+questions.length;el.st.textContent='Skóre '+score;el.fill.style.width=((i/questions.length)*100)+'%';el.a.innerHTML='';el.f.className='feedback';el.f.innerHTML='';el.n.className='next';x.o.forEach((txt,idx)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+idx)+') '+txt;b.addEventListener('click',()=>choose(idx,b));el.a.appendChild(b)})}
function choose(idx,b){if(locked)return;locked=true;const x=questions[i];const buttons=[...el.a.querySelectorAll('button')];buttons.forEach(z=>z.disabled=true);buttons[x.a].classList.add('correct');if(idx===x.a){score++;el.f.innerHTML='<strong>Správně.</strong>'+x.e}else{b.classList.add('wrong');el.f.innerHTML='<strong>Správná odpověď: '+x.o[x.a]+'.</strong>'+x.e}el.st.textContent='Skóre '+score;el.f.classList.add('show');el.n.classList.add('show')}
function finish(){el.game.style.display='none';el.result.classList.add('show');el.fill.style.width='100%';el.pt.textContent='Hotovo';el.st.textContent='Skóre '+score;el.scoreBig.textContent=score+'/'+questions.length;let t='';if(score===15)t='Perfektní průchod. Ani jedna otázka vás nezastavila.';else if(score>=12)t='Výborný výsledek. V tématu se orientujete opravdu dobře.';else if(score>=8)t='Solidní přehled. Několik detailů ale dokázalo překvapit.';else t='Tady bylo pár pastí. Po vysvětleních už ale příště získáte víc.';el.resultText.textContent=t}
el.n.addEventListener('click',()=>{if(i<questions.length-1){i++;render()}else finish()});el.restart.addEventListener('click',()=>{i=0;score=0;el.game.style.display='block';el.result.classList.remove('show');render()});render();
</script></body></html>
