<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: PDF, JPG, ZIP, CSV. Poznáte 15 typů souborů jen podle přípony?</title><style>
*{box-sizing:border-box}body{margin:0;background:#11151b;color:#dfe8f1;font-family:system-ui,Segoe UI,Arial}.desktop{max-width:1240px;margin:16px auto;background:#20252d;border:1px solid #49515d;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #0008}.bar{height:46px;background:#2b313a;display:flex;align-items:center;padding:0 15px;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#69717b}.path{margin-left:14px;background:#1c2128;border:1px solid #414953;border-radius:7px;padding:7px 12px;flex:1;color:#aeb8c3;font-size:13px}.work{display:grid;grid-template-columns:210px 1fr;min-height:690px}.side{background:#1b2027;border-right:1px solid #39414a;padding:14px}.side h3{font-size:11px;letter-spacing:.14em;color:#7f8b98}.folder{padding:10px 8px;margin:3px 0;border-radius:7px;color:#b8c3cf;font-size:14px}.folder:before{content:'▰';margin-right:8px;color:#d1a84b}.main{padding:20px}.topline{display:flex;justify-content:space-between;color:#83909d;font-size:12px}.filecard{height:270px;margin:20px auto 15px;max-width:520px;background:#262c35;border:1px solid #4a5461;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.fileIcon{width:150px;height:185px;background:#e9eef4;color:#1d2731;border-radius:10px 10px 18px 18px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;font-size:38px;font-weight:1000;box-shadow:0 15px 35px #0005}.fileIcon:before{content:"";position:absolute;right:0;top:0;border-left:45px solid transparent;border-bottom:45px solid #b8c4d1}.q{font-size:24px;font-weight:900;max-width:820px;margin:12px auto}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px;margin:auto}.answer{border:1px solid #536171;background:#252c35;color:#eef3f8;padding:14px;text-align:left;border-radius:9px;font-weight:750;cursor:pointer}.answer:hover{background:#303944}.answer.good{background:#244b36;border-color:#4ea26f}.answer.bad{background:#5c2b31;border-color:#c65f69}.feedback{display:none;max-width:820px;margin:12px auto;background:#1c2832;border-left:4px solid #55a3d6;padding:12px;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:12px calc((100% - min(820px,100%))/2) 0 auto;background:#2672c9;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:900}.dock{display:flex;gap:5px;margin-top:20px}.task{height:7px;flex:1;background:#39424d;border-radius:9px}.task.done{background:#42a5e5}.result{display:none;text-align:center;padding:80px}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#62b8f0}.restart{padding:12px 18px;background:#2672c9;color:white;border:0;border-radius:7px;font-weight:900}@media(max-width:720px){.work{grid-template-columns:1fr}.side{display:none}.main{padding:12px}.answers{grid-template-columns:1fr}.filecard{height:220px}.fileIcon{width:120px;height:150px;font-size:30px}}@media(max-width:400px){.desktop{margin:4px;border-radius:5px}.q{font-size:20px}}
</style></head><body><div class="desktop"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="path">Tento počítač › Nezařazené soubory</div></div><div class="work"><aside class="side"><h3>SLOŽKY</h3><div class="folder">Dokumenty</div><div class="folder">Obrázky</div><div class="folder">Audio</div><div class="folder">Video</div><div class="folder">Data</div><div class="folder">Archivy</div><div class="folder">Web</div><div class="folder">Programy</div></aside><main class="main"><div id="quiz"><div class="topline"><span id="prog"></span><span>SPRÁVCE SOUBORŮ // TŘÍDĚNÍ</span></div><div class="filecard"><div class="fileIcon" id="icon"></div></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">PŘESUNOUT DALŠÍ SOUBOR →</button><div class="dock" id="dock"></div></div><section class="result" id="result"><div>SLOŽKA UKLIZENA</div><div class="score" id="score"></div><p id="res"></p><button class="restart" id="restart">ROZHÁZET SOUBORY ZNOVU</button></section></main></div></div><script>
const questions=[{"q": "Soubor má příponu .PDF. Do které přihrádky správce souborů nejlépe patří?", "o": ["Zvukový soubor", "Komprimovaný archiv", "Dokument s pevným rozvržením stránky", "Spustitelný program"], "c": 2, "e": "PDF je Portable Document Format určený pro sdílení dokumentů se zachováním rozvržení.", "v": "PDF", "ext": ".PDF"}, {"q": "Soubor má příponu .DOCX. Do které přihrádky správce souborů nejlépe patří?", "o": ["Textový dokument Wordu", "Tabulkový sešit", "Prezentace", "Video"], "c": 0, "e": "DOCX je standardní formát dokumentu Microsoft Word založený na Open XML.", "v": "DOCX", "ext": ".DOCX"}, {"q": "Soubor má příponu .XLSX. Do které přihrádky správce souborů nejlépe patří?", "o": ["Textový dokument", "Rastrový obrázek", "Archiv", "Tabulkový sešit"], "c": 3, "e": "XLSX je běžný formát sešitu Microsoft Excel.", "v": "XLSX", "ext": ".XLSX"}, {"q": "Soubor má příponu .PPTX. Do které přihrádky správce souborů nejlépe patří?", "o": ["Zvuk", "Prezentace", "Tabulková data CSV", "Vektorová grafika"], "c": 1, "e": "PPTX je formát prezentace Microsoft PowerPoint.", "v": "PPTX", "ext": ".PPTX"}, {"q": "Soubor má příponu .JPG. Do které přihrádky správce souborů nejlépe patří?", "o": ["Rastrový obrázek", "Archiv", "Zvuk", "Webová stránka"], "c": 0, "e": "JPG/JPEG je běžný rastrový obrazový formát.", "v": "JPG", "ext": ".JPG"}, {"q": "Soubor má příponu .PNG. Do které přihrádky správce souborů nejlépe patří?", "o": ["Spustitelný program", "Tabulkový sešit", "Rastrový obrázek", "Video"], "c": 2, "e": "PNG je rastrový obrazový formát, často používaný i s průhledností.", "v": "PNG", "ext": ".PNG"}, {"q": "Soubor má příponu .SVG. Do které přihrádky správce souborů nejlépe patří?", "o": ["Zvuk", "Vektorová grafika", "Archiv", "Textový dokument Wordu"], "c": 1, "e": "SVG znamená Scalable Vector Graphics a ukládá vektorovou grafiku.", "v": "SVG", "ext": ".SVG"}, {"q": "Soubor má příponu .ZIP. Do které přihrádky správce souborů nejlépe patří?", "o": ["Prezentace", "Obrázek", "Zvuk", "Komprimovaný archiv"], "c": 3, "e": "ZIP je archivní formát pro zabalení a obvykle i kompresi souborů.", "v": "ZIP", "ext": ".ZIP"}, {"q": "Soubor má příponu .RAR. Do které přihrádky správce souborů nejlépe patří?", "o": ["Komprimovaný archiv", "Webová stránka", "Video", "Tabulka"], "c": 0, "e": "RAR je archivní formát.", "v": "RAR", "ext": ".RAR"}, {"q": "Soubor má příponu .MP3. Do které přihrádky správce souborů nejlépe patří?", "o": ["Obrázek", "Dokument", "Zvukový soubor", "Program"], "c": 2, "e": "MP3 je ztrátově komprimovaný zvukový formát.", "v": "MP3", "ext": ".MP3"}, {"q": "Soubor má příponu .WAV. Do které přihrádky správce souborů nejlépe patří?", "o": ["Archiv", "Zvukový soubor", "Prezentace", "Vektorový obrázek"], "c": 1, "e": "WAV je zvukový souborový formát.", "v": "WAV", "ext": ".WAV"}, {"q": "Soubor má příponu .MP4. Do které přihrádky správce souborů nejlépe patří?", "o": ["Tabulková data", "Textový dokument", "Archiv", "Video / multimediální kontejner"], "c": 3, "e": "MP4 je multimediální kontejner běžně používaný pro video a zvuk.", "v": "MP4", "ext": ".MP4"}, {"q": "Soubor má příponu .CSV. Do které přihrádky správce souborů nejlépe patří?", "o": ["Tabulková data v textové podobě", "Rastrový obrázek", "Prezentace", "Program"], "c": 0, "e": "CSV ukládá hodnoty oddělené oddělovačem v textové podobě.", "v": "CSV", "ext": ".CSV"}, {"q": "Soubor má příponu .HTML. Do které přihrádky správce souborů nejlépe patří?", "o": ["Zvuk", "Archiv", "Webová stránka / dokument HTML", "Tabulkový sešit"], "c": 2, "e": "HTML je značkovací jazyk a přípona běžného dokumentu webové stránky.", "v": "HTML", "ext": ".HTML"}, {"q": "Soubor má příponu .EXE. Do které přihrádky správce souborů nejlépe patří?", "o": ["Obrázek", "Spustitelný program ve Windows", "Dokument PDF", "Zvuk"], "c": 1, "e": "EXE označuje spustitelný soubor v prostředí Windows.", "v": "EXE", "ext": ".EXE"}];let i=0,score=0,locked=false;const dock=document.getElementById('dock');for(let n=0;n<15;n++){let x=document.createElement('span');x.className='task';x.id='t'+n;dock.appendChild(x)}function show(){locked=false;let q=questions[i];document.getElementById('prog').textContent='SOUBOR '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('icon').textContent=q.ext;document.getElementById('q').textContent=q.q;let a=document.getElementById('answers');a.innerHTML='';q.o.forEach((t,j)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=j;b.textContent=t;b.onclick=()=>pick(j);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function pick(j){if(locked)return;locked=true;let q=questions[i],ok=j===q.c;if(ok)score++;document.querySelectorAll('.answer').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');if(k===j&&k!==q.c)b.classList.add('bad')});document.getElementById('t'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=q.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<15?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('res').textContent=score>=13?'Průzkumník by vám složky svěřil bez dozoru.':score>=9?'Většinu přípon třídíte automaticky.':'Pár ikon skončilo v úplně jiné zásuvce. Druhé třídění to spraví.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.task').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
