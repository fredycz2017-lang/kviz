*{box-sizing:border-box}html,body{margin:0;background:#111318;color:#f4f7fa;font-family:Arial,sans-serif;overflow-x:hidden}body{padding:14px;background:linear-gradient(135deg,#171a21,#090b0f)}.tester{max-width:1200px;margin:auto;background:#20242c;border:1px solid #505967;border-radius:22px;box-shadow:0 28px 70px #000a;overflow:hidden}header{padding:21px 24px;background:linear-gradient(90deg,#282e38,#171b22);border-bottom:1px solid #4e5865}.kicker{font-size:12px;letter-spacing:.15em;font-weight:900;color:#f5d55f}h1{font-size:clamp(27px,4vw,49px);margin:5px 0 8px;line-height:1.04}header p{color:#bfc7d0;margin:0;max-width:900px;line-height:1.45}.body{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px}.organizer{background:#141820;border:1px solid #39414d;border-radius:16px;padding:14px}.organizer h2{font-size:12px;letter-spacing:.12em;color:#aeb8c4}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{height:64px;border:1px solid #343d48;border-radius:10px;background:#0d1015;display:grid;place-items:center;color:#65717e;font-weight:900}.slot.done{background:#253c2b;color:#aef0b9;border-color:#5bb86d}.screen{background:#0d1014;border:1px solid #39424e;border-radius:16px;padding:16px;min-width:0}.lcd{display:flex;justify-content:space-between;font-family:monospace;color:#b5ff9f;background:#071007;padding:9px 12px;border:2px inset #334533}.scene{min-height:290px;margin:12px 0;border:1px solid #38414d;border-radius:14px;background:radial-gradient(circle at 50% 30%,#313741,#151920 68%);display:grid;place-items:center;position:relative}.dims{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font:800 14px monospace;color:#f3da73;background:#080a0dcc;padding:7px 10px;border:1px solid #4f5660;border-radius:8px;white-space:nowrap}.q{font-size:23px;font-weight:900;margin:8px 0 12px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{background:#252b34;color:#fff;border:1px solid #57616e;border-radius:10px;padding:13px;text-align:left;font-weight:900;cursor:pointer}.answer.good{background:#24432e;border-color:#6dd783}.answer.bad{background:#532a30;border-color:#ff7b8a}.feedback{display:none;margin-top:12px;background:#1a2028;border-left:5px solid #e5c54f;padding:12px;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:12px 0 0 auto;border:0;background:#e5c54f;color:#17130a;padding:12px 18px;border-radius:8px;font-weight:1000}.result{display:none;text-align:center;padding:56px 20px}.result.show{display:block}.score{font-size:74px;font-weight:1000;color:#f2d257}.restart{border:0;background:#e5c54f;padding:13px 19px;font-weight:900}@media(max-width:760px){body{padding:5px}.body{grid-template-columns:1fr;padding:8px}.slots{grid-template-columns:repeat(5,1fr)}.slot{height:38px}.screen{padding:10px}.scene{min-height:225px}.answers{grid-template-columns:1fr}.dims{font-size:12px}}
</style></head><body><div class="tester"><header><div class="kicker">ORGANIZÉR ČLÁNKŮ // TESTER TVARU</div><h1>AA, AAA, 9V, CR2032. Poznáte 15 baterií jen podle tvaru?</h1><p>Žádná rada o nabíjení ani chemii. Jen form factor: silueta, proporce a orientační rozměry, které vám pomůžou odlišit podobně vypadající články.</p></header><div class="body"><aside class="organizer"><h2>VOLNÉ POZICE</h2><div class="slots" id="slots"></div></aside><main class="screen"><section id="quiz"><div class="lcd"><span id="prog"></span><span>FORM FACTOR ONLY</span></div><div class="scene" id="scene"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button id="next" class="next">DALŠÍ ČLÁNEK →</button></section><section id="result" class="result"><h2>ORGANIZÉR ZAPLNĚN</h2><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">VYSYPAT ORGANIZÉR</button></section></main></div></div><script>
const questions=[{"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["AA", "AAA", "C", "18650"], "c": 0, "e": "AA je běžný „tužkový“ válcový formát okolo 14,5 mm v průměru a 50,5 mm na délku.", "v": "aa", "name": "AA", "dims": "≈ 14,5 × 50,5 mm", "shape": "cyl", "ratio": 3.48}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["AAAA", "AA", "AAA", "N"], "c": 2, "e": "AAA je užší a kratší než AA, zhruba 10,5 × 44,5 mm.", "v": "aaa", "name": "AAA", "dims": "≈ 10,5 × 44,5 mm", "shape": "cyl", "ratio": 4.24}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["AAA", "A23", "N", "AAAA"], "c": 3, "e": "AAAA je ještě štíhlejší válcový formát, přibližně 8,3 × 42,5 mm.", "v": "aaaa", "name": "AAAA", "dims": "≈ 8,3 × 42,5 mm", "shape": "cyl", "ratio": 5.12}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["D", "C", "AA", "CR123A"], "c": 1, "e": "C je výrazně tlustší válec než AA při podobné délce kolem 50 mm.", "v": "c", "name": "C", "dims": "≈ 26,2 × 50 mm", "shape": "cyl", "ratio": 1.91}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["D", "C", "18650", "9V / PP3"], "c": 0, "e": "D je nejmohutnější z běžné řady AAA/AA/C/D, zhruba 34 mm v průměru a přes 61 mm dlouhý.", "v": "d", "name": "D", "dims": "≈ 34,2 × 61,5 mm", "shape": "cyl", "ratio": 1.8}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["3R12 (plochá 4,5 V)", "D", "A23", "9V / PP3"], "c": 3, "e": "9V/PP3 poznáte podle hranatého těla a dvojice patentových kontaktů nahoře.", "v": "9v", "name": "9V / PP3", "dims": "≈ 26,5 × 17,5 × 48,5 mm", "shape": "block", "ratio": 1.83}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["9V / PP3", "CR2032", "3R12 (plochá 4,5 V)", "C"], "c": 2, "e": "3R12 je klasická plochá 4,5V baterie s hranatým tělem a dvěma plochými kontakty nahoře.", "v": "3r12", "name": "3R12 (plochá 4,5 V)", "dims": "≈ 67 × 62 × 22 mm", "shape": "flat", "ratio": 0.93}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["N", "A23", "AAAA", "CR123A"], "c": 1, "e": "A23 je krátký tenký váleček okolo 10 × 28 mm, často používaný v dálkových ovladačích.", "v": "a23", "name": "A23", "dims": "≈ 10,3 × 28,5 mm", "shape": "cyl", "ratio": 2.77}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["A23", "AAA", "AAAA", "N"], "c": 3, "e": "Článek N je válcový formát přibližně 12 × 30 mm – kratší a silnější než AAAA.", "v": "n", "name": "N", "dims": "≈ 12 × 30 mm", "shape": "cyl", "ratio": 2.5}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["CR2032", "CR2025", "CR2016", "LR44"], "c": 0, "e": "U CR2032 číslice odpovídají přibližně průměru 20 mm a tloušťce 3,2 mm.", "v": "cr2032", "name": "CR2032", "dims": "20 × 3,2 mm", "shape": "coin", "ratio": 0.16}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["CR2032", "CR2025", "CR2016", "LR44"], "c": 1, "e": "CR2025 má stejný průměr 20 mm jako CR2032, ale je tenčí – asi 2,5 mm.", "v": "cr2025", "name": "CR2025", "dims": "20 × 2,5 mm", "shape": "coin", "ratio": 0.125}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["CR2025", "CR2032", "CR2016", "LR44"], "c": 2, "e": "CR2016 je z trojice 20mm mincí nejtenčí, asi 1,6 mm.", "v": "cr2016", "name": "CR2016", "dims": "20 × 1,6 mm", "shape": "coin", "ratio": 0.08}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["LR44", "CR2016", "CR2025", "A23"], "c": 0, "e": "LR44 je malý knoflíkový článek okolo 11,6 mm v průměru a 5,4 mm vysoký.", "v": "lr44", "name": "LR44", "dims": "≈ 11,6 × 5,4 mm", "shape": "button", "ratio": 0.47}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["A23", "18650", "C", "CR123A"], "c": 3, "e": "CR123A je krátký robustní lithiový válec kolem 17 × 34,5 mm.", "v": "cr123a", "name": "CR123A", "dims": "≈ 17 × 34,5 mm", "shape": "cyl", "ratio": 2.03}, {"q": "Kterému formátu odpovídá silueta a uvedený rozměrový poměr?", "o": ["AA", "18650", "CR123A", "D"], "c": 1, "e": "Označení 18650 odkazuje na nominální průměr kolem 18 mm a délku kolem 65 mm; konkrétní provedení se může mírně lišit.", "v": "18650", "name": "18650", "dims": "nominálně 18 × 65 mm", "shape": "cyl", "ratio": 3.61}];let i=0,score=0,locked=false;let slots=document.getElementById('slots');for(let n=0;n<15;n++){let d=document.createElement('div');d.className='slot';d.id='s'+n;d.textContent=n+1;slots.appendChild(d)}
function batterySvg(x){let w=150,h=180;if(x.shape==='cyl'){let ratio=Math.min(5.5,Math.max(1.5,x.ratio));h=190;w=Math.max(42,Math.min(120,h/ratio));return `<svg viewBox='0 0 400 240'><rect x='${200-w/2}' y='22' width='${w}' height='${h}' rx='${w*.28}' fill='#bfc5ca' stroke='#f0d75c' stroke-width='6'/><rect x='${200-w*.22}' y='10' width='${w*.44}' height='16' rx='5' fill='#e5e7e8'/><rect x='${200-w/2+8}' y='70' width='${w-16}' height='65' rx='6' fill='#353b43'/><text x='200' y='112' text-anchor='middle' fill='#f3d75d' font-size='25' font-weight='900'>?</text></svg>`}if(x.shape==='coin'||x.shape==='button'){let hh=x.shape==='button'?65:38;return `<svg viewBox='0 0 400 240'><ellipse cx='200' cy='115' rx='112' ry='${hh}' fill='#d4d7d9' stroke='#f0d75c' stroke-width='6'/><ellipse cx='200' cy='105' rx='112' ry='${hh}' fill='#aeb4ba' stroke='#eef1f2' stroke-width='3'/><text x='200' y='115' text-anchor='middle' fill='#343a41' font-size='40' font-weight='900'>+</text></svg>`}if(x.shape==='block')return `<svg viewBox='0 0 400 240'><rect x='125' y='45' width='150' height='155' rx='12' fill='#343943' stroke='#f0d75c' stroke-width='6'/><circle cx='165' cy='38' r='18' fill='#c9ced1'/><circle cx='235' cy='38' r='12' fill='#c9ced1'/><text x='200' y='135' text-anchor='middle' fill='#f0d75c' font-size='42' font-weight='900'>9V?</text></svg>`;return `<svg viewBox='0 0 400 240'><rect x='92' y='65' width='216' height='125' rx='8' fill='#4a5058' stroke='#f0d75c' stroke-width='6'/><rect x='130' y='45' width='35' height='28' fill='#c9ced1'/><rect x='235' y='45' width='35' height='28' fill='#c9ced1'/><text x='200' y='140' text-anchor='middle' fill='#f0d75c' font-size='38' font-weight='900'>4,5V?</text></svg>`}
function show(){locked=false;let x=questions[i];document.getElementById('prog').textContent=`TEST ${String(i+1).padStart(2,'0')} / 15`;let scene=document.getElementById('scene');scene.innerHTML=batterySvg(x)+`<div class='dims'>${x.dims}</div>`;document.getElementById('q').textContent=x.q;let a=document.getElementById('answers');a.innerHTML='';x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=k;b.textContent=t;b.onclick=()=>answer(k);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});if(ok)score++;document.getElementById('s'+i).classList.add('done');let f=document.getElementById('fb');f.className='feedback show';f.textContent=x.e;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<questions.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=`${score} / 15`;document.getElementById('res').textContent=score>=13?'Organizér sedí skoro bez chyby.':score>=9?'Většinu formátů byste z krabičky vytáhli správně.':'Tužkové, knoflíkové i lithiové formáty se ještě trochu slévají.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
