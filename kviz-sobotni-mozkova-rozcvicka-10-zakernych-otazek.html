<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobotní mozková rozcvička – 10 otázek</title>
<style>
:root{--bg:#f3f3f2;--card:#fff;--navy:#21324a;--muted:#70757d;--accent:#9a5a0a;--soft:#f7f6f3;--good:#16783a;--goodbg:#ecf8ef;--bad:#b42318;--badbg:#fff0ee}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f2024}body{padding:32px 14px}
.shell{max-width:700px;margin:0 auto;background:#fff;border:1px solid #d7dbe1;border-radius:24px;overflow:hidden}
.head{padding:28px 28px 20px}.kicker{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
h1{font-size:31px;line-height:1.05;color:var(--navy);margin:0 0 14px;font-weight:900}.lead{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 24px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:800}.score{padding:9px 14px;border:1px solid #dcdfe4;background:var(--soft);border-radius:999px;white-space:nowrap}
.progress-wrap{height:9px;background:#ebe9e6;border-top:1px solid #e2dfdb;border-bottom:1px solid #e2dfdb}.progress{height:100%;width:0;background:#b06b13;transition:width .25s ease}
.main{padding:28px}.tag{display:inline-block;margin:0 0 11px;font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}.question{font-size:23px;line-height:1.3;font-weight:900;margin:0 0 22px}
.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid #dde1e6;background:#fff;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.35;font-weight:700;cursor:pointer}
.answer:hover:not(:disabled){border-color:#aeb7c2;background:#fbfbfc}.answer:disabled{cursor:default}.answer.correct{border-color:var(--good);background:var(--goodbg);color:#0e5c2a}.answer.wrong{border-color:var(--bad);background:var(--badbg);color:#8e1d15}
.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:13px;background:#f7f7f7;border:1px solid #e0e2e6;font-size:15px;line-height:1.5;color:#3f444c}.feedback.show{display:block}
.controls{display:none;justify-content:flex-end;margin-top:18px}.controls.show{display:flex}.next,.restart{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px 20px;font-size:15px;font-weight:900;cursor:pointer}
.result{display:none;text-align:center}.result.show{display:block}.result-score{font-size:54px;line-height:1;font-weight:900;color:var(--navy);margin:4px 0 10px}.result-title{font-size:25px;font-weight:900;margin:0 0 10px}.result-text{font-size:16px;line-height:1.5;color:#5f6670;max-width:540px;margin:0 auto 22px}
.footer{padding:0 28px 24px;text-align:center;color:#8a8f97;font-size:12px;line-height:1.45}
@media(max-width:520px){body{padding:12px 8px}.shell{border-radius:18px}.head{padding:22px 20px 16px}h1{font-size:27px}.lead{font-size:15px}.main{padding:22px 20px}.question{font-size:21px}.answer{padding:14px 15px;font-size:15px}.footer{padding:0 20px 20px}}
</style>
</head>
<body>
<div class="shell">
<section class="head">
<div class="kicker">SOBOTNÍ MOZKOVÁ ROZCVIČKA • 10 OTÁZEK</div>
<h1>Vypadají jednoduše. Právě proto nachytají.</h1>
<p class="lead">Žádné obskurní letopočty. Stačí procenta, logika, mapa nebo obyčejné hodiny — jen se nesmíte ukvapit.</p>
<div class="meta"><span id="counter">Otázka 1 z 10</span><span class="score">Skóre <span id="score">0</span></span></div>
</section>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<main class="main">
<section id="quizArea">
<div class="tag" id="tag"></div>
<h2 class="question" id="question"></h2>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<div class="controls" id="controls"><button class="next" id="nextBtn">Další otázka</button></div>
</section>
<section class="result" id="result">
<div class="result-score"><span id="finalScore">0</span>/10</div>
<h2 class="result-title" id="resultTitle"></h2>
<p class="result-text" id="resultText"></p>
<button class="restart" id="restartBtn">Zkusit znovu</button>
</section>
</main>
<div class="footer">Všechny úlohy mají právě jednu jednoznačnou správnou odpověď.</div>
</div>
<script>
const questions=[{"tag": "Procenta", "q": "Zboží stojí 1 000 Kč. Nejprve zlevní o 20 % a potom novou cenu zdraží o 20 %. Kolik stojí nakonec?", "a": ["960 Kč", "1 000 Kč", "980 Kč", "1 040 Kč"], "c": 0, "e": "Po slevě stojí 800 Kč. Dvacet procent z 800 Kč je 160 Kč, takže konečná cena je 960 Kč. Stejné procento se pokaždé počítalo z jiné částky."}, {"tag": "Výroba", "q": "Pět stejných strojů vyrobí pět součástek za pět minut. Za jak dlouho vyrobí 100 stejných strojů 100 součástek?", "a": ["5 minut", "20 minut", "100 minut", "500 minut"], "c": 0, "e": "Každý stroj vyrobí jednu součástku za pět minut. Sto strojů tedy za stejných pět minut vyrobí sto součástek."}, {"tag": "Cesta", "q": "Auto jede stejnou trasu tam rychlostí 60 km/h a zpět rychlostí 40 km/h. Jaká je jeho průměrná rychlost za celou cestu?", "a": ["48 km/h", "50 km/h", "52 km/h", "45 km/h"], "c": 0, "e": "U stejně dlouhých úseků nelze rychlosti jen zprůměrovat. Pro dvě stejné vzdálenosti vyjde průměrná rychlost 2 × 60 × 40 / (60 + 40) = 48 km/h."}, {"tag": "Rodina", "q": "Na výlet jdou dva otcové a dva synové. Přesto jsou tam jen tři lidé. Jak je to možné?", "a": ["Jde o dědečka, jeho syna a vnuka", "Jeden z otců je zároveň dvojče", "Dva lidé se počítají dvakrát kvůli příjmení", "Jeden ze synů na výlet nakonec nejde"], "c": 0, "e": "Tři lidé stačí: dědeček je otec, prostřední muž je zároveň syn i otec a třetí člověk je jeho syn."}, {"tag": "Růst", "q": "Lekníny každý den zdvojnásobí plochu, kterou pokrývají. Rybník je celý zakrytý 30. den. Kdy byl zakrytý přesně z poloviny?", "a": ["29. den", "15. den", "20. den", "28. den"], "c": 0, "e": "Jestli se pokrytá plocha každý den zdvojnásobí, den před úplným zakrytím musela být přesně poloviční."}, {"tag": "Hodiny", "q": "Jaký je menší úhel mezi hodinovou a minutovou ručičkou přesně ve 3:30?", "a": ["75°", "90°", "60°", "105°"], "c": 0, "e": "Minutová ručička je na 180°. Hodinová se za půl hodiny posune z 90° na 105°. Rozdíl je tedy 75°."}, {"tag": "Pravděpodobnost", "q": "Hodíte dvakrát poctivou mincí. Jaká je pravděpodobnost, že alespoň jednou padne panna?", "a": ["75 %", "50 %", "25 %", "100 %"], "c": 0, "e": "Možnosti jsou panna–panna, panna–orel, orel–panna a orel–orel. Ve třech ze čtyř případů padne alespoň jednou panna, tedy 75 %."}, {"tag": "Ponožky", "q": "Ve tmě vybíráte ponožky ze zásuvky. Jsou tam jen černé, bílé a modré. Kolik ponožek musíte vytáhnout, abyste měli jistotu alespoň dvou stejné barvy?", "a": ["4", "3", "5", "6"], "c": 0, "e": "V nejhorším vytáhnete nejprve jednu černou, jednu bílou a jednu modrou. Čtvrtá ponožka už musí mít jednu z těchto tří barev, takže vytvoří pár."}, {"tag": "Mapa", "q": "Na mapě v měřítku 1 : 50 000 jsou dvě místa vzdálená 3 cm. Jaká je jejich skutečná vzdálenost?", "a": ["1,5 km", "150 m", "15 km", "5 km"], "c": 0, "e": "Jeden centimetr na mapě odpovídá 50 000 cm ve skutečnosti, tedy 500 metrům. Tři centimetry jsou 1 500 metrů neboli 1,5 km."}, {"tag": "Kalendář", "q": "Který z těchto roků NENÍ přestupný podle gregoriánského kalendáře?", "a": ["2100", "2000", "2024", "2400"], "c": 0, "e": "Roky dělitelné 100 nejsou přestupné, pokud nejsou zároveň dělitelné 400. Rok 2100 proto přestupný nebude, zatímco 2000 a 2400 ano."}];
let index=0,score=0,locked=false;
const counter=document.getElementById('counter'),scoreEl=document.getElementById('score'),progress=document.getElementById('progress'),tagEl=document.getElementById('tag'),questionEl=document.getElementById('question'),answersEl=document.getElementById('answers'),feedbackEl=document.getElementById('feedback'),controls=document.getElementById('controls'),nextBtn=document.getElementById('nextBtn'),quizArea=document.getElementById('quizArea'),result=document.getElementById('result');
function render(){
 locked=false; const item=questions[index];
 counter.textContent=`Otázka ${index+1} z ${questions.length}`; scoreEl.textContent=score; progress.style.width=`${(index/questions.length)*100}%`; tagEl.textContent=item.tag; questionEl.textContent=item.q; answersEl.innerHTML=''; feedbackEl.className='feedback'; feedbackEl.innerHTML=''; controls.className='controls';
 item.a.forEach((txt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=txt;b.addEventListener('click',()=>answer(i));answersEl.appendChild(b);});
}
function answer(chosen){
 if(locked)return; locked=true; const item=questions[index]; const buttons=[...answersEl.querySelectorAll('.answer')];
 buttons.forEach((b,i)=>{b.disabled=true;if(i===item.c)b.classList.add('correct');});
 if(chosen===item.c){score++;scoreEl.textContent=score;feedbackEl.innerHTML=`<strong>Správně.</strong> ${item.e}`;}
 else{buttons[chosen].classList.add('wrong');feedbackEl.innerHTML=`<strong>Tentokrát ne.</strong> ${item.e}`;}
 feedbackEl.classList.add('show');controls.classList.add('show');progress.style.width=`${((index+1)/questions.length)*100}%`;nextBtn.textContent=index===questions.length-1?'Zobrazit výsledek':'Další otázka';
}
function finish(){
 quizArea.style.display='none';result.classList.add('show');counter.textContent='Hotovo';progress.style.width='100%';document.getElementById('finalScore').textContent=score;
 let title,text;
 if(score===10){title='Nenechali jste se nachytat ani jednou';text='Plný počet. Nejenže počítáte správně, ale hlavně jste u otázek nepřepnuli na automatickou odpověď.';}
 else if(score>=8){title='Velmi bystré sobotní ráno';text='Jedna nebo dvě pasti prošly, jinak jste drželi logiku i základní počty velmi pevně.';}
 else if(score>=5){title='Půlka pastí nevyšla';text='Základ máte. U těchto otázek ale často rozhoduje spíš klidné čtení než encyklopedická znalost.';}
 else{title='Ráno mozek ještě protestuje';text='Tyhle otázky jsou schválně postavené tak, aby sváděly k rychlé odpovědi. Druhý pokus může vypadat úplně jinak.';}
 document.getElementById('resultTitle').textContent=title;document.getElementById('resultText').textContent=text;
}
nextBtn.addEventListener('click',()=>{if(index<questions.length-1){index++;render();}else finish();});
document.getElementById('restartBtn').addEventListener('click',()=>{index=0;score=0;quizArea.style.display='';result.classList.remove('show');render();});
render();
</script>
</body>
</html>
