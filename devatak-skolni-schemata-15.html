<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz deváťáka pro dospělé: Přečtete 15 školních schémat bez učebnice?</title><style>
*{box-sizing:border-box}:root{--bg:#d5c39e;--locker:#315b70;--paper:#fffdf3;--ink:#25313a;--yellow:#f5c95d;--red:#b64c4c}html,body{margin:0;min-height:100%;background:linear-gradient(90deg,#c7b287,#e5d7b8);font-family:Arial,sans-serif;color:var(--ink);overflow-x:hidden}.wrap{max-width:1160px;margin:auto;padding:14px}header{background:#f8f1df;border:2px solid #8c7958;border-radius:18px;padding:18px 20px;box-shadow:0 15px 40px #6b583633}.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--red)}h1{font-size:clamp(27px,4vw,44px);line-height:1.05;margin:7px 0}.lead{color:#6e6557;line-height:1.48;max-width:900px}.school{margin-top:14px;display:grid;grid-template-columns:220px 1fr;gap:14px}.locker,.card{border-radius:16px;border:2px solid #254857}.locker{background:linear-gradient(180deg,#3b6d83,#2c5364);padding:12px;color:white}.locker h3{font-size:11px;letter-spacing:.12em;margin:0 0 8px}.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.door{height:50px;border:1px solid #6f9cae;border-radius:5px;background:#2d596b;display:grid;place-items:center;font-size:10px;color:#a9ccd8}.door.done{background:#498a68;color:white;border-color:#7bd9a2}.card{background:var(--paper);padding:16px;box-shadow:0 16px 36px #6b583633}.topline{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:#657680}.diagram{margin:12px 0;border:2px solid #a9a08c;border-radius:12px;background:#fff;padding:16px;min-height:200px;display:grid;place-items:center;text-align:center}.diagram .big{font-size:clamp(25px,4vw,47px);font-weight:1000;letter-spacing:.04em}.diagram .hint{margin-top:8px;color:#6d6d66;line-height:1.4;max-width:700px}.q{font-size:clamp(20px,2.5vw,28px);font-weight:1000;margin:6px 0 10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #91a0a7;background:#f5f7f7;border-radius:11px;padding:12px;text-align:left;font-weight:800;font-size:15px;cursor:pointer;min-height:56px}.opt.correct{background:#dff5e7;border-color:#65a77d;color:#173a25}.opt.wrong{background:#f9dfe0;border-color:#c56a6d;color:#5a1c1e}.opt:disabled{opacity:1}.feedback{display:none;margin-top:10px;padding:11px 12px;background:#edf2f2;border:1px solid #9daaad;border-radius:10px;line-height:1.42}.feedback.show{display:block}.next{display:none;margin:10px 0 0 auto;border:0;border-radius:10px;padding:11px 16px;background:var(--locker);color:white;font-weight:1000}.result{display:none;text-align:center;padding:36px}.result.show{display:block}.score{font-size:67px;font-weight:1000;color:var(--red)}.restart{border:0;border-radius:10px;padding:12px 16px;background:var(--yellow);font-weight:1000}@media(max-width:760px){.school{grid-template-columns:1fr}.locker{display:none}.opts{grid-template-columns:1fr}.wrap{padding:8px}.diagram{min-height:160px}}
</style></head><body><div class="wrap"><header><div class="kicker">SKŘÍŇKA 9.A // 15 DIAGRAMOVÝCH KARET</div><h1>Kvíz deváťáka pro dospělé: Přečtete 15 školních schémat bez učebnice?</h1><p class="lead">Žádný dlouhý výklad. Jen diagram, osa, řetězec, graf nebo jednoduchý model a otázka, kterou by měl zvládnout deváťák.</p></header><div class="school"><aside class="locker"><h3>SKŘÍŇKA 9.A</h3><div class="doors" id="doors"></div></aside><main class="card"><div id="quiz"><div class="topline"><span id="progress"></span><span>VIZUÁLNÍ UČIVO</span></div><div class="diagram"><div><div class="big" id="visual"></div><div class="hint" id="label"></div></div></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ KARTA →</button></div><section class="result" id="result"><div class="kicker">ZVONÍ</div><h2>Skříňka 9.A je otevřená</h2><div class="score" id="score"></div><p id="resText"></p><button class="restart" id="restart">VRÁTIT SE DO HODINY</button></section></main></div></div><script>
const Q=[{"kind": "fraction", "label": "Vybarveny jsou 3 ze 4 stejných dílů.", "q": "Jaký zlomek schéma znázorňuje?", "options": ["1/4", "2/3", "3/4", "4/3"], "a": 2, "exp": "Tři ze čtyř stejných částí znamenají 3/4."}, {"kind": "coords", "label": "Bod A leží 2 dílky vpravo a 3 dílky nahoru od počátku.", "q": "Jaké souřadnice má bod A?", "options": ["[3;2]", "[-2;3]", "[2;-3]", "[2;3]"], "a": 3, "exp": "Nejdřív x = 2, potom y = 3."}, {"kind": "triangle", "label": "Jeden vnitřní úhel je označen čtverečkem 90°.", "q": "Jaký typ trojúhelníku vidíte?", "options": ["Pravoúhlý", "Rovnostranný", "Tupoúhlý", "Rovnoramenný nutně vždy"], "a": 0, "exp": "Značka 90° určuje pravoúhlý trojúhelník."}, {"kind": "chain", "label": "Tráva → zajíc → liška", "q": "Kdo je v tomto jednoduchém potravním řetězci primární konzument?", "options": ["Tráva", "Zajíc", "Liška", "Všichni tři"], "a": 1, "exp": "Zajíc se živí producentem, tedy trávou, a je primárním konzumentem."}, {"kind": "earth", "label": "Tři soustředné vrstvy: kůra, plášť, jádro.", "q": "Která vrstva je na schématu úplně na povrchu Země?", "options": ["Jádro", "Plášť", "Kůra", "Vnější jádro"], "a": 2, "exp": "Nejvzdálenější vrstvou na zjednodušeném modelu je zemská kůra."}, {"kind": "atom", "label": "Uprostřed jádro, kolem něj částice na obalu.", "q": "Která částice se v základním školním modelu nachází v elektronovém obalu?", "options": ["Proton", "Neutron", "Nukleon", "Elektron"], "a": 3, "exp": "Elektrony tvoří elektronový obal kolem jádra."}, {"kind": "cell", "label": "V jednoduchém obrázku buňky je tmavý kulatý útvar uvnitř.", "q": "Co tento útvar obvykle představuje?", "options": ["Buněčné jádro", "Kořen", "Plod", "Kost"], "a": 0, "exp": "Tmavý vnitřní útvar ve školním schématu buňky bývá jádro."}, {"kind": "timeline", "label": "1918 — 1938 — 1945 — 1989", "q": "Který uvedený rok leží na časové ose nejpozději?", "options": ["1945", "1989", "1938", "1918"], "a": 1, "exp": "Nejpozdější z uvedených roků je 1989."}, {"kind": "bars", "label": "Sloupce A=4, B=7, C=5, D=3.", "q": "Který sloupec má nejvyšší hodnotu?", "options": ["A", "C", "B", "D"], "a": 2, "exp": "Nejvyšší hodnota 7 patří sloupci B."}, {"kind": "compass", "label": "Šipka N míří vzhůru; bod X je napravo od středu.", "q": "Jakým směrem leží bod X?", "options": ["Sever", "Jih", "Západ", "Východ"], "a": 3, "exp": "Při severu nahoře leží východ napravo."}, {"kind": "states", "label": "LED → VODA → PÁRA", "q": "Jak se jmenuje změna skupenství mezi ledem a kapalnou vodou?", "options": ["Tání", "Sublimace", "Kondenzace", "Tuhnutí"], "a": 0, "exp": "Přechod pevné látky do kapaliny je tání."}, {"kind": "solar", "label": "Slunce — Merkur — Venuše — Země — Mars", "q": "Která planeta je na schématu třetí od Slunce?", "options": ["Venuše", "Země", "Mars", "Merkur"], "a": 1, "exp": "Třetí planetou od Slunce je Země."}, {"kind": "venn", "label": "Dva kruhy A a B se částečně překrývají.", "q": "Co představuje překrytá část kruhů?", "options": ["Prvky, které nejsou ani v A ani v B", "Pouze prvky z A", "Průnik A a B", "Součet všech čísel"], "a": 2, "exp": "Překrytá oblast Vennova diagramu představuje společné prvky obou množin."}, {"kind": "grammar", "label": "PES | BĚŽÍ | RYCHLE", "q": "Které slovo tvoří v této jednoduché větě přísudek?", "options": ["Pes", "Rychle", "Žádné", "Běží"], "a": 3, "exp": "Slovesný přísudek je „běží“."}, {"kind": "density", "label": "Dvě stejně velké kostky: A má 100 g, B má 250 g.", "q": "Která kostka má při stejném objemu větší hustotu?", "options": ["B", "A", "Obě stejnou", "Z obrázku to nikdy nejde určit"], "a": 0, "exp": "Při stejném objemu má větší hustotu těleso s větší hmotností, tedy B."}];window.QUIZ=Q;let i=0,score=0,locked=false;const icons={fraction:'◼ ◼ ◼ □',coords:'↗  A( ? ; ? )',triangle:'△  ∟',chain:'🌱 → 🐇 → 🦊',earth:'◎  KŮRA / PLÁŠŤ / JÁDRO',atom:'⊙  • • •',cell:'◯  ●',timeline:'1918 ─ 1938 ─ 1945 ─ 1989',bars:'▅  █  ▆  ▄',compass:'N ↑   • → X',states:'🧊 → 💧 → ☁',solar:'☀ • • 🌍 •',venn:'◯∩◯',grammar:'PES | BĚŽÍ | RYCHLE',density:'A 100 g   ◼   ◼  250 g B'};document.getElementById('doors').innerHTML=Q.map((_,k)=>`<div class="door">${k+1}</div>`).join('');function show(){locked=false;let q=Q[i];document.getElementById('progress').textContent='KARTA '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('visual').textContent=icons[q.kind]||'SCHÉMA';document.getElementById('label').textContent=q.label;document.getElementById('q').textContent=q.q;let o=document.getElementById('opts');o.innerHTML='';q.options.forEach((x,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>answer(k);o.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===k&&j!==q.a)b.classList.add('wrong')});if(k===q.a)score++;document.querySelectorAll('.door')[i].classList.add('done');let f=document.getElementById('feedback');f.className='feedback show';f.innerHTML='<b>'+(k===q.a?'Karta sedí.':'Tahle skříňka zůstala zamčená.')+'</b><br>'+q.exp;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;if(i<Q.length)show();else finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('resText').textContent=score>=13?'Devátou třídu byste z diagramů dali s přehledem.':score>=9?'Většina školních schémat pořád drží.':'Některé přihrádky 9.A budou chtít doučování.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.door').forEach(x=>x.className='door');document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
