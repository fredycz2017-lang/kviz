<!doctype html><html lang='cs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Co je ve skutečnosti starší? 10 dvojic, u kterých první instinkt často selže</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111827,#050608 72%);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 14px 44px}.hero{border:1px solid #ffffff22;background:#ffffff0b;border-radius:24px;padding:24px;box-shadow:0 20px 60px #0008}.kicker{color:#f59e0b;font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(28px,6vw,48px);line-height:1.02;margin:8px 0 12px}.lead{color:#cbd5e1;line-height:1.55}.bar{height:8px;background:#ffffff18;border-radius:20px;overflow:hidden;margin:20px 0}.bar i{display:block;height:100%;width:0;background:#f59e0b;transition:.3s}.meta{display:flex;justify-content:space-between;color:#94a3b8;font-size:14px}.q{font-size:25px;font-weight:850;line-height:1.2;margin:24px 0 16px}.opts{display:grid;gap:10px}button.opt{text-align:left;border:1px solid #ffffff24;background:#ffffff0d;color:white;border-radius:16px;padding:16px;font-size:17px;font-weight:700;cursor:pointer}button.opt:hover{border-color:#f59e0b}button.opt:disabled{cursor:default}button.good{border-color:#22c55e;background:#22c55e22}button.bad{border-color:#ef4444;background:#ef444422}.why{display:none;margin-top:16px;padding:15px;border-left:4px solid #f59e0b;background:#0004;border-radius:10px;line-height:1.5}.next{display:none;margin-top:16px;width:100%;border:0;border-radius:14px;background:#f59e0b;color:#090909;padding:15px;font-weight:900;font-size:17px;cursor:pointer}.locks{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}.lock{width:34px;height:34px;border:1px solid #ffffff25;border-radius:9px;display:grid;place-items:center;color:#64748b}.lock.open{border-color:#f59e0b;color:#f59e0b;background:#d4af3714}.result{display:none;text-align:center;padding:25px 4px}.score{font-size:64px;font-weight:950;color:#f59e0b}.rank{font-size:26px;font-weight:900;margin:8px}.restart{border:1px solid #f59e0b;background:transparent;color:#f59e0b;padding:12px 18px;border-radius:14px;font-weight:800;cursor:pointer}footer{text-align:center;color:#64748b;font-size:12px;margin-top:16px}
</style></head><body><main class='wrap'><section class='hero'><div class='kicker'>Interaktivní kvíz • 10 kol</div><h1>Co je ve skutečnosti starší? 10 dvojic, u kterých první instinkt často selže</h1><p class='lead'>Nečeká vás klasický dějepis. V každém kole stojí proti sobě dvě známé věci, události nebo vynálezy. Klikněte na tu, která přišla dřív.</p><div id='game'><div class='bar'><i id='prog'></i></div><div class='meta'><span id='count'></span><span id='points'></span></div><div class='q' id='question'></div><div class='opts' id='opts'></div><div class='why' id='why'></div><button class='next' id='next'>Další kolo →</button></div><div class='result' id='result'><div class='kicker'>Výsledek</div><div class='score' id='score'></div><div class='rank' id='rank'></div><p class='lead' id='desc'></p><button class='restart' onclick='location.reload()'>Zkusit znovu</button></div></section><footer>Autorský kvíz • Adam Holl</footer></main><script>
const Q=[["Co je starší?", ["Platební karta", "Bankomat"], 0, "První univerzální platební karta Diners Club vznikla roku 1950; první moderní bankomat byl spuštěn v roce 1967."], ["Co přišlo dřív?", ["YouTube", "Facebook"], 1, "Facebook byl spuštěn v roce 2004, YouTube v roce 2005."], ["Co je starší?", ["Londýnské metro", "Eiffelova věž"], 0, "První úsek londýnského metra otevřel roku 1863; Eiffelova věž byla dokončena roku 1889."], ["Co přišlo dřív?", ["Fax", "Telefon"], 0, "Princip a patent faxového přenosu sahá do roku 1843; Bellův telefonní patent je z roku 1876."], ["Co je starší?", ["Konzervovaná potravina", "Domácí lednička"], 0, "Praktické konzervování se rozvíjelo už na počátku 19. století, elektrické domácí chladničky až ve 20. století."], ["Co přišlo dřív?", ["QR kód", "DVD"], 0, "QR kód byl vyvinut v roce 1994; formát DVD byl finalizován a uveden později v polovině 90. let."], ["Co je starší?", ["Nintendo", "Panamský průplav"], 0, "Nintendo vzniklo v roce 1889; Panamský průplav byl otevřen roku 1914."], ["Co přišlo dřív?", ["První e-mail", "První mobilní telefonní hovor"], 0, "Síťový e-mail se objevil roku 1971; první veřejně známý hovor z ručního mobilu proběhl roku 1973."], ["Co je starší?", ["Oxfordská univerzita", "Aztécká říše"], 0, "Výuka v Oxfordu je doložena od 11. století; Aztécká říše vznikla až v 15. století."], ["Co přišlo dřív?", ["Google", "Mezinárodní vesmírná stanice"], 0, "Google byl založen v září 1998; první modul ISS odstartoval v listopadu 1998."]];let n=0,s=0;const $=x=>document.getElementById(x);const locks=$('locks');if(locks){for(let i=0;i<10;i++)locks.innerHTML+=`<span class="lock" id="l${i}">${i+1}</span>`}function draw(){let q=Q[n];$('count').textContent=`Otázka ${n+1} / 10`;$('points').textContent=`Skóre: ${s}`;$('prog').style.width=`${n*10}%`;$('question').textContent=q[0];$('opts').innerHTML='';$('why').style.display='none';$('next').style.display='none';q[1].forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(i,b);$('opts').appendChild(b)})}function answer(i,b){[...document.querySelectorAll('.opt')].forEach(x=>x.disabled=true);let q=Q[n];if(i===q[2]){s++;b.classList.add('good');if(locks)$('l'+n).classList.add('open')}else{b.classList.add('bad');document.querySelectorAll('.opt')[q[2]].classList.add('good')}$('why').textContent=q[3];$('why').style.display='block';$('points').textContent=`Skóre: ${s}`;$('next').style.display='block'}$('next').onclick=()=>{n++;if(n<10)draw();else finish()};function finish(){$('game').style.display='none';$('result').style.display='block';$('score').textContent=`${s}/10`;let r,d;if(s===10){r='Absolutní mistr';d='Deset z deseti. Tohle už není náhoda.'}else if(s>=8){r='Elitní úroveň';d='Výborný přehled a minimum zaváhání.'}else if(s>=6){r='Velmi solidní výkon';d='Většinu pastí jste přečetli správně.'}else if(s>=4){r='Střed pole';d='Základ drží, ale několik detailů vás nachytalo.'}else{r='Dnes to kousalo';d='Právě od toho je druhý pokus – teď už znáte pasti.'}$('rank').textContent=r;$('desc').textContent=d}draw();</script></body></html>
