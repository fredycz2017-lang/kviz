<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poznáte kraj podle řeky, města a památky?</title>
<style>
:root{--bg:#f3f3f2;--navy:#21324a;--muted:#70757d;--accent:#9a5a0a;--good:#16783a;--goodbg:#ecf8ef;--bad:#b42318;--badbg:#fff0ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f2024}body{padding:32px 14px}
.shell{max-width:700px;margin:auto;background:#fff;border:1px solid #d7dbe1;border-radius:24px;overflow:hidden}.head{padding:28px 28px 20px}
.kicker{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}h1{font-size:31px;line-height:1.05;color:var(--navy);margin:0 0 14px;font-weight:900}.lead{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 24px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:800}.score{padding:9px 14px;border:1px solid #dcdfe4;background:#f7f6f3;border-radius:999px}.bar{height:9px;background:#ebe9e6;border-top:1px solid #e2dfdb;border-bottom:1px solid #e2dfdb}.prog{height:100%;width:0;background:#b06b13;transition:.25s}
.main{padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}.question{font-size:23px;line-height:1.3;font-weight:900;margin:0 0 16px}
.clues{display:grid;gap:8px;margin:0 0 22px}.clue{border:1px solid #e0e3e7;background:#f8f8f7;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800}
.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid #dde1e6;background:#fff;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.35;font-weight:700;cursor:pointer}.answer:hover:not(:disabled){border-color:#aeb7c2;background:#fbfbfc}.answer.correct{border-color:var(--good);background:var(--goodbg);color:#0e5c2a}.answer.wrong{border-color:var(--bad);background:var(--badbg);color:#8e1d15}
.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:13px;background:#f7f7f7;border:1px solid #e0e2e6;font-size:15px;line-height:1.5;color:#3f444c}.feedback.show{display:block}.controls{display:none;justify-content:flex-end;margin-top:18px}.controls.show{display:flex}.next,.restart{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px 20px;font-size:15px;font-weight:900;cursor:pointer}
.result{display:none;text-align:center}.result.show{display:block}.rscore{font-size:54px;line-height:1;font-weight:900;color:var(--navy);margin:4px 0 10px}.rtitle{font-size:25px;font-weight:900;margin:0 0 10px}.rtext{font-size:16px;line-height:1.5;color:#5f6670;max-width:540px;margin:0 auto 22px}.footer{padding:0 28px 24px;text-align:center;color:#8a8f97;font-size:12px}
@media(max-width:520px){body{padding:12px 8px}.shell{border-radius:18px}.head{padding:22px 20px 16px}h1{font-size:27px}.main{padding:22px 20px}.question{font-size:21px}.answer{padding:14px 15px;font-size:15px}}
</style>
</head>
<body><div class="shell">
<section class="head"><div class="kicker">ČESKO ZBLÍZKA • 10 KRAJŮ</div><h1>Poznáte kraj podle řeky, města a památky?</h1><p class="lead">Tři stopy, jeden kraj. Tentokrát nehledáme město, ale celý region — a jedna známá indicie nemusí vždy stačit.</p><div class="meta"><span id="counter">Kolo 1 z 10</span><span class="score">Skóre <span id="score">0</span></span></div></section>
<div class="bar"><div class="prog" id="prog"></div></div>
<main class="main"><section id="quiz"><div class="tag">Tři stopy</div><h2 class="question" id="question"></h2><div class="clues" id="clues"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls" id="controls"><button class="next" id="next">Další kraj</button></div></section>
<section class="result" id="result"><div class="rscore"><span id="final">0</span>/10</div><h2 class="rtitle" id="rtitle"></h2><p class="rtext" id="rtext"></p><button class="restart" id="restart">Zkusit znovu</button></section></main>
<div class="footer">Jedna řeka + jedno město + jedna památka. Vždy právě jeden správný kraj.</div></div>
<script>
const q=[{"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Jizera", "Město: Liberec", "Památka / dominanta: Ještěd"], "a": ["Liberecký kraj", "Královéhradecký kraj", "Středočeský kraj", "Ústecký kraj"], "c": 0, "e": "Jizera protéká částí Libereckého kraje, jeho správním centrem je Liberec a Ještěd patří k nejvýraznějším symbolům regionu."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Vltava", "Město: České Budějovice", "Památka: zámek Hluboká"], "a": ["Jihočeský kraj", "Plzeňský kraj", "Středočeský kraj", "Kraj Vysočina"], "c": 0, "e": "České Budějovice i Hluboká nad Vltavou leží v Jihočeském kraji a Vltava patří k jeho hlavním řekám."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Dyje", "Město: Brno", "Památka: Lednicko-valtický areál"], "a": ["Jihomoravský kraj", "Zlínský kraj", "Olomoucký kraj", "Kraj Vysočina"], "c": 0, "e": "Brno je centrem Jihomoravského kraje, Dyje protéká jeho jižní částí a Lednicko-valtický areál leží právě zde."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Ohře", "Město: Karlovy Vary", "Památka: hrad Loket"], "a": ["Karlovarský kraj", "Ústecký kraj", "Plzeňský kraj", "Liberecký kraj"], "c": 0, "e": "Ohře protéká Karlovarským krajem, Karlovy Vary jsou jeho krajským městem a hrad Loket leží nedaleko na stejné řece."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Berounka", "Město: Plzeň", "Památka: hrad Rabí"], "a": ["Plzeňský kraj", "Středočeský kraj", "Jihočeský kraj", "Karlovarský kraj"], "c": 0, "e": "Berounka vzniká v Plzni soutokem Mže a Radbuzy a hrad Rabí leží v Plzeňském kraji."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Labe", "Město: Hradec Králové", "Památka: hospitál Kuks"], "a": ["Královéhradecký kraj", "Pardubický kraj", "Liberecký kraj", "Středočeský kraj"], "c": 0, "e": "Hradec Králové je centrem kraje, Labe regionem protéká a barokní areál Kuks leží v okrese Trutnov."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Chrudimka", "Město: Pardubice", "Památka: zámek Litomyšl"], "a": ["Pardubický kraj", "Královéhradecký kraj", "Kraj Vysočina", "Olomoucký kraj"], "c": 0, "e": "Chrudimka protéká Pardubicemi a zámek Litomyšl, památka UNESCO, leží rovněž v Pardubickém kraji."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Jihlava", "Město: Jihlava", "Památka: historické centrum Telče"], "a": ["Kraj Vysočina", "Jihomoravský kraj", "Jihočeský kraj", "Pardubický kraj"], "c": 0, "e": "Jihlava je krajským městem Vysočiny, stejnojmenná řeka městem protéká a Telč patří k nejznámějším památkám regionu."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Morava", "Město: Olomouc", "Památka: Sloup Nejsvětější Trojice"], "a": ["Olomoucký kraj", "Zlínský kraj", "Jihomoravský kraj", "Moravskoslezský kraj"], "c": 0, "e": "Olomouc je centrem Olomouckého kraje, Morava regionem protéká a Sloup Nejsvětější Trojice je olomouckou památkou UNESCO."}, {"q": "Který kraj spojují tyto tři stopy?", "clues": ["Řeka: Odra", "Město: Ostrava", "Památka: Dolní oblast Vítkovice"], "a": ["Moravskoslezský kraj", "Olomoucký kraj", "Zlínský kraj", "Jihomoravský kraj"], "c": 0, "e": "Ostrava i Dolní oblast Vítkovice leží v Moravskoslezském kraji a Odra protéká Ostravskem."}];
let i=0,s=0,lock=false;
const counter=document.getElementById('counter'),score=document.getElementById('score'),prog=document.getElementById('prog'),question=document.getElementById('question'),clues=document.getElementById('clues'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),controls=document.getElementById('controls'),next=document.getElementById('next'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){lock=false;const x=q[i];counter.textContent=`Kolo ${i+1} z ${q.length}`;score.textContent=s;prog.style.width=`${i/q.length*100}%`;question.textContent=x.q;clues.innerHTML='';x.clues.forEach(t=>{const d=document.createElement('div');d.className='clue';d.textContent=t;clues.appendChild(d)});answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';controls.className='controls';x.a.forEach((t,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>pick(n);answers.appendChild(b)})}
function pick(n){if(lock)return;lock=true;const x=q[i],bs=[...answers.querySelectorAll('.answer')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('correct')});if(n===x.c){s++;score.textContent=s;feedback.innerHTML=`<strong>Správně.</strong> ${x.e}`}else{bs[n].classList.add('wrong');feedback.innerHTML=`<strong>Tentokrát ne.</strong> ${x.e}`}feedback.classList.add('show');controls.classList.add('show');prog.style.width=`${(i+1)/q.length*100}%`;next.textContent=i===q.length-1?'Zobrazit výsledek':'Další kraj'}
function finish(){quiz.style.display='none';result.classList.add('show');counter.textContent='Hotovo';prog.style.width='100%';document.getElementById('final').textContent=s;let t,p;if(s===10){t='Česko máte v malíčku';p='Plný počet. Řeky, města i památky jste poskládali bez jediné chyby.'}else if(s>=8){t='Velmi slušný domácí zeměpis';p='Jedna nebo dvě trojice vás potrápily, jinak jste se mezi kraji orientovali výborně.'}else if(s>=5){t='Základ drží';p='Některé dominanty byly jasné, jiné řeky nebo sousední kraje už dokázaly zamotat hlavu.'}else{t='Mapa by se tentokrát hodila';p='Tři stopy znějí jednoduše, ale sousední kraje dokážou být zrádné.'}document.getElementById('rtitle').textContent=t;document.getElementById('rtext').textContent=p}
next.onclick=()=>{if(i<q.length-1){i++;render()}else finish()};document.getElementById('restart').onclick=()=>{i=0;s=0;quiz.style.display='';result.classList.remove('show');render()};render();
</script></body></html>
