<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Skořice, hřebíček, badyán. Poznáte 15 druhů koření jen podle tvaru?</title><style>*{box-sizing:border-box}body{margin:0;background:#3a251a;color:#3a2417;font-family:Arial,sans-serif}.cabinet{max-width:1180px;margin:auto;padding:18px}header{background:#ead4ad;border:10px solid #7a4b2d;border-bottom-width:18px;padding:18px 22px;box-shadow:inset 0 0 0 3px #c0915f}.k{font-size:11px;letter-spacing:.18em;font-weight:900;color:#7c3b2b}h1{font-size:34px;line-height:1.05;margin:6px 0}.work{display:grid;grid-template-columns:1fr 310px;gap:16px;background:#6b432b;padding:16px;border:4px solid #2d1c14;border-top:0}.countertop{background:#efe0c5;border-radius:14px;padding:16px;box-shadow:inset 0 -10px 0 #d5b987}.scene{max-width:760px;margin:auto}.q{font-size:25px;font-weight:900;line-height:1.2;margin:13px 5px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{background:#fff9ec;border:2px solid #8d6a43;border-radius:12px;padding:13px;text-align:left;font-size:16px;font-weight:800;cursor:pointer}.opt:hover{border-color:#9c492f}.opt.ok{background:#dfead1}.opt.bad{background:#f2d1ca}.fb{display:none;margin-top:12px;background:#fff4d8;border-left:6px solid #9c492f;border-radius:8px;padding:13px;line-height:1.45}.next{display:none;margin:12px 0 0 auto;background:#7c3b2b;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:900}.drawer{background:#8a5737;border:5px solid #2d1c14;border-radius:12px;padding:14px;color:#fff}.drawerTop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b78965;padding-bottom:10px}.drawerTop b{font-size:30px}.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.jar{height:76px;border:2px solid #d4b07b;border-radius:12px 12px 18px 18px;background:#55351f;display:flex;align-items:end;justify-content:center;padding:5px;font-size:9px;color:#d8c0a1;text-align:center}.jar.done{background:#b98549;color:#21140d;box-shadow:inset 0 -26px 0 #d3ad6e}.result{display:none;text-align:center;padding:50px 10px}.score{font-size:78px;font-weight:1000;color:#7c3b2b}.restart{background:#3a251a;color:#fff;border:0;border-radius:10px;padding:13px 19px;font-weight:900}@media(max-width:820px){.work{grid-template-columns:1fr}.drawer{order:-1}.jars{grid-template-columns:repeat(5,1fr)}.jar{height:45px}.opts{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body><div class="cabinet"><header><div class="k">ZÁSUVKA KOŘENÍ // AROMATICKÝ ATLAS BEZ VŮNĚ</div><h1>Kvíz: Skořice, hřebíček, badyán. Poznáte 15 druhů koření jen podle tvaru?</h1></header><div class="work"><main class="countertop"><div id="quiz"><div class="scene" id="scene"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">PŘESYPAT DALŠÍ →</button></div><div class="result" id="result"><div class="k">ZÁSUVKA POPSANÁ</div><div class="score" id="score"></div><h2 id="grade"></h2><p>Žádné obaly ani značky: jen celý tvar koření a morfologie.</p><button class="restart" id="restart">VYSYPAT A ZNOVU</button></div></main><aside class="drawer"><div class="drawerTop"><span>DÓZY</span><b id="prog">01/15</b></div><div class="jars" id="jars"></div></aside></div></div><script>const Q=[{"name":"Skořice","kind":"cinnamon","q":"Co poznáte podle stočených trubiček usušené kůry?","o":["Skořice","Vanilka","Bobkový list","Muškátový oříšek"],"a":0,"e":"Skořice je sušená kůra stromů rodu Cinnamomum a v celku tvoří typické svitky."},{"name":"Hřebíček","kind":"clove","q":"Které koření připomíná malý hřebíček s kulatou hlavičkou?","o":["Hřebíček","Nové koření","Kmín","Hořčičné semínko"],"a":0,"e":"Hřebíček jsou sušená neotevřená květní poupata; tvar připomíná drobný hřebík."},{"name":"Badyán","kind":"star","q":"Které koření tvoří tvrdá hvězdicovitá souplodí s několika cípy?","o":["Badyán","Kardamom","Anýz","Vanilka"],"a":0,"e":"Badyán neboli star anise se prodává jako nápadná hvězdicovitá souplodí."},{"name":"Černý pepř","kind":"pepper","q":"Co tvoří malé kulaté, vrásčité kuličky běžně sypané do mlýnku?","o":["Černý pepř","Koriandr","Hořčice","Nové koření"],"a":0,"e":"Celý černý pepř jsou sušené peckovice pepřovníku a má typicky vrásčitý kulatý povrch."},{"name":"Kardamom","kind":"cardamom","q":"Které koření poznáte podle podlouhlých žebernatých tobolek, uvnitř kterých jsou drobná semena?","o":["Kardamom","Vanilka","Kmín","Fenykl"],"a":0,"e":"Kardamom se často prodává v celých tobolkách, které ukrývají aromatická semena."},{"name":"Koriandr","kind":"coriander","q":"Které koření má téměř kulatá semena/plody s jemnými podélnými žebry?","o":["Koriandr","Kmín","Římský kmín","Fenykl"],"a":0,"e":"Sušený koriandr je kulovitý až téměř kulovitý a výrazně se liší od protáhlého kmínu."},{"name":"Kmín","kind":"caraway","q":"Které české kuchyni dobře známé koření tvoří úzké, lehce zahnuté plody s podélnými rýhami?","o":["Kmín","Koriandr","Hořčičné semínko","Nové koření"],"a":0,"e":"Kmín kořenný má protáhlé, zakřivené a rýhované plody."},{"name":"Hořčičné semínko","kind":"mustard","q":"Co vypadá jako velké množství velmi drobných téměř dokonale kulatých semínek?","o":["Hořčičné semínko","Hřebíček","Kardamom","Bobkový list"],"a":0,"e":"Hořčice se používá jako drobná kulatá semena různých druhů rodu Brassica."},{"name":"Muškátový oříšek","kind":"nutmeg","q":"Které koření je jeden oválný tvrdý útvar s nepravidelně rýhovaným povrchem?","o":["Muškátový oříšek","Nové koření","Kardamom","Jalovec"],"a":0,"e":"Muškátový oříšek je sušené semeno s nápadně vrásčitým/rýhovaným povrchem."},{"name":"Římský kmín","kind":"cumin","q":"Které koření má dlouhá úzká semena/plody, rovnější a štíhlejší než běžný kmín?","o":["Římský kmín","Koriandr","Hořčice","Hřebíček"],"a":0,"e":"Cumin neboli římský kmín je protáhlý a podélně rýhovaný; oproti kmínu kořennému bývá rovnější."},{"name":"Fenykl","kind":"fennel","q":"Které koření tvoří větší podlouhlé, žebrované plody, často mírně prohnuté?","o":["Fenykl","Kmín","Koriandr","Kardamom"],"a":0,"e":"Fenyklová semena/plody jsou protáhlá, výrazně žebrovaná a větší než běžný kmín."},{"name":"Nové koření","kind":"allspice","q":"Co vypadá jako hladší kulatá bobule, obvykle větší než kulička černého pepře?","o":["Nové koření","Černý pepř","Koriandr","Hořčice"],"a":0,"e":"Nové koření jsou sušené nezralé plody pimentovníku; v celku vypadají jako kulaté bobule."},{"name":"Vanilka","kind":"vanilla","q":"Které koření poznáte podle velmi dlouhého tenkého tmavého lusku?","o":["Vanilka","Skořice","Bobkový list","Kardamom"],"a":0,"e":"Vanilka se prodává jako dlouhé usušené plody orchideje Vanilla planifolia."},{"name":"Bobkový list","kind":"bay","q":"Které koření je celé tuhé kopinaté až eliptické listí s výraznou střední žilkou?","o":["Bobkový list","Badyán","Skořice","Hřebíček"],"a":0,"e":"Bobkový list je sušený list vavřínu; i po usušení si zachovává zřetelný listový tvar."},{"name":"Jalovec","kind":"juniper","q":"Které koření tvoří kulaté bobulovité šištice s drobnou trojcípou kresbou na konci?","o":["Jalovec","Nové koření","Pepř","Koriandr"],"a":0,"e":"Jalovčinky jsou kulaté bobulovité šištice jalovce; na vrcholu lze často vidět trojčetnou stopu."}];let i=0,score=0;function spice(k){let s='';const ink='#5a331d',red='#9c492f',cream='#f2dec0',green='#71875a';
if(k==='cinnamon')s=`<path d='M240 160q70 100 0 220M300 150q70 110 0 240M390 145q70 115 0 250M470 165q65 95 0 210' fill='none' stroke='#9a5b35' stroke-width='32' stroke-linecap='round'/><path d='M240 160q-18 15 0 30M300 150q-18 15 0 30M390 145q-18 15 0 30M470 165q-18 15 0 30' fill='none' stroke='#4c2b1b' stroke-width='8'/>`;
if(k==='clove')s=`${[[250,190],[350,150],[440,230],[520,170],[320,300]].map(p=>`<g transform='translate(${p[0]} ${p[1]}) rotate(${p[0]%40-20})'><rect x='-10' y='0' width='20' height='120' rx='8' fill='${ink}'/><circle cy='0' r='28' fill='${red}'/></g>`).join('')}`;
if(k==='star')s=`${[[300,230],[470,260]].map(p=>`<g transform='translate(${p[0]} ${p[1]})'>${Array.from({length:8},(_,i)=>`<path d='M0 0 L20 -80 L-20 -80Z' fill='${i%2?ink:red}' transform='rotate(${i*45})'/>`).join('')}<circle r='20' fill='#2d1d14'/></g>`).join('')}`;
if(k==='pepper'||k==='allspice'||k==='juniper')s=`${Array.from({length:18},(_,i)=>`<circle cx='${210+(i*77)%380}' cy='${150+(i*61)%240}' r='${k==='allspice'?18: k==='juniper'?19:14}' fill='${k==='juniper'?green:k==='allspice'?'#6f4b34':'#2b241f'}' stroke='${ink}' stroke-width='3'/>${k==='juniper'?`<path d='M${210+(i*77)%380-8} ${150+(i*61)%240-18} l8 10 8-10' fill='none' stroke='${cream}' stroke-width='2'/>`:''}`).join('')}`;
if(k==='cardamom')s=`${[[260,200],[390,160],[500,260],[330,330]].map((p,i)=>`<path d='M${p[0]-35} ${p[1]} q35-65 70 0 q-12 85-70 0z' fill='${green}' stroke='${ink}' stroke-width='5'/><path d='M${p[0]} ${p[1]-45}v80' stroke='#46553b' stroke-width='4'/>`).join('')}`;
if(k==='coriander'||k==='mustard')s=`${Array.from({length:k==='mustard'?42:22},(_,i)=>`<circle cx='${190+(i*59)%430}' cy='${135+(i*73)%260}' r='${k==='mustard'?7:15}' fill='${k==='mustard'?'#b28e45':'#b79865'}' stroke='${ink}' stroke-width='2'/>${k==='coriander'?`<path d='M${190+(i*59)%430} ${120+(i*73)%260}v30' stroke='#795f3c' stroke-width='2'/>`:''}`).join('')}`;
if(k==='caraway'||k==='cumin'||k==='fennel')s=`${Array.from({length:24},(_,i)=>`<path d='M${190+(i*67)%420} ${140+(i*59)%260} q${k==='caraway'?18:8} 35 ${k==='fennel'?10:4} ${k==='fennel'?68:52}' fill='none' stroke='${k==='fennel'?'#9a9b55':'#785936'}' stroke-width='${k==='fennel'?10:7}' stroke-linecap='round'/>`).join('')}`;
if(k==='nutmeg')s=`<ellipse cx='390' cy='260' rx='115' ry='145' fill='#9b7251' stroke='${ink}' stroke-width='8'/>${Array.from({length:9},(_,i)=>`<path d='M${320+i*18} 145 q${30-i*4} 110 ${i%2?20:-15} 230' fill='none' stroke='#5f412d' stroke-width='6'/>`).join('')}`;
if(k==='vanilla')s=`<path d='M230 340 Q350 100 560 160' fill='none' stroke='#33231b' stroke-width='22' stroke-linecap='round'/><path d='M250 365 Q370 125 575 185' fill='none' stroke='#523627' stroke-width='18' stroke-linecap='round'/>`;
if(k==='bay')s=`<path d='M250 330 Q300 120 520 170 Q500 355 250 330Z' fill='${green}' stroke='${ink}' stroke-width='7'/><path d='M270 315 Q370 240 500 180' stroke='#425737' stroke-width='7'/><path d='M335 270l-45-55M395 235l-35-65M445 205l-25-55' stroke='#526846' stroke-width='5'/>`;
return `<svg viewBox='0 0 780 520'><rect width='780' height='520' rx='24' fill='#f4ead8'/><circle cx='390' cy='260' r='205' fill='#fff9ed' stroke='#d4b78b' stroke-width='5'/>${s}</svg>`}for(let n=0;n<15;n++)jars.innerHTML+=`<div class="jar" data-j="${n}">${String(n+1).padStart(2,'0')}</div>`;function show(){let x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;scene.innerHTML=spice(x.kind);q.textContent=x.q;opts.innerHTML='';[0,1,2,3].map(n=>(n+((i*3+1)%4))%4).forEach(j=>{let v=x.o[j],b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){let x=Q[i];[...document.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;let jar=document.querySelector(`[data-j="${i}"]`);jar.classList.add('done');jar.textContent=x.name;fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'DÓZA SEDÍ.':'AROMA BY SKONČILO VE ŠPATNÉ PŘIHRÁDCE.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';scoreEl=document.getElementById('score');scoreEl.textContent=`${score} / 15`;grade.textContent=score>=13?'Kořenář bez čichu':score>=9?'Dobrá zásuvka':'Badyán s hřebíčkem ještě trochu zlobí'}document.getElementById('restart').onclick=()=>{i=0;score=0;result.style.display='none';quiz.style.display='block';document.querySelectorAll('.jar').forEach((x,n)=>{x.classList.remove('done');x.textContent=String(n+1).padStart(2,'0')});show()};show();</script></body></html>
