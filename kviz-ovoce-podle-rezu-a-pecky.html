<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Jablko, hruška, švestka. Poznáte 15 druhů ovoce jen podle řezu a pecky?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4efe2;color:#263126}.wrap{max-width:1120px;margin:auto;padding:18px}header{background:#fffaf0;border:2px solid #8da06e;border-radius:22px;padding:18px;box-shadow:0 14px 30px #68785722}h1{margin:0;font-size:clamp(26px,4vw,43px);line-height:1.06}.sub{color:#5f6a50;line-height:1.5}.market{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.crate,.card{background:#fffaf0;border:2px solid #9b8a5d;border-radius:18px}.crate{padding:16px;height:max-content;position:sticky;top:12px;background:repeating-linear-gradient(0deg,#d9bc7e 0 22px,#c9a667 22px 44px)}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#f5e8c7aa;padding:10px;border-radius:10px}.slot{height:35px;border:2px dashed #8b7044;border-radius:8px;background:#fff5d8}.slot.on{background:#7f9d5f;border-style:solid}.label{background:#fff8df;border:2px solid #7b633f;border-radius:10px;padding:10px;margin-bottom:12px;font-weight:800}.card{padding:18px}.zone{display:inline-block;background:#e4ecd3;border:1px solid #9eaf83;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.fruitview{min-height:210px;margin:12px 0;border-radius:16px;background:#f9f4e8;border:1px solid #d1c3a2;display:flex;align-items:center;justify-content:center}.q{font-size:clamp(21px,3vw,29px);font-weight:800;line-height:1.22;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:2px solid #b6a77f;background:white;padding:13px;border-radius:12px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#e2f2df;border-color:#5d8a51}.answer.wrong{background:#f5dddd;border-color:#a14b4b}.answer.locked{pointer-events:none}.feedback{display:none;margin-top:13px;padding:12px;border-radius:12px;background:#eef0df;border-left:5px solid #78905c;line-height:1.5}.feedback.show{display:block}.next,.restart{margin-top:14px;background:#667f4d;color:#fff;border:0;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:30px}.score{font-size:58px;font-weight:900;color:#5d7546}.band{max-width:620px;margin:10px auto;line-height:1.5}@media(max-width:800px){.market{grid-template-columns:1fr}.crate{position:static}.answers{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><h1>Kvíz: Jablko, hruška, švestka. Poznáte 15 druhů ovoce jen podle řezu a pecky?</h1><p class="sub">Bez stromu a bez etikety. Jen stylizovaný řez, semena a pecky.</p></header><div class="market"><aside class="crate"><div class="label">BOTANICKÁ VITRÍNA<br><span id="progressText">1 / 15</span></div><div class="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></aside><main class="card"><section id="quizArea"><div class="zone" id="zoneTag"></div><div class="fruitview" id="visual"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn" disabled>Další plod</button></section><section class="result" id="resultArea"><h2>Vitrína zaplněna</h2><div class="score" id="scoreOut"></div><div class="band" id="bandOut"></div><button class="restart" id="restartBtn">Zkusit znovu</button></section></main></div></div><script>function fruitSvg(t){const s='#2f332b',f='#f8f1dc',r='#b9a97a',seed='#4e4131';const wrap=(body)=>`<svg viewBox="0 0 260 190" width="100%" height="190" aria-hidden="true">${body}</svg>`;
const ellipse=(cx,cy,rx,ry,extra='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${s}" stroke-width="4" ${extra}/>`;
const seeds=(arr)=>arr.map(([x,y,rx=4,ry=7,rot=0])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${seed}" transform="rotate(${rot} ${x} ${y})"/>`).join('');
if(t==='apple') return wrap(ellipse(130,95,70,65)+`<path d="M130 58 L146 82 L140 112 L120 112 L114 82 Z" fill="none" stroke="${r}" stroke-width="4"/>`+seeds([[130,72],[146,92],[138,113],[120,113],[114,92]]));
if(t==='pear') return wrap(`<path d="M130 28 C110 50 82 62 78 105 C74 148 105 166 130 166 C155 166 186 148 182 105 C178 62 150 50 130 28 Z" fill="${f}" stroke="${s}" stroke-width="4"/>`+seeds([[130,92],[122,105],[139,106],[129,119]]));
if(t==='plum') return wrap(ellipse(130,96,56,72)+ellipse(130,98,15,35,`fill="${r}"`));
if(t==='cherry') return wrap(ellipse(130,100,52,52)+ellipse(130,100,22,22,`fill="${r}"`)+`<path d="M130 48 Q145 28 153 20" fill="none" stroke="${s}" stroke-width="4"/>`);
if(t==='peach') return wrap(ellipse(130,95,68,65)+`<path d="M130 54 C160 70 160 120 130 138 C100 120 100 70 130 54Z" fill="${r}" stroke="${s}" stroke-width="3"/>`+`<path d="M118 70 Q132 95 118 120 M142 70 Q128 95 142 120" fill="none" stroke="#6f6049" stroke-width="2"/>`);
if(t==='avocado') return wrap(`<path d="M130 25 C108 50 77 78 82 117 C88 155 108 170 130 170 C152 170 172 155 178 117 C183 78 152 50 130 25 Z" fill="${f}" stroke="${s}" stroke-width="4"/>`+ellipse(130,112,31,31,`fill="${r}"`));
if(t==='orange'||t==='lemon'){const rx=t==='orange'?68:76, ry=t==='orange'?68:54;let body=ellipse(130,95,rx,ry);for(let i=0;i<10;i++){let a=i*Math.PI/5;let x=130+Math.cos(a)*rx*.8,y=95+Math.sin(a)*ry*.8;body+=`<line x1="130" y1="95" x2="${x}" y2="${y}" stroke="${r}" stroke-width="3"/>`;}body+=ellipse(130,95,rx-10,ry-10,`fill="none" stroke="${r}" stroke-width="2"`);return wrap(body);}
if(t==='kiwi'){let body=ellipse(130,95,67,67)+ellipse(130,95,26,26,`fill="none" stroke="${r}" stroke-width="3"`);let arr=[];for(let i=0;i<24;i++){let a=i*Math.PI/12;arr.push([130+Math.cos(a)*43,95+Math.sin(a)*43,2.5,5,a*180/Math.PI+90]);}return wrap(body+seeds(arr));}
if(t==='banana') return wrap(`<path d="M55 70 Q120 35 205 75 Q170 130 80 137 Q56 120 55 70Z" fill="${f}" stroke="${s}" stroke-width="4"/>`+`<path d="M74 82 Q125 56 187 82 Q158 111 91 117" fill="none" stroke="${r}" stroke-width="3"/>`+seeds([[112,93,2,3],[127,91,2,3],[142,91,2,3],[157,94,2,3]]));
if(t==='grape') return wrap(ellipse(130,95,50,68)+seeds([[118,94,6,10,-15],[140,101,6,10,15]]));
if(t==='watermelon'){let body=ellipse(130,95,90,67)+ellipse(130,95,79,56,`fill="none" stroke="${r}" stroke-width="4"`);return wrap(body+seeds([[92,74],[121,65],[151,72],[172,94],[142,112],[105,116],[128,132],[159,126]]));}
if(t==='pomegranate'){let body=ellipse(130,100,68,62)+`<path d="M112 38 L130 22 L148 38" fill="none" stroke="${s}" stroke-width="4"/>`;let arr=[];for(let y=70;y<=130;y+=20)for(let x=95;x<=165;x+=18)arr.push([x,y,4,6,0]);return wrap(body+seeds(arr)+`<path d="M90 96 H170 M130 50 V150" stroke="${r}" stroke-width="2"/>`);}
if(t==='fig'){let body=`<path d="M130 25 C105 50 82 76 84 113 C86 150 107 165 130 165 C153 165 174 150 176 113 C178 76 155 50 130 25Z" fill="${f}" stroke="${s}" stroke-width="4"/>`;let arr=[];for(let i=0;i<35;i++){let a=i*.8,rad=8+(i%6)*7;arr.push([130+Math.cos(a)*rad,102+Math.sin(a)*rad,2,2,0]);}return wrap(body+seeds(arr));}
if(t==='strawberry'){let body=`<path d="M130 38 C95 38 72 60 82 95 C92 130 110 155 130 168 C150 155 168 130 178 95 C188 60 165 38 130 38Z" fill="${f}" stroke="${s}" stroke-width="4"/>`;let arr=[];for(let y=70;y<=130;y+=18)for(let x=105+(y%36?0:9);x<=155;x+=18)arr.push([x,y,2,3,0]);return wrap(body+seeds(arr));}
return wrap('');}</script>
<script>
const questions=[{"zone": "JÁDŘINCE", "fruit": "apple", "q": "Který plod ukazuje stylizovaný řez s pětidílným jádřincem uprostřed?", "options": ["Jablko", "Hruška", "Kdoule", "Kiwi"], "correct": 0, "explanation": "Pro jablko je typický centrální jádřinec se semeny uspořádanými do pěti pouzder."}, {"zone": "JÁDŘINCE", "fruit": "pear", "q": "Které ovoce poznáte podle hruškovitého obrysu a centrálního jádřince?", "options": ["Fík", "Avokádo", "Jablko", "Hruška"], "correct": 3, "explanation": "Hruška má typický zúžený tvar a uvnitř jádřinec se semeny."}, {"zone": "PECKOVINY", "fruit": "plum", "q": "Který plod má oválný řez a jednu protáhlejší pecku?", "options": ["Třešeň", "Švestka", "Hroznové víno", "Kiwi"], "correct": 1, "explanation": "Švestka patří mezi peckoviny a typicky obsahuje jednu podlouhlejší pecku."}, {"zone": "PECKOVINY", "fruit": "cherry", "q": "Který malý kulatý plod má jedinou pecku uprostřed?", "options": ["Hroznové víno", "Rybíz", "Třešeň", "Fík"], "correct": 2, "explanation": "Třešeň je peckovina s jedinou peckou uvnitř malého kulatého plodu."}, {"zone": "PECKOVINY", "fruit": "peach", "q": "Které ovoce má velkou výrazně rýhovanou pecku uprostřed?", "options": ["Broskev", "Meruňka", "Švestka", "Avokádo"], "correct": 0, "explanation": "Broskev má nápadnou, tvrdou a hluboce rýhovanou pecku."}, {"zone": "PECKOVINY", "fruit": "avocado", "q": "Který plod má velmi velké téměř kulaté semeno, které zabírá značnou část řezu?", "options": ["Mango", "Papája", "Avokádo", "Hruška"], "correct": 2, "explanation": "Avokádo je dobře poznatelné podle jediného velmi velkého semene uprostřed."}, {"zone": "BOBULE", "fruit": "orange", "q": "Který plod ukazuje kruhový řez rozdělený na mnoho radiálních dílků?", "options": ["Kiwi", "Granátové jablko", "Fík", "Pomeranč"], "correct": 3, "explanation": "Pomeranč má typické citrusové dílky uspořádané radiálně kolem středu."}, {"zone": "BOBULE", "fruit": "lemon", "q": "Který citrus bývá na řezu protáhlejší a má výraznou silnější kůru kolem segmentů?", "options": ["Pomeranč", "Citron", "Kiwi", "Hroznové víno"], "correct": 1, "explanation": "Citron má oválnější profil a výraznou citrusovou kůru kolem segmentované dužiny."}, {"zone": "BOBULE", "fruit": "kiwi", "q": "Který řez má prstenec mnoha drobných semen kolem světlejšího středu?", "options": ["Fík", "Jablko", "Granátové jablko", "Kiwi"], "correct": 3, "explanation": "Kiwi je typické radiálním uspořádáním mnoha drobných semen kolem středu."}, {"zone": "EXOTIKA", "fruit": "banana", "q": "Který plod je na podélném řezu protáhlý, mírně zahnutý a má jen drobné zbytky semen?", "options": ["Banán", "Mango", "Papája", "Avokádo"], "correct": 0, "explanation": "Pěstované banány mají protáhlý zahnutý tvar a jen drobné, nevyvinuté zbytky semen."}, {"zone": "EXOTIKA", "fruit": "grape", "q": "Který malý oválný plod může mít uvnitř několik drobných semen, ale žádnou velkou pecku?", "options": ["Třešeň", "Hroznové víno", "Švestka", "Broskev"], "correct": 1, "explanation": "Bobule hroznu mohou obsahovat několik semen, ale nemají jedinou velkou pecku jako peckoviny."}, {"zone": "EXOTIKA", "fruit": "watermelon", "q": "Který velký řez má silnou vnější vrstvu a mnoho semen rozptýlených v dužině?", "options": ["Granátové jablko", "Kiwi", "Vodní meloun", "Pomeranč"], "correct": 2, "explanation": "Vodní meloun má silnou slupku a v dužině bývá rozptýleno mnoho semen."}, {"zone": "FINÁLE", "fruit": "pomegranate", "q": "Který plod je uvnitř rozdělen do komor plných jednotlivých šťavnatých semen?", "options": ["Granátové jablko", "Fík", "Kiwi", "Hroznové víno"], "correct": 0, "explanation": "Granátové jablko obsahuje množství semen obalených šťavnatými míšky v oddělených komorách."}, {"zone": "FINÁLE", "fruit": "fig", "q": "Který plod má na řezu dutinu vyplněnou velkým množstvím drobných semínek?", "options": ["Hruška", "Jablko", "Avokádo", "Fík"], "correct": 3, "explanation": "Fík má charakteristickou vnitřní strukturu s množstvím drobných nažek uvnitř dužnatého útvaru."}, {"zone": "FINÁLE", "fruit": "strawberry", "q": "Který plod poznáte podle srdčitého řezu a drobných „semínek“ na vnějším povrchu?", "options": ["Malina", "Jahoda", "Třešeň", "Hroznové víno"], "correct": 1, "explanation": "U jahody jsou drobné nažky nápadně na povrchu plodu, což ji od většiny ostatních plodů odlišuje."}];
let idx=0,score=0,answered=false;
const qEl=document.getElementById('question'), aEl=document.getElementById('answers'), fbEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), progressText=document.getElementById('progressText'), zoneTag=document.getElementById('zoneTag'), quizArea=document.getElementById('quizArea'), resultArea=document.getElementById('resultArea'), scoreOut=document.getElementById('scoreOut'), bandOut=document.getElementById('bandOut'), restartBtn=document.getElementById('restartBtn');
function render(){answered=false;nextBtn.disabled=true;fbEl.classList.remove('show');const q=questions[idx];zoneTag.textContent=q.zone;progressText.textContent=`${idx+1} / ${questions.length}`;qEl.textContent=q.q;document.getElementById('visual').innerHTML=fruitSvg(q.fruit);document.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('on',i<idx));;aEl.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;b.onclick=()=>choose(i);aEl.appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[idx];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.add('locked');if(i===q.correct)b.classList.add('correct');if(i===choice&&i!==q.correct)b.classList.add('wrong');});const ok=choice===q.correct;if(ok)score++;fbEl.innerHTML=`<strong>${ok?'Správně.':'Tentokrát ne.'}</strong> ${q.explanation}`;fbEl.classList.add('show');nextBtn.disabled=false;}
nextBtn.onclick=()=>{idx++;if(idx>=questions.length)finish();else render();};
function finish(){quizArea.style.display='none';resultArea.style.display='block';scoreOut.textContent=`${score} / ${questions.length}`;let text='Dobrá práce.';if(score<=5)text='Tenhle svět vás trochu potrápil, ale o to víc jste si z něj odnesli.';else if(score<=10)text='Solidní výsledek. Většinu situací jste zvládli bez většího zaváhání.';else if(score<=13)text='Velmi dobré. V tomhle tématu se orientujete opravdu jistě.';else text='Výborně. Tohle už je skoro bezchybný průchod celým kvízem.';bandOut.textContent=text;document.querySelectorAll('.slot').forEach(s=>s.classList.add('on')); }
restartBtn.onclick=()=>{idx=0;score=0;quizArea.style.display='block';resultArea.style.display='none';document.querySelectorAll('.answer').forEach(x=>x.classList.remove('locked'));render();};
render();
</script></body></html>
