<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pohádkový rodokmen: Kdo je komu? Propojíte 15 vztahů z českých pohádek?</title><style>
*{box-sizing:border-box}:root{--bg:#190d23;--panel:#291338;--gold:#f4cc73;--pink:#df75b8;--text:#fff8e8;--muted:#cebcd5}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#482250,#190d23 50%);color:var(--text);font-family:Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1120px;margin:auto;padding:14px}header{border:1px solid #805078;border-radius:24px;background:linear-gradient(135deg,#351743,#1e1029);padding:18px 20px;box-shadow:0 20px 60px #0007}.kicker{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:900}h1{font-size:clamp(27px,4vw,45px);line-height:1.05;margin:7px 0}.lead{color:var(--muted);line-height:1.5;max-width:880px}.board{margin-top:14px;border:1px solid #74456f;border-radius:20px;background:#271231;padding:16px}.topline{display:flex;justify-content:space-between;color:#c9adcb;font-size:11px;font-weight:900}.tree{min-height:260px;margin:12px 0;border-radius:17px;background:linear-gradient(180deg,#32163e,#21102c);display:flex;align-items:center;justify-content:center;gap:28px;position:relative;overflow:hidden;padding:20px}.tree:before{content:'';position:absolute;width:210px;height:4px;background:var(--gold);top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px #f4cc7355}.person{position:relative;z-index:2;width:180px;min-height:120px;border:2px solid #9e6899;border-radius:15px;background:#3a1b46;display:grid;place-items:center;text-align:center;padding:15px;font-size:20px;font-weight:1000}.badge{font-size:10px;color:#e4c7e3;margin-top:6px;font-weight:700}.q{font-size:clamp(21px,2.7vw,29px);font-weight:1000;margin:5px 0 11px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #744f76;background:#361942;color:white;border-radius:13px;padding:12px;text-align:left;font-size:15.5px;font-weight:800;cursor:pointer;min-height:58px}.opt:hover{border-color:var(--gold)}.opt.correct{background:#e2f6e8;color:#163823;border-color:#6bb282}.opt.wrong{background:#fbe0e3;color:#60151d;border-color:#d36a78}.opt:disabled{opacity:1}.feedback{display:none;margin-top:10px;padding:11px;border:1px solid #704b70;background:#32173c;border-radius:11px;line-height:1.42}.feedback.show{display:block}.next{display:none;margin:10px 0 0 auto;border:0;border-radius:11px;padding:11px 16px;background:linear-gradient(90deg,var(--pink),var(--gold));font-weight:1000;color:#281226}.threads{display:flex;gap:4px;margin-top:10px}.thread{height:6px;flex:1;border-radius:10px;background:#4b2756}.thread.done{background:var(--gold)}.result{display:none;text-align:center;padding:38px 12px}.result.show{display:block}.score{font-size:68px;font-weight:1000;color:var(--gold)}.restart{border:0;border-radius:11px;padding:12px 16px;background:var(--pink);color:white;font-weight:1000}@media(max-width:650px){.wrap{padding:8px}.opts{grid-template-columns:1fr}.tree{min-height:210px;gap:12px}.person{width:45%;min-height:105px;font-size:16px}.tree:before{width:110px}}
</style></head><body><div class="wrap"><header><div class="kicker">POHÁDKOVÝ RODOKMEN // VZTAHOVÁ MAPA</div><h1>Pohádkový rodokmen: Kdo je komu? Propojíte 15 vztahů z českých pohádek?</h1><p class="lead">Tentokrát nepoznáváte herce ani název z rekvizity. Dvě postavy už znáte — chybí jen správná vazba mezi nimi.</p></header><main class="board"><div id="quiz"><div class="topline"><span id="progress"></span><span id="film"></span></div><div class="tree"><div class="person"><div id="aName"></div><div class="badge">POSTAVA A</div></div><div class="person"><div id="bName"></div><div class="badge">POSTAVA B</div></div></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ VAZBA →</button><div class="threads" id="threads"></div></div><section class="result" id="result"><div class="kicker">RODOKMEN UZAVŘEN</div><h2>Patnáct vztahů propojeno</h2><div class="score" id="score"></div><p id="resText"></p><button class="restart" id="restart">ROZPLÉST ZNOVU</button></section></main></div><script>
const Q=[{"film": "Tři oříšky pro Popelku", "aName": "Popelka", "bName": "Dora", "q": "Jaký vztah mají Popelka a Dora?", "options": ["Jsou nevlastní sestry", "Jsou matka a dcera", "Jsou sestřenice", "Jsou soupeřící princezny z různých království"], "a": 0, "exp": "Dora je dcera macechy a Popelčina nevlastní sestra."}, {"film": "Tři oříšky pro Popelku", "aName": "Macecha", "bName": "Popelka", "q": "Kým je macecha vůči Popelce?", "options": ["Teta", "Nevlastní matka", "Starší sestra", "Dvorní dáma"], "a": 1, "exp": "Po smrti rodičů zůstává Popelka v péči otcovy druhé ženy, své macechy."}, {"film": "Tři oříšky pro Popelku", "aName": "Princ", "bName": "Popelka", "q": "Jaký vztah se mezi princem a Popelkou v příběhu rozvine?", "options": ["Sourozenecký", "Učitelský", "Milostný", "Služební"], "a": 2, "exp": "Popelka a princ tvoří hlavní milostnou dvojici pohádky."}, {"film": "S čerty nejsou žerty", "aName": "Dorota Máchalová", "bName": "Petr Máchal", "q": "Kým je Dorota vůči Petrovi?", "options": ["Sestra", "Manželka", "Teta", "Macecha"], "a": 3, "exp": "ČT popisuje Dorotu jako zlou a chamtivou Petrovu macechu."}, {"film": "S čerty nejsou žerty", "aName": "Janek", "bName": "Petr Máchal", "q": "Jaký vztah mezi Jankem a Petrem v příběhu vznikne?", "options": ["Stanou se přáteli a spojenci", "Janek je Petrův otec", "Jsou bratři", "Jsou soupeři o mlýn"], "a": 0, "exp": "Mladý čert Janek se stane Petrovým přítelem a pomáhá mu."}, {"film": "S čerty nejsou žerty", "aName": "Adélka", "bName": "Angelína", "q": "Jaký vztah mají princezny Adélka a Angelína?", "options": ["Jsou sestřenice", "Jsou sestry", "Jsou matka a dcera", "Nejsou příbuzné"], "a": 1, "exp": "Kníže má dvě dcery, Adélku a Angelínu."}, {"film": "S čerty nejsou žerty", "aName": "Adélka", "bName": "Petr Máchal", "q": "Jak se vyvíjí vztah Adélky k Petrovi?", "options": ["Považuje ho za bratra", "Je jeho učitelkou", "Má k němu milostný vztah", "Chce mu sebrat mlýn"], "a": 2, "exp": "Synopse ČT uvádí, že se Adélce Petr líbí; tvoří romantickou dvojici."}, {"film": "Byl jednou jeden král...", "aName": "Maruška", "bName": "Král Já I.", "q": "Kým je Maruška vůči králi Já I.?", "options": ["Rádkyně", "Sestra", "Vnučka", "Dcera"], "a": 3, "exp": "Maruška je nejmladší ze tří králových dcer."}, {"film": "Byl jednou jeden král...", "aName": "Maruška", "bName": "Drahomíra", "q": "Jaký vztah mají Maruška a Drahomíra?", "options": ["Jsou sestry", "Jsou matka a dcera", "Jsou služebná a princezna", "Jsou soupeřící královny"], "a": 0, "exp": "Obě patří mezi tři dcery krále Já I."}, {"film": "Lotrando a Zubejda", "aName": "Lotrando mladší", "bName": "Lotrando starší", "q": "Jaký je jejich rodinný vztah?", "options": ["Bratři", "Syn a otec", "Strýc a synovec", "Nemají rodinný vztah"], "a": 1, "exp": "Mladý Lotrando je synem starého loupežníka Lotranda."}, {"film": "Lotrando a Zubejda", "aName": "Zubejda", "bName": "Sultán Solimán", "q": "Kým je Zubejda vůči sultánovi?", "options": ["Sestra", "Rádkyně", "Dcera", "Matka"], "a": 2, "exp": "Zubejda je Solimánova dcera, nemocná princezna."}, {"film": "Lotrando a Zubejda", "aName": "Lotrando", "bName": "Zubejda", "q": "Jaký vztah nakonec stojí v centru jejich příběhu?", "options": ["Obchodní", "Sourozenecký", "Učitelský", "Milostný"], "a": 3, "exp": "Zubejdě nakonec podle synopse pomáhá i láska mladého Lotranda."}, {"film": "Tři veteráni", "aName": "Bosana", "bName": "Král Pikola", "q": "Kým je Bosana vůči králi Pikolovi?", "options": ["Dcera", "Sestra", "Matka", "Rádkyně"], "a": 0, "exp": "Bosana je dcerou krále Pikoly."}, {"film": "Tři veteráni", "aName": "Bimbác", "bName": "Bosana", "q": "Jaký vztah k Bosaně má Bimbác?", "options": ["Je její bratr", "Zamiluje se do ní", "Je její otec", "Je její učitel"], "a": 1, "exp": "Synopse ČT uvádí, že se Bimbác do Bosany zamiluje."}, {"film": "Tři veteráni", "aName": "Pankrác, Servác, Bimbác", "bName": "—", "q": "Co spojuje Pankráce, Serváce a Bimbáce?", "options": ["Jsou tři bratři", "Jsou tři králové", "Jsou tři vysloužilí vojáci a společníci", "Jsou tři kouzelníci"], "a": 2, "exp": "Tři veteráni jsou vysloužilí vojáci, kteří společně putují světem."}];window.QUIZ=Q;let i=0,score=0,locked=false;document.getElementById('threads').innerHTML=Q.map(()=>'<span class="thread"></span>').join('');function show(){locked=false;let q=Q[i];document.getElementById('progress').textContent='VAZBA '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('film').textContent=q.film.toUpperCase();document.getElementById('aName').textContent=q.aName;document.getElementById('bName').textContent=q.bName;document.getElementById('q').textContent=q.q;let o=document.getElementById('opts');o.innerHTML='';q.options.forEach((x,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>answer(k);o.appendChild(b)});document.getElementById('feedback').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===k&&j!==q.a)b.classList.add('wrong')});if(k===q.a)score++;document.querySelectorAll('.thread')[i].classList.add('done');let f=document.getElementById('feedback');f.className='feedback show';f.innerHTML='<b>'+(k===q.a?'Nit sedí.':'Nit vede jinam.')+'</b><br>'+q.exp;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;if(i<Q.length)show();else finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('resText').textContent=score>=13?'Pohádkové vztahy máte propojené skoro bez uzlu.':score>=9?'Rodokmen drží, jen pár nití se zamotalo.':'V tomhle království bude potřeba matrika.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.thread').forEach(x=>x.className='thread');document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
