<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz: Počítače, hardware a IT</title>
    <style>
        :root {
            --primary-blue: #1e40af;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --btn-bg: #f9fafb;
            --btn-border: #e5e7eb;
            --btn-hover: #f3f4f6;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --incorrect-bg: #fee2e2;
            --incorrect-border: #ef4444;
            --next-btn-bg: #2563eb;
            --next-btn-hover: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 15px;
            line-height: 1.5;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--btn-border);
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .progress {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .question {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 24px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: #d1d5db;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
        }

        .explanation {
            margin-top: 20px;
            padding: 16px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 4px;
            display: none;
        }

        .explanation p {
            font-size: 0.95rem;
            color: #334155;
        }

        .next-btn {
            margin-top: 20px;
            background-color: var(--next-btn-bg);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background-color 0.2s ease;
        }

        .next-btn:hover {
            background-color: var(--next-btn-hover);
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 24px auto;
        }

        .result-title {
            font-size: 1.5rem;
            color: var(--primary-blue);
            margin-bottom: 12px;
        }

        .result-text {
            font-size: 1.1rem;
            margin-bottom: 32px;
            color: #4b5563;
        }

        @media (max-width: 560px) {
            .quiz-container {
                padding: 16px;
            }
            .question {
                font-size: 1.1rem;
            }
            .option-btn {
                padding: 12px;
                font-size: 0.95rem;
            }
            .score-circle {
                width: 100px;
                height: 100px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header" id="quiz-header">
            <h1>Kvíz: Počítače, hardware a IT</h1>
            <p>Jen pro zábavu. Jste spíš ajťák, nebo klikař?</p>
        </div>

        <div id="question-container">
            <div class="progress" id="progress">Otázka 1 / 15</div>
            <div class="question" id="question">Načítání otázky...</div>
            <div class="options" id="options"></div>
            
            <div class="explanation" id="explanation">
                <p id="explanation-text"></p>
            </div>
            
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Další otázka</button>
        </div>

        <div class="result-container" id="result-container">
            <div class="score-circle" id="final-score">0/15</div>
            <h2 class="result-title" id="result-title">Hodnocení</h2>
            <p class="result-text" id="result-text">Vyhodnocení</p>
            <button class="next-btn" style="display: block;" onclick="restartQuiz()">Zkusit znovu</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Co znamená zkratka RAM?",
                options: ["Random Access Memory", "Read And Memorize", "Really Awesome Machine", "Rapid Action Module"],
                correct: 0,
                explanation: "Zkratka znamená Random Access Memory neboli paměť s přímým přístupem. Jde o pracovní paměť počítače."
            },
            {
                question: "Když ti počítač řve jako startující Boeing a ty chceš upravit křivky ventilátorů, jaký program je na to největší spása?",
                options: ["Fan Control", "MS Paint", "Wordpad", "BIOS Optimizer"],
                correct: 0,
                explanation: "Fan Control je geniální open-source utilita, která dokáže parádně zkrotit a detailně nastavit i ty nejhlučnější větráky v bedně."
            },
            {
                question: "Jakou grafickou kartu by si člověk koupil, kdyby chtěl naprosté dělo z edice NVIDIA řady 40, ale nechtěl utrácet majlant za 4090?",
                options: ["RTX 4080 SUPER", "GTX 1060", "RTX 3050", "Radeon RX 580"],
                correct: 0,
                explanation: "Karta RTX 4080 SUPER nabízí ohromný 4K výkon, ale přece jen nenechá ve tvé peněžence takový kráter jako vlajková loď RTX 4090."
            },
            {
                question: "Co udělá legendární klávesová zkratka Alt + F4?",
                options: ["Zavře aktuální okno", "Zrychlí internet", "Vypne zvuk", "Zobrazí tajné cheat kódy"],
                correct: 0,
                explanation: "Nejstarší chyták herních fór a chatů! Alt+F4 nemilosrdně ukončí aktuálně spuštěný program. Během hraní to dost bolí."
            },
            {
                question: "Co v jazyce C++ znamená, když programátor mluví o \"pointeru\" neboli ukazateli?",
                options: ["Proměnná, která uchovává paměťovou adresu jiné proměnné", "Šipka myši na monitoru", "Speciální funkce pro mazání dat", "Laserové ukazovátko k prezentaci"],
                correct: 0,
                explanation: "Ukazatele (pointers) jsou extrémně mocným, ale začátečníky dost obávaným nástrojem pro přímou práci s pamětí."
            },
            {
                question: "Jaký je nejčastější a nejuniverzálnější způsob, jak \"opravit\" zamrzlý počítač?",
                options: ["Vypnout a zapnout", "Přidat více termopasty", "Zakřičet na něj", "Odinstalovat prohlížeč"],
                correct: 0,
                explanation: "Univerzální pravidlo IT podpory: 'Zkoušeli jste to vypnout a zapnout?' To skutečně vyřeší asi tak 90 % podivných potíží."
            },
            {
                question: "Kolik operační paměti (RAM) je dnes považováno za pořádný luxus pro nejnáročnější úkoly a těžký multitasking?",
                options: ["64 GB", "4 GB", "8 GB", "16 MB"],
                correct: 0,
                explanation: "Zatímco 16 nebo 32 GB RAM je dnes bráno jako velmi slušný standard pro herní PC, 64 GB už je pořádná výbava pro profíky."
            },
            {
                question: "Když si chceš zahrát Euro Truck Simulator 2 nebo letecký X-Plane 11 na maximální detaily, co se v počítači zapotí úplně nejvíc?",
                options: ["Grafická karta", "Zvuková karta", "Síťová karta", "CD-ROM"],
                correct: 0,
                explanation: "Aby hra na obrazovce vypadala co nejlépe (textury, stíny, světlo, antialiasing), grafická karta pojede na doraz."
            },
            {
                question: "Co je to tzv. \"modrá smrt\" (BSOD)?",
                options: ["Kritická chyba Windows, po které následuje pád systému", "Nejtěžší boss v Dark Souls", "Speciální typ viru", "Zničení monitoru modrým laserem"],
                correct: 0,
                explanation: "Blue Screen of Death (Modrá obrazovka smrti) znamená, že se jádro Windows dostalo do takového průšvihu, ze kterého neumí vybruslit."
            },
            {
                question: "Jaký procesor od Intelu z 14. generace s označením KF je nesmírně oblíbený mezi nadšenci do skládání výkonných herních PC?",
                options: ["Intel Core i7-14700KF", "Intel Pentium Gold", "Intel Core i3-10100", "AMD Ryzen 7 7800X3D"],
                correct: 0,
                explanation: "Core i7-14700KF. F na konci znamená absenci integrované grafiky a K ukazuje na odemčený násobič (jde to dobře taktovat)."
            },
            {
                question: "Co znamená počítačový pojem \"přetaktování\" (overclocking)?",
                options: ["Zvýšení pracovní frekvence komponenty nad tovární hodnoty", "Rychlejší psaní na klávesnici", "Úprava času v BIOSu", "Zrychlení rychlosti internetu"],
                correct: 0,
                explanation: "Díky přetaktování (CPU nebo GPU) získáš víc výkonu zdarma, ale často za cenu vyšších teplot a vyšší spotřeby elektřiny."
            },
            {
                question: "Jaká komponenta funguje jako \"mozek\" celého počítačového stroje?",
                options: ["Procesor / CPU", "Zdroj / PSU", "Základní deska", "Chladič"],
                correct: 0,
                explanation: "CPU (Central Processing Unit) provádí veškeré výpočty, rozděluje úkoly a doslova řídí všechny ostatní součástky."
            },
            {
                question: "K čemu slouží teplovodivá pasta?",
                options: ["K lepšímu přenosu tepla mezi procesorem a chladičem", "K lepení drátů", "Ke zrychlení paměti RAM", "K promazání ventilátorů"],
                correct: 0,
                explanation: "Kovový povrch procesoru i chladiče má na sobě mikroskopické rýhy. Pasta tyto mezírky vyplní, vytlačí izolující vzduch a teplo jde krásně pryč."
            },
            {
                question: "Když stavíš webovou hru a potřebuješ, aby se na obrazovce něco hýbalo a reagovalo na kliknutí, jaký jazyk přidáš k HTML a CSS?",
                options: ["JavaScript", "Python", "C++", "Java"],
                correct: 0,
                explanation: "JavaScript běží přímo ve tvém internetovém prohlížeči a stará se o to, že stránky reagují, počítají a stávají se aplikacemi."
            },
            {
                question: "Proč se u herních PC beden silně nedoporučuje pokládat je přímo na huňatý koberec?",
                options: ["Zdroj by zespodu nasával prach jako vysavač a udusil by se", "Koberec by PC zelektrizoval", "Počítač by mohl ujet", "Signál Wi-Fi by se ztratil v koberci"],
                correct: 0,
                explanation: "Většina zdrojů má dnes ventilátor mířící dolů. Kdybys počítač položil na koberec, ventilátor nebude mít odkud sát vzduch a zdroj by se mohl upéct."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const explanationEl = document.getElementById('explanation');
        const explanationTextEl = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        
        const questionContainer = document.getElementById('question-container');
        const resultContainer = document.getElementById('result-container');
        const headerEl = document.getElementById('quiz-header');

        function initQuiz() {
            // Promícháme možnosti a pamatujeme si správnou odpověď
            questions.forEach(q => {
                const optionsWithIndex = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct }));
                // Fischer-Yates shuffle
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                q.shuffledOptions = optionsWithIndex.map(opt => opt.text);
                q.shuffledCorrectIndex = optionsWithIndex.findIndex(opt => opt.isCorrect);
            });

            currentQuestionIndex = 0;
            score = 0;
            questionContainer.style.display = 'block';
            resultContainer.style.display = 'none';
            headerEl.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const currentQ = questions[currentQuestionIndex];
            
            progressEl.textContent = `Otázka ${currentQuestionIndex + 1} / ${questions.length}`;
            questionEl.textContent = currentQ.question;
            
            optionsEl.innerHTML = '';
            explanationEl.style.display = 'none';
            nextBtn.style.display = 'none';

            currentQ.shuffledOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = questions[currentQuestionIndex];
            const allBtns = optionsEl.getElementsByClassName('option-btn');

            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true;
                if (i === currentQ.shuffledCorrectIndex) {
                    allBtns[i].classList.add('correct');
                }
            }

            if (selectedIndex === currentQ.shuffledCorrectIndex) {
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
            }

            explanationTextEl.textContent = currentQ.explanation;
            explanationEl.style.display = 'block';
            
            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = 'Další otázka';
            } else {
                nextBtn.textContent = 'Zobrazit výsledek';
            }
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            questionContainer.style.display = 'none';
            headerEl.style.display = 'none';
            resultContainer.style.display = 'block';
            
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            
            const titleEl = document.getElementById('result-title');
            const textEl = document.getElementById('result-text');
            
            if (score === questions.length) {
                titleEl.textContent = "Ultimátní Ajťák!";
                textEl.textContent = "Fantazie! Máš hardwarové specifikace v malíčku a BSOD se tě bojí. Z tebe by měl každý správce sítě radost.";
            } else if (score >= 10) {
                titleEl.textContent = "Zkušený geek";
                textEl.textContent = "Skvělý výsledek! Občas možná nějaká frekvence ulítne, ale rozhodně víš, z čeho se ten tvůj miláček na stole skládá.";
            } else if (score >= 5) {
                titleEl.textContent = "Obyčejný smrtelník";
                textEl.textContent = "Víš, kde je tlačítko zapnout, a jak najít Google, a to je hlavní. Zbytek zařídí strýček nebo IT podpora!";
            } else {
                titleEl.textContent = "Jsi spíš na knížky?";
                textEl.textContent = "Tady jsi asi omylem! Ale nevadí, aspoň ses dneska dozvěděl spoustu nových termínů z křemíkového světa.";
            }
        }

        function restartQuiz() {
            initQuiz();
        }

        // Start kvízu
        initQuiz();
    </script>
</body>
</html>
