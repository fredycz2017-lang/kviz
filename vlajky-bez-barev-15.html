if(k==='nepal')x=`<path d='M235 70 L235 445 L610 445 L365 290 L565 290 L235 70Z' fill='${M}' stroke='${B}' stroke-width='8'/><circle cx='330' cy='200' r='45' fill='${W}'/><path d='M330 330 l25 45h-50z' fill='${W}'/>`;

return `<svg viewBox='0 0 780 520'><rect width='780' height='520' rx='24' fill='#e9e9e6'/>${x}</svg>`}const strip=document.getElementById('strip');for(let n=0;n<15;n++)strip.innerHTML+=`<span data-s="${n}">LIST ${String(n+1).padStart(2,'0')}</span>`;function show(){let x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;scene.innerHTML=flag(x.kind);q.textContent=x.q;opts.innerHTML='';[0,1,2,3].map(n=>(n+((i*3+1)%4))%4).forEach(j=>{let v=x.o[j],b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){let x=Q[i];[...document.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;document.querySelector(`[data-s="${i}"]`).classList.add('done');meter.style.width=`${(i+1)/15*100}%`;fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'GEOMETRIE SEDÍ.':'TISK NESOUHLASÍ.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';scoreEl=document.getElementById('score');scoreEl.textContent=`${score} / 15`;grade.textContent=score>=13?'Vexilologická tiskárna bez zaseknutí':score>=9?'Silná geometrická paměť':'Bez barev je svět překvapivě zlý'}document.getElementById('restart').onclick=()=>{i=0;score=0;result.style.display='none';quiz.style.display='block';meter.style.width='0';document.querySelectorAll('.strip span').forEach(x=>x.classList.remove('done'));show()};show();</script></body></html>
