<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz pro pamětníky: staré československé značky a výrobky</title><style>
:root{--card:#fff;--ink:#171714;--muted:#64645d;--line:#deddd5;--accent:#9c6100;--accent2:#d59a2e;--ok:#126a43;--okbg:#eaf7f0;--bad:#a72e2e;--badbg:#fff0f0}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink)}body{padding:10px}.quiz{max-width:700px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}.hero{padding:26px 28px 20px;background:linear-gradient(180deg,#fff,#faf7f0);border-bottom:1px solid var(--line)}.kicker{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:8px}h1{font-size:31px;line-height:1.08;margin:0 0 10px}.sub{font-size:17px;line-height:1.5;color:var(--muted);margin:0}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;font-size:14px;font-weight:800}.score{padding:8px 12px;border-radius:999px;background:#f1eee6;border:1px solid var(--line)}.progress{height:8px;background:#ebe8df}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}.main{padding:28px}.q{font-size:23px;line-height:1.32;font-weight:850;margin:0 0 20px}.answers{display:grid;gap:12px}.answer{width:100%;min-height:56px;text-align:left;padding:16px 17px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:17px;line-height:1.35;font-weight:750;cursor:pointer}.answer:hover:not(:disabled){border-color:#bdb9ad;background:#fbfaf7}.answer:focus-visible{outline:4px solid rgba(156,97,0,.22);outline-offset:2px}.answer.correct{border-color:#86c4a2;background:var(--okbg);color:#0b5d39}.answer.wrong{border-color:#d6a1a1;background:var(--badbg);color:#8c2828}.answer:disabled{cursor:default}.feedback{display:none;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#f8f6f1;font-size:16px;line-height:1.5}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.next{display:none;margin-top:18px;width:100%;min-height:52px;border:0;border-radius:14px;background:#171714;color:white;font-size:16px;font-weight:850;cursor:pointer}.next.show{display:block}.result{display:none;text-align:center;padding:40px 28px}.result.show{display:block}.big{font-size:56px;font-weight:900;margin:10px 0}.result h2{font-size:27px;margin:0 0 8px}.result p{font-size:17px;color:var(--muted);line-height:1.5;max-width:520px;margin:0 auto 22px}.retry{border:0;border-radius:14px;background:#171714;color:#fff;padding:14px 22px;font-size:16px;font-weight:850;cursor:pointer}.note{text-align:center;color:#7b7a73;font-size:12px;padding:0 18px 18px}@media(max-width:560px){body{padding:6px}.quiz{border-radius:17px}.hero,.main{padding-left:18px;padding-right:18px}h1{font-size:27px}.sub{font-size:16px}.q{font-size:20px}.answer{font-size:16px;padding:15px}}
</style></head><body><div class="quiz"><section id="play"><div class="hero"><div class="kicker">Kvíz pro pamětníky • 15 otázek</div><h1>Pamatujete Kofolu, ETA, Botas nebo JAWU?</h1><p class="sub">Patnáct otázek z historie značek a výrobků, které znaly celé generace československých domácností.</p><div class="meta"><div id="counter">Otázka 1 z 15</div><div id="score" class="score">Skóre 0</div></div></div><div class="progress"><div id="bar"></div></div><main class="main"><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="next" type="button">Další otázka →</button></main></section><section id="result" class="result" aria-live="polite"><div class="kicker">Hotovo</div><h2>Vaše skóre</h2><div id="bigscore" class="big">0/15</div><p id="resulttext"></p><button id="retry" class="retry" type="button">Zkusit znovu</button></section><div class="note">Větší písmo a tlačítka jsou zvolené schválně pro pohodlné čtení.</div></div><script>
const questions=[{"q": "Ve kterém roce sjela z výrobní linky první Kofola?", "opts": ["1956", "1960", "1964", "1968"], "correct": 1, "explain": "Za začátek historie Kofoly se považuje rok 1960, kdy sjela z výrobní linky první láhev."}, {"q": "Kolik bylinných a ovocných složek tvoří základ sirupu KOFO podle historie značky Kofola?", "opts": ["8", "10", "14", "21"], "correct": 2, "explain": "Sirup KOFO vznikl ze čtrnácti bylinných a ovocných složek doplněných kofeinem."}, {"q": "Pod jakým názvem vznikl v roce 1943 podnik, z něhož později vyrostla značka ETA?", "opts": ["ESA", "Elektrodom", "Tesla Hlinsko", "Praga Elektro"], "correct": 0, "explain": "Jan Prošvic založil v roce 1943 Elektrotechnickou akciovou společnost ESA, která položila základy dnešní ETA."}, {"q": "Ve kterém roce byla zaregistrována ochranná známka ETA?", "opts": ["1952", "1956", "1960", "1973"], "correct": 2, "explain": "Ochranná známka ETA byla registrována v roce 1960."}, {"q": "Který spotřebič se po roce 1952 stal jedním z hlavních výrobních programů závodu ETA v Hlinsku?", "opts": ["Vysavače", "Televizory", "Ledničky", "Šicí stroje"], "correct": 0, "explain": "Do Hlinska byla v roce 1952 převedena výroba vysavačů a ty se brzy staly hlavním výrobním programem."}, {"q": "Jak se původně jmenovala firma, z níž vznikla stavebnice Merkur?", "opts": ["Kovomat", "Inventor", "Mechanik", "Metropol"], "correct": 1, "explain": "Jaroslav Vancl založil v roce 1920 firmu Inventor; z její stavebnice se později vyvinul Merkur."}, {"q": "Čím se začaly od roku 1925 spojovat kovové díly stavebnice, z níž vznikl Merkur?", "opts": ["Nýtky", "Lepidlem", "Šroubky a matičkami", "Pružinami"], "correct": 2, "explain": "Od roku 1925 se díly začaly spojovat šroubky a matičkami, což je princip typický pro Merkur dodnes."}, {"q": "Ve kterém roce byla zaregistrována značka ALPA a poprvé se objevila její francovka?", "opts": ["1901", "1913", "1925", "1938"], "correct": 1, "explain": "Značka ALPA i její francovka se datují do roku 1913."}, {"q": "Ve kterém roce vznikla firma Botana, z níž později vzešly botasky?", "opts": ["1949", "1956", "1963", "1970"], "correct": 0, "explain": "Botana vznikla ve Skutči v roce 1949."}, {"q": "Z čeho vznikl název Botas podle historie značky?", "opts": ["BOTA Skuteč / BOTA Sportovní", "BOty Továrny Aš", "BOhemia TAnčí Sport", "BOTA Slovensko"], "correct": 0, "explain": "Název Botas se vykládá jako BOTA Skuteč, případně BOTA Sportovní."}, {"q": "Jak vznikl název motocyklové značky JAWA?", "opts": ["Podle řek Jizera a Vltava", "Spojením jmen Janeček a Wanderer", "Podle názvu závodu v Jaworzyně", "Jako zkratka Jednotných automobilových výrobních akcí"], "correct": 1, "explain": "JAWA vznikla spojením počátečních částí jmen Janeček a Wanderer."}, {"q": "Ve kterém roce byla ochranná známka JAWA zaregistrována?", "opts": ["1918", "1925", "1929", "1935"], "correct": 2, "explain": "Ochranná známka JAWA byla zaregistrována v roce 1929."}, {"q": "Ve kterém roce byla vyrobena první pečicí mísa Remoska?", "opts": ["1953", "1957", "1964", "1971"], "correct": 1, "explain": "První Remoska byla ručně smontována v roce 1957."}, {"q": "Kde byla podle historie značky smontována první Remoska?", "opts": ["V Hlinsku", "Ve Skutči", "V Kostelci nad Černými lesy", "V Polici nad Metují"], "correct": 2, "explain": "První pečicí mísa Remoska vznikla v Kostelci nad Černými lesy."}, {"q": "Proč začal v Československu vznikat nápoj, z něhož se stala Kofola?", "opts": ["Měl nahradit nedostatek kávy", "Měl být domácí alternativou západních kolových nápojů", "Vznikl jako lék proti nachlazení", "Měl sloužit výhradně sportovcům"], "correct": 1, "explain": "Vývoj Kofoly začal jako úkol vytvořit domácí československý nápoj konkurující západním kolám."}];let i=0,score=0,locked=false;const q=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),counter=document.getElementById('counter'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),play=document.getElementById('play'),result=document.getElementById('result');function render(){locked=false;const item=questions[i];counter.textContent=`Otázka ${i+1} z ${questions.length}`;scoreEl.textContent=`Skóre ${score}`;bar.style.width=`${(i/questions.length)*100}%`;q.textContent=item.q;answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';next.className='next';item.opts.forEach((opt,idx)=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=opt;b.addEventListener('click',()=>choose(idx,b));answers.appendChild(b);});}function choose(choice,button){if(locked)return;locked=true;const item=questions[i];const buttons=[...answers.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);buttons[item.correct].classList.add('correct');if(choice===item.correct){score++;feedback.innerHTML=`<strong>Správně.</strong>${item.explain}`;}else{button.classList.add('wrong');feedback.innerHTML=`<strong>Tentokrát ne.</strong>Správná odpověď je <b>${item.opts[item.correct]}</b>. ${item.explain}`;}scoreEl.textContent=`Skóre ${score}`;feedback.className='feedback show';next.textContent=i===questions.length-1?'Zobrazit výsledek →':'Další otázka →';next.className='next show';}next.addEventListener('click',()=>{if(i<questions.length-1){i++;render();}else finish();});function finish(){bar.style.width='100%';play.style.display='none';result.className='result show';document.getElementById('bigscore').textContent=`${score}/${questions.length}`;let t;if(score===15)t='Perfektní. Staré československé značky máte opravdu v malíku.';else if(score>=12)t='Výborný výkon. Historii známých značek a výrobků si pamatujete velmi dobře.';else if(score>=8)t='Solidní výsledek. Většinu klasik jste poznali, pár detailů ale potrápilo.';else t='Bylo to těžší, než vypadalo. Druhý pokus může skóre rychle zvednout.';document.getElementById('resulttext').textContent=t;}document.getElementById('retry').addEventListener('click',()=>{i=0;score=0;locked=false;result.className='result';play.style.display='block';render();});render();
</script></body></html>
