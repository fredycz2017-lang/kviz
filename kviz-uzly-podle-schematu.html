<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvíz: Tkanička, kravata, balík. Poznáte 15 uzlů podle schématu?</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
:root{--bg:#f3f4f6;--card:#fff;--line:#d1d5db;--accent:#2563eb;--accent2:#1e40af;--text:#111827;--muted:#6b7280;--ok:#166534;--bad:#991b1b;}
:root{--bg:#eef5ef;--card:#ffffff;--line:#a7c4a0;--accent:#166534;--accent2:#14532d;--text:#1f3b22;--muted:#55745b;} .stage svg{width:100%;max-width:520px;height:240px}
.wrap{max-width:1160px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,var(--card),#ffffffdd);border:2px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.08)}
h1{margin:0;font-size:clamp(28px,4.2vw,44px);line-height:1.05} .sub{margin:10px 0 0;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:310px 1fr;gap:18px;margin-top:18px}
.panel,.main{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 14px 30px rgba(0,0,0,.06)}
.panel{padding:16px} .main{padding:18px}
.progressBig{font-size:36px;font-weight:800;color:var(--accent2)} .tiny{color:var(--muted);font-size:13px;line-height:1.45}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px} .dot{height:18px;border-radius:999px;background:#e5e7eb;border:1px solid #cbd5e1} .dot.done{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:color-mix(in srgb, var(--accent) 12%, white);color:var(--accent2);font-weight:700;font-size:12px;letter-spacing:.04em}
.stage{margin:14px 0 18px;border:2px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#ffffff,#f8fafc);min-height:270px;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.q{font-size:25px;font-weight:800;line-height:1.2;margin:8px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.opt{appearance:none;border:none;text-align:left;padding:14px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);cursor:pointer;font-size:17px;font-weight:700;color:var(--text);transition:.15s} button.opt:hover{transform:translateY(-1px);border-color:var(--accent)}
button.opt.correct{background:#ecfdf5;border-color:#22c55e;color:var(--ok)} button.opt.wrong{background:#fef2f2;border-color:#ef4444;color:var(--bad)} button.opt:disabled{cursor:default;opacity:1}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:16px;background:#f8fafc;border:2px solid var(--line)} .feedback.show{display:block} .feedback strong{display:block;margin-bottom:5px}
.actions{display:flex;justify-content:flex-end;margin-top:14px} .nextBtn{padding:12px 18px;border:none;border-radius:14px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.footer{margin-top:12px;color:var(--muted);font-size:13px}
.result{display:none;text-align:center;padding:20px} .result.show{display:block} .score{font-size:54px;font-weight:900;color:var(--accent2)}
.result p{font-size:18px;line-height:1.55;max-width:720px;margin:14px auto}
.restart{padding:14px 22px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:18px;font-weight:800;cursor:pointer}
@media (max-width:900px){.grid{grid-template-columns:1fr} .opts{grid-template-columns:1fr} .stage{min-height:220px} .q{font-size:22px} }
</style></head><body><div class="wrap"><header><div class="badge">NÁSTĚNKA UZLŮ</div><h1>Kvíz: Tkanička, kravata, balík. Poznáte 15 uzlů podle schématu?</h1><p class="sub">Praktický svět tkaniček, provazů a smyček. Místo fotek jasná schematická kresba uzlu.</p></header>
<div class="grid"><aside class="panel"><div class="progressBig" id="progressBig">1 / 15</div><div class="tiny">Každá otázka má čtyři možnosti. Po odpovědi uvidíte vysvětlení a pak pokračujete dál.</div><div class="dots" id="dots"></div><div class="footer">GitHub Pages ready · Mobil i desktop</div></aside>
<section class="main"><div id="quizWrap"><div class="badge" id="catBadge"></div><div class="q" id="questionText"></div><div class="stage" id="stage"></div><div class="opts" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="nextBtn" id="nextBtn" style="display:none">Další otázka</button></div></div><div class="result" id="result"><div class="score" id="score"></div><p id="resultText"></p><button class="restart" id="restartBtn">Zkusit znovu</button></div></section></div></div>
<script>
const questions=[{"category": "UZLY", "knot": "ambulantní", "shape": "reef", "q": "Který uzel je známý jako plochý či ambulantní a často se váže na balíky?", "options": ["Ambulantní uzel", "Liščí smyčka", "Lodní uzel", "Dračí smyčka"], "correct": 0, "explanation": "Ambulantní neboli plochý uzel se tradičně používá na vázání balíků nebo šátků."}, {"category": "UZLY", "knot": "mašle", "shape": "bow", "q": "Který uzel nebo vázání poznáte jako klasickou mašli na tkaničkách?", "options": ["Dvojitý osmičkový uzel", "Mašle", "Liščí uzel", "Zkracovačka"], "correct": 1, "explanation": "Na tkaničkách se běžně váže mašle se dvěma očky."}, {"category": "UZLY", "knot": "lodní smyčka", "shape": "clove", "q": "Který uzel se často používá k rychlému upevnění lana na tyč nebo kůl?", "options": ["Lodní smyčka", "Ambulantní uzel", "Motýlek", "Rybářská spojka"], "correct": 0, "explanation": "Lodní smyčka je klasický rychlý uzel pro upevnění lana na předmět."}, {"category": "UZLY", "knot": "dračí smyčka", "shape": "bowline", "q": "Který uzel vytvoří pevné oko, které se samo neutahuje?", "options": ["Liščí smyčka", "Dračí smyčka", "Plochá spojka", "Uzda"], "correct": 1, "explanation": "Dračí smyčka je známá pevnou smyčkou, která se sama nestahuje."}, {"category": "UZLY", "knot": "osmička", "shape": "eight", "q": "Který základní zarážkový uzel má tvar připomínající číslici 8?", "options": ["Ambulantní uzel", "Osmička", "Smyčka na prst", "Lodní smyčka"], "correct": 1, "explanation": "Osmička je klasický zarážkový uzel."}, {"category": "UZLY", "knot": "rybářský uzel", "shape": "fisher", "q": "Který uzel se často používá ke spojení dvou tenčích šňůr nebo vlasců?", "options": ["Rybářský uzel", "Bowline", "Kotvový úvaz", "Mlynářský uzel"], "correct": 0, "explanation": "Rybářský uzel je běžný pro spojování tenkých šňůr."}, {"category": "UZLY", "knot": "škotová spojka", "shape": "sheet", "q": "Který uzel je typický pro spojení dvou lan různé tloušťky?", "options": ["Škotová spojka", "Mašle", "Lodní smyčka", "Prusík"], "correct": 0, "explanation": "Škotová spojka slouží pro spojení dvou lan, často nestejně silných."}, {"category": "UZLY", "knot": "prusík", "shape": "prusik", "q": "Který uzel / smyčka se v horách používá jako posuvná smyčka po laně?", "options": ["Prusík", "Plochý uzel", "Dvojitá smyčka", "Mašle"], "correct": 0, "explanation": "Prusík je třecí uzel používaný například při lezení."}, {"category": "UZLY", "knot": "kotvový úvaz", "shape": "anchor", "q": "Který uzel je určený pro pevné přivázání lana ke kruhu nebo karabině?", "options": ["Kotvový úvaz", "Osmička", "Mašle", "Ambulantní uzel"], "correct": 0, "explanation": "Kotvový úvaz je vhodný k upevnění na oko, kruh či karabinu."}, {"category": "UZLY", "knot": "ambulantní s kličkou", "shape": "slipped_reef", "q": "Který uzel je rychle rozvázatelná varianta plochého uzlu?", "options": ["Ambulantní s kličkou", "Lodní smyčka", "Prusík", "Liščí smyčka"], "correct": 0, "explanation": "Ploché vázání s kličkou dovolí rychlé rozvázání zatažením za volný konec."}, {"category": "UZLY", "knot": "dvojitá osmička", "shape": "double_eight", "q": "Který uzel vytváří pevné zajištěné oko a je oblíbený na jištění?", "options": ["Dvojitá osmička", "Bowline", "Rybářský uzel", "Mašle"], "correct": 0, "explanation": "Dvojitá osmička je oblíbená pro navázání do úvazku."}, {"category": "UZLY", "knot": "škrticí uzel", "shape": "constrictor", "q": "Který uzel se po utažení velmi pevně sevře kolem předmětu?", "options": ["Škrticí uzel", "Mašle", "Rybářský uzel", "Osmička"], "correct": 0, "explanation": "Škrticí uzel se po dotažení silně stáhne kolem předmětu."}, {"category": "UZLY", "knot": "lišťí smyčka", "shape": "cow", "q": "Který jednoduchý uzel navléknete jako smyčku přes předmět ve tvaru liščí (kravské) smyčky?", "options": ["Liščí smyčka", "Kotvový úvaz", "Prusík", "Škotová spojka"], "correct": 0, "explanation": "Liščí neboli kravská smyčka se navléká přes předmět jako jednoduché zavěšení."}, {"category": "UZLY", "knot": "zkracovačka", "shape": "sheepshank", "q": "Který uzel dočasně zkracuje lano bez jeho přestřižení?", "options": ["Zkracovačka", "Dračí smyčka", "Lodní smyčka", "Plochý uzel"], "correct": 0, "explanation": "Zkracovačka slouží ke zkrácení lana bez zásahu do jeho délky."}, {"category": "UZLY", "knot": "motýlek", "shape": "butterfly", "q": "Který uzel vytvoří pevné oko uprostřed lana?", "options": ["Motýlek", "Mašle", "Kotvový úvaz", "Rybářský uzel"], "correct": 0, "explanation": "Alpský motýlek vytváří oko uprostřed lana."}];
let current=0, score=0, locked=false;
const dots=document.getElementById('dots');
for(let i=0;i<questions.length;i++){const d=document.createElement('div');d.className='dot';dots.appendChild(d)}
const qText=document.getElementById('questionText'); const options=document.getElementById('options'); const feedback=document.getElementById('feedback'); const nextBtn=document.getElementById('nextBtn'); const progressBig=document.getElementById('progressBig'); const stage=document.getElementById('stage'); const catBadge=document.getElementById('catBadge');
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function renderVisual(q){ 
function rope(p){return `<path d='${p}' stroke='#d4a373' stroke-width='16' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='${p}' stroke='#8b5e34' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/>`}
let d='';
switch(q.shape){
 case 'reef': d=rope('M 90 120 C 140 80, 160 80, 210 120 S 290 160 330 120 M 90 120 C 145 165, 165 165, 210 120 S 286 75 330 120'); break;
 case 'bow': d=rope('M 70 130 C 130 130, 150 110, 180 90 C 165 120,165 145,180 170 C 150 150,130 130,70 130 M 330 130 C 270 130,250 110,220 90 C 235 120,235 145,220 170 C 250 150,270 130,330 130'); break;
 case 'clove': d=rope('M 95 80 C 165 120, 165 120, 235 80 M 95 160 C 165 120, 165 120, 235 160 M 245 70 L 245 170'); break;
 case 'bowline': d=rope('M 90 160 C 130 95, 170 85, 210 130 C 190 100, 200 70, 240 70 C 280 70, 300 95, 300 120 C 280 120,250 120,230 145 C 210 170,180 180,140 180'); break;
 case 'eight': d=rope('M 185 65 C 120 65, 120 130, 185 130 C 250 130, 250 65, 185 65 M 185 130 C 120 130, 120 195, 185 195 C 250 195, 250 130, 185 130'); break;
 case 'fisher': d=rope('M 70 150 C 135 150, 160 110, 210 110 C 260 110, 285 150, 350 150 M 110 130 C 140 95, 175 95, 175 130 M 245 130 C 245 95, 280 95, 310 130'); break;
 case 'sheet': d=rope('M 80 150 C 135 95, 175 95, 215 135 C 245 165, 280 165, 320 130 M 150 110 C 170 155, 205 165, 250 140'); break;
 case 'prusik': d=rope('M 235 45 L 235 190 M 160 95 C 210 65, 260 65, 310 95 C 260 125, 210 125, 160 95 M 160 145 C 210 115, 260 115, 310 145 C 260 175,210 175,160 145'); break;
 case 'anchor': d=rope('M 130 70 C 220 70, 245 110, 245 150 C 245 175, 275 180, 320 170 M 245 150 C 210 160, 170 165, 120 155'); break;
 case 'slipped_reef': d=rope('M 90 120 C 145 80, 160 80, 210 120 S 285 160 330 120 M 90 120 C 150 165, 165 160, 210 120 S 280 90 305 90'); break;
 case 'double_eight': d=rope('M 160 60 C 105 60,105 125,160 125 C 215 125,215 60,160 60 M 160 125 C 105 125,105 190,160 190 C 215 190,215 125,160 125 M 210 190 C 250 190,300 170,330 130'); break;
 case 'constrictor': d=rope('M 100 100 C 160 70, 240 70, 300 100 M 100 140 C 160 170, 240 170, 300 140 M 170 85 L 230 155 M 170 155 L 230 85'); break;
 case 'cow': d=rope('M 150 75 C 180 120,180 140,150 185 M 250 75 C 220 120,220 140,250 185 M 150 75 L 250 75'); break;
 case 'sheepshank': d=rope('M 70 125 L 145 125 C 160 90, 240 90, 255 125 L 330 125 M 145 125 C 160 160,240 160,255 125'); break;
 case 'butterfly': d=rope('M 90 130 C 145 85, 175 85, 200 130 C 225 85,255 85,310 130 M 130 145 C 170 175,230 175,270 145'); break;
}
stage.innerHTML=`<svg viewBox='0 0 400 240' xmlns='http://www.w3.org/2000/svg'><rect width='400' height='240' rx='18' fill='#f6fbf5'/><rect x='28' y='28' width='344' height='184' rx='18' fill='#ffffff' stroke='#9db69b' stroke-width='4'/><text x='42' y='54' fill='#166534' font-size='14' font-weight='700'>NÁSTĚNKA UZLŮ</text>${d}<text x='200' y='218' text-anchor='middle' fill='#5a6e50' font-size='20' font-weight='800'>${esc(q.knot)}</text></svg>`;
 }
function showQuestion(){locked=false; feedback.className='feedback'; feedback.innerHTML=''; nextBtn.style.display='none'; const q=questions[current]; progressBig.textContent=`${current+1} / ${questions.length}`; catBadge.textContent=q.category; qText.textContent=q.q; renderVisual(q); options.innerHTML=''; q.options.forEach((opt,idx)=>{const b=document.createElement('button'); b.className='opt'; b.innerHTML=`<strong>${String.fromCharCode(65+idx)}.</strong> ${esc(opt)}`; b.onclick=()=>answer(idx,b); options.appendChild(b)})}
function answer(idx, btn){ if(locked) return; locked=true; const q=questions[current]; const btns=[...document.querySelectorAll('.opt')]; btns.forEach((b,i)=>{b.disabled=true; if(i===q.correct) b.classList.add('correct'); if(i===idx && i!==q.correct) b.classList.add('wrong')}); if(idx===q.correct) score++; feedback.className='feedback show'; feedback.innerHTML=`<strong>${idx===q.correct?'Správně!':'Tady to nesedlo.'}</strong>${esc(q.explanation)}`; nextBtn.style.display='inline-block'; document.querySelectorAll('.dot')[current].classList.add('done'); }
nextBtn.onclick=()=>{ current++; if(current<questions.length) showQuestion(); else finish(); };
function finish(){ document.getElementById('quizWrap').style.display='none'; const res=document.getElementById('result'); res.classList.add('show'); document.getElementById('score').textContent=`${score} / ${questions.length}`; const pct=Math.round(score/questions.length*100); let line=''; if(pct>=90) line='Paráda — tohle je velmi silný výsledek.'; else if(pct>=70) line='Velmi slušné. Většinu jste měl(a) pevně v ruce.'; else if(pct>=50) line='Půlka a víc je dobrý základ. Příště to může být ještě lepší.'; else line='Tady je pořád kam růst — ale přesně od toho kvíz je.'; document.getElementById('resultText').textContent=line; }
document.getElementById('restartBtn').onclick=()=>{ current=0; score=0; document.querySelectorAll('.dot').forEach(d=>d.className='dot'); document.getElementById('quizWrap').style.display='block'; document.getElementById('result').classList.remove('show'); showQuestion(); };
showQuestion();
</script></body></html>
