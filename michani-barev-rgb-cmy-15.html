<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Červená, azurová, žlutá. Namícháte 15 barev bez kapátka?</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f7f7f7;font-family:Arial,sans-serif}.console{max-width:1180px;margin:auto;padding:17px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #2d3441;padding:8px 0 16px}.k{font:900 11px monospace;letter-spacing:.16em;color:#97a0af}h1{font-size:34px;line-height:1.08;margin:6px 0 0;max-width:900px}#prog{font:900 33px monospace}.mixer{margin-top:18px;background:#111620;border:1px solid #30394a;border-radius:22px;padding:18px;box-shadow:0 25px 70px #000a}.mode{display:inline-block;border:1px solid #566177;border-radius:999px;padding:6px 10px;font:900 11px monospace;color:#cbd5e1}.mixviz{min-height:285px;display:flex;align-items:center;justify-content:center;gap:24px;position:relative;overflow:hidden}.orb{width:180px;height:180px;border-radius:50%;box-shadow:0 0 55px currentColor;mix-blend-mode:screen;border:1px solid #ffffff33}.plus{font-size:54px;font-weight:200;color:#7e8796}.droplet{width:150px;height:180px;border-radius:80% 20% 65% 35% / 65% 25% 75% 35%;transform:rotate(45deg);box-shadow:inset 0 0 30px #0005}.q{font-size:24px;font-weight:900;line-height:1.2;margin:8px 0 13px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{background:#171e2a;border:1px solid #435069;color:#fff;border-radius:12px;padding:13px;text-align:left;font-size:16px;font-weight:850;cursor:pointer}.opt:hover{border-color:#e2e8f0}.opt.ok{background:#173d2c;border-color:#63d89b}.opt.bad{background:#4b2028;border-color:#ff7d8a}.fb{display:none;margin-top:12px;background:#0b1018;border:1px solid #30394a;border-radius:12px;padding:13px;line-height:1.45}.next{display:none;margin:12px 0 0 auto;border:0;border-radius:10px;padding:12px 17px;background:#e8edf5;color:#111827;font-weight:900}.channels{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:14px}.channels span{height:7px;background:#2a3240;border-radius:20px}.channels span.done{background:#e8edf5;box-shadow:0 0 8px #fff8}.result{display:none;text-align:center;padding:60px 10px}.score{font-size:75px;font-weight:1000}.restart{background:#111620;color:#fff;border:1px solid #e8edf5;border-radius:10px;padding:12px 18px;font-weight:900}@media(max-width:650px){header{display:block}#prog{margin-top:9px}h1{font-size:26px}.mixviz{min-height:210px;gap:12px}.orb{width:105px;height:105px}.droplet{width:90px;height:110px}.plus{font-size:38px}.opts{grid-template-columns:1fr}}</style></head><body><div class="console"><header><div><div class="k">MÍCHACÍ PULT // RGB ↔ CMY</div><h1>Kvíz: Červená, azurová, žlutá. Namícháte 15 barev bez kapátka?</h1></div><div id="prog">01/15</div></header><main class="mixer"><div id="quiz"><div class="mode" id="mode"></div><div class="mixviz" id="mixviz"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">DALŠÍ MIX →</button><div class="channels" id="channels"></div></div><section class="result" id="result"><div class="k">MIXÁŽNÍ SESSION DOKONČENA</div><div class="score" id="score"></div><h2 id="grade"></h2><button class="restart" id="restart">VYNULOVAT PULT</button></section></main></div><script>const Q=[{"mode":"RGB světlo","c1":"#ff3b30","c2":"#38d568","q":"Smícháte ve stejné intenzitě červené a zelené světlo. Jaký výsledek dostanete?","e":"V aditivním RGB modelu platí R + G = Y.","o":["Žluté světlo","Azurové světlo","Purpurové světlo","Černou"],"a":0},{"mode":"RGB světlo","c1":"#38d568","c2":"#3485ff","q":"Smícháte ve stejné intenzitě zelené a modré světlo. Jaký výsledek?","e":"V aditivním RGB modelu platí G + B = C.","o":["Žluté světlo","Purpurové světlo","Červené světlo","Azurové světlo"],"a":3},{"mode":"RGB světlo","c1":"#3485ff","c2":"#ff3b30","q":"Smícháte ve stejné intenzitě modré a červené světlo. Co vznikne?","e":"V aditivním RGB modelu platí B + R = M.","o":["Žluté světlo","Zelené světlo","Purpurové (magenta) světlo","Azurové světlo"],"a":2},{"mode":"RGB světlo","c1":"#ffffff","c2":"#ffffff","q":"Červené, zelené a modré světlo svítí současně stejnou intenzitou. Jak působí jejich součet?","e":"R + G + B v aditivním modelu vytváří bílé světlo.","o":["Azurově","Bíle","Černě","Hnědě"],"a":1},{"mode":"RGB světlo","c1":"#ff3b30","c2":"#00e5ff","q":"Červené světlo přidáte k jeho doplňkové azurové. Jaký je aditivní výsledek?","e":"Azurová obsahuje zelenou a modrou; R + (G + B) dává bílou.","o":["Bílá","Černá","Žlutá","Purpurová"],"a":0},{"mode":"RGB světlo","c1":"#38d568","c2":"#ff00d4","q":"Zelené světlo přidáte k doplňkové purpurové (magenta). Co vznikne?","e":"Magenta je červená + modrá; přidáním zelené získáte R + G + B, tedy bílou.","o":["Černá","Azurová","Žlutá","Bílá"],"a":3},{"mode":"RGB světlo","c1":"#3485ff","c2":"#ffe600","q":"Modré světlo přidáte ke žlutému světlu. Jaký je výsledek při stejné intenzitě?","e":"Žluté světlo je červená + zelená; přidání modré doplní všechny tři RGB složky.","o":["Černá","Purpurová","Bílá","Zelená"],"a":2},{"mode":"RGB světlo","c1":"#111111","c2":"#111111","q":"Na obrazovce jsou kanály R, G i B nastavené na nulu. Jakou barvu pixel ideálně zobrazí?","e":"Bez vyzařovaného světla je aditivní výsledek černý.","o":["Azurovou","Černou","Bílou","Šedou"],"a":1},{"mode":"CMY pigment","c1":"#00d9e8","c2":"#ff00bf","q":"V idealizovaném subtraktivním CMY modelu smícháte cyan a magentu. Jaký výsledek?","e":"Cyan odečítá červenou a magenta zelenou, takže z bílého světla zůstává hlavně modrá.","o":["Modrou","Červenou","Zelenou","Bílou"],"a":0},{"mode":"CMY pigment","c1":"#ff00bf","c2":"#ffe000","q":"V idealizovaném CMY modelu smícháte magentu a žlutou. Co vznikne?","e":"Magenta odečítá zelenou a žlutá modrou, takže zůstává červená.","o":["Modrá","Zelená","Azurová","Červená"],"a":3},{"mode":"CMY pigment","c1":"#ffe000","c2":"#00d9e8","q":"V idealizovaném CMY modelu smícháte žlutou a cyan. Jaký výsledek?","e":"Žlutá odečítá modrou a cyan červenou, takže zůstává zelená.","o":["Modrá","Purpurová","Zelená","Červená"],"a":2},{"mode":"CMY pigment","c1":"#00d9e8","c2":"#ff00bf","q":"Cyan, magenta a žlutá jsou v idealizovaném CMY modelu nanesené dohromady v plné intenzitě. Jaký teoretický výsledek?","e":"Ideální CMY pigmenty společně odečtou červenou, zelenou i modrou složku. V reálném tisku se proto používá i samostatná černá K.","o":["Azurová","Černá","Bílá","Červená"],"a":1},{"mode":"CMY filtr","c1":"#00d9e8","c2":"#ffffff","q":"Kterou základní RGB složku z bílého světla ideální cyan filtr pohlcuje?","e":"Cyan propouští zelenou a modrou a pohlcuje jejich doplňkovou červenou.","o":["Červenou","Zelenou","Modrou","Žádnou"],"a":0},{"mode":"CMY filtr","c1":"#ff00bf","c2":"#ffffff","q":"Kterou základní RGB složku ideální magenta filtr pohlcuje?","e":"Magenta propouští červenou a modrou a pohlcuje zelenou.","o":["Červenou","Modrou","Všechny tři stejně","Zelenou"],"a":3},{"mode":"CMY filtr","c1":"#ffe000","c2":"#ffffff","q":"Kterou základní RGB složku ideální žlutý filtr pohlcuje?","e":"Žlutý filtr propouští červenou a zelenou a pohlcuje modrou.","o":["Zelenou","Žádnou","Modrou","Červenou"],"a":2}];let i=0,score=0;for(let n=0;n<15;n++)channels.innerHTML+='<span></span>';function viz(x){const pigment=x.mode.startsWith('CMY');const cl=pigment?'droplet':'orb';return `<div class="${cl}" style="background:${x.c1};color:${x.c1}"></div><div class="plus">+</div><div class="${cl}" style="background:${x.c2};color:${x.c2}"></div>`}function show(){const x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;mode.textContent=x.mode;mixviz.innerHTML=viz(x);q.textContent=x.q;opts.innerHTML='';x.o.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){const x=Q[i];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;channels.children[i].classList.add('done');fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'MIX SEDÍ.':'KANÁLY NESOUHLASÍ.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('score').textContent=`${score} / 15`;grade.textContent=score>=13?'Barevný technik':score>=9?'Pult máte pod kontrolou':'RGB a CMY chtějí ještě jeden mix'}restart.onclick=()=>{i=0;score=0;[...channels.children].forEach(x=>x.classList.remove('done'));result.style.display='none';quiz.style.display='block';show()};show();</script></body></html>
