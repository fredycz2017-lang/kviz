<!doctype html><html lang='cs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kvíz: Parní stroj, telefon, internet. Zařadíte 15 vynálezů na časovou osu?</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button{font:inherit}.wrap{max-width:1180px;margin:auto;padding:14px}h1{font-size:clamp(27px,4vw,48px);line-height:1.05;margin:6px 0 8px}.lead{line-height:1.5;max-width:940px;margin:0}.opt{border-radius:14px;padding:13px 14px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:56px}.opt:hover{transform:translateY(-1px)}.opt.correct{background:#dff7e9!important;color:#173723!important;border-color:#67d995!important}.opt.wrong{background:#ffe1e5!important;color:#5b1520!important;border-color:#ff7786!important}.opt:disabled{opacity:1;cursor:default}.feedback{display:none;border-radius:14px;padding:12px 14px;margin-top:11px;line-height:1.45}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.next{display:none;margin:11px 0 0 auto;border:none;border-radius:13px;padding:12px 17px;font-weight:1000;cursor:pointer}.result{display:none;text-align:center;padding:38px 15px}.result.show{display:block}.score{font-size:70px;font-weight:1000}.resText{max-width:760px;margin:10px auto 18px;line-height:1.5}.restart{border:none;border-radius:14px;padding:13px 18px;font-weight:1000;cursor:pointer}@media(max-width:700px){.wrap{padding:8px}.opt{font-size:15px}} body{background:#120d08;color:#fff8ec}header{border:1px solid #775333;border-radius:24px;padding:18px 20px;background:linear-gradient(135deg,#2b1b0d,#120d08);margin-bottom:14px}.lead{color:#cfbfad}.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:#ffbd64}.timeline{border:1px solid #775333;border-radius:22px;padding:15px;background:#1a120b}.belt{height:180px;border-radius:18px;background:repeating-linear-gradient(90deg,#302317 0 58px,#1d150e 58px 63px);border:1px solid #684b33;display:grid;place-items:center;position:relative;overflow:hidden}.belt:after{content:'CHRONOLOGICKÝ DOPRAVNÍK';position:absolute;right:14px;bottom:10px;font-size:10px;color:#9f856d;letter-spacing:.12em}.card{width:min(700px,90%);background:#f0ddbb;color:#362515;border:3px solid #a27743;border-radius:14px;padding:18px 20px;box-shadow:0 9px 20px #0007}.card b{display:block;color:#7e3d1c;font-size:11px;letter-spacing:.12em;margin-bottom:7px}.card div{font-size:clamp(22px,3vw,32px);font-weight:1000}.ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:12px 0}.tick{height:10px;border-radius:99px;background:#3a2a1c}.tick.done{background:#ffbd64}.question{font-size:24px;font-weight:1000;margin:10px 0}#options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #654932;background:#24180f;color:#fff8ec}.opt:hover{border-color:#ffbd64}.feedback{background:#24180f;border:1px solid #654932}.feedback strong{color:#ffbd64}.next,.restart{background:#ffbd64;color:#23180b}.score{color:#ffbd64}.resText{color:#cfbfad}@media(max-width:700px){#options{grid-template-columns:1fr}}</style></head><body><div class='wrap'><header><div class='kicker'>PATENTOVÁ OSA // 15 MILNÍKŮ</div><h1>Kvíz: Parní stroj, telefon, internet. Zařadíte 15 vynálezů na časovou osu?</h1><p class='lead'>Nejde o jména vynálezců. Každá karta míří do širokého časového okna nebo na jeden známý milník.</p></header><main class='timeline'><div id='quiz'><div class='ticks' id='ticks'></div><div class='belt'><div class='card'><b id='tag'></b><div id='visual'></div></div></div><div class='question'>Kam patří tato karta na časové ose?</div><div id='options'></div><div class='feedback' id='feedback'></div><button class='next' id='next'>DALŠÍ PATENT →</button></div><section class='result' id='result'><div class='kicker'>ČASOVÁ OSA UZAVŘENA</div><h2>Patnáct milníků zařazeno</h2><div class='score' id='score'></div><p class='resText' id='resText'></p><button class='restart' id='restart'>PROJET OSU ZNOVU</button></section></main></div><script>const Q=[{"name": "Knihtisk s pohyblivými literami", "options": ["15. století", "17. století", "19. století", "20. století"], "a": 0, "exp": "Gutenbergův evropský knihtisk s pohyblivými literami se pojí s polovinou 15. století."}, {"name": "Newcomenův parní stroj", "options": ["Začátek 18. století", "Konec 18. století", "Polovina 19. století", "Začátek 20. století"], "a": 0, "exp": "Newcomenův atmosférický parní stroj začal pracovat roku 1712."}, {"name": "Daguerrotypie", "options": ["1810. léta", "1830. léta", "1870. léta", "1910. léta"], "a": 1, "exp": "Daguerrotypie byla veřejně představena roku 1839."}, {"name": "Morseův elektrický telegraf", "options": ["1780.–1790. léta", "1830.–1840. léta", "1880.–1890. léta", "1920.–1930. léta"], "a": 1, "exp": "Praktické Morseovy systémy se prosadily ve 30. a 40. letech 19. století."}, {"name": "Bellův telefon", "options": ["1840. léta", "1870. léta", "1900. léta", "1930. léta"], "a": 1, "exp": "Bellův telefonní patent je z roku 1876."}, {"name": "Praktická žárovka s dlouhou životností", "options": ["Konec 1830. let", "Konec 1870. let", "Konec 1910. let", "Konec 1950. let"], "a": 1, "exp": "Praktické dlouho svítící žárovky se prosadily na konci 70. let 19. století."}, {"name": "Benz Patent-Motorwagen", "options": ["1860. léta", "1880. léta", "1910. léta", "1940. léta"], "a": 1, "exp": "Benzův Patent-Motorwagen vznikl v letech 1885–1886."}, {"name": "Rádiový přenos bez drátu", "options": ["1840. léta", "1890. léta", "1930. léta", "1970. léta"], "a": 1, "exp": "Praktické bezdrátové rádiové experimenty a přenosy se datují do 90. let 19. století."}, {"name": "Motorový let bratří Wrightů", "options": ["1886", "1903", "1927", "1947"], "a": 1, "exp": "Bratři Wrightové uskutečnili známý řízený motorový let roku 1903."}, {"name": "Elektronická televize – zásadní demonstrace", "options": ["1890. léta", "1920. léta", "1950. léta", "1980. léta"], "a": 1, "exp": "Zásadní elektronické televizní demonstrace spadají do 20. let 20. století."}, {"name": "Tranzistor", "options": ["1927", "1947", "1969", "1989"], "a": 1, "exp": "První funkční bodový tranzistor byl předveden v Bell Labs roku 1947."}, {"name": "Integrovaný obvod", "options": ["Konec 1930. let", "Konec 1950. let", "Konec 1970. let", "Konec 1990. let"], "a": 1, "exp": "První integrované obvody jsou spojovány s lety 1958–1959."}, {"name": "Osobní mikropočítače", "options": ["1940. léta", "1950. léta", "1970. léta", "1990. léta"], "a": 2, "exp": "Vlna osobních mikropočítačů se rozběhla v 70. letech."}, {"name": "Návrh World Wide Webu", "options": ["1969", "1979", "1989", "1999"], "a": 2, "exp": "Tim Berners-Lee předložil návrh World Wide Webu v CERN v roce 1989."}, {"name": "CERN uvolňuje webovou technologii", "options": ["1983", "1989", "1993", "2001"], "a": 2, "exp": "CERN roku 1993 uvolnil webovou technologii bez licenčních poplatků."}];const GOOD="Výborně. Technologickou osu čtete skoro bez zaváhání.",MID="Dobré. Většinu milníků máte správně.",LOW="Časová osa se vám tentokrát zamotala. Druhé kolo zkuste podle vztahů mezi milníky.";function resetWorld(){document.getElementById('ticks').innerHTML=Array.from({length:15},()=>'<span class="tick"></span>').join('')}function afterAnswer(){document.querySelectorAll('.tick')[i].classList.add('done')}function show(){locked=false;let q=Q[i];document.getElementById('tag').textContent='KARTA '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('visual').textContent=q.name;renderOptions(q);document.getElementById('feedback').className='feedback';document.getElementById('next').style.display='none'}let i=0,score=0,locked=false;function renderOptions(q){let box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(k);box.appendChild(b)})}function answer(k){if(locked)return;locked=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===k&&j!==q.a)b.classList.add('wrong')});if(k===q.a)score++;afterAnswer(k===q.a);let f=document.getElementById('feedback');f.className='feedback show';f.innerHTML='<strong>'+(k===q.a?'SPRÁVNĚ':'TENTOKRÁT NE')+'</strong>'+q.exp;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;if(i<Q.length)show();else finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / '+Q.length;document.getElementById('resText').textContent=score>=Math.ceil(Q.length*.85)?GOOD:score>=Math.ceil(Q.length*.6)?MID:LOW}document.getElementById('restart').onclick=()=>{i=0;score=0;locked=false;resetWorld();document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='';show()};resetWorld();show();</script></body></html>
