<!doctype html><html lang='cs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kvíz ze školy: Kilo, centi, mili, mikro. Převedete 15 předpon bez kalkulačky?</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button{font:inherit}.wrap{max-width:1180px;margin:auto;padding:14px}h1{font-size:clamp(27px,4vw,48px);line-height:1.05;margin:6px 0 8px}.lead{line-height:1.5;max-width:940px;margin:0}.opt{border-radius:14px;padding:13px 14px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:56px}.opt:hover{transform:translateY(-1px)}.opt.correct{background:#dff7e9!important;color:#173723!important;border-color:#67d995!important}.opt.wrong{background:#ffe1e5!important;color:#5b1520!important;border-color:#ff7786!important}.opt:disabled{opacity:1;cursor:default}.feedback{display:none;border-radius:14px;padding:12px 14px;margin-top:11px;line-height:1.45}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.next{display:none;margin:11px 0 0 auto;border:none;border-radius:13px;padding:12px 17px;font-weight:1000;cursor:pointer}.result{display:none;text-align:center;padding:38px 15px}.result.show{display:block}.score{font-size:70px;font-weight:1000}.resText{max-width:760px;margin:10px auto 18px;line-height:1.5}.restart{border:none;border-radius:14px;padding:13px 18px;font-weight:1000;cursor:pointer}@media(max-width:700px){.wrap{padding:8px}.opt{font-size:15px}} body{background:#071019;color:#eef9ff}header{border:1px solid #315a78;border-radius:24px;padding:18px 20px;background:linear-gradient(135deg,#0c2940,#071019);margin-bottom:14px}.lead{color:#b6ccd9}.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:#75d2ff}.elevator{display:grid;grid-template-columns:220px 1fr;gap:14px;border:1px solid #315a78;border-radius:22px;padding:15px;background:#0b1721}.shaft{border:1px solid #345a73;border-radius:18px;background:#071017;padding:12px;display:grid;grid-template-rows:repeat(7,1fr);gap:6px}.floor{border:1px solid #233d4f;border-radius:10px;padding:9px;color:#607f92;font-size:12px;font-weight:900}.floor.active{background:#12344a;color:#dbf4ff;border-color:#75d2ff}.cab{border:1px solid #315a78;border-radius:18px;padding:16px;background:#0d1d29}.display{min-height:210px;border:1px solid #315a78;border-radius:17px;background:radial-gradient(circle at 50% 40%,#12354d,#060c12 70%);display:grid;place-items:center;text-align:center}.value{font-size:clamp(45px,8vw,86px);font-weight:1000}.question{font-size:24px;font-weight:1000;margin:13px 0}#options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #36566c;background:#101f2a;color:#eef9ff}.feedback{background:#101f2a;border:1px solid #36566c}.feedback strong{color:#75d2ff}.next,.restart{background:#75d2ff;color:#051018}.score{color:#75d2ff}.resText{color:#b6ccd9}@media(max-width:800px){.elevator{grid-template-columns:1fr}.shaft{grid-template-columns:repeat(7,1fr);grid-template-rows:1fr;overflow:auto}#options{grid-template-columns:1fr}}</style></head><body><div class='wrap'><header><div class='kicker'>MĚŘÍTKOVÝ VÝTAH // 15 PŘEVODŮ</div><h1>Kvíz ze školy: Kilo, centi, mili, mikro. Převedete 15 předpon bez kalkulačky?</h1><p class='lead'>Patra jsou řády velikosti. Žádné těžké počítání, jen desetinná čárka a jistota v předponách.</p></header><main class='elevator'><aside class='shaft' id='shaft'></aside><section class='cab'><div id='quiz'><div class='display'><div><div class='kicker' id='progress'></div><div class='value' id='visual'></div></div></div><div class='question' id='qtext'></div><div id='options'></div><div class='feedback' id='feedback'></div><button class='next' id='next'>DALŠÍ PATRO →</button></div><section class='result' id='result'><div class='kicker'>VÝTAH DORAZIL</div><h2>Patnáct převodů hotovo</h2><div class='score' id='score'></div><p class='resText' id='resText'></p><button class='restart' id='restart'>JET ZNOVU</button></section></section></main></div><script>const Q=[{"name":"2 km","question":"Kolik je to metrů?","options":["200 m","2 000 m","20 000 m","0,002 m"],"a":1,"exp":"Kilo znamená 10³, takže 2 km = 2 000 m."},{"name":"350 cm","question":"Kolik je to metrů?","options":["0,35 m","3,5 m","35 m","3500 m"],"a":1,"exp":"Centi znamená 10⁻², proto 350 cm = 3,5 m."},{"name":"4,2 m","question":"Kolik je to centimetrů?","options":["42 cm","420 cm","4 200 cm","0,042 cm"],"a":1,"exp":"Jeden metr má 100 centimetrů, takže 4,2 m = 420 cm."},{"name":"750 mm","question":"Kolik je to metrů?","options":["0,075 m","0,75 m","7,5 m","75 m"],"a":1,"exp":"Mili znamená 10⁻³, takže 750 mm = 0,75 m."},{"name":"3,6 l","question":"Kolik je to mililitrů?","options":["36 ml","360 ml","3 600 ml","36 000 ml"],"a":2,"exp":"Jeden litr má 1 000 mililitrů, proto 3,6 l = 3 600 ml."},{"name":"250 ml","question":"Kolik je to litrů?","options":["0,025 l","0,25 l","2,5 l","25 l"],"a":1,"exp":"250 ml = 0,25 l."},{"name":"5 kg","question":"Kolik je to gramů?","options":["50 g","500 g","5 000 g","50 000 g"],"a":2,"exp":"5 kg = 5 000 g."},{"name":"80 g","question":"Kolik je to kilogramů?","options":["0,008 kg","0,08 kg","0,8 kg","8 kg"],"a":1,"exp":"80 g = 0,08 kg."},{"name":"7 dl","question":"Kolik je to litrů?","options":["0,07 l","0,7 l","7 l","70 l"],"a":1,"exp":"7 dl = 0,7 l."},{"name":"1,5 l","question":"Kolik je to decilitrů?","options":["1,5 dl","15 dl","150 dl","0,15 dl"],"a":1,"exp":"1,5 l = 15 dl."},{"name":"45 µm","question":"Kolik je to metrů?","options":["0,000045 m","0,00045 m","0,0045 m","0,045 m"],"a":0,"exp":"45 µm = 45 × 10⁻⁶ m = 0,000045 m."},{"name":"0,003 m","question":"Kolik je to milimetrů?","options":["0,3 mm","3 mm","30 mm","300 mm"],"a":1,"exp":"0,003 m = 3 mm."},{"name":"12 cm","question":"Kolik je to milimetrů?","options":["1,2 mm","12 mm","120 mm","1 200 mm"],"a":2,"exp":"12 cm = 120 mm."},{"name":"6 500 µg","question":"Kolik je to miligramů?","options":["0,65 mg","6,5 mg","65 mg","650 mg"],"a":1,"exp":"6 500 µg = 6,5 mg."},{"name":"0,4 kg","question":"Kolik je to gramů?","options":["4 g","40 g","400 g","4 000 g"],"a":2,"exp":"0,4 kg = 400 g."}];const GOOD="Výborně. Řády velikosti máte pod kontrolou.",MID="Dobré. Většina převodů sedí.",LOW="Měřítkový výtah vás párkrát vysadil na špatném patře.";const floors=['kilo 10³','hecto 10²','deka 10¹','základ 10⁰','deci 10⁻¹','centi 10⁻²','mili 10⁻³'];function resetWorld(){document.getElementById('shaft').innerHTML=floors.map(x=>'<div class="floor">'+x+'</div>').join('')}function afterAnswer(){let fs=document.querySelectorAll('.floor');fs.forEach(x=>x.classList.remove('active'));fs[i%7].classList.add('active')}function show(){locked=false;let q=Q[i];document.getElementById('progress').textContent='PŘEVOD '+(i+1)+' / 15';document.getElementById('visual').textContent=q.name;document.getElementById('qtext').textContent=q.question;renderOptions(q);document.getElementById('feedback').className='feedback';document.getElementById('next').style.display='none';let fs=document.querySelectorAll('.floor');fs.forEach(x=>x.classList.remove('active'));fs[i%7].classList.add('active')}let i=0,score=0,locked=false;function renderOptions(q){let box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(k);box.appendChild(b)})}function answer(k){if(locked)return;locked=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===k&&j!==q.a)b.classList.add('wrong')});if(k===q.a)score++;afterAnswer(k===q.a);let f=document.getElementById('feedback');f.className='feedback show';f.innerHTML='<strong>'+(k===q.a?'SPRÁVNĚ':'TENTOKRÁT NE')+'</strong>'+q.exp;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;if(i<Q.length)show();else finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / '+Q.length;document.getElementById('resText').textContent=score>=Math.ceil(Q.length*.85)?GOOD:score>=Math.ceil(Q.length*.6)?MID:LOW}document.getElementById('restart').onclick=()=>{i=0;score=0;locked=false;resetWorld();document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='';show()};resetWorld();show();</script></body></html>
