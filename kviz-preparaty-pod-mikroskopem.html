<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: Cibule, list, kvasinka. Poznáte 15 preparátů pod mikroskopem?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#dbe7e0;color:#183128}.wrap{max-width:1120px;margin:auto;padding:18px}header{background:#f7fbf8;border:2px solid #5f8878;border-radius:20px;padding:18px}h1{margin:0;font-size:clamp(26px,4vw,43px);line-height:1.06}.sub{color:#4b665d;line-height:1.5}.lab{display:grid;grid-template-columns:310px 1fr;gap:18px;margin-top:18px}.scope,.card{background:#f7fbf8;border:2px solid #678c7e;border-radius:18px}.scope{padding:16px;height:max-content;position:sticky;top:12px;text-align:center}.tube{width:120px;height:95px;background:#486f61;margin:0 auto;border-radius:22px 22px 50px 50px;position:relative}.tube:after{content:'';position:absolute;width:165px;height:18px;background:#335448;bottom:-18px;left:-22px;border-radius:10px}.ocular{width:230px;height:230px;margin:38px auto 10px;border-radius:50%;background:#eef7f1;border:16px solid #254a3d;box-shadow:inset 0 0 28px #6c9e8a;display:flex;align-items:center;justify-content:center;overflow:hidden}.slides{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.slide{height:18px;background:#bdd2c7;border:1px solid #698c7d}.slide.on{background:#4d7f69}.card{padding:18px}.zone{display:inline-block;background:#d6e8de;border:1px solid #7da08e;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.q{font-size:clamp(21px,3vw,29px);font-weight:800;line-height:1.22;margin:12px 0}.answers{display:grid;gap:10px}.answer{background:#fff;border:2px solid #9db7aa;padding:13px;border-radius:12px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#dff2e5;border-color:#4c8462}.answer.wrong{background:#f4dddd;border-color:#a45656}.answer.locked{pointer-events:none}.feedback{display:none;margin-top:13px;background:#e7f0eb;border-left:5px solid #4f7969;padding:12px;line-height:1.5}.feedback.show{display:block}.next,.restart{margin-top:14px;background:#355f50;color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:30px}.score{font-size:58px;font-weight:900;color:#3e6f5c}.band{max-width:620px;margin:10px auto;line-height:1.5}@media(max-width:800px){.lab{grid-template-columns:1fr}.scope{position:static}.ocular{width:200px;height:200px}}
</style></head><body><div class="wrap"><header><h1>Kvíz ze školy: Cibule, list, kvasinka. Poznáte 15 preparátů pod mikroskopem?</h1><p class="sub">Patnáct školních preparátů jako vlastní schematické obrazy v okuláru.</p></header><div class="lab"><aside class="scope"><div class="tube"></div><div class="ocular" id="visual"></div><div><strong>Sklíčko <span id="progressText">1 / 15</span></strong></div><div class="slides"><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div><div class="slide"></div></div></aside><main class="card"><section id="quizArea"><div class="zone" id="zoneTag"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn" disabled>Vyměnit preparát</button></section><section class="result" id="resultArea"><h2>Krabička plná</h2><div class="score" id="scoreOut"></div><div class="band" id="bandOut"></div><button class="restart" id="restartBtn">Zkusit znovu</button></section></main></div></div><script>function microSvg(t){const g='#49665a',d='#21352f',l='#dce9df',a='#88ad96';const W=(b)=>`<svg viewBox="0 0 260 190" width="100%" height="190">${b}</svg>`;
if(t==='onion'){let b='';for(let y=25;y<165;y+=35)for(let x=25;x<235;x+=52)b+=`<rect x="${x}" y="${y}" width="52" height="35" fill="none" stroke="${g}" stroke-width="2"/>`;return W(b)}
if(t==='elodea'){let b='';for(let y=25;y<165;y+=45)for(let x=25;x<235;x+=55){b+=`<rect x="${x}" y="${y}" width="55" height="45" fill="none" stroke="${g}" stroke-width="2"/>`;for(let i=0;i<8;i++){let px=x+8+(i%4)*12,py=y+8+Math.floor(i/4)*24;b+=`<circle cx="${px}" cy="${py}" r="3" fill="${a}"/>`;}}return W(b)}
if(t==='stoma')return W(`<path d="M95 55 C65 80 75 130 112 130 C125 130 128 105 128 95 C128 75 116 55 95 55Z" fill="${l}" stroke="${g}" stroke-width="3"/><path d="M165 55 C195 80 185 130 148 130 C135 130 132 105 132 95 C132 75 144 55 165 55Z" fill="${l}" stroke="${g}" stroke-width="3"/><ellipse cx="130" cy="95" rx="7" ry="31" fill="${d}"/>`)
if(t==='starch'){let b='';[[70,80,28,20],[125,70,34,24],[180,95,30,22],[105,125,27,18],[165,135,35,25]].forEach(([x,y,rx,ry])=>{b+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${g}" stroke-width="2"/><ellipse cx="${x}" cy="${y}" rx="${rx*.55}" ry="${ry*.55}" fill="none" stroke="${a}" stroke-width="2"/>`;});return W(b)}
if(t==='yeast'){let b='';[[65,70,13],[98,105,15],[142,70,14],[175,115,16],[200,62,12],[125,135,12]].forEach(([x,y,r],i)=>{b+=`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" fill="${l}" stroke="${g}" stroke-width="2"/>`;if(i%2===0)b+=`<ellipse cx="${x+r*.8}" cy="${y-r*.6}" rx="${r*.45}" ry="${r*.35}" fill="${l}" stroke="${g}" stroke-width="2"/>`;});return W(b)}
if(t==='paramecium')return W(`<path d="M65 105 C75 50 175 35 205 88 C228 130 145 158 88 138 C70 132 60 120 65 105Z" fill="${l}" stroke="${g}" stroke-width="3"/>`+Array.from({length:22},(_,i)=>{let a=i/22*Math.PI*2,x=135+Math.cos(a)*75,y=100+Math.sin(a)*50,x2=135+Math.cos(a)*86,y2=100+Math.sin(a)*59;return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${g}" stroke-width="2"/>`}).join(''))
if(t==='euglena')return W(`<path d="M80 115 C95 45 175 45 188 98 C195 128 150 150 105 136 C88 130 76 124 80 115Z" fill="${l}" stroke="${g}" stroke-width="3"/><path d="M187 96 Q220 75 235 44" fill="none" stroke="${g}" stroke-width="3"/><circle cx="163" cy="79" r="7" fill="${d}"/>`)
if(t==='diatom')return W(`<ellipse cx="80" cy="90" rx="28" ry="55" fill="none" stroke="${g}" stroke-width="3"/><rect x="120" y="55" width="70" height="70" rx="8" fill="none" stroke="${g}" stroke-width="3"/><path d="M205 45 L232 72 L205 99 L178 72 Z" fill="none" stroke="${g}" stroke-width="3"/><g stroke="${a}" stroke-width="2"><line x1="65" y1="50" x2="95" y2="130"/><line x1="65" y1="130" x2="95" y2="50"/><line x1="130" y1="65" x2="180" y2="115"/><line x1="180" y1="65" x2="130" y2="115"/></g>`)
if(t==='pollen'){let b='';[[80,90,26],[145,68,22],[176,125,28],[110,135,18]].forEach(([x,y,r])=>{b+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${l}" stroke="${g}" stroke-width="3"/>`;for(let i=0;i<12;i++){let a=i*Math.PI/6;b+=`<line x1="${x+Math.cos(a)*r}" y1="${y+Math.sin(a)*r}" x2="${x+Math.cos(a)*(r+8)}" y2="${y+Math.sin(a)*(r+8)}" stroke="${g}" stroke-width="2"/>`;}});return W(b)}
if(t==='cork'){let b='';for(let y=25;y<170;y+=28)for(let x=20+(y%56?14:0);x<240;x+=48)b+=`<path d="M${x} ${y+8} L${x+12} ${y} L${x+36} ${y} L${x+48} ${y+8} L${x+36} ${y+28} L${x+12} ${y+28}Z" fill="none" stroke="${g}" stroke-width="2"/>`;return W(b)}
if(t==='mold')return W(`<path d="M40 150 Q80 100 120 145 M90 145 Q110 95 145 70 M130 145 Q155 115 190 128 M150 100 Q185 75 200 45" fill="none" stroke="${g}" stroke-width="4"/><circle cx="202" cy="42" r="20" fill="none" stroke="${g}" stroke-width="3"/>`+Array.from({length:8},(_,i)=>{let ang=i*Math.PI/4;return `<circle cx="${202+Math.cos(ang)*11}" cy="${42+Math.sin(ang)*11}" r="2.5" fill="${a}"/>`}).join(''))
if(t==='root'){let b='';for(let y=25;y<165;y+=35)for(let x=30;x<230;x+=40){b+=`<rect x="${x}" y="${y}" width="40" height="35" fill="none" stroke="${g}" stroke-width="2"/>`;if((x+y)%80===0)b+=`<path d="M${x+10} ${y+10} L${x+30} ${y+25} M${x+30} ${y+10} L${x+10} ${y+25}" stroke="${d}" stroke-width="3"/>`; }return W(b)}
if(t==='spirogyra'){let b=`<rect x="35" y="70" width="190" height="50" rx="10" fill="none" stroke="${g}" stroke-width="3"/>`;for(let x=65;x<225;x+=35)b+=`<line x1="${x}" y1="70" x2="${x}" y2="120" stroke="${g}" stroke-width="2"/>`;for(let x=45;x<220;x+=30)b+=`<path d="M${x} 112 Q${x+12} 72 ${x+25} 82 Q${x+37} 122 ${x+50} 108" fill="none" stroke="${a}" stroke-width="4"/>`;return W(b)}
if(t==='moss'){let b='';for(let y=30;y<160;y+=30)for(let x=30+(y%60?15:0);x<230;x+=42){b+=`<path d="M${x} ${y+8} L${x+12} ${y} L${x+30} ${y+5} L${x+36} ${y+20} L${x+20} ${y+30} L${x+4} ${y+24}Z" fill="none" stroke="${g}" stroke-width="2"/>`;for(let i=0;i<3;i++)b+=`<circle cx="${x+12+i*7}" cy="${y+14+(i%2)*5}" r="2" fill="${a}"/>`; }return W(b)}
if(t==='trichome')return W(`<path d="M25 135 Q75 125 120 135 Q170 145 235 130" fill="none" stroke="${g}" stroke-width="5"/><path d="M130 134 Q128 95 150 65 Q160 52 168 38" fill="none" stroke="${g}" stroke-width="5"/><circle cx="169" cy="36" r="7" fill="${a}"/>`)
return W('');}</script>
<script>
const questions=[{"zone": "ROSTLINY", "micro": "onion", "q": "Který školní preparát typicky připomíná pravidelnou cihlovou zeď z protáhlých buněk?", "options": ["Kvasinky", "Pyl", "Plíseň", "Cibulová pokožka"], "correct": 3, "explanation": "Buňky cibulové pokožky jsou velké, pravidelně uspořádané a často působí jako cihličky."}, {"zone": "ROSTLINY", "micro": "elodea", "q": "Který preparát ukazuje obdélníkové rostlinné buňky s mnoha drobnými chloroplasty při okrajích?", "options": ["Korek", "List vodní rostliny (např. vodní mor)", "Kvasinky", "Rozsivky"], "correct": 1, "explanation": "V listech vodních rostlin jsou chloroplasty v živých buňkách velmi dobře pozorovatelné."}, {"zone": "ROSTLINY", "micro": "stoma", "q": "Co ukazuje dvojice ledvinovitých buněk obklopujících štěrbinu?", "options": ["Průduch listu", "Kořenový vlásek", "Zárodečnou buňku", "Kvasinkovou kolonii"], "correct": 0, "explanation": "Dvě svěrací buňky obklopující průduchovou štěrbinu tvoří průduch."}, {"zone": "ROSTLINY", "micro": "starch", "q": "Který preparát poznáte podle mnoha oválných škrobových zrn s jemnými soustřednými strukturami?", "options": ["Pyl", "Korek", "Bramborový škrob", "Kvasinky"], "correct": 2, "explanation": "Škrobová zrna z bramboru bývají oválná a mohou vykazovat vrstvenou strukturu."}, {"zone": "MIKROORGANISMY", "micro": "yeast", "q": "Který obraz tvoří drobné oválné buňky, z nichž některé mají malý pupen?", "options": ["Pyl", "Kvasinky", "Rozsivky", "Kořenová špička"], "correct": 1, "explanation": "Kvasinky se často rozmnožují pučením, takže vedle větší buňky bývá vidět menší pupen."}, {"zone": "MIKROORGANISMY", "micro": "paramecium", "q": "Který organismus má protáhlý „střevíčkovitý“ tvar a povrch pokrytý brvami?", "options": ["Krásnoočko", "Rozsivka", "Plíseň", "Trepka"], "correct": 3, "explanation": "Trepka je nálevník se střevíčkovitým tvarem a množstvím brv na povrchu."}, {"zone": "MIKROORGANISMY", "micro": "euglena", "q": "Který jednobuněčný organismus bývá protáhlý a má bičík?", "options": ["Kvasinka", "Pylové zrno", "Krásnoočko", "Trepka"], "correct": 2, "explanation": "Krásnoočko (Euglena) je protáhlý jednobuněčný organismus s bičíkem."}, {"zone": "MIKROORGANISMY", "micro": "diatom", "q": "Který preparát tvoří nápadně geometrické schránky různých tvarů?", "options": ["Rozsivky", "Cibulová pokožka", "Plíseň", "Kořenový vlásek"], "correct": 0, "explanation": "Rozsivky mají charakteristické křemičité schránky s výraznými geometrickými tvary."}, {"zone": "STRUKTURY", "micro": "pollen", "q": "Který preparát může vypadat jako množství kulatých či oválných zrnek s členitým povrchem?", "options": ["Škrob", "Pyl", "Korek", "Kvasinky"], "correct": 1, "explanation": "Pylová zrna mají druhově různý, často výrazně strukturovaný povrch."}, {"zone": "STRUKTURY", "micro": "cork", "q": "Který preparát historicky připomíná síť prázdných komůrek a dal vzniknout pojmu „buňka“?", "options": ["Pyl", "Kořenová špička", "Korek", "Krásnoočko"], "correct": 2, "explanation": "Robert Hooke pozoroval v korku pravidelné komůrky, které pojmenoval cells – buňky."}, {"zone": "STRUKTURY", "micro": "mold", "q": "Co nejlépe odpovídá obrazu dlouhých větvených vláken zakončených výtrusnými útvary?", "options": ["Vodní mor", "Pyl", "Rozsivka", "Plíseň"], "correct": 3, "explanation": "Plísně tvoří vláknité hyfy a u některých typů lze pozorovat výtrusné struktury."}, {"zone": "FINÁLE", "micro": "root", "q": "Kde byste typicky hledali mnoho buněk v různých fázích dělení?", "options": ["Ve špičce rostoucího kořene", "V korku", "V pylové láčce bez dělení", "V odumřelé slupce"], "correct": 0, "explanation": "Kořenová špička obsahuje meristém, kde se buňky intenzivně dělí."}, {"zone": "FINÁLE", "micro": "spirogyra", "q": "Který preparát tvoří dlouhé vlákno buněk se spirálovitě uspořádaným chloroplastem?", "options": ["Rozsivky", "Plíseň", "Šroubatka (Spirogyra)", "Kvasinky"], "correct": 2, "explanation": "Šroubatka má nápadné spirálovité chloroplasty, podle nichž se snadno poznává."}, {"zone": "FINÁLE", "micro": "moss", "q": "Který obraz odpovídá tenkému lístku mechu s mnoha polygonálními zelenými buňkami?", "options": ["Pyl", "Lístek mechu", "Korek", "Trepka"], "correct": 1, "explanation": "Jednoduché mechové lístky jsou tenké a jejich buněčná síť může být v mikroskopu dobře viditelná."}, {"zone": "FINÁLE", "micro": "trichome", "q": "Jak se nazývá vlasovitý útvar vyrůstající z povrchu rostlinného orgánu?", "options": ["Trichom (rostlinný chlup)", "Průduch", "Hyfa", "Bičík"], "correct": 0, "explanation": "Trichomy jsou epidermální výrůstky rostlin, často dobře viditelné v lupě nebo mikroskopu."}];
let idx=0,score=0,answered=false;
const qEl=document.getElementById('question'), aEl=document.getElementById('answers'), fbEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), progressText=document.getElementById('progressText'), zoneTag=document.getElementById('zoneTag'), quizArea=document.getElementById('quizArea'), resultArea=document.getElementById('resultArea'), scoreOut=document.getElementById('scoreOut'), bandOut=document.getElementById('bandOut'), restartBtn=document.getElementById('restartBtn');
function render(){answered=false;nextBtn.disabled=true;fbEl.classList.remove('show');const q=questions[idx];zoneTag.textContent=q.zone;progressText.textContent=`${idx+1} / ${questions.length}`;qEl.textContent=q.q;document.getElementById('visual').innerHTML=microSvg(q.micro);document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i<idx));;aEl.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;b.onclick=()=>choose(i);aEl.appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[idx];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.add('locked');if(i===q.correct)b.classList.add('correct');if(i===choice&&i!==q.correct)b.classList.add('wrong');});const ok=choice===q.correct;if(ok)score++;fbEl.innerHTML=`<strong>${ok?'Správně.':'Tentokrát ne.'}</strong> ${q.explanation}`;fbEl.classList.add('show');nextBtn.disabled=false;}
nextBtn.onclick=()=>{idx++;if(idx>=questions.length)finish();else render();};
function finish(){quizArea.style.display='none';resultArea.style.display='block';scoreOut.textContent=`${score} / ${questions.length}`;let text='Dobrá práce.';if(score<=5)text='Tenhle svět vás trochu potrápil, ale o to víc jste si z něj odnesli.';else if(score<=10)text='Solidní výsledek. Většinu situací jste zvládli bez většího zaváhání.';else if(score<=13)text='Velmi dobré. V tomhle tématu se orientujete opravdu jistě.';else text='Výborně. Tohle už je skoro bezchybný průchod celým kvízem.';bandOut.textContent=text;document.querySelectorAll('.slide').forEach(s=>s.classList.add('on')); }
restartBtn.onclick=()=>{idx=0;score=0;quizArea.style.display='block';resultArea.style.display='none';document.querySelectorAll('.answer').forEach(x=>x.classList.remove('locked'));render();};
render();
</script></body></html>
