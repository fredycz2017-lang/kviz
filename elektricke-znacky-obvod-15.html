<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: Rezistor, spínač, dioda. Přečtete 15 značek elektrického obvodu?</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#17202a;color:#eaf6ff;font-family:Arial,sans-serif;overflow-x:hidden}body{padding:14px;background:radial-gradient(circle at 20% 0,#27445c,#111922 58%)}.bench{max-width:1220px;margin:auto;border:1px solid #66869d;background:#0d1720;box-shadow:0 24px 70px #0009;border-radius:20px;overflow:hidden}header{padding:20px 24px;background:#132a3b;border-bottom:1px solid #42677f}.kicker{color:#68d5ff;font-weight:900;letter-spacing:.15em;font-size:12px}h1{font-size:clamp(27px,4vw,48px);line-height:1.04;margin:5px 0 8px}header p{color:#b8ccda;margin:0;max-width:900px;line-height:1.45}.work{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px}.breadboard{background:#f2f4ef;color:#1b2730;border-radius:14px;padding:15px;box-shadow:inset 0 0 0 2px #bfc9c6}.breadboard h2{font-size:12px;letter-spacing:.12em}.leds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.led{height:48px;border-radius:8px;background:repeating-linear-gradient(90deg,#e4e9e6 0 8px,#d7dfdc 8px 9px);border:1px solid #b4bfbc;position:relative}.led:after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#8b9691;box-shadow:0 0 0 3px #c9d1ce}.led.done:after{background:#37e47f;box-shadow:0 0 12px #37e47f}.panel{background:#10212e;border:1px solid #335168;border-radius:14px;padding:16px;min-width:0}.progress{font-weight:900;color:#77dcff}.schematic{margin:12px 0;min-height:280px;background:#dceaf0;border-radius:10px;display:grid;place-items:center;border:2px solid #7796a8;position:relative}.schematic:before{content:"SCHÉMA 13/10";position:absolute;left:12px;top:10px;color:#5a6c76;font:700 11px monospace}.schematic svg{max-width:720px;width:100%;height:250px}.q{font-size:24px;font-weight:900;margin:8px 0 12px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{background:#183245;border:1px solid #4f7287;color:#fff;padding:13px;text-align:left;border-radius:9px;font-weight:800;cursor:pointer;min-height:58px}.answer.good{background:#153f2b;border-color:#57dc8f}.answer.bad{background:#52242b;border-color:#ff7787}.feedback{display:none;background:#152a38;border-left:5px solid #65d4ff;padding:12px;margin-top:12px;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:12px 0 0 auto;border:0;background:#47b9e6;color:#08202c;padding:12px 18px;font-weight:1000;border-radius:8px}.result{display:none;text-align:center;padding:55px 20px}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#62d8ff}.restart{border:0;background:#47b9e6;padding:13px 19px;font-weight:900}@media(max-width:780px){body{padding:5px}.work{grid-template-columns:1fr;padding:8px}.breadboard{padding:9px}.leds{grid-template-columns:repeat(5,1fr)}.led{height:31px}.panel{padding:10px}.schematic{min-height:210px}.schematic svg{height:195px}.answers{grid-template-columns:1fr}}
</style></head><body><div class="bench"><header><div class="kicker">ŠKOLNÍ ELEKTROLAB // BEZ VÝPOČTŮ</div><h1>Rezistor, spínač, dioda. Přečtete 15 značek elektrického obvodu?</h1><p>Jedna značka se pokaždé zvýrazní na školním schématu. Určujete pouze význam symbolu — žádný Ohmův zákon a žádné počítání.</p></header><div class="work"><aside class="breadboard"><h2>TESTOVACÍ DESKA</h2><div class="leds" id="leds"></div></aside><main class="panel"><section id="quiz"><div class="progress" id="prog"></div><div class="schematic" id="scene"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button id="next" class="next">ZAPOJIT DALŠÍ →</button></section><section id="result" class="result"><h2>OBVOD DOKONČEN</h2><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">NOVÉ SCHÉMA</button></section></main></div></div><script>
const questions=[{"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Baterie článků", "Elektrický článek", "Kondenzátor", "Pojistka"], "c": 1, "e": "Jedna delší a jedna kratší rovnoběžná čára značí jeden elektrický článek.", "v": "cell", "name": "Elektrický článek"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Elektrický článek", "Kondenzátor", "Rezistor", "Baterie článků"], "c": 3, "e": "Opakování dlouhé a krátké čáry značí baterii tvořenou více články.", "v": "battery", "name": "Baterie článků"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Rezistor", "Pojistka", "Kondenzátor", "Cívka / induktor"], "c": 0, "e": "V IEC/evropském školním zápisu se rezistor běžně kreslí jako obdélník v vodiči.", "v": "resistor", "name": "Rezistor"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Rezistor", "Dioda", "Proměnný rezistor", "Otevřený spínač"], "c": 2, "e": "Proměnný rezistor kombinuje značku rezistoru se šikmou šipkou.", "v": "varres", "name": "Proměnný rezistor"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Sepnutý spínač", "Otevřený spínač", "Pojistka", "Rezistor"], "c": 1, "e": "Rozpojené kontakty s mezerou ukazují otevřený spínač.", "v": "switch-open", "name": "Otevřený spínač"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Sepnutý spínač", "Otevřený spínač", "Dioda", "Pojistka"], "c": 0, "e": "Dotýkající se kontakty ukazují sepnutý spínač.", "v": "switch-closed", "name": "Sepnutý spínač"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Elektromotor", "Ampérmetr", "Voltmetr", "Žárovka"], "c": 3, "e": "Kruh s křížem je běžná školní značka žárovky.", "v": "lamp", "name": "Žárovka"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Rezistor", "Kondenzátor", "Pojistka", "Dioda"], "c": 2, "e": "Pojistka se ve školních schématech kreslí jako malý obdélníkový prvek vložený do vodiče.", "v": "fuse", "name": "Pojistka"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Dioda", "LED", "Pojistka", "Kondenzátor"], "c": 0, "e": "Dioda má anodu na straně „hrotu“ a katodu vyznačenou svislou čarou.", "v": "diode", "name": "Dioda"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Dioda", "LED", "Žárovka", "Fotoodpor"], "c": 1, "e": "LED je dioda doplněná dvěma šipkami směřujícími ven – vyzařované světlo.", "v": "led", "name": "LED"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Elektrický článek", "Rezistor", "Pojistka", "Kondenzátor"], "c": 3, "e": "Dvě rovnoběžné desky proti sobě představují kondenzátor.", "v": "capacitor", "name": "Kondenzátor"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Rezistor", "Kondenzátor", "Cívka / induktor", "Baterie článků"], "c": 2, "e": "Série oblouků / závitů ve vodiči představuje cívku neboli induktor.", "v": "inductor", "name": "Cívka / induktor"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Žárovka", "Elektromotor", "Ampérmetr", "Voltmetr"], "c": 1, "e": "Kruh s písmenem M značí elektromotor.", "v": "motor", "name": "Elektromotor"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Ampérmetr", "Voltmetr", "Elektromotor", "Žárovka"], "c": 0, "e": "Kruh s písmenem A je ampérmetr pro měření elektrického proudu.", "v": "ammeter", "name": "Ampérmetr"}, {"q": "Co znamená zvýrazněná značka v elektrickém schématu?", "o": ["Ampérmetr", "Elektromotor", "Žárovka", "Voltmetr"], "c": 3, "e": "Kruh s písmenem V je voltmetr pro měření elektrického napětí.", "v": "voltmeter", "name": "Voltmetr"}];let i=0,score=0,locked=false;const leds=document.getElementById('leds');for(let n=0;n<15;n++){let d=document.createElement('div');d.className='led';d.id='l'+n;leds.appendChild(d)}
function symbol(v){const L='#1f2a30',H='#e43f4b';let inner='';if(v==='cell')inner=`<line x1='120' y1='125' x2='270' y2='125' stroke='${L}' stroke-width='5'/><line x1='270' y1='80' x2='270' y2='170' stroke='${H}' stroke-width='8'/><line x1='310' y1='98' x2='310' y2='152' stroke='${H}' stroke-width='5'/><line x1='310' y1='125' x2='500' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='battery')inner=`<line x1='90' y1='125' x2='190' y2='125' stroke='${L}' stroke-width='5'/><g stroke='${H}'><line x1='200' y1='76' x2='200' y2='174' stroke-width='8'/><line x1='235' y1='98' x2='235' y2='152' stroke-width='5'/><line x1='275' y1='76' x2='275' y2='174' stroke-width='8'/><line x1='310' y1='98' x2='310' y2='152' stroke-width='5'/></g><line x1='310' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='resistor')inner=`<line x1='90' y1='125' x2='210' y2='125' stroke='${L}' stroke-width='5'/><rect x='210' y='98' width='190' height='54' fill='none' stroke='${H}' stroke-width='7'/><line x1='400' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='varres')inner=`<line x1='90' y1='125' x2='210' y2='125' stroke='${L}' stroke-width='5'/><rect x='210' y='98' width='190' height='54' fill='none' stroke='${H}' stroke-width='7'/><line x1='400' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/><line x1='350' y1='55' x2='280' y2='180' stroke='${H}' stroke-width='6'/><polygon points='274,180 292,164 298,184' fill='${H}'/>`;if(v==='switch-open')inner=`<line x1='100' y1='125' x2='230' y2='125' stroke='${L}' stroke-width='5'/><circle cx='240' cy='125' r='8' fill='${H}'/><circle cx='400' cy='125' r='8' fill='${H}'/><line x1='246' y1='120' x2='365' y2='68' stroke='${H}' stroke-width='7'/><line x1='410' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='switch-closed')inner=`<line x1='100' y1='125' x2='230' y2='125' stroke='${L}' stroke-width='5'/><circle cx='240' cy='125' r='8' fill='${H}'/><circle cx='400' cy='125' r='8' fill='${H}'/><line x1='248' y1='125' x2='392' y2='125' stroke='${H}' stroke-width='7'/><line x1='410' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='lamp')inner=`<line x1='90' y1='125' x2='235' y2='125' stroke='${L}' stroke-width='5'/><circle cx='320' cy='125' r='72' fill='none' stroke='${H}' stroke-width='7'/><line x1='272' y1='77' x2='368' y2='173' stroke='${H}' stroke-width='6'/><line x1='368' y1='77' x2='272' y2='173' stroke='${H}' stroke-width='6'/><line x1='392' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='fuse')inner=`<line x1='90' y1='125' x2='215' y2='125' stroke='${L}' stroke-width='5'/><rect x='215' y='105' width='200' height='40' fill='none' stroke='${H}' stroke-width='6'/><line x1='230' y1='125' x2='400' y2='125' stroke='${H}' stroke-width='4'/><line x1='415' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='diode'||v==='led')inner=`<line x1='90' y1='125' x2='235' y2='125' stroke='${L}' stroke-width='5'/><polygon points='240,75 240,175 345,125' fill='none' stroke='${H}' stroke-width='7'/><line x1='350' y1='72' x2='350' y2='178' stroke='${H}' stroke-width='7'/><line x1='350' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`+(v==='led'?`<g stroke='${H}' stroke-width='5' fill='${H}'><line x1='360' y1='75' x2='425' y2='30'/><polygon points='425,30 410,33 420,45'/><line x1='385' y1='100' x2='450' y2='55'/><polygon points='450,55 435,58 445,70'/></g>`:'');if(v==='capacitor')inner=`<line x1='90' y1='125' x2='270' y2='125' stroke='${L}' stroke-width='5'/><line x1='280' y1='65' x2='280' y2='185' stroke='${H}' stroke-width='8'/><line x1='340' y1='65' x2='340' y2='185' stroke='${H}' stroke-width='8'/><line x1='340' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(v==='inductor')inner=`<line x1='80' y1='125' x2='180' y2='125' stroke='${L}' stroke-width='5'/><path d='M180 125 q25 -70 50 0 q25 -70 50 0 q25 -70 50 0 q25 -70 50 0' fill='none' stroke='${H}' stroke-width='7'/><line x1='380' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`;if(['motor','ammeter','voltmeter'].includes(v)){let ch=v==='motor'?'M':v==='ammeter'?'A':'V';inner=`<line x1='90' y1='125' x2='235' y2='125' stroke='${L}' stroke-width='5'/><circle cx='320' cy='125' r='72' fill='none' stroke='${H}' stroke-width='7'/><text x='320' y='150' text-anchor='middle' font-size='72' font-weight='900' fill='${H}'>${ch}</text><line x1='392' y1='125' x2='520' y2='125' stroke='${L}' stroke-width='5'/>`}return `<svg viewBox='0 0 610 250' xmlns='http://www.w3.org/2000/svg'>${inner}</svg>`}
function show(){locked=false;let x=questions[i];document.getElementById('prog').textContent=`ZNAČKA ${i+1} / 15`;document.getElementById('scene').innerHTML=symbol(x.v);document.getElementById('q').textContent=x.q;let a=document.getElementById('answers');a.innerHTML='';x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=k;b.textContent=t;b.onclick=()=>answer(k);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});if(ok)score++;document.getElementById('l'+i).classList.add('done');let f=document.getElementById('fb');f.className='feedback show';f.textContent=x.e;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<questions.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=`${score} / 15`;document.getElementById('res').textContent=score>=13?'Schéma čtete skoro bez zaváhání.':score>=9?'Solidní orientace ve školních značkách.':'Breadboard zůstal místy ve tmě — zkuste druhý průchod.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.led').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
