<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: ≠, ≥, √, ∞. Přeložíte 15 matematických symbolů do normální češtiny?</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#d8caa7;color:#f4f1df;font-family:Arial,sans-serif;overflow-x:hidden}body{padding:12px;background:linear-gradient(135deg,#7b633b,#bda774)}.board{max-width:1080px;margin:auto;background:#183d32;border:14px solid #6b4928;border-radius:8px;box-shadow:0 24px 65px #3c2a18;min-height:660px;position:relative;overflow:hidden}.board:after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff2 1px,transparent 1px);background-size:7px 7px;opacity:.12}header{padding:18px 22px;border-bottom:2px solid #ffffff33;position:relative;z-index:1}.k{font:900 12px monospace;letter-spacing:.15em;color:#e2d5a5}h1{font-size:clamp(25px,4vw,45px);line-height:1.04;margin:4px 0 6px;font-family:Georgia,serif}header p{margin:0;color:#d8e7da;max-width:900px;line-height:1.45}.wrap{display:grid;grid-template-columns:185px 1fr;gap:14px;padding:14px;position:relative;z-index:1}.dict,.task{border:1px solid #ffffff2a;padding:12px;border-radius:8px;background:#0d2c2466}.dict h2{font-size:11px;letter-spacing:.12em;margin-top:0}.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mark{height:35px;border:1px solid #ffffff26;display:grid;place-items:center;font:bold 10px monospace;color:#9db7a8}.mark.done{background:#d1c275;color:#173528}.hud{display:flex;justify-content:space-between;font:900 12px monospace;color:#e7dcae}.symbol{height:230px;display:grid;place-items:center;font-family:Georgia,serif;font-size:150px;text-shadow:0 0 2px #fff;margin:5px 0 8px}.q{font-size:22px;font-weight:900;margin:0 0 10px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{background:transparent;color:#fffbe9;border:2px solid #d8d0a255;border-radius:5px;padding:12px;text-align:left;font-weight:900;cursor:pointer}.answer.good{background:#315f3e;border-color:#bfe48b}.answer.bad{background:#6a302e;border-color:#f6a194}.feedback{display:none;margin-top:10px;padding:10px 12px;border-left:5px solid #e0cf79;background:#102f27;line-height:1.4}.feedback.show{display:block}.next{display:none;margin:10px 0 0 auto;border:0;background:#e0cf79;color:#19382e;padding:10px 15px;font-weight:1000;border-radius:5px}.result{display:none;text-align:center;padding:62px 20px;position:relative;z-index:1}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#e0cf79}.restart{border:0;background:#e0cf79;color:#17392e;padding:11px 17px;border-radius:5px;font-weight:1000}@media(max-width:760px){body{padding:4px}.board{border-width:7px}.wrap{grid-template-columns:1fr;padding:8px}.dict{display:none}.symbol{height:175px;font-size:115px}.answers{grid-template-columns:1fr}}
</style></head><body><div class="board"><header><div class="k">MATEMATICKÝ DEKODÉR // 15 ZNAKŮ</div><h1>Kvíz ze školy: ≠, ≥, √, ∞. Přeložíte 15 matematických symbolů do normální češtiny?</h1><p>Bez počítání. Jediný úkol: přečíst symbol tak, jak se používá v běžné školní matematice.</p></header><div class="wrap"><aside class="dict"><h2>DEKÓDOVANÉ ZNAKY</h2><div class="marks" id="marks"></div></aside><main class="task"><section id="quiz"><div class="hud"><span id="prog"></span><span>TABULE: PŘIPRAVENA</span></div><div class="symbol" id="symbol"></div><div class="q">Co tento symbol znamená?</div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">DALŠÍ ZNAK →</button></section><section id="result" class="result"><h2>SLOVNÍK DOKONČEN</h2><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">NOVÁ TABULE</button></section></main></div></div><script>
const questions=[{"sym":"≠","o":["rovná se","nerovná se","přibližně se rovná","je větší než"],"c":1,"e":"Symbol ≠ znamená „nerovná se“."},{"sym":"≥","o":["větší nebo rovno","menší nebo rovno","větší než","přibližně rovno"],"c":0,"e":"≥ znamená „větší než nebo rovno“."},{"sym":"≤","o":["větší nebo rovno","menší než","menší nebo rovno","rovná se"],"c":2,"e":"≤ znamená „menší než nebo rovno“."},{"sym":"√","o":["absolutní hodnota","druhá odmocnina","součet","nekonečno"],"c":1,"e":"Znak √ označuje druhou odmocninu (radikál)."},{"sym":"∞","o":["nekonečno","nula","součin","promile"],"c":0,"e":"∞ je symbol nekonečna."},{"sym":"π","o":["Eulerovo číslo","zlatý řez","pí","procento"],"c":2,"e":"π označuje číslo pí."},{"sym":"∑","o":["součet členů","součin členů","odmocninu","průměr"],"c":0,"e":"Velké řecké sigma ∑ se používá jako symbol sumace, tedy součtu."},{"sym":"∈","o":["je kolmé k","náleží do množiny","je rovnoběžné s","nenáleží do množiny"],"c":1,"e":"∈ znamená, že prvek náleží do množiny."},{"sym":"∉","o":["náleží do množiny","je podmnožinou","nenáleží do množiny","je přibližně rovno"],"c":2,"e":"∉ znamená, že prvek do dané množiny nenáleží."},{"sym":"∥","o":["je kolmé k","je rovnoběžné s","je totožné s","je větší než"],"c":1,"e":"∥ označuje rovnoběžnost přímek nebo úseček."},{"sym":"⊥","o":["je rovnoběžné s","je přibližně rovno","je kolmé k","je prvkem"],"c":2,"e":"⊥ označuje kolmost."},{"sym":"≈","o":["nerovná se","přibližně se rovná","je větší nebo rovno","je úměrné"],"c":1,"e":"≈ znamená „přibližně se rovná“."},{"sym":"±","o":["plus nebo minus","násobení","rozdíl množin","absolutní hodnota"],"c":0,"e":"± se čte „plus minus“ a vyjadřuje dvě možné znaménkové varianty nebo toleranci podle kontextu."},{"sym":"%","o":["promile","procento","stupeň","zlomek"],"c":1,"e":"% je znak procenta: setiny celku."},{"sym":"‰","o":["procento","promile","perioda","přibližně"],"c":1,"e":"‰ je promile: tisícina celku."}];window.__QUIZ={questions};let i=0,score=0,locked=false;let m=document.getElementById('marks');questions.forEach((_,n)=>{let x=document.createElement('div');x.className='mark';x.id='m'+n;x.textContent=n+1;m.appendChild(x)});function show(){locked=false;let x=questions[i];document.getElementById('prog').textContent=`ZNAK ${i+1} / 15`;document.getElementById('symbol').textContent=x.sym;let a=document.getElementById('answers');a.innerHTML='';x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=k;b.textContent=t;b.onclick=()=>answer(k);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;if(ok)score++;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});document.getElementById('m'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=x.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<15?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=`${score} / 15`;document.getElementById('res').textContent=score>=13?'Matematickou tabuli překládáte plynně.':score>=9?'Základní symboly máte pevné, pár značek ještě zdržuje.':'Dekodér chce ještě jednu směnu.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.mark').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();</script></body></html>
