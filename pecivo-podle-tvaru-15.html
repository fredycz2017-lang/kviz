<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Rohlík, veka, preclík. Poznáte 15 druhů pečiva jen podle tvaru?</title><style>
*{box-sizing:border-box}body{margin:0;background:#3a2415;color:#362115;font-family:Arial,sans-serif;background-image:linear-gradient(90deg,#ffffff05 50%,transparent 50%);background-size:34px 34px}.bakery{max-width:1180px;margin:14px auto;background:#f5e1b9;border:9px solid #6c3e20;box-shadow:0 28px 70px #0008}header{background:#8b4c27;color:#fff0d1;padding:20px 24px;border-bottom:5px solid #c98b45}.kicker{font-size:12px;letter-spacing:.18em;font-weight:900;color:#ffd895}h1{font:900 clamp(28px,4vw,49px)/1.03 Georgia,serif;margin:5px 0}header p{max-width:900px;line-height:1.45;margin:0;color:#f4dcb5}.shop{display:grid;grid-template-columns:260px 1fr;min-height:680px}.rack{background:#734220;padding:14px;border-right:6px solid #4c2a16}.rack h2{font-size:12px;letter-spacing:.14em;color:#f1cf92}.slots{display:grid;grid-template-columns:1fr 1fr;gap:7px}.slot{height:66px;background:#4e2b16;border:2px solid #b77a3d;position:relative;color:#bfa077;font-size:10px;padding:4px}.slot:after{content:"";position:absolute;left:8px;right:8px;bottom:9px;height:14px;background:#c89858;border-radius:50%}.slot.done{background:#5b5d2e;color:#f3e7b6}.counter{padding:20px;background:repeating-linear-gradient(0deg,#e9c994 0 22px,#e2bd83 22px 44px)}.ticket{max-width:780px;margin:auto;background:#fff5df;border:1px solid #b88750;box-shadow:7px 8px 0 #9a6234;padding:16px}.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:#986f3f}.tray{height:300px;margin:12px 0;background:#66564b;border:12px solid #a58d76;box-shadow:inset 0 0 0 5px #4e443d;display:flex;align-items:center;justify-content:center}.tray svg{width:96%;height:275px}.q{font-size:23px;font-weight:900;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{background:#fffaf0;border:2px solid #b4844d;padding:13px;text-align:left;font-weight:800;cursor:pointer}.answer.good{background:#e2efc9;border-color:#718b3d}.answer.bad{background:#f3d2c4;border-color:#a44b39}.feedback{display:none;background:#f7e6c5;border-left:5px solid #a56c32;margin-top:12px;padding:12px;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:12px 0 0 auto;background:#81441f;color:white;border:0;padding:12px 17px;font-weight:900}.result{display:none;text-align:center;padding:70px 20px;background:#fff1d2}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#8a4b23}.restart{padding:12px 18px;background:#81441f;color:#fff;border:0;font-weight:900}@media(max-width:760px){.shop{grid-template-columns:1fr}.rack{border-right:0;border-bottom:6px solid #4c2a16}.slots{grid-template-columns:repeat(5,1fr)}.slot{height:40px}.slot:after{height:8px}.counter{padding:10px}.tray{height:235px}.tray svg{height:215px}.answers{grid-template-columns:1fr}}@media(max-width:430px){.bakery{margin:3px;border-width:4px}.slots{grid-template-columns:repeat(3,1fr)}.ticket{padding:10px}}
</style></head><body><div class="bakery"><header><div class="kicker">PEKAŘSKÝ REGÁL // TVAROVÁ POZNÁVAČKA</div><h1>Rohlík, veka, preclík. Poznáte 15 druhů pečiva jen podle tvaru?</h1><p>Žádný obal, cenovka ani vůně. Na plechu zůstává jen stylizovaný tvar — a ten musí stačit k rozhodnutí.</p></header><div class="shop"><aside class="rack"><h2>REGÁL // 15 POZIC</h2><div class="slots" id="slots"></div></aside><main class="counter"><div id="quiz" class="ticket"><div class="meta"><span id="prog"></span><span>PLECH 13/10</span></div><div id="tray" class="tray"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="fb" class="feedback"></div><button id="next" class="next">DALŠÍ PLECH →</button></div><section id="result" class="result"><div>REGÁL ZAPLNĚN</div><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">ZPĚT DO PEKÁRNY</button></section></main></div></div><script>
const questions=[{"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Croissant", "Rohlík", "Bageta", "Preclík"], "c": 1, "e": "Český rohlík má typický zahnutý, protáhlý tvar bez vrstvených „rohů“ croissantu.", "v": "roll", "name": "Rohlík"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Veka", "Bageta", "Ciabatta", "Focaccia"], "c": 0, "e": "Veka je delší hladký bochník, obvykle širší a měkčí než klasická bageta.", "v": "veka", "name": "Veka"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Veka", "Ciabatta", "Naan", "Bageta"], "c": 3, "e": "Bageta je dlouhá úzká šiška s typickým podélným profilem a zářezy.", "v": "baguette", "name": "Bageta"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Bagel", "Donut", "Preclík", "Rohlík"], "c": 2, "e": "Preclík poznáte podle charakteristického uzlového tvaru se dvěma oky.", "v": "pretzel", "name": "Preclík"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Croissant", "Rohlík", "Loupák", "Veka"], "c": 0, "e": "Croissant je vrstvený půlměsíc s výraznými segmenty těsta.", "v": "croissant", "name": "Croissant"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Donut", "Mazanec", "Kaiserka", "Kobliha"], "c": 3, "e": "Kobliha je kulatá smažená bulka bez středového otvoru, často plněná.", "v": "doughnutsolid", "name": "Kobliha"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Bagel", "Donut", "Preclík", "Kobliha"], "c": 1, "e": "Donut v klasickém prstencovém provedení má uprostřed otvor a hladký kulatý tvar.", "v": "donut", "name": "Donut"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Ciabatta", "Veka", "Vánočka", "Focaccia"], "c": 2, "e": "Vánočku prozradí výrazně pletený podlouhlý bochník.", "v": "vanocka", "name": "Vánočka"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Mazanec", "Kobliha", "Pita", "Kaiserka"], "c": 0, "e": "Mazanec je kulatý klenutý bochník, často s křížovým naříznutím nahoře.", "v": "mazanec", "name": "Mazanec"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Naan", "Focaccia", "Ciabatta", "Pita"], "c": 3, "e": "Pita je plochý kulatý chléb, který při pečení může vytvořit kapsu.", "v": "pita", "name": "Pita"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Pita", "Focaccia", "Ciabatta", "Veka"], "c": 1, "e": "Focaccia je nízký plochý chléb, často obdélný, s typickými důlky po prstech.", "v": "focaccia", "name": "Focaccia"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Donut", "Preclík", "Bagel", "Kobliha"], "c": 2, "e": "Bagel je hutný kruhový chléb s otvorem, obvykle bez sladké polevy.", "v": "bagel", "name": "Bagel"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Ciabatta", "Veka", "Focaccia", "Bageta"], "c": 0, "e": "Ciabatta má nízký podlouhlý, lehce nepravidelný „pantoflový“ tvar.", "v": "ciabatta", "name": "Ciabatta"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Kobliha", "Mazanec", "Pita", "Kaiserka"], "c": 3, "e": "Kaiserka je kulatá žemle s nápadným hvězdicovým členěním na povrchu.", "v": "kaiser", "name": "Kaiserka"}, {"q": "Který druh pečiva nebo chleba leží na plechu?", "o": ["Pita", "Naan", "Focaccia", "Veka"], "c": 1, "e": "Naan bývá plochý oválný až kapkovitý chléb s nepravidelně bublinkovým povrchem.", "v": "naan", "name": "Naan"}];let i=0,score=0,locked=false;const slots=document.getElementById('slots');for(let n=0;n<15;n++){let s=document.createElement('div');s.className='slot';s.id='s'+n;s.textContent=String(n+1).padStart(2,'0');slots.appendChild(s)}function bread(v){const C='#d59a45',D='#865628',H='#f0c978';let x='';if(v==='roll')x=`<path d='M170 170 Q300 55 470 160 Q410 235 300 215 Q220 215 170 170Z' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M210 155 Q300 95 425 150' fill='none' stroke='${H}' stroke-width='10'/>`;if(v==='veka')x=`<rect x='150' y='105' width='340' height='115' rx='57' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M220 120 l-28 70 M300 112 l-20 88 M380 115 l-16 80' stroke='${H}' stroke-width='10'/>`;if(v==='baguette')x=`<rect x='95' y='125' width='450' height='72' rx='36' fill='${C}' stroke='${D}' stroke-width='8'/><path d='M185 125 l-30 70 M280 125 l-30 70 M375 125 l-30 70 M470 125 l-30 70' stroke='${H}' stroke-width='8'/>`;if(v==='pretzel')x=`<path d='M195 205 C110 95 235 65 315 155 C395 65 520 95 445 205 C390 250 350 220 315 185 C280 220 245 250 195 205Z M165 225 Q315 135 475 225' fill='none' stroke='${C}' stroke-width='34' stroke-linecap='round'/>`;if(v==='croissant')x=`<path d='M150 195 Q315 20 490 185 Q425 245 340 205 Q315 190 290 205 Q215 245 150 195Z' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M225 135 l35 85 M300 95 l18 105 M380 120 l-24 95' stroke='${H}' stroke-width='8'/>`;if(v==='doughnutsolid')x=`<circle cx='320' cy='165' r='105' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M235 155 Q320 105 405 155' fill='none' stroke='#e9ad91' stroke-width='26'/><circle cx='260' cy='130' r='4' fill='#fff'/><circle cx='330' cy='120' r='4' fill='#fff'/><circle cx='380' cy='150' r='4' fill='#fff'/>`;if(v==='donut')x=`<circle cx='320' cy='165' r='110' fill='${C}' stroke='${D}' stroke-width='9'/><circle cx='320' cy='165' r='42' fill='#66564b' stroke='${D}' stroke-width='8'/><path d='M230 145 Q320 95 410 145' fill='none' stroke='#d98993' stroke-width='28'/>`;if(v==='vanocka')x=`<g fill='none' stroke='${C}' stroke-width='42' stroke-linecap='round'><path d='M160 205 Q240 90 320 205 Q400 90 480 205'/><path d='M185 215 Q265 120 345 215 Q415 135 455 210'/></g><path d='M170 225 H470' stroke='${D}' stroke-width='8'/>`;if(v==='mazanec')x=`<path d='M165 215 Q185 65 320 55 Q455 65 475 215Z' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M270 95 l100 100 M370 95 l-100 100' stroke='${H}' stroke-width='10'/>`;if(v==='pita')x=`<ellipse cx='320' cy='165' rx='170' ry='105' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M175 175 Q320 120 465 175' fill='none' stroke='${H}' stroke-width='8'/>`;if(v==='focaccia')x=`<rect x='135' y='80' width='370' height='175' rx='24' fill='${C}' stroke='${D}' stroke-width='9'/><g fill='#9f6d32'>`+[[190,125],[270,120],[355,130],[440,120],[220,190],[320,185],[420,195]].map(([x,y])=>`<circle cx='${x}' cy='${y}' r='12'/>`).join('')+`</g>`;if(v==='bagel')x=`<ellipse cx='320' cy='165' rx='150' ry='110' fill='${C}' stroke='${D}' stroke-width='9'/><ellipse cx='320' cy='165' rx='55' ry='42' fill='#66564b' stroke='${D}' stroke-width='8'/><g fill='#f0dfb0'>`+Array.from({length:14},(_,k)=>{let a=k*0.43;return `<ellipse cx='${(320+110*Math.cos(a)).toFixed(1)}' cy='${(165+78*Math.sin(a)).toFixed(1)}' rx='6' ry='3'/>`}).join('')+`</g>`;if(v==='ciabatta')x=`<path d='M145 110 Q195 70 250 95 Q320 65 380 92 Q455 70 505 120 L490 220 Q420 245 350 225 Q275 250 205 225 Q165 220 145 110Z' fill='${C}' stroke='${D}' stroke-width='9'/><g fill='${H}' opacity='.65'><ellipse cx='240' cy='150' rx='24' ry='10'/><ellipse cx='345' cy='125' rx='30' ry='11'/><ellipse cx='415' cy='180' rx='25' ry='9'/></g>`;if(v==='kaiser')x=`<circle cx='320' cy='165' r='112' fill='${C}' stroke='${D}' stroke-width='9'/><path d='M320 165 L320 62 M320 165 L418 133 M320 165 L381 248 M320 165 L259 248 M320 165 L222 133' stroke='${H}' stroke-width='12' stroke-linecap='round'/>`;if(v==='naan')x=`<path d='M205 235 Q145 130 250 65 Q390 15 450 115 Q500 205 390 245 Q295 275 205 235Z' fill='${C}' stroke='${D}' stroke-width='9'/><g fill='#9a622c'>`+[[240,130],[315,105],[390,145],[280,205],[360,210]].map(([x,y])=>`<ellipse cx='${x}' cy='${y}' rx='14' ry='9'/>`).join('')+`</g>`;return `<svg viewBox='0 0 640 320' xmlns='http://www.w3.org/2000/svg'><ellipse cx='320' cy='275' rx='230' ry='18' fill='#0002'/>${x}</svg>`}function show(){locked=false;let q=questions[i];document.getElementById('prog').textContent='KUS '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('tray').innerHTML=bread(q.v);document.getElementById('q').textContent=q.q;let a=document.getElementById('answers');a.innerHTML='';q.o.forEach((t,j)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=j;b.textContent=t;b.onclick=()=>pick(j);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function pick(j){if(locked)return;locked=true;let q=questions[i],ok=j===q.c;if(ok)score++;document.querySelectorAll('.answer').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');if(k===j&&k!==q.c)b.classList.add('bad')});document.getElementById('s'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=q.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<15?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('res').textContent=score>=13?'Pekařský regál byste popsali bez cenovek.':score>=9?'Většinu tvarů znáte, pár placek a kroužků umí mást.':'Bez obalu je pečivo překvapivě zákeřná geometrie.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
