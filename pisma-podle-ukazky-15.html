<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Řecké, cyrilice, arabské písmo. Poznáte 15 písem jen podle krátké ukázky?</title><style>*{box-sizing:border-box}body{margin:0;background:#ece9df;color:#17202a;font-family:Arial,"Noto Sans",sans-serif}.terminal{max-width:1180px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;border:3px double #273746;padding:14px;background:#f8f6ef}.tag{font:900 11px/1 monospace;letter-spacing:.16em}h1{font-size:31px;line-height:1.08;margin:7px 0 0;max-width:850px}#prog{font:900 30px monospace}.screen{margin-top:16px;border:10px solid #263238;border-radius:28px;background:#0b1515;padding:18px;box-shadow:inset 0 0 40px #000,0 16px 35px #0003}.display{min-height:220px;display:flex;align-items:center;justify-content:center;color:#8effb4;font-family:"Noto Sans","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Thai","Noto Sans Hebrew","Noto Sans Bengali",Arial,sans-serif;font-size:clamp(48px,8vw,92px);text-align:center;text-shadow:0 0 12px #35ff7755;letter-spacing:.04em;border:1px solid #294b3a;background:repeating-linear-gradient(0deg,#0d1915 0 3px,#0a1512 3px 6px);padding:25px}.q{font-size:22px;color:#d9f5e2;font-weight:900;margin:16px 0 10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{background:#12221c;border:1px solid #315a45;color:#eaffef;border-radius:4px;padding:13px;text-align:left;font-weight:800;font-size:16px;cursor:pointer}.opt:hover{border-color:#8effb4}.opt.ok{background:#183e2b;border-color:#8effb4}.opt.bad{background:#492227;border-color:#ff8c97}.fb{display:none;color:#dceee2;background:#0c1814;border:1px dashed #4d7c61;padding:12px;margin-top:11px;line-height:1.4}.next{display:none;margin:12px 0 0 auto;background:#8effb4;border:0;padding:11px 16px;font-weight:900}.modules{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:11px}.modules span{height:9px;background:#25352d}.modules span.done{background:#8effb4;box-shadow:0 0 8px #8effb4}.result{display:none;text-align:center;padding:55px 10px;color:#eaffef}.score{font-size:75px;font-weight:1000;color:#8effb4}.restart{background:#0b1515;color:#8effb4;border:1px solid #8effb4;padding:12px 18px;font-weight:900}.legend{font:12px monospace;color:#799585;margin-top:8px}@media(max-width:620px){header{display:block}#prog{margin-top:10px}.opts{grid-template-columns:1fr}.screen{padding:10px;border-width:7px}.display{min-height:170px;font-size:52px;padding:15px}h1{font-size:25px}}</style></head><body><div class="terminal"><header><div><div class="tag">TYPOGRAFICKÝ TERMINÁL // GLYPH SAMPLE</div><h1>Kvíz: Řecké, cyrilice, arabské písmo. Poznáte 15 písem jen podle krátké ukázky?</h1></div><div id="prog">01/15</div></header><main class="screen"><div id="quiz"><div class="display" id="sample"></div><div class="legend">IDENTIFIKUJTE PÍSMO, NE KONKRÉTNÍ JAZYK</div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">NAČÍST DALŠÍ MODUL →</button><div class="modules" id="mods"></div></div><section class="result" id="result"><div class="tag">VŠECHNY FONTOVÉ MODULY NAČTENY</div><div class="score" id="score"></div><h2 id="grade"></h2><button class="restart" id="restart">RESET TERMINÁLU</button></section></main></div><script>const Q=[{"sample":"Praha","q":"Jaký systém písma je na vzorku?","e":"Vzorek používá latinku – písmo, kterým je zapsána i čeština.","o":["Latinka","Cyrilice","Řecké písmo","Arménské písmo"],"a":0},{"sample":"Αθήνα","q":"Jaký systém písma je na vzorku?","e":"Znaky Α, θ nebo ή patří do řeckého písma.","o":["Latinka","Cyrilice","Gruzínské písmo","Řecké písmo"],"a":3},{"sample":"Москва","q":"Jaký systém písma je na vzorku?","e":"Vzorek je zapsán cyrilicí; stejný systém používá mimo jiné ruština.","o":["Latinka","Arménské písmo","Cyrilice","Řecké písmo"],"a":2},{"sample":"مرحبا","q":"Jaký systém písma je na vzorku?","e":"Arabské písmo se běžně zapisuje zprava doleva a znaky se často spojují.","o":["Thajské písmo","Arabské písmo","Hebrejské písmo","Dévanágarí"],"a":1},{"sample":"שלום","q":"Jaký systém písma je na vzorku?","e":"Vzorek používá hebrejské písmo, které se také zapisuje zprava doleva.","o":["Hebrejské písmo","Arabské písmo","Arménské písmo","Gruzínské písmo"],"a":0},{"sample":"თბილისი","q":"Jaký systém písma je na vzorku?","e":"Zaoblené znaky vzorku patří do moderní gruzínské abecedy.","o":["Arménské písmo","Řecké písmo","Cyrilice","Gruzínské písmo"],"a":3},{"sample":"Հայաստան","q":"Jaký systém písma je na vzorku?","e":"Vzorek používá arménské písmo, samostatný abecední systém.","o":["Cyrilice","Řecké písmo","Arménské písmo","Gruzínské písmo"],"a":2},{"sample":"भारत","q":"Jaký systém písma je na vzorku?","e":"Dévanágarí je snadno poznatelné podle výrazné horní horizontální linky spojující mnoho znaků.","o":["Arabské písmo","Dévanágarí","Bengálské písmo","Thajské písmo"],"a":1},{"sample":"ไทย","q":"Jaký systém písma je na vzorku?","e":"Vzorek používá thajské písmo s charakteristickými smyčkami a diakritikou.","o":["Thajské písmo","Dévanágarí","Bengálské písmo","Hangul"],"a":0},{"sample":"한국","q":"Jaký systém písma je na vzorku?","e":"Korejský hangul skládá základní písmena do čtvercových slabičných bloků.","o":["Han znaky","Katakana","Hiragana","Hangul"],"a":3},{"sample":"ひらがな","q":"Jaký systém písma je na vzorku?","e":"Hiragana je japonské slabičné písmo s převážně zaoblenými tahy.","o":["Hangul","Han znaky","Hiragana","Katakana"],"a":2},{"sample":"カタカナ","q":"Jaký systém písma je na vzorku?","e":"Katakana je japonské slabičné písmo s výrazněji hranatými a přímými tahy.","o":["Han znaky","Katakana","Hiragana","Hangul"],"a":1},{"sample":"中文","q":"Jaký systém písma je na vzorku?","e":"Vzorek tvoří znaky Han, logografický systém používaný mimo jiné v čínštině.","o":["Han znaky","Hangul","Katakana","Dévanágarí"],"a":0},{"sample":"አማርኛ","q":"Jaký systém písma je na vzorku?","e":"Vzorek patří do etiopského písma odvozeného od Ge’ez.","o":["Arabské písmo","Bengálské písmo","Arménské písmo","Etiopské písmo (Ge’ez)"],"a":3},{"sample":"বাংলা","q":"Jaký systém písma je na vzorku?","e":"Bengálské písmo má vlastní tvary a výraznou horní linii, ale liší se od dévanágarí.","o":["Thajské písmo","Gruzínské písmo","Bengálské písmo","Dévanágarí"],"a":2}];let i=0,score=0;for(let n=0;n<15;n++)mods.innerHTML+='<span></span>';function show(){const x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;sample.textContent=x.sample;q.textContent=x.q;opts.innerHTML='';x.o.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){const x=Q[i];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;mods.children[i].classList.add('done');fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'SYSTÉM ROZPOZNÁN.':'MODUL ODMÍTÁ IDENTIFIKACI.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('score').textContent=`${score} / 15`;grade.textContent=score>=13?'Typografický radar':score>=9?'Slušná orientace mezi písmy':'Glyphy chtějí druhý průchod'}restart.onclick=()=>{i=0;score=0;[...mods.children].forEach(x=>x.classList.remove('done'));result.style.display='none';quiz.style.display='block';show()};show();</script></body></html>
