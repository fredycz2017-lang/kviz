<h1>Kvíz: Cumulus, cirrus, stratus. Přečtete 15 oblačných scén podle tvaru a výšky?</h1><p class="lead">Deset rodů WMO, patnáct scén. Mrak dostane tvar a výškové patro; vy ho musíte poslat do správné části oblohy.</p>
<div class="hud"><div class="progress"><i id="bar"></i></div><div class="counter" id="counter">01 / 15</div></div>
<section class="card" id="game"><div id="sceneMeta" class="scene-meta"></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ →</button></section>
<section class="card result" id="result"><div class="eyebrow">HOTOVO</div><div class="score" id="score"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="restart" id="restart">HRÁT ZNOVU</button></section>
</main><script>
const Q=[{"q": "Tenké vláknité „peří“ ve vysoké hladině oblohy patří k rodu…", "a": "Cirrus", "w": ["Stratus", "Altocumulus", "Cumulus"], "v": "cirrus", "h": "vysoké patro", "meta": "ATLAS OBLOHY • 01", "explain": "Cirrus tvoří jemná vláknitá oblaka ve vysokém patře.", "options": ["Cirrus", "Stratus", "Altocumulus", "Cumulus"], "correct": 0}, {"q": "Drobné vysoké obláčky v pravidelných zrnkách či vlnkách jsou…", "a": "Cirrocumulus", "w": ["Stratocumulus", "Altostratus", "Nimbostratus"], "v": "cirrocumulus", "h": "vysoké patro", "meta": "ATLAS OBLOHY • 02", "explain": "Cirrocumulus patří mezi vysoká oblaka a tvoří drobné kupky či vlnky.", "options": ["Stratocumulus", "Cirrocumulus", "Altostratus", "Nimbostratus"], "correct": 1}, {"q": "Tenký vysoký závoj přes velkou část oblohy, někdy s halem kolem Slunce, je…", "a": "Cirrostratus", "w": ["Altostratus", "Stratus", "Cumulonimbus"], "v": "cirrostratus", "h": "vysoké patro", "meta": "ATLAS OBLOHY • 03", "explain": "Cirrostratus je vysoký průsvitný závoj; může souviset s halovými jevy.", "options": ["Altostratus", "Stratus", "Cirrostratus", "Cumulonimbus"], "correct": 2}, {"q": "Středně vysoké zaoblené kupky ve skupinách či pásech odpovídají rodu…", "a": "Altocumulus", "w": ["Cirrocumulus", "Stratocumulus", "Stratus"], "v": "altocumulus", "h": "střední patro", "meta": "ATLAS OBLOHY • 04", "explain": "Altocumulus se typicky objevuje ve středním patře jako skupiny či vrstvy zaoblených částí.", "options": ["Cirrocumulus", "Stratocumulus", "Stratus", "Altocumulus"], "correct": 3}, {"q": "Rozsáhlá šedavá střední vrstva, přes kterou může Slunce prosvítat jen tlumeně, je…", "a": "Altostratus", "w": ["Cirrostratus", "Nimbostratus", "Stratocumulus"], "v": "altostratus", "h": "střední patro", "meta": "ATLAS OBLOHY • 05", "explain": "Altostratus je rozsáhlá střední vrstva, často šedá či modrošedá.", "options": ["Cirrostratus", "Altostratus", "Nimbostratus", "Stratocumulus"], "correct": 1}, {"q": "Silná souvislá vrstva spojená s vytrvalými srážkami je nejčastěji…", "a": "Nimbostratus", "w": ["Cumulus", "Cirrus", "Stratus"], "v": "nimbostratus", "h": "střední, často přes více pater", "meta": "ATLAS OBLOHY • 06", "explain": "Nimbostratus bývá rozsáhlý a souvisí s dlouhotrvajícími plošnými srážkami.", "options": ["Cumulus", "Cirrus", "Stratus", "Nimbostratus"], "correct": 3}, {"q": "Nízká vrstva z velkých zaoblených částí, často s mezerami, je…", "a": "Stratocumulus", "w": ["Altocumulus", "Cirrocumulus", "Altostratus"], "v": "stratocumulus", "h": "nízké patro", "meta": "ATLAS OBLOHY • 07", "explain": "Stratocumulus je nízké vrstevnaté oblačno složené z větších valů či kup.", "options": ["Stratocumulus", "Altocumulus", "Cirrocumulus", "Altostratus"], "correct": 0}, {"q": "Nízká, poměrně jednotná šedá vrstva s rovnou základnou je…", "a": "Stratus", "w": ["Cumulus", "Altostratus", "Cirrus"], "v": "stratus", "h": "nízké patro", "meta": "ATLAS OBLOHY • 08", "explain": "Stratus vytváří nízkou, často jednotnou šedou vrstvu.", "options": ["Cumulus", "Altostratus", "Stratus", "Cirrus"], "correct": 2}, {"q": "Izolovaná bílá kupa s „květákovým“ vrškem a plochou základnou je…", "a": "Cumulus", "w": ["Cumulonimbus", "Stratus", "Cirrostratus"], "v": "cumulus", "h": "základna v nízkém patře", "meta": "ATLAS OBLOHY • 09", "explain": "Cumulus je kupovité oblačno s výrazným vertikálním růstem a plochou základnou.", "options": ["Cumulonimbus", "Stratus", "Cirrostratus", "Cumulus"], "correct": 3}, {"q": "Mohutný věžovitý mrak s kovadlinou ve vrcholu je…", "a": "Cumulonimbus", "w": ["Cumulus", "Nimbostratus", "Altocumulus"], "v": "cumulonimbus", "h": "od nízkého patra až vysoko", "meta": "ATLAS OBLOHY • 10", "explain": "Cumulonimbus má velký vertikální rozsah a vrchol může vytvořit kovadlinu.", "options": ["Cumulonimbus", "Cumulus", "Nimbostratus", "Altocumulus"], "correct": 0}, {"q": "Který z těchto rodů patří standardně do vysokého patra?", "a": "Cirrus", "w": ["Stratus", "Altocumulus", "Nimbostratus"], "v": "cirrus", "h": "výšková otázka", "meta": "ATLAS OBLOHY • 11", "explain": "WMO řadí Cirrus mezi vysoká oblaka.", "options": ["Stratus", "Altocumulus", "Cirrus", "Nimbostratus"], "correct": 2}, {"q": "Který rod se běžně vyskytuje ve středním patře?", "a": "Altocumulus", "w": ["Cirrus", "Stratus", "Cumulus"], "v": "altocumulus", "h": "výšková otázka", "meta": "ATLAS OBLOHY • 12", "explain": "Altocumulus je jedním z rodů typických pro střední hladinu.", "options": ["Cirrus", "Altocumulus", "Stratus", "Cumulus"], "correct": 1}, {"q": "Který rod má obvykle základnu nízko, ale jeho vrchol může dosáhnout až do vysokého patra?", "a": "Cumulonimbus", "w": ["Stratus", "Cirrocumulus", "Altostratus"], "v": "cumulonimbus", "h": "vertikální rozsah", "meta": "ATLAS OBLOHY • 13", "explain": "Cumulonimbus může vyrůst přes střední hladinu až do vysokého patra.", "options": ["Cumulonimbus", "Stratus", "Cirrocumulus", "Altostratus"], "correct": 0}, {"q": "Která nízká vrstva může přinášet mrholení a mívá poměrně jednotnou základnu?", "a": "Stratus", "w": ["Cirrus", "Cumulus", "Cirrocumulus"], "v": "stratus", "h": "nízké patro", "meta": "ATLAS OBLOHY • 14", "explain": "WMO u Stratu uvádí možnost mrholení; jde o nízkou vrstvu s poměrně jednotnou základnou.", "options": ["Cirrus", "Cumulus", "Cirrocumulus", "Stratus"], "correct": 3}, {"q": "Který rod je typický pro plošné, dlouhotrvající srážky z rozsáhlé vrstvy?", "a": "Nimbostratus", "w": ["Cirrus", "Cumulus", "Cirrostratus"], "v": "nimbostratus", "h": "srážková situace", "meta": "ATLAS OBLOHY • 15", "explain": "Nimbostratus je klasická rozsáhlá srážková vrstva.", "options": ["Cirrus", "Nimbostratus", "Cumulus", "Cirrostratus"], "correct": 1}];
let idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){const q=Q[idx];locked=false;$('counter').textContent=String(idx+1).padStart(2,'0')+' / '+String(Q.length).padStart(2,'0');$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('sceneMeta').textContent=q.meta||'';$('feedback').className='feedback';$('feedback').textContent='';$('next').className='next';$('answers').innerHTML=''; renderVisual(q,idx,false);q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(i,b);$('answers').appendChild(b);})}
function choose(i,b){if(locked)return;locked=true;const q=Q[idx];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('ok');if(i!==q.correct)b.classList.add('bad');else score++;$('feedback').textContent=(i===q.correct?'✓ ':'✕ ')+q.explain;$('feedback').className='feedback show';renderVisual(q,idx,true,i===q.correct);$('next').textContent=idx===Q.length-1?'VÝSLEDEK →':'DALŠÍ →';$('next').className='next show';}
$('next').onclick=()=>{idx++;if(idx>=Q.length)finish();else render();};
function finish(){$('bar').style.width='100%';$('game').classList.add('hidden');$('result').classList.add('show');$('score').textContent=score+' / '+Q.length;const pct=score/Q.length;let t,x;if(pct>=.87){t='METEOROLOGICKÉ OKO';x='Rod i patro oblačnosti čtete velmi přesně.'}else if(pct>=.6){t='OBLOHU ČTETE DOBŘE';x='Většina scén sedla, jen vrstvy a kupy se párkrát prohodily.'}else{t='ATLAS JEŠTĚ OTEVŘENÝ';x='Oblačnost je zrádná. Po druhém průchodu začnou rozdíly dávat větší smysl.'}$('resultTitle').textContent=t;$('resultText').textContent=x;}
$('restart').onclick=()=>{idx=0;score=0;$('result').classList.remove('show');$('game').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};

function cloudShape(t){const c='#fff';const d='#d8e3ee';let s='';
if(t==='cirrus')s=`<path d="M35 115 C80 65 110 82 165 48 M61 130 C105 88 135 91 204 72 M102 146 C140 116 165 112 213 108" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" opacity=".9"/>`;
if(t==='cirrocumulus')s=Array.from({length:18},(_,k)=>`<circle cx="${38+(k%6)*31}" cy="${72+Math.floor(k/6)*30}" r="10" fill="${c}" opacity=".9"/>`).join('');
if(t==='cirrostratus')s=`<path d="M26 82 Q120 48 215 77 L221 150 Q126 177 24 151Z" fill="${c}" opacity=".33"/><circle cx="128" cy="111" r="31" fill="none" stroke="${c}" stroke-width="5" opacity=".8"/><circle cx="128" cy="111" r="12" fill="#ffe681"/>`;
if(t==='altocumulus')s=Array.from({length:12},(_,k)=>`<ellipse cx="${42+(k%4)*50}" cy="${74+Math.floor(k/4)*37}" rx="20" ry="13" fill="${c}" opacity=".88"/>`).join('');
if(t==='altostratus')s=`<path d="M20 75 Q120 49 224 80 L224 158 Q116 178 20 152Z" fill="${d}" opacity=".82"/><circle cx="166" cy="105" r="14" fill="#f5e6a8" opacity=".5"/>`;
if(t==='nimbostratus')s=`<path d="M15 82 Q53 51 90 71 Q130 45 166 72 Q201 60 229 89 L229 145 L15 145Z" fill="#6f7886"/><g stroke="#92c8ff" stroke-width="4">${[45,78,112,148,184,212].map(x=>`<path d="M${x} 151l-9 25"/>`).join('')}</g>`;
if(t==='stratocumulus')s=`<g fill="#edf2f6">${[35,74,114,154,194].map((x,k)=>`<ellipse cx="${x}" cy="102" rx="34" ry="23"/>`).join('')}</g><path d="M15 111h214v38H15z" fill="#d3dae0"/>`;
if(t==='stratus')s=`<path d="M10 86 Q120 72 230 86 L230 150 Q117 157 10 148Z" fill="#cbd3da"/>`;
if(t==='cumulus')s=`<path d="M43 146 Q27 116 55 100 Q59 68 93 72 Q108 45 137 67 Q174 56 181 92 Q217 101 205 137 Q174 151 43 146Z" fill="${c}"/>`;
if(t==='cumulonimbus')s=`<path d="M83 160 Q51 144 69 118 Q52 96 81 79 Q77 54 108 48 Q115 23 143 42 Q178 34 184 64 Q217 66 218 91 Q191 101 161 103 Q186 122 177 160Z" fill="${c}"/><path d="M130 42 Q181 20 220 48 Q190 65 148 60" fill="${c}"/>`;
return `<svg viewBox="0 0 240 190" class="cloud-svg">${s}</svg>`}
function renderVisual(q,i,after,correct=true){$('visual').innerHTML=`<div class="sky"><div class="alt"><span>VYSOKÉ</span><span>STŘEDNÍ</span><span>NÍZKÉ</span></div><div class="cloudbox">${cloudShape(q.v)}</div><div class="heightmark">${q.h||''}</div>${after?`<div class="weather-stamp ${correct?'yes':'no'}">${correct?'ZAŘAZENO':'OPRAVENO'}</div>`:''}</div>`}

render();
</script></body></html>
