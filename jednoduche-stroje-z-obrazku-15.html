<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: Páka, kladka, nakloněná rovina. Přečtete 15 jednoduchých strojů z obrázku?</title><style>*{box-sizing:border-box}body{margin:0;background:#d7d2c7;color:#202124;font-family:Arial,sans-serif}.work{max-width:1200px;margin:auto;padding:15px}header{background:#f4efe4;border:2px solid #45413a;padding:15px;display:flex;justify-content:space-between;align-items:end;box-shadow:8px 8px 0 #8d877c}.stamp{font:900 11px monospace;letter-spacing:.14em;color:#6b4f2b}h1{margin:6px 0 0;font-size:32px;line-height:1.08;max-width:900px}#prog{font:900 30px monospace}.desk{display:grid;grid-template-columns:235px 1fr;gap:18px;margin-top:22px}.tools{background:#a87b4d;border:8px solid #6c4e31;padding:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}.tools span{aspect-ratio:1;border:2px solid #5d432a;background:#c9a476;display:flex;align-items:center;justify-content:center;font:900 12px monospace;color:#5d432a}.tools span.done{background:#f5c04e;color:#2b251e}.sheet{background:#fffdf7;border:1px solid #b9b3a9;padding:17px;box-shadow:0 18px 50px #0003;position:relative}.sheet:before{content:'MECHANICKÁ DÍLNA / ZAKÁZKOVÝ LIST';font:900 10px monospace;letter-spacing:.14em;color:#766b5b}.diagram{height:360px;margin:15px 0 10px;border:2px dashed #b9b3a9;background:#eef1f2;display:flex;align-items:center;justify-content:center}.diagram svg{width:100%;height:100%}.q{font-size:23px;font-weight:900;line-height:1.22;margin:12px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{background:#fff;border:2px solid #4f4b43;padding:12px;text-align:left;font-size:16px;font-weight:800;cursor:pointer}.opt:hover{background:#f3ead8}.opt.ok{background:#d5f1dc;border-color:#2e7d4f}.opt.bad{background:#f4d6d6;border-color:#a53b3b}.fb{display:none;border-top:2px solid #4f4b43;margin-top:11px;padding-top:10px;line-height:1.45}.next{display:none;margin:12px 0 0 auto;background:#3e3a34;color:#fff;border:0;padding:12px 16px;font-weight:900}.result{display:none;text-align:center;padding:55px 10px}.score{font-size:72px;font-weight:1000;color:#6b4f2b}.restart{background:#fffdf7;border:2px solid #45413a;padding:12px 18px;font-weight:900}@media(max-width:760px){.desk{grid-template-columns:1fr}.tools{grid-template-columns:repeat(5,1fr);border-width:5px}.diagram{height:255px}.opts{grid-template-columns:1fr}header{display:block}#prog{margin-top:9px}h1{font-size:25px}}</style></head><body><div class="work"><header><div><div class="stamp">MECHANICKÁ DÍLNA // 15 MODELŮ</div><h1>Kvíz ze školy: Páka, kladka, nakloněná rovina. Přečtete 15 jednoduchých strojů z obrázku?</h1></div><div id="prog">01/15</div></header><div class="desk"><aside class="tools" id="tools"></aside><main class="sheet"><div id="quiz"><div class="diagram" id="diagram"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">DALŠÍ MODEL →</button></div><section class="result" id="result"><div class="stamp">ZAKÁZKOVÝ LIST UZAVŘEN</div><div class="score" id="score"></div><h2 id="grade"></h2><button class="restart" id="restart">VRÁTIT MODELY NA STŮL</button></section></main></div></div><script>const Q=[{"kind":"seesaw","q":"Houpačka má uprostřed pevný bod a síly působí na obou stranách. Jaký jednoduchý stroj je jejím principem?","e":"Houpačka je typický příklad páky s opěrným bodem mezi silami.","o":["Páka","Kladka","Klín","Šroub"],"a":0},{"kind":"fixedpulley","q":"Lano vede přes kladku pevně zavěšenou nahoře a při zvedání vlajky taháte dolů. Co ideální pevná kladka hlavně mění?","e":"Ideální pevná kladka sama o sobě neposkytuje mechanickou výhodu; především mění směr síly.","o":["Hmotnost břemene","Množství vykonané práce","Délku stožáru","Směr působící síly"],"a":3},{"kind":"movepulley","q":"Jedna kladka se pohybuje spolu s bednou a břemeno podpírají dva úseky lana. Co se v ideálním případě stane s potřebnou silou?","e":"U jedné ideální pohyblivé kladky nesou břemeno dva úseky lana, takže potřebná síla je přibližně poloviční.","o":["Zůstane vždy stejná","Klesne na nulu","Klesne přibližně na polovinu","Zdvojnásobí se"],"a":2},{"kind":"ramp","q":"Bednu tlačíte do auta po dlouhé rampě místo svislého zdvihu. Jaký jednoduchý stroj používáte?","e":"Nakloněná rovina prodlužuje dráhu, ale umožní snížit potřebnou sílu.","o":["Klín","Nakloněnou rovinu","Páku","Kolo na hřídeli"],"a":1},{"kind":"axe","q":"Ostří sekery rozděluje dřevo tím, že převádí pohyb vpřed na síly do stran. Jaký je to princip?","e":"Klín lze chápat jako pohyblivou nakloněnou rovinu; rozkládá sílu do stran.","o":["Klín","Kladka","Šroub","Kolo na hřídeli"],"a":0},{"kind":"screw","q":"Závit obtáčí válec ve spirále. Který popis nejlépe vysvětluje princip šroubu?","e":"Závit šroubu je geometricky nakloněná rovina vedená kolem válce.","o":["Dvě spojené kladky","Páka bez opěrného bodu","Kolo bez hřídele","Nakloněná rovina navinutá kolem válce"],"a":3},{"kind":"wheel","q":"Když otáčíte velkou klikou připojenou k menší hřídeli navijáku, který jednoduchý stroj využíváte?","e":"Kolo a hřídel pracují jako spojené rotační části s různými poloměry.","o":["Nakloněná rovina","Pevnou kladku","Kolo na hřídeli","Klín"],"a":2},{"kind":"bottle","q":"Otvírák podepřete o okraj uzávěru; uzávěr je mezi opěrným bodem a silou ruky. O jakou třídu páky jde?","e":"U páky druhého druhu leží břemeno mezi opěrným bodem a působící silou.","o":["Nejde o páku","Páka druhého druhu","Páka prvního druhu","Páka třetího druhu"],"a":1},{"kind":"tweezers","q":"Pinzeta má oporu na spojeném konci, síla prstů působí uprostřed a břemeno je na špičkách. O jakou třídu páky jde?","e":"U páky třetího druhu leží působící síla mezi opěrným bodem a břemenem.","o":["Páka třetího druhu","Páka prvního druhu","Páka druhého druhu","Kladka"],"a":0},{"kind":"crowbar","q":"Páčidlo se opírá o pevný bod, který leží mezi rukou a zvedaným víkem. O jakou třídu páky jde?","e":"U páky prvního druhu je opěrný bod mezi působící silou a břemenem.","o":["Páka druhého druhu","Páka třetího druhu","Šroub","Páka prvního druhu"],"a":3},{"kind":"wheelbarrow","q":"U kolečka je osa kola opěrný bod, náklad leží mezi kolem a rukama. Jakou třídu páky představují držadla s korbou?","e":"Náklad je mezi opěrným bodem a silou rukou, což odpovídá páce druhého druhu.","o":["Páka třetího druhu","Není to páka","Páka druhého druhu","Páka prvního druhu"],"a":2},{"kind":"scissors","q":"Nůžky mají středový čep a dvě ramena; ostří navíc působí jako klíny. Jaká kombinace je nejvýstižnější?","e":"Každá polovina nůžek je páka prvního druhu kolem čepu a ostří funguje jako klín.","o":["Kolo na hřídeli + kladka","Dvě páky prvního druhu + klíny","Dvě pevné kladky + klíny","Šroub + nakloněná rovina"],"a":1},{"kind":"block","q":"Soustava několika pevných a pohyblivých kladek rozděluje zatížení mezi více úseků lana. Jak se systém nazývá?","e":"Kladkostroj kombinuje více kladek, aby v ideálním případě zvýšil mechanickou výhodu.","o":["Kladkostroj","Naviják","Klínový převod","Šroubový zvedák"],"a":0},{"kind":"jack","q":"U mechanického zvedáku otáčíte klikou a závit pomalu zvedá auto. Který jednoduchý stroj je uvnitř rozhodující?","e":"Šroub převádí rotační pohyb na pomalý lineární posun s velkou mechanickou výhodou.","o":["Pevná kladka","Klín","Nakloněná rovina bez závitu","Šroub"],"a":3},{"kind":"knife","q":"Čepel nože je tenká u ostří a širší směrem k hřbetu. Jaký jednoduchý stroj představuje průřez ostřím?","e":"Ostří nože je klín: dvě nakloněné plochy převádějí sílu dopředu na síly do stran.","o":["Kladka","Páka třetího druhu","Klín","Kolo na hřídeli"],"a":2}],V={"seesaw":"<polygon points='390,270 340,350 440,350' fill='#6b7280'/><rect x='170' y='245' width='440' height='34' rx='14' fill='#d97706'/><circle cx='210' cy='210' r='38' fill='#60a5fa'/><circle cx='570' cy='210' r='38' fill='#f87171'/>","fixedpulley":"<circle cx='390' cy='140' r='65' fill='none' stroke='#94a3b8' stroke-width='22'/><path d='M325 140 V390 M455 140 V390' stroke='#e5e7eb' stroke-width='8'/><rect x='260' y='360' width='120' height='75' fill='#b45309'/><path d='M455 390 l-25-45h50z' fill='#fbbf24'/>","movepulley":"<circle cx='390' cy='300' r='65' fill='none' stroke='#94a3b8' stroke-width='22'/><path d='M220 85 V300 Q220 365 390 365 Q560 365 560 300 V85' fill='none' stroke='#e5e7eb' stroke-width='8'/><rect x='325' y='385' width='130' height='70' fill='#b45309'/>","ramp":"<polygon points='170,405 610,405 610,170' fill='#64748b'/><rect x='360' y='275' width='105' height='82' transform='rotate(-28 412 316)' fill='#b45309'/><path d='M320 350 l110-60' stroke='#fbbf24' stroke-width='12'/>","axe":"<rect x='380' y='160' width='30' height='300' rx='15' fill='#8b5a2b'/><path d='M300 145 Q390 100 500 165 L430 260 L330 245Z' fill='#cbd5e1'/><rect x='160' y='365' width='460' height='70' fill='#7c4a25'/>","screw":"<rect x='350' y='90' width='80' height='360' rx='22' fill='#94a3b8'/><path d='M330 130 L450 170 M330 190 L450 230 M330 250 L450 290 M330 310 L450 350 M330 370 L450 410' stroke='#e5e7eb' stroke-width='12'/>","wheel":"<circle cx='320' cy='265' r='145' fill='none' stroke='#f59e0b' stroke-width='26'/><circle cx='320' cy='265' r='45' fill='#6b7280'/><line x1='320' y1='265' x2='590' y2='265' stroke='#94a3b8' stroke-width='28'/>","bottle":"<path d='M300 410 Q300 230 340 190 H460 Q500 230 500 410Z' fill='#38bdf8' opacity='.55'/><rect x='330' y='170' width='140' height='25' fill='#94a3b8'/><path d='M240 170 H390 L320 315' fill='none' stroke='#f59e0b' stroke-width='30'/>","tweezers":"<path d='M220 140 Q390 210 520 410 M260 120 Q410 210 555 395' fill='none' stroke='#cbd5e1' stroke-width='18'/><circle cx='510' cy='390' r='22' fill='#f87171'/>","crowbar":"<rect x='155' y='385' width='470' height='35' fill='#64748b'/><path d='M245 360 L570 170' stroke='#f59e0b' stroke-width='28'/><polygon points='365,340 405,405 325,405' fill='#94a3b8'/>","wheelbarrow":"<circle cx='220' cy='380' r='70' fill='#334155'/><path d='M260 360 L560 280 L620 155' stroke='#f59e0b' stroke-width='30'/><path d='M275 290 H510 L465 390 H320Z' fill='#b45309'/>","scissors":"<circle cx='390' cy='280' r='24' fill='#111827'/><path d='M390 280 L180 120 M390 280 L600 120' stroke='#cbd5e1' stroke-width='28'/><path d='M390 280 L210 430 M390 280 L570 430' stroke='#f59e0b' stroke-width='36'/>","block":"<circle cx='300' cy='145' r='55' fill='none' stroke='#94a3b8' stroke-width='18'/><circle cx='480' cy='300' r='55' fill='none' stroke='#94a3b8' stroke-width='18'/><path d='M245 145 V300 Q245 355 300 355 H480 Q535 355 535 300 V145' fill='none' stroke='#e5e7eb' stroke-width='8'/><rect x='420' y='380' width='120' height='65' fill='#b45309'/>","jack":"<path d='M280 400 L390 145 L500 400 M280 145 L390 400 L500 145' fill='none' stroke='#94a3b8' stroke-width='25'/><line x1='250' y1='270' x2='530' y2='270' stroke='#f59e0b' stroke-width='22'/><path d='M530 270 h95' stroke='#fbbf24' stroke-width='16'/>","knife":"<path d='M170 300 L560 180 L610 270 L220 350Z' fill='#d1d5db'/><rect x='120' y='310' width='180' height='75' rx='25' fill='#8b5a2b'/><path d='M560 180 L610 270' stroke='#f8fafc' stroke-width='7'/>"};let i=0,score=0;for(let n=0;n<15;n++)tools.innerHTML+=`<span>${String(n+1).padStart(2,'0')}</span>`;function draw(k){return `<svg viewBox="0 0 780 520"><rect width="780" height="520" fill="#eef1f2"/><path d="M40 455 H740" stroke="#c4c9ca" stroke-width="3"/>${V[k]}</svg>`}function show(){const x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;diagram.innerHTML=draw(x.kind);q.textContent=x.q;opts.innerHTML='';x.o.forEach((v,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){const x=Q[i];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;tools.children[i].classList.add('done');fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'MECHANISMUS SEDÍ.':'NÁKRES SE ROZCHÁZÍ.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?show():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('score').textContent=`${score} / 15`;grade.textContent=score>=13?'Mistr jednoduchých strojů':score>=9?'Dílna funguje':'Pár mechanismů chce rozebrat znovu'}restart.onclick=()=>{i=0;score=0;[...tools.children].forEach(x=>x.classList.remove('done'));result.style.display='none';quiz.style.display='block';show()};show();</script></body></html>
