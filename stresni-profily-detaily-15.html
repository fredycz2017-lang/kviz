<title>Kvíz: Sedlová, valbová, mansardová. Přečtete 15 střešních profilů a detailů?</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font:inherit}

.quiz-wrap{width:min(1120px,100%);margin:0 auto;padding:22px}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.72}h1{font-size:clamp(28px,4vw,48px);line-height:1.02;margin:8px 0 10px}.lead{font-size:clamp(15px,2vw,19px);line-height:1.55;max-width:850px;margin:0 0 18px}.hud{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:14px 0}.progress{height:12px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.12)}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:.35s}.counter{font-weight:850;min-width:76px;text-align:right}.card{border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.12);overflow:hidden}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.15;margin:6px 0 18px}.visual{min-height:250px;display:grid;place-items:center;margin:8px 0 20px;position:relative}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:0;border-radius:15px;padding:14px 16px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:54px}.answer:hover{transform:translateY(-1px)}.answer[disabled]{cursor:default}.answer.ok{background:var(--ok)!important;color:#fff!important}.answer.bad{background:var(--bad)!important;color:#fff!important}.feedback{min-height:70px;margin-top:14px;padding:13px 15px;border-radius:14px;line-height:1.45;display:none}.feedback.show{display:block}.next{display:none;margin-top:14px;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.next.show{display:inline-block}.result{display:none;text-align:center;padding:34px 18px}.result.show{display:block}.result .score{font-size:clamp(54px,10vw,100px);font-weight:1000;line-height:.9;margin:16px 0}.restart{border:0;border-radius:14px;padding:13px 20px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}

@media(max-width:620px){.quiz-wrap{padding:12px}.card{padding:14px;border-radius:18px}.answers{grid-template-columns:1fr}.visual{min-height:220px}h1{font-size:30px}.question{font-size:23px}}
</style></head><body><main class="quiz-wrap">
<div class="topline"><div class="eyebrow">14. 10. 2026 • KVÍZ</div><div class="mini-brand">ADAM HOLL</div></div>
<h1>Kvíz: Sedlová, valbová, mansardová. Přečtete 15 střešních profilů a detailů?</h1><p class="lead">Devět tvarů střech a šest konstrukčních detailů. Inspektor ukáže jen model; vy musíte pojmenovat to, co skutečně vidíte.</p>
<div class="hud"><div class="progress"><i id="bar"></i></div><div class="counter" id="counter">01 / 15</div></div>
<section class="card" id="game"><div id="sceneMeta" class="scene-meta"></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ →</button></section>
<section class="card result" id="result"><div class="eyebrow">HOTOVO</div><div class="score" id="score"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="restart" id="restart">HRÁT ZNOVU</button></section>
</main><script>
const Q=[{"q": "Dvě šikmé roviny se setkávají v hřebeni a na čele vzniká trojúhelníkový štít. To je střecha…", "a": "Sedlová", "w": ["Valbová", "Pultová", "Stanová"], "v": "gable", "meta": "STŘEŠNÍ INSPEKCE • 01", "explain": "Sedlová střecha má dvě hlavní šikmé roviny a štítové konce.", "options": ["Sedlová", "Valbová", "Pultová", "Stanová"], "correct": 0}, {"q": "Všechny čtyři strany střechy klesají směrem k obvodovým stěnám. Jde o střechu…", "a": "Valbovou", "w": ["Sedlovou", "Plochou", "Pultovou"], "v": "hip", "meta": "STŘEŠNÍ INSPEKCE • 02", "explain": "Valbová střecha nemá klasický svislý štít; sklon má na všech stranách.", "options": ["Sedlovou", "Valbovou", "Plochou", "Pultovou"], "correct": 1}, {"q": "Štít je nahoře „seříznutý“ malou valbou. Tento typ je…", "a": "Polovalbový", "w": ["Sedlový", "Stanový", "Mansardový"], "v": "halfhip", "meta": "STŘEŠNÍ INSPEKCE • 03", "explain": "Polovalbová střecha kombinuje štít se zkrácenou valbou v horní části.", "options": ["Sedlový", "Stanový", "Polovalbový", "Mansardový"], "correct": 2}, {"q": "Jediná šikmá rovina klesající jedním směrem je střecha…", "a": "Pultová", "w": ["Sedlová", "Valbová", "Motýlková"], "v": "shed", "meta": "STŘEŠNÍ INSPEKCE • 04", "explain": "Pultová střecha je tvořena jednou nakloněnou rovinou.", "options": ["Sedlová", "Valbová", "Motýlková", "Pultová"], "correct": 3}, {"q": "Na každé straně jsou dva sklony, přičemž spodní část je výrazně strmější. Jde o střechu…", "a": "Mansardovou", "w": ["Sedlovou", "Stanovou", "Pilovou"], "v": "mansard", "meta": "STŘEŠNÍ INSPEKCE • 05", "explain": "Mansardová střecha používá na stranách dva různé sklony, spodní obvykle strmější.", "options": ["Sedlovou", "Mansardovou", "Stanovou", "Pilovou"], "correct": 1}, {"q": "Čtyři trojúhelníkové roviny se sbíhají do jediného vrcholu. To je střecha…", "a": "Stanová", "w": ["Valbová s hřebenem", "Sedlová", "Pultová"], "v": "pyramid", "meta": "STŘEŠNÍ INSPEKCE • 06", "explain": "Stanová neboli pyramidová střecha se sbíhá do jediného vrcholu.", "options": ["Valbová s hřebenem", "Sedlová", "Pultová", "Stanová"], "correct": 3}, {"q": "Profil je téměř vodorovný a nevytváří klasický hřeben. Jde o střechu…", "a": "Plochou", "w": ["Pultovou", "Sedlovou", "Mansardovou"], "v": "flat", "meta": "STŘEŠNÍ INSPEKCE • 07", "explain": "Plochá střecha má velmi malý sklon a nemá hřeben jako šikmé střechy.", "options": ["Plochou", "Pultovou", "Sedlovou", "Mansardovou"], "correct": 0}, {"q": "Opakující se série strmých a mírnějších rovin připomíná zuby pily. Jde o střechu…", "a": "Pilovou", "w": ["Motýlkovou", "Mansardovou", "Valbovou"], "v": "saw", "meta": "STŘEŠNÍ INSPEKCE • 08", "explain": "Pilová střecha má opakovaný profil připomínající zuby pily.", "options": ["Motýlkovou", "Mansardovou", "Pilovou", "Valbovou"], "correct": 2}, {"q": "Dvě roviny klesají směrem doprostřed a vytvářejí centrální úžlabí. To je střecha…", "a": "Motýlková", "w": ["Sedlová", "Valbová", "Pultová"], "v": "butterfly", "meta": "STŘEŠNÍ INSPEKCE • 09", "explain": "Motýlková střecha je obrácená logika sedlové: roviny klesají do středu.", "options": ["Sedlová", "Valbová", "Pultová", "Motýlková"], "correct": 3}, {"q": "Jak se nazývá horní vodorovná linie, kde se setkávají dvě střešní roviny?", "a": "Hřeben", "w": ["Úžlabí", "Nároží", "Okap"], "v": "ridge", "meta": "DETAIL STŘECHY • 10", "explain": "Hřeben je horní linie styku dvou protilehlých střešních rovin.", "options": ["Hřeben", "Úžlabí", "Nároží", "Okap"], "correct": 0}, {"q": "Vnitřní šikmá linie, do níž se sbíhají dvě střešní roviny, je…", "a": "Úžlabí", "w": ["Hřeben", "Nároží", "Atika"], "v": "valley", "meta": "DETAIL STŘECHY • 11", "explain": "Úžlabí je vnitřní spoj dvou střešních rovin a odvádí vodu dolů.", "options": ["Hřeben", "Nároží", "Úžlabí", "Atika"], "correct": 2}, {"q": "Vystupující vnější šikmá hrana na styku dvou střešních rovin je…", "a": "Nároží", "w": ["Úžlabí", "Hřeben", "Okap"], "v": "hipline", "meta": "DETAIL STŘECHY • 12", "explain": "Nároží je vnější šikmá hrana vznikající na styku dvou rovin.", "options": ["Úžlabí", "Nároží", "Hřeben", "Okap"], "correct": 1}, {"q": "Spodní hrana střechy, odkud voda obvykle odtéká do žlabu, se nazývá…", "a": "Okapová hrana", "w": ["Hřeben", "Úžlabí", "Atika"], "v": "eave", "meta": "DETAIL STŘECHY • 13", "explain": "Okapová hrana je spodní okraj šikmé střechy, u něhož bývá okapní žlab.", "options": ["Okapová hrana", "Hřeben", "Úžlabí", "Atika"], "correct": 0}, {"q": "Malá vystupující konstrukce s oknem ve střešní rovině je…", "a": "Vikýř", "w": ["Atika", "Hřeben", "Nároží"], "v": "dormer", "meta": "DETAIL STŘECHY • 14", "explain": "Vikýř vystupuje ze střešní roviny a zpravidla obsahuje svislé okno.", "options": ["Atika", "Hřeben", "Nároží", "Vikýř"], "correct": 3}, {"q": "Nízká svislá stěna po obvodu ploché střechy se nazývá…", "a": "Atika", "w": ["Okap", "Vikýř", "Úžlabí"], "v": "parapet", "meta": "DETAIL STŘECHY • 15", "explain": "Atika je zvýšená svislá část obvodové stěny nad úrovní střechy.", "options": ["Okap", "Atika", "Vikýř", "Úžlabí"], "correct": 1}];
let idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){const q=Q[idx];locked=false;$('counter').textContent=String(idx+1).padStart(2,'0')+' / '+String(Q.length).padStart(2,'0');$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('sceneMeta').textContent=q.meta||'';$('feedback').className='feedback';$('feedback').textContent='';$('next').className='next';$('answers').innerHTML=''; renderVisual(q,idx,false);q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(i,b);$('answers').appendChild(b);})}
function choose(i,b){if(locked)return;locked=true;const q=Q[idx];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('ok');if(i!==q.correct)b.classList.add('bad');else score++;$('feedback').textContent=(i===q.correct?'✓ ':'✕ ')+q.explain;$('feedback').className='feedback show';renderVisual(q,idx,true,i===q.correct);$('next').textContent=idx===Q.length-1?'VÝSLEDEK →':'DALŠÍ →';$('next').className='next show';}
$('next').onclick=()=>{idx++;if(idx>=Q.length)finish();else render();};
function finish(){$('bar').style.width='100%';$('game').classList.add('hidden');$('result').classList.add('show');$('score').textContent=score+' / '+Q.length;const pct=score/Q.length;let t,x;if(pct>=.87){t='INSPEKCE BEZ ZÁVAD';x='Střešní geometrii i detaily máte pod kontrolou.'}else if(pct>=.6){t='DOBRÝ TECHNICKÝ ODHAD';x='Většinu střech přečtete správně, jen pár hran a profilů splývá.'}else{t='VÝKRES CHCE DRUHOU KONTROLU';x='Hřeben, nároží i úžlabí se snadno pletou. Opakování pomůže.'}$('resultTitle').textContent=t;$('resultText').textContent=x;}
$('restart').onclick=()=>{idx=0;score=0;$('result').classList.remove('show');$('game').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};

function roofSVG(t){const L='#f7d08a',D='#16324f',R='#ca4b40';let s='';
const house=`<rect x="55" y="104" width="130" height="70" rx="4" fill="#e9e0d2" stroke="${D}" stroke-width="4"/>`;
if(t==='gable')s=`${house}<path d="M42 106 L120 48 L198 106Z" fill="${R}" stroke="${D}" stroke-width="4"/>`;
if(t==='hip')s=`${house}<path d="M49 106 L87 58 L154 58 L191 106Z" fill="${R}" stroke="${D}" stroke-width="4"/><path d="M87 58L120 92L154 58" fill="#b84138" stroke="${D}" stroke-width="3"/>`;
if(t==='halfhip')s=`${house}<path d="M48 106 L77 70 L91 54 L149 54 L164 70 L192 106Z" fill="${R}" stroke="${D}" stroke-width="4"/><path d="M77 70L120 92L164 70" fill="#b84138" stroke="${D}" stroke-width="3"/>`;
if(t==='shed')s=`${house}<path d="M45 106 L72 58 L195 76 L190 106Z" fill="${R}" stroke="${D}" stroke-width="4"/>`;
if(t==='mansard')s=`${house}<path d="M44 106 L66 63 L88 48 L153 48 L176 63 L197 106Z" fill="${R}" stroke="${D}" stroke-width="4"/><path d="M66 63L176 63" stroke="${D}" stroke-width="3"/>`;
if(t==='pyramid')s=`${house}<path d="M48 106 L120 44 L192 106Z" fill="${R}" stroke="${D}" stroke-width="4"/><path d="M120 44L120 105" stroke="${D}" stroke-width="3" opacity=".6"/>`;
if(t==='flat')s=`${house}<path d="M49 97 H191 V108 H49Z" fill="${R}" stroke="${D}" stroke-width="4"/>`;
if(t==='saw')s=`${house}<path d="M48 104 L78 64 L98 104 L128 64 L148 104 L178 64 L195 104Z" fill="${R}" stroke="${D}" stroke-width="4"/>`;
if(t==='butterfly')s=`${house}<path d="M45 70 L120 104 L196 70 L190 106 L120 123 L51 106Z" fill="${R}" stroke="${D}" stroke-width="4"/>`;
if(['ridge','valley','hipline','eave','dormer','parapet'].includes(t)){s=`${house}<path d="M42 106 L120 48 L198 106Z" fill="#d9e4ee" stroke="${D}" stroke-width="4"/>`;if(t==='ridge')s+=`<path d="M120 48L198 106" stroke="${R}" stroke-width="9"/>`;if(t==='valley')s+=`<path d="M120 106L150 77" stroke="${R}" stroke-width="9"/>`;if(t==='hipline')s+=`<path d="M120 48L55 106" stroke="${R}" stroke-width="9"/>`;if(t==='eave')s+=`<path d="M42 106H198" stroke="${R}" stroke-width="9"/>`;if(t==='dormer')s+=`<rect x="96" y="79" width="48" height="35" fill="#fff" stroke="${D}" stroke-width="3"/><path d="M90 80l30-24 30 24z" fill="${R}" stroke="${D}" stroke-width="3"/>`;if(t==='parapet')s=`${house}<path d="M48 87H192V106H48Z" fill="#d9e4ee" stroke="${D}" stroke-width="4"/><path d="M48 87H192" stroke="${R}" stroke-width="8"/>`;}
return `<svg viewBox="0 0 240 200" class="roof-svg">${s}</svg>`}
function renderVisual(q,i,after,correct=true){$('visual').innerHTML=`<div class="blueprint"><div class="gridtag">INSPEKCE ${String(i+1).padStart(2,'0')}</div>${roofSVG(q.v)}${after?`<div class="roof-stamp ${correct?'yes':'no'}">${correct?'SCHVÁLENO':'OPRAVENO'}</div>`:''}</div>`}

render();
</script></body></html>
