<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokážete trefit 10 čísel z běžného života?</title><style>
:root{--bg:#f3f3f2;--navy:#21324a;--muted:#70757d;--accent:#9a5a0a;--accentbg:#f5eee4;--good:#16783a;--goodbg:#ecf8ef;--bad:#b42318;--badbg:#fff0ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f2024}body{padding:30px 12px}.shell{max-width:700px;margin:auto;background:#fff;border:1px solid #d7dbe1;border-radius:24px;overflow:hidden}.head{padding:28px 28px 20px}.kicker{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}h1{font-size:31px;line-height:1.06;color:var(--navy);margin:0 0 14px;font-weight:900}.lead{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 24px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;font-weight:800}.score{padding:9px 14px;border:1px solid #dcdfe4;background:#f7f6f3;border-radius:999px}.bar{height:9px;background:#ebe9e6}.prog{height:100%;width:0;background:#b06b13;transition:.25s}.main{padding:28px}.tag{display:inline-block;margin:0 0 11px;padding:7px 10px;border-radius:999px;background:var(--accentbg);color:#87520e;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.055em}.question{font-size:23px;line-height:1.32;font-weight:900;margin:0 0 20px}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid #dde1e6;background:#fff;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.35;font-weight:700;cursor:pointer}.answer:hover:not(:disabled){border-color:#aeb7c2;background:#fbfbfc}.answer:disabled{cursor:default}.answer.correct{border-color:var(--good);background:var(--goodbg);color:#0e5c2a}.answer.wrong{border-color:var(--bad);background:var(--badbg);color:#8e1d15}.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:13px;background:#f7f7f7;border:1px solid #e0e2e6;font-size:15px;line-height:1.5;color:#3f444c}.feedback.show{display:block}.controls{display:none;justify-content:flex-end;margin-top:18px}.controls.show{display:flex}.next,.restart,.hintbtn{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px 18px;font-size:15px;font-weight:900;cursor:pointer}.result{display:none;text-align:center}.result.show{display:block}.rscore{font-size:54px;line-height:1;font-weight:900;color:var(--navy);margin:4px 0 10px}.rtitle{font-size:25px;font-weight:900;margin:0 0 10px}.rtext{font-size:16px;line-height:1.5;color:#5f6670;max-width:550px;margin:0 auto 22px}.footer{padding:0 28px 24px;text-align:center;color:#8a8f97;font-size:12px;line-height:1.45}@media(max-width:520px){body{padding:10px 7px}.shell{border-radius:18px}.head{padding:22px 20px 16px}h1{font-size:27px}.lead{font-size:15px}.main{padding:22px 20px}.question{font-size:21px}.answer{padding:14px 15px;font-size:15px}}
</style></head><body><div class="shell"><section class="head"><div class="kicker">RANNÍ DESÍTKA • 10 ODHADŮ</div><h1>Dokážete trefit 10 čísel z běžného života?</h1><p class="lead">Papír, platební karta, IBAN, fotbalová branka nebo obyčejná zásuvka. Všechno znáte — ale trefíte přesné číslo?</p><div class="meta"><span id="counter">Otázka 1 z 10</span><span class="score">Skóre <span id="score">0</span></span></div></section><div class="bar"><div class="prog" id="prog"></div></div><main class="main"><section id="quiz"><div class="tag" id="tag"></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls" id="controls"><button class="next" id="next">Další otázka</button></div></section><section class="result" id="result"><div class="rscore"><span id="final">0</span>/10</div><h2 class="rtitle" id="rtitle"></h2><p class="rtext" id="rtext"></p><button class="restart" id="restart">Zkusit znovu</button></section></main><div class="footer">Čísla vycházejí ze standardů a pravidel; nejde o odhady výrobce ani nahodilé průměry.</div></div><script>
const q=[{"tag": "Papír", "q": "Jak dlouhá je delší strana běžného listu A4?", "a": ["27,9 cm", "31,0 cm", "29,7 cm", "32,4 cm"], "c": 2, "e": "Formát A4 má rozměry 210 × 297 mm, takže delší strana měří 29,7 cm."}, {"tag": "Peněženka", "q": "Jak široká je standardní platební karta formátu ID-1?", "a": ["85,60 mm", "75,0 mm", "80,0 mm", "90,00 mm"], "c": 0, "e": "Karta formátu ID-1 má nominální rozměr 85,60 × 53,98 mm."}, {"tag": "Bankovnictví", "q": "Kolik znaků má český IBAN v elektronickém zápisu bez mezer?", "a": ["20", "22", "26", "24"], "c": 3, "e": "Český IBAN má 24 znaků: CZ, dvě kontrolní číslice a 20 znaků národního čísla účtu."}, {"tag": "Nákup", "q": "Kolik číslic má kód GTIN-13, běžně označovaný také jako EAN-13?", "a": ["10", "13", "12", "14"], "c": 1, "e": "GTIN-13/EAN-13 má 13 číslic. Právě tento formát se často objevuje pod čárovým kódem na běžném zboží."}, {"tag": "Fotbal", "q": "Jak široká je branka ve velkém fotbale mezi vnitřními stranami tyčí?", "a": ["6,40 m", "7,00 m", "7,32 m", "7,50 m"], "c": 2, "e": "Pravidla IFAB stanovují šířku 7,32 m a výšku 2,44 m."}, {"tag": "Tenis", "q": "Jak vysoko je tenisová síť přesně uprostřed kurtu?", "a": ["0,914 m", "0,814 m", "1,014 m", "1,114 m"], "c": 0, "e": "Uprostřed kurtu má síť výšku 0,914 m, tedy přesně 3 stopy."}, {"tag": "Logistika", "q": "Jak vysoká je standardní europaleta EPAL 1?", "a": ["120 mm", "132 mm", "160 mm", "144 mm"], "c": 3, "e": "EPAL 1 má rozměry 800 × 1200 mm a výšku 144 mm."}, {"tag": "Technika", "q": "Jaký průměr má standardní CD-ROM podle specifikace ECMA-130?", "a": ["90 mm", "120 mm", "100 mm", "140 mm"], "c": 1, "e": "Standardní kompaktní disk má průměr 120 mm."}, {"tag": "Zásuvka", "q": "Jaké jmenovité napětí má běžná evropská elektrická síť v domácnosti?", "a": ["110 V", "120 V", "230 V", "400 V"], "c": 2, "e": "Evropská síť je standardně 230 V střídavých při 50 Hz."}, {"tag": "Peněženka", "q": "Jaká je nominální tloušťka standardní identifikační či platební karty ID-1?", "a": ["0,76 mm", "0,36 mm", "0,56 mm", "0,96 mm"], "c": 0, "e": "Norma pro ID-1 uvádí nominální tloušťku 0,76 mm."}];let i=0,s=0,lock=false;const counter=document.getElementById('counter'),score=document.getElementById('score'),prog=document.getElementById('prog'),tag=document.getElementById('tag'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),controls=document.getElementById('controls'),next=document.getElementById('next'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){lock=false;const x=q[i];counter.textContent=`Otázka ${i+1} z ${q.length}`;score.textContent=s;prog.style.width=`${i/q.length*100}%`;tag.textContent=x.tag;question.textContent=x.q;answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';controls.className='controls';x.a.forEach((t,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>pick(n);answers.appendChild(b)})}
function pick(n){if(lock)return;lock=true;const x=q[i],bs=[...answers.querySelectorAll('.answer')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('correct')});if(n===x.c){s++;score.textContent=s;feedback.innerHTML=`<strong>Správně.</strong> ${x.e}`}else{bs[n].classList.add('wrong');feedback.innerHTML=`<strong>Tentokrát ne.</strong> ${x.e}`}feedback.classList.add('show');controls.classList.add('show');prog.style.width=`${(i+1)/q.length*100}%`;next.textContent=i===q.length-1?'Zobrazit výsledek':'Další otázka'}
function finish(){quiz.style.display='none';result.classList.add('show');counter.textContent='Hotovo';prog.style.width='100%';document.getElementById('final').textContent=s;let t,p;if(s===10){t='Číselný radar bez chyby';p='Plný počet. Rozměry a standardy, které většina lidí jen míjí, máte překvapivě přesně v hlavě.'}else if(s>=8){t='Výborný odhad';p='Jedna či dvě hodnoty utekly, jinak jste běžná čísla trefovali velmi přesně.'}else if(s>=5){t='Půlka reality sedí';p='U některých předmětů byl odhad blízko, jiné standardy jsou mnohem méně intuitivní, než vypadají.'}else{t='Čísla kolem nás umí klamat';p='Věci používáme denně, ale jejich přesné rozměry a hodnoty si běžně pamatovat nemusíme.'}document.getElementById('rtitle').textContent=t;document.getElementById('rtext').textContent=p;}
next.onclick=()=>{if(i<q.length-1){i++;render()}else finish()};document.getElementById('restart').onclick=()=>{i=0;s=0;quiz.style.display='';result.classList.remove('show');render()};render();
</script></body></html>
