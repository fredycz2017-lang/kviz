<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obce bez pojmenovaných ulic – přehled</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #172033;
  }
  .wrap {
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    border: 1px solid #d7dee8;
    border-radius: 14px;
    padding: 18px;
    background: #fff;
    box-shadow: 0 4px 18px rgba(23, 32, 51, 0.06);
  }
  h2 {
    margin: 0 0 14px;
    font-size: 22px;
    line-height: 1.25;
    color: #245b9f;
  }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    min-width: 620px;
    border-collapse: separate;
    border-spacing: 0;
    border: 1px solid #cfd6df;
    border-radius: 10px;
    overflow: hidden;
    font-size: 15px;
  }
  th {
    background: #dfeaf7;
    color: #172033;
    font-weight: 700;
    text-align: left;
    padding: 10px 12px;
    border-right: 1px solid #cfd6df;
  }
  th:last-child { border-right: 0; }
  td {
    padding: 10px 12px;
    border-top: 1px solid #d9dee6;
    border-right: 1px solid #d9dee6;
    vertical-align: top;
  }
  td:last-child { border-right: 0; }
  tbody tr:nth-child(even) td { background: #f8fafc; }
  .num { white-space: nowrap; }
  .note {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.5;
    color: #4b5563;
  }
  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 14px; border-radius: 10px; }
    h2 { font-size: 20px; }
    table { font-size: 14px; min-width: 560px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h2>Přehled ukazatelů</h2>
      <div class="table-wrap">
        <table aria-label="Přehled ukazatelů k obcím a pojmenovaným ulicím">
          <thead>
            <tr>
              <th>Ukazatel</th>
              <th>Hodnota</th>
              <th>Opora</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Obcí celkem</td>
              <td class="num">6 258</td>
              <td>ČÚZK, stav 31. 12. 2025</td>
            </tr>
            <tr>
              <td>Obcí s pojmenovanými ulicemi</td>
              <td class="num">1 424</td>
              <td>Kloknerová, data použita v práci 2024</td>
            </tr>
            <tr>
              <td>Hrubý rozdíl</td>
              <td class="num">4 834</td>
              <td>autorský výpočet</td>
            </tr>
            <tr>
              <td>Orientační podíl bez pojmenovaných ulic</td>
              <td class="num">77,2 %</td>
              <td>autorský výpočet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
