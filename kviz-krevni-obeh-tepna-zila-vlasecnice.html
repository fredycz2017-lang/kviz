<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: Tepna, žíla, vlásečnice. Přečtete 15 schémat krevního oběhu?</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#eaf1f7;font-family:Arial,sans-serif}.lab{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:1px solid #3b4c5f;padding-bottom:15px}h1{margin:0;font-size:clamp(27px,4vw,42px);line-height:1.05}.status{font-family:monospace;color:#7dd3fc}.monitor{margin-top:18px;border:3px solid #435264;border-radius:24px;background:#172431;box-shadow:0 20px 50px #0008;overflow:hidden}.ecg{height:58px;background:#0b141c;border-bottom:1px solid #304151;display:flex;align-items:center;padding:0 18px}.ecg svg{width:100%;height:44px}.layout{display:grid;grid-template-columns:48% 1fr}.diagramPane{padding:18px;border-right:1px solid #33485a;background:radial-gradient(circle at 50% 45%,#263b4a,#14212c 65%)}.diagram{height:390px;display:grid;place-items:center}.diagram svg{width:100%;height:100%}.right{padding:18px}.zone{font:800 12px monospace;color:#7dd3fc;letter-spacing:.08em}.q{font-size:24px;font-weight:900;line-height:1.2;margin:12px 0 14px}.answers{display:grid;gap:9px}.answer{border:1px solid #486177;background:#203244;color:#eef8ff;border-radius:10px;padding:13px;text-align:left;font-weight:800;font-size:15px;cursor:pointer}.answer:hover{background:#294158}.answer.correct{background:#153c2c;border-color:#48b27d}.answer.wrong{background:#4a2024;border-color:#c75a62}.feedback{display:none;margin-top:12px;border-left:4px solid #38bdf8;background:#101b25;padding:12px;line-height:1.45}.feedback.show{display:block}#nextBtn,.restart{display:none;margin-top:12px;border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#38bdf8;color:#08202d;cursor:pointer}.restart{display:inline-block}#result{display:none;text-align:center;padding:45px}#score{font-size:60px;font-weight:900;color:#7dd3fc}.pulses{display:flex;gap:5px;margin-top:15px;flex-wrap:wrap}.pulse{width:28px;height:8px;border-radius:6px;background:#35495a}.pulse.done{background:linear-gradient(90deg,#ef4444 0 50%,#38bdf8 50%)}@media(max-width:850px){.layout{grid-template-columns:1fr}.diagramPane{border-right:0;border-bottom:1px solid #33485a}.diagram{height:270px}.top{display:block}}
</style></head><body><div class="lab"><div class="top"><div><h1>Kvíz ze školy: Tepna, žíla, vlásečnice. Přečtete 15 schémat krevního oběhu?</h1><p style="color:#9db1c2;margin:8px 0 0">Školní diagramy, směr toku a základní funkce cév. Žádné diagnózy ani zdravotní rady.</p></div><div class="status">BIO LAB / FLOW MAP</div></div><div class="monitor"><div class="ecg"><svg viewBox="0 0 800 50"><polyline id="ecgline" points="0,27 90,27 110,27 125,5 138,44 150,15 162,27 250,27 270,27 285,5 298,44 310,15 322,27 420,27 440,27 455,5 468,44 480,15 492,27 800,27" fill="none" stroke="#52e0a5" stroke-width="3"/></svg></div><div class="layout" id="quiz"><div class="diagramPane"><div class="diagram" id="diagram"></div><div class="pulses" id="pulses"></div></div><div class="right"><div class="zone" id="cat"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button id="nextBtn">Další schéma</button></div></div><div id="result"><div id="score"></div><p id="resultText"></p><button class="restart" id="restartBtn">Spustit oběh znovu</button></div></div></div><script>const questions=[{"cat":"CÉVY","diagram":"away","q":"Co na jednoduchém schématu znamená céva, kterou krev proudí od srdce?","o":["Vlásečnici","Žílu","Tepnu","Lymfatickou cévu"],"a":2,"e":"Tepna je definována směrem toku: vede krev od srdce."},{"cat":"CÉVY","diagram":"toward","q":"Který typ cévy vede krev směrem k srdci?","o":["Žíla","Tepna","Vlásečnice","Aorta"],"a":0,"e":"Žíly vedou krev zpět k srdci."},{"cat":"CÉVY","diagram":"capillary","q":"Kde na schématu probíhá hlavní výměna plynů a dalších látek mezi krví a tkáněmi?","o":["V aortě","V srdeční síni","Ve velké žíle","Ve vlásečnicích"],"a":3,"e":"Vlásečnice mají velmi tenké stěny a jsou hlavním místem výměny látek s tkáněmi."},{"cat":"MALÝ OBĚH","diagram":"pulmonary","q":"Která cesta správně popisuje plicní (malý) oběh?","o":["Levá komora → aorta → tělo → pravá síň","Pravá komora → plicní tepny → plíce → plicní žíly → levá síň","Levá síň → duté žíly → plíce → pravá komora","Pravá síň → aorta → plíce → levá komora"],"a":1,"e":"Plicní oběh začíná v pravé komoře, vede do plic a přes plicní žíly se vrací do levé síně."},{"cat":"VELKÝ OBĚH","diagram":"systemic","q":"Která cesta nejlépe popisuje tělní (velký) oběh?","o":["Pravá komora → plíce → levá síň","Pravá síň → plicní tepna → plíce","Levá komora → aorta → tkáně → duté žíly → pravá síň","Levá síň → plicní žíly → plíce"],"a":2,"e":"Velký oběh vede z levé komory přes aortu do těla a vrací se dutými žilami do pravé síně."},{"cat":"MALÝ OBĚH","diagram":"pulm_art","q":"Co je na plicní tepně zvláštní ve srovnání s většinou ostatních tepen?","o":["Vede krev s nižším obsahem kyslíku ze srdce do plic","Vede krev do levé síně","Je to žíla podle směru toku","Nemá krevní tok"],"a":0,"e":"Plicní tepny vedou krev z pravé komory do plic; jde o tepny podle směru, i když krev má nižší obsah kyslíku."},{"cat":"MALÝ OBĚH","diagram":"pulm_vein","q":"Kam vedou plicní žíly?","o":["Z pravé komory do plic","Z těla do pravé síně","Z levé komory do aorty","Z plic do levé síně"],"a":3,"e":"Plicní žíly vracejí okysličenou krev z plic do levé síně."},{"cat":"SRDCE","diagram":"aorta","q":"Ze které srdeční komory vystupuje aorta?","o":["Pravé síně","Levé komory","Pravé komory","Levé síně"],"a":1,"e":"Aorta začíná v levé komoře a rozvádí krev do tělního oběhu."},{"cat":"SRDCE","diagram":"vena_cava","q":"Do které srdeční dutiny ústí horní a dolní dutá žíla?","o":["Levé síně","Levé komory","Pravé síně","Pravé komory"],"a":2,"e":"Duté žíly přivádějí systémovou žilní krev do pravé síně."},{"cat":"SRDCE","diagram":"pulm_trunk","q":"Která srdeční komora pumpuje krev do plicního kmene?","o":["Pravá komora","Levá komora","Levá síň","Pravá síň"],"a":0,"e":"Plicní kmen vystupuje z pravé komory a rozděluje se na plicní tepny."},{"cat":"SRDCE","diagram":"left_atrium","q":"Co přivádí krev do levé síně?","o":["Aorta","Duté žíly","Plicní tepny","Plicní žíly"],"a":3,"e":"Levá síň přijímá krev z plic prostřednictvím plicních žil."},{"cat":"CÉVY","diagram":"micro","q":"Které pořadí odpovídá průtoku přes mikrocirkulaci?","o":["Žíla → tepna → vlásečnice","Tepénka → vlásečnice → žilka","Vlásečnice → tepénka → aorta","Aorta → žíla → tepénka"],"a":1,"e":"Tepénky přivádějí krev do vlásečnic a z nich krev odtéká do žilek."},{"cat":"CÉVY","diagram":"definition_art","q":"Co je nejpřesnější definicí tepny?","o":["Céva, která vždy vede okysličenou krev","Céva, která vždy vede krev do plic","Céva, která vede krev od srdce","Céva s chlopněmi v končetinách"],"a":2,"e":"Tepna se definuje směrem toku od srdce; obsah kyslíku není univerzální rozlišovací znak."},{"cat":"CÉVY","diagram":"definition_vein","q":"Co je nejpřesnější definicí žíly?","o":["Céva, která vede krev k srdci","Céva, která vždy vede neokysličenou krev","Nejmenší céva v těle","Céva vystupující z levé komory"],"a":0,"e":"Žíla se definuje směrem toku k srdci; plicní žíly například nesou okysličenou krev."},{"cat":"CÉVY","diagram":"valves","q":"K čemu slouží chlopně v mnoha žilách končetin?","o":["Zvyšují tvorbu krvinek","Mění žílu na tepnu","Okysličují krev","Pomáhají bránit zpětnému toku krve"],"a":3,"e":"Žilní chlopně podporují jednosměrný tok směrem k srdci a omezují zpětný tok."}];const pulses=document.getElementById('pulses');for(let j=0;j<15;j++){let p=document.createElement('div');p.className='pulse';pulses.appendChild(p)}
function arrow(x1,y1,x2,y2,color){return `<line x1='${x1}' y1='${y1}' x2='${x2}' y2='${y2}' stroke='${color}' stroke-width='7' marker-end='url(#arr)'/>`}function node(x,y,t,c='#dce8f0'){return `<circle cx='${x}' cy='${y}' r='42' fill='#132330' stroke='${c}' stroke-width='3'/><text x='${x}' y='${y+5}' text-anchor='middle' font-size='15' fill='#fff' font-weight='700'>${t}</text>`}
function diag(t){let s=`<svg viewBox='0 0 520 340' xmlns='http://www.w3.org/2000/svg'><defs><marker id='arr' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L0,6 L9,3 z' fill='#dce8f0'/></marker></defs>`;if(t==='away')s+=node(100,170,'SRDCE','#ef4444')+node(410,170,'TĚLO','#7dd3fc')+arrow(150,170,360,170,'#ef4444');else if(t==='toward')s+=node(100,170,'TĚLO','#7dd3fc')+node(410,170,'SRDCE','#ef4444')+arrow(150,170,360,170,'#38bdf8');else if(t==='capillary')s+=node(85,170,'TEPÉNKA','#ef4444')+node(260,170,'VLÁSEČNICE','#fde68a')+node(435,170,'ŽILKA','#38bdf8')+arrow(130,170,210,170,'#ef4444')+arrow(310,170,390,170,'#38bdf8');else if(t==='pulmonary')s+=node(80,240,'PK','#38bdf8')+node(260,90,'PLÍCE','#7dd3fc')+node(440,240,'LS','#ef4444')+arrow(115,210,225,120,'#38bdf8')+arrow(295,120,405,210,'#ef4444');else if(t==='systemic')s+=node(80,100,'LK','#ef4444')+node(440,100,'TĚLO','#fbbf24')+node(440,260,'PŽ','#38bdf8')+node(80,260,'PS','#38bdf8')+arrow(125,100,390,100,'#ef4444')+arrow(440,145,440,215,'#8b5cf6')+arrow(390,260,130,260,'#38bdf8');else if(t==='pulm_art')s+=node(100,170,'PK','#38bdf8')+node(410,170,'PLÍCE','#7dd3fc')+arrow(150,170,360,170,'#38bdf8')+`<text x='260' y='135' text-anchor='middle' fill='#9fd9ff'>PLICNÍ TEPNY</text>`;else if(t==='pulm_vein')s+=node(100,170,'PLÍCE','#7dd3fc')+node(410,170,'LS','#ef4444')+arrow(150,170,360,170,'#ef4444')+`<text x='260' y='135' text-anchor='middle' fill='#fecaca'>PLICNÍ ŽÍLY</text>`;else if(t==='aorta')s+=node(120,190,'LK','#ef4444')+node(400,90,'AORTA','#ef4444')+arrow(155,160,355,105,'#ef4444');else if(t==='vena_cava')s+=node(110,90,'DUTÁ ŽÍLA','#38bdf8')+node(400,190,'PS','#38bdf8')+arrow(150,105,355,175,'#38bdf8');else if(t==='pulm_trunk')s+=node(120,190,'PK','#38bdf8')+node(400,90,'PLICNÍ KMEN','#38bdf8')+arrow(155,160,355,105,'#38bdf8');else if(t==='left_atrium')s+=node(100,170,'PLÍCE','#7dd3fc')+node(410,170,'LS','#ef4444')+arrow(150,170,360,170,'#ef4444');else if(t==='micro')s+=node(80,170,'TEPÉNKA','#ef4444')+node(260,170,'VLÁSEČNICE','#fde68a')+node(440,170,'ŽILKA','#38bdf8')+arrow(125,170,210,170,'#ef4444')+arrow(310,170,395,170,'#38bdf8');else if(t==='definition_art')s+=node(100,170,'SRDCE','#ef4444')+node(410,170,'?','#fbbf24')+arrow(150,170,360,170,'#ef4444');else if(t==='definition_vein')s+=node(100,170,'?','#fbbf24')+node(410,170,'SRDCE','#ef4444')+arrow(150,170,360,170,'#38bdf8');else s+=node(100,170,'KONČETINA','#7dd3fc')+node(410,170,'SRDCE','#ef4444')+arrow(150,170,360,170,'#38bdf8')+`<path d='M245 140 L260 170 L275 140' fill='none' stroke='#fff' stroke-width='5'/><path d='M245 200 L260 170 L275 200' fill='none' stroke='#fff' stroke-width='5'/>`;return s+'</svg>'}
function render(){locked=false;let x=questions[i];document.getElementById('cat').textContent=x.cat+' · SCHÉMA '+(i+1)+'/15';document.getElementById('diagram').innerHTML=diag(x.diagram);document.getElementById('q').textContent=x.q;document.getElementById('answers').innerHTML=x.o.map((o,j)=>'<button class="answer">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('');document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('nextBtn').style.display='none';wireAnswers();}function markProgress(idx,ok){pulses.children[idx].classList.add('done')}function resetProgress(){[...pulses.children].forEach(p=>p.className='pulse')}
let i=0,score=0,locked=false; const total=15;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function wireAnswers(){document.querySelectorAll('.answer').forEach((b,idx)=>b.onclick=()=>choose(idx,b));}
function choose(idx,btn){if(locked)return;locked=true;const q=questions[i];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===idx&&j!==q.a)b.classList.add('wrong')});if(idx===q.a)score++;document.getElementById('feedback').innerHTML='<b>'+(idx===q.a?'Správně.':'Tentokrát ne.')+'</b> '+esc(q.e);document.getElementById('feedback').classList.add('show');document.getElementById('nextBtn').style.display='inline-block';markProgress(i,idx===q.a);}
document.getElementById('nextBtn').onclick=()=>{i++;if(i<total)render();else finish();};
function finish(){document.getElementById('quiz').style.display='none';const r=document.getElementById('result');r.style.display='block';document.getElementById('score').textContent=score+' / '+total;document.getElementById('resultText').textContent=score>=13?'Výborný výsledek.':score>=10?'Velmi slušné skóre.':score>=7?'Dobrá polovina, ale pár pastí tu bylo.':'Tenhle svět umí překvapit. Zkuste to ještě jednou.';}
document.getElementById('restartBtn').onclick=()=>{i=0;score=0;locked=false;resetProgress();document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';render();};
render();</script></body></html>
