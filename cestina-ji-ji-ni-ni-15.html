<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz z češtiny: Ji, jí, ni, ní. Dáte 15 zájmen bez chyby?</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font:inherit}
:root{--accent:#b02132;--ok:#1e9e63;--bad:#d33f49;--ink:#18202a}
body{background:#e8ecef;color:#1f2933}.card{background:#f7f7f2;border:1px solid #a9b4bd}.answer{background:#fff;color:#1e2c3a;border:2px solid #c7d1d8}.feedback{background:#e9eef1}.railbox{width:min(650px,100%);min-height:250px;background:linear-gradient(180deg,#f6edcf 0 58%,#59636c 58% 100%);border:5px solid #27333d;border-radius:16px;position:relative;padding:24px}.ticket{background:#fff9e9;border:2px dashed #ae9a6f;padding:18px 18px;font-size:20px;font-weight:800;box-shadow:0 4px 0 #d2c59f}.ticket b{color:#b02132}.rails{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:absolute;left:18px;right:18px;bottom:20px}.rails span{background:#27333d;color:#fff;border:3px solid #d7a739;border-radius:12px;padding:12px;text-align:center;font-weight:1000;font-size:24px}.signal{position:absolute;right:18px;top:85px;border-radius:999px;padding:8px 12px;font-weight:1000;color:white}.signal.go{background:#1e9e63}.signal.stop{background:#d33f49}
.quiz-wrap{width:min(1120px,100%);margin:0 auto;padding:22px}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.72}h1{font-size:clamp(28px,4vw,48px);line-height:1.02;margin:8px 0 10px}.lead{font-size:clamp(15px,2vw,19px);line-height:1.55;max-width:850px;margin:0 0 18px}.hud{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:14px 0}.progress{height:12px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.12)}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:.35s}.counter{font-weight:850;min-width:76px;text-align:right}.card{border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.12);overflow:hidden}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.15;margin:6px 0 18px}.visual{min-height:250px;display:grid;place-items:center;margin:8px 0 20px;position:relative}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:0;border-radius:15px;padding:14px 16px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:54px}.answer:hover{transform:translateY(-1px)}.answer[disabled]{cursor:default}.answer.ok{background:var(--ok)!important;color:#fff!important}.answer.bad{background:var(--bad)!important;color:#fff!important}.feedback{min-height:70px;margin-top:14px;padding:13px 15px;border-radius:14px;line-height:1.45;display:none}.feedback.show{display:block}.next{display:none;margin-top:14px;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.next.show{display:inline-block}.result{display:none;text-align:center;padding:34px 18px}.result.show{display:block}.result .score{font-size:clamp(54px,10vw,100px);font-weight:1000;line-height:.9;margin:16px 0}.restart{border:0;border-radius:14px;padding:13px 20px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.hidden{display:none!important}

@media(max-width:620px){.quiz-wrap{padding:12px}.card{padding:14px;border-radius:18px}.answers{grid-template-columns:1fr}.visual{min-height:220px}h1{font-size:30px}.question{font-size:23px}}
</style></head><body><main class="quiz-wrap">
<div class="topline"><div class="eyebrow">14. 10. 2026 • KVÍZ</div><div class="mini-brand">ADAM HOLL</div></div>
<h1>Kvíz z češtiny: Ji, jí, ni, ní. Dáte 15 zájmen bez chyby?</h1><p class="lead">Čtyři krátké tvary, patnáct běžných vět. Rozhoduje pád a hlavně to, jestli před zájmenem stojí předložka.</p>
<div class="hud"><div class="progress"><i id="bar"></i></div><div class="counter" id="counter">01 / 15</div></div>
<section class="card" id="game"><div id="sceneMeta" class="scene-meta"></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ →</button></section>
<section class="card result" id="result"><div class="eyebrow">HOTOVO</div><div class="score" id="score"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="restart" id="restart">HRÁT ZNOVU</button></section>
</main><script>
const Q=[{"q": "Viděl jsem ___ včera v tramvaji.", "a": "ji", "w": ["jí", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 01", "explain": "4. pád bez předložky: viděl jsem koho? ji.", "options": ["ji", "jí", "ni", "ní"], "correct": 0}, {"q": "Předal jsem ___ klíče od bytu.", "a": "jí", "w": ["ji", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 02", "explain": "3. pád bez předložky: předal jsem komu? jí.", "options": ["ji", "jí", "ni", "ní"], "correct": 1}, {"q": "Bez ___ bych ten projekt nedokončil.", "a": "ní", "w": ["ji", "jí", "ni"], "v": "rail", "meta": "VÝHYBKA 03", "explain": "Po předložce bez se počáteční j- mění na n-: bez ní.", "options": ["ji", "jí", "ní", "ni"], "correct": 2}, {"q": "Čekám tu na ___ už deset minut.", "a": "ni", "w": ["ji", "jí", "ní"], "v": "rail", "meta": "VÝHYBKA 04", "explain": "Po předložce na ve 4. pádě je náležitý tvar ni: čekám na ni.", "options": ["ji", "jí", "ní", "ni"], "correct": 3}, {"q": "Mluvili jsme o ___ celé odpoledne.", "a": "ní", "w": ["ji", "jí", "ni"], "v": "rail", "meta": "VÝHYBKA 05", "explain": "Po předložce o v 6. pádě: o ní.", "options": ["ji", "ní", "jí", "ni"], "correct": 1}, {"q": "Poslal jsem ___ krátkou zprávu.", "a": "jí", "w": ["ji", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 06", "explain": "3. pád bez předložky: poslal jsem komu? jí.", "options": ["ji", "ni", "ní", "jí"], "correct": 3}, {"q": "Znám ___ už od školy.", "a": "ji", "w": ["jí", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 07", "explain": "4. pád bez předložky: znám koho? ji.", "options": ["ji", "jí", "ni", "ní"], "correct": 0}, {"q": "Šel jsem k ___ po práci.", "a": "ní", "w": ["ji", "jí", "ni"], "v": "rail", "meta": "VÝHYBKA 08", "explain": "Po předložce k se užívá n-ový tvar: k ní.", "options": ["ji", "jí", "ní", "ni"], "correct": 2}, {"q": "Seděl jsem vedle ___ v první řadě.", "a": "ní", "w": ["ji", "jí", "ni"], "v": "rail", "meta": "VÝHYBKA 09", "explain": "Po předložce vedle: vedle ní.", "options": ["ji", "jí", "ni", "ní"], "correct": 3}, {"q": "Koupil jsem dárek pro ___.", "a": "ni", "w": ["ji", "jí", "ní"], "v": "rail", "meta": "VÝHYBKA 10", "explain": "Po předložce pro ve 4. pádě: pro ni.", "options": ["ni", "ji", "jí", "ní"], "correct": 0}, {"q": "Pomohl jsem ___ s těžkým kufrem.", "a": "jí", "w": ["ji", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 11", "explain": "3. pád bez předložky: pomohl jsem komu? jí.", "options": ["ji", "ni", "jí", "ní"], "correct": 2}, {"q": "Zeptal jsem se ___ na cestu.", "a": "jí", "w": ["ji", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 12", "explain": "Sloveso zeptat se se pojí se 2. pádem: zeptal jsem se koho? jí.", "options": ["ji", "jí", "ni", "ní"], "correct": 1}, {"q": "Nemohl jsem ___ v davu najít.", "a": "ji", "w": ["jí", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 13", "explain": "4. pád bez předložky: najít koho? ji.", "options": ["ji", "jí", "ni", "ní"], "correct": 0}, {"q": "Přišel jsem s ___ na schůzku.", "a": "ní", "w": ["ji", "jí", "ni"], "v": "rail", "meta": "VÝHYBKA 14", "explain": "Po předložce s v 7. pádě: s ní.", "options": ["ji", "jí", "ni", "ní"], "correct": 3}, {"q": "Napsal jsem ___ ještě večer.", "a": "jí", "w": ["ji", "ni", "ní"], "v": "rail", "meta": "VÝHYBKA 15", "explain": "3. pád bez předložky: napsal jsem komu? jí.", "options": ["ji", "jí", "ni", "ní"], "correct": 1}];
let idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){const q=Q[idx];locked=false;$('counter').textContent=String(idx+1).padStart(2,'0')+' / '+String(Q.length).padStart(2,'0');$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('sceneMeta').textContent=q.meta||'';$('feedback').className='feedback';$('feedback').textContent='';$('next').className='next';$('answers').innerHTML=''; renderVisual(q,idx,false);q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(i,b);$('answers').appendChild(b);})}
function choose(i,b){if(locked)return;locked=true;const q=Q[idx];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('ok');if(i!==q.correct)b.classList.add('bad');else score++;$('feedback').textContent=(i===q.correct?'✓ ':'✕ ')+q.explain;$('feedback').className='feedback show';renderVisual(q,idx,true,i===q.correct);$('next').textContent=idx===Q.length-1?'VÝSLEDEK →':'DALŠÍ →';$('next').className='next show';}
$('next').onclick=()=>{idx++;if(idx>=Q.length)finish();else render();};
function finish(){$('bar').style.width='100%';$('game').classList.add('hidden');$('result').classList.add('show');$('score').textContent=score+' / '+Q.length;const pct=score/Q.length;let t,x;if(pct>=.87){t='VÝHYBKY SEDÍ';x='Patnáct vět projelo bez vykolejení.'}else if(pct>=.6){t='DOBRÁ JAZYKOVÁ TRAŤ';x='Princip znáte, jen pár pádů potřebuje větší pozornost.'}else{t='VÝHYBKÁŘSKÁ SMĚNA NAVÍC';x='Ji/jí a ni/ní jsou krátké, ale umějí potrápit. Druhé kolo bude jistější.'}$('resultTitle').textContent=t;$('resultText').textContent=x;}
$('restart').onclick=()=>{idx=0;score=0;$('result').classList.remove('show');$('game').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};

function renderVisual(q,i,after,correct=true){let tracks=['ji','jí','ni','ní'];$('visual').innerHTML=`<div class="railbox"><div class="ticket">${q.q.replace('___','<b>___</b>')}</div><div class="rails">${tracks.map(x=>`<span>${x}</span>`).join('')}</div>${after?`<div class="signal ${correct?'go':'stop'}">${correct?'VĚTA PROJELA':'VÝHYBKA OPRAVENA'}</div>`:''}</div>`}

render();
</script></body></html>
