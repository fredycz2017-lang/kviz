<!doctype html><html lang='cs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kvíz: Amonit, trilobit, belemnit. Poznáte 15 fosilií a stop podle tvaru?</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button{font:inherit}.wrap{max-width:1180px;margin:auto;padding:14px}h1{font-size:clamp(27px,4vw,48px);line-height:1.05;margin:6px 0 8px}.lead{line-height:1.5;max-width:940px;margin:0}.opt{border-radius:14px;padding:13px 14px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:56px}.opt:hover{transform:translateY(-1px)}.opt.correct{background:#dff7e9!important;color:#173723!important;border-color:#67d995!important}.opt.wrong{background:#ffe1e5!important;color:#5b1520!important;border-color:#ff7786!important}.opt:disabled{opacity:1;cursor:default}.feedback{display:none;border-radius:14px;padding:12px 14px;margin-top:11px;line-height:1.45}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.next{display:none;margin:11px 0 0 auto;border:none;border-radius:13px;padding:12px 17px;font-weight:1000;cursor:pointer}.result{display:none;text-align:center;padding:38px 15px}.result.show{display:block}.score{font-size:70px;font-weight:1000}.resText{max-width:760px;margin:10px auto 18px;line-height:1.5}.restart{border:none;border-radius:14px;padding:13px 18px;font-weight:1000;cursor:pointer}@media(max-width:700px){.wrap{padding:8px}.opt{font-size:15px}} body{background:#11100d;color:#fff9ed}header{border:1px solid #6c5c3d;border-radius:24px;padding:18px 20px;background:linear-gradient(135deg,#2a2518,#11100d);margin-bottom:14px}.lead{color:#c9c0a7}.kicker{font-size:11px;letter-spacing:.16em;font-weight:900;color:#d8b96b}.deposit{display:grid;grid-template-columns:250px 1fr;gap:14px;border:1px solid #6c5c3d;border-radius:22px;padding:15px;background:#17150f}.drawers{border:1px solid #51472f;border-radius:18px;padding:12px}.drawergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.drawer{height:50px;border:1px solid #433a28;border-radius:9px;display:grid;place-items:center;color:#665a3e}.drawer.done{background:#40371f;color:#ffe7a4;border-color:#d8b96b}.stone{min-height:320px;border-radius:18px;background:radial-gradient(circle,#81765d,#4d4636 55%,#272319);display:grid;place-items:center;position:relative}.glyph{width:300px;height:210px}.question{font-size:24px;font-weight:1000;margin:13px 0}#options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid #5b4e34;background:#211d14;color:#fff9ed}.feedback{background:#211d14;border:1px solid #5b4e34}.feedback strong{color:#d8b96b}.next,.restart{background:#d8b96b;color:#1b170e}.score{color:#d8b96b}.resText{color:#c9c0a7}@media(max-width:820px){.deposit{grid-template-columns:1fr}.drawers{order:2}#options{grid-template-columns:1fr}}</style></head><body><div class='wrap'><header><div class='kicker'>PALEONTOLOGICKÝ DEPOZITÁŘ // 15 KAZET</div><h1>Kvíz: Amonit, trilobit, belemnit. Poznáte 15 fosilií a stop podle tvaru?</h1><p class='lead'>Schránky, zuby, články i stopní fosilie musí prozradit svůj původ jen tvarem.</p></header><main class='deposit'><aside class='drawers'><div class='kicker'>KAZETY</div><div class='drawergrid' id='drawers'></div></aside><section><div id='quiz'><div class='stone'><div id='fossil'></div></div><div class='question'>Co je zachyceno v této kamenné kazetě?</div><div id='options'></div><div class='feedback' id='feedback'></div><button class='next' id='next'>DALŠÍ KAZETA →</button></div><section class='result' id='result'><div class='kicker'>DEPOZITÁŘ UZAVŘEN</div><h2>Patnáct kazet zařazeno</h2><div class='score' id='score'></div><p class='resText' id='resText'></p><button class='restart' id='restart'>OTEVŘÍT DEPO ZNOVU</button></section></section></main></div><script>const Q=[{"name":"Amonit","kind":"spiral","options":["Amonit","Trilobit","Belemnit","Stvol lilijice"],"a":0,"exp":"Spirálně stočená schránka s komůrkami."},{"name":"Trilobit","kind":"segments","options":["Brachiopod","Kostra ryby","Ježovka","Trilobit"],"a":3,"exp":"Článkované oválné tělo rozdělené do tří laloků."},{"name":"Belemnit","kind":"cone","options":["Korál","Stvol lilijice","Belemnit","Žraločí zub"],"a":2,"exp":"Protažený kuželovitý rostrum."},{"name":"Brachiopod","kind":"shell","options":["Ježovka","Brachiopod","Kostra ryby","Belemnit"],"a":1,"exp":"Žebrovaná souměrná schránka."},{"name":"Stvol lilijice","kind":"discs","options":["Stvol lilijice","Mlž","Stopa dinosaura","Brachiopod"],"a":0,"exp":"Řetízek kruhových článků."},{"name":"Žraločí zub","kind":"tooth","options":["Ježovka","Orthoceras","Amonit","Žraločí zub"],"a":3,"exp":"Trojúhelníkovitý zub s kořenem."},{"name":"Otisk kapradiny","kind":"fern","options":["Brachiopod","Amonit","Otisk kapradiny","Orthoceras"],"a":2,"exp":"Větvený list s opakujícími se lístky."},{"name":"Kostra ryby","kind":"fish","options":["Ježovka","Kostra ryby","Amonit","Mlž"],"a":1,"exp":"Páteř, žebra a ploutve."},{"name":"Stopa dinosaura","kind":"track","options":["Stopa dinosaura","Belemnit","Stopní fosilie – chodbička","Brachiopod"],"a":0,"exp":"Tříprstý otisk."},{"name":"Mlž","kind":"clam","options":["Stvol lilijice","Ježovka","Amonit","Mlž"],"a":3,"exp":"Dvojchlopňová lastura."},{"name":"Plž","kind":"snail","options":["Mlž","Brachiopod","Plž","Otisk kapradiny"],"a":2,"exp":"Spirální ulita."},{"name":"Ježovka","kind":"urchin","options":["Plž","Ježovka","Stopa dinosaura","Amonit"],"a":1,"exp":"Kruh s pětidílnou paprsčitou kresbou."},{"name":"Korál","kind":"coral","options":["Korál","Plž","Žraločí zub","Brachiopod"],"a":0,"exp":"Kolonie drobných kalíšků."},{"name":"Orthoceras","kind":"chamber","options":["Korál","Plž","Amonit","Orthoceras"],"a":3,"exp":"Rovná komůrkovaná schránka."},{"name":"Stopní fosilie – chodbička","kind":"burrow","options":["Trilobit","Brachiopod","Stopní fosilie – chodbička","Amonit"],"a":2,"exp":"Vlnitá chodbička v sedimentu."}];const GOOD="Výborně. Tvar fosilie vám stačí skoro vždy.",MID="Dobré. Většinu schránek a stop poznáváte.",LOW="Depozitář vás tentokrát potrápil.";function glyph(k){let c='#e4d3a4',d='#5c5139';let s='';if(k==='spiral')s='<circle cx="150" cy="105" r="80" fill="none" stroke="'+c+'" stroke-width="16"/><path d="M150 25c-80 0-105 110-25 145 70 30 120-60 60-95-45-25-75 35-30 55" fill="none" stroke="'+c+'" stroke-width="14"/>';else if(k==='segments')s='<ellipse cx="150" cy="105" rx="90" ry="75" fill="'+d+'" stroke="'+c+'" stroke-width="8"/><path d="M115 35v140M185 35v140M70 70h160M62 105h176M70 140h160" stroke="'+c+'" stroke-width="6"/>';else if(k==='cone')s='<path d="M45 150L255 55l25 35L60 180Z" fill="'+d+'" stroke="'+c+'" stroke-width="8"/>';else if(k==='shell'||k==='clam')s='<path d="M55 140Q75 35 150 45Q225 35 245 140Q150 190 55 140Z" fill="'+d+'" stroke="'+c+'" stroke-width="8"/><path d="M150 48v135M85 120q65-40 130 0" stroke="'+c+'" stroke-width="5" fill="none"/>';else if(k==='discs')s=Array.from({length:7},(_,j)=>'<circle cx="'+(45+j*35)+'" cy="105" r="18" fill="'+d+'" stroke="'+c+'" stroke-width="6"/><circle cx="'+(45+j*35)+'" cy="105" r="5" fill="#81765d"/>').join('');else if(k==='tooth')s='<path d="M150 20L245 180l-70-20h-50l-70 20Z" fill="'+d+'" stroke="'+c+'" stroke-width="8"/>';else if(k==='fern')s='<path d="M150 20v170" stroke="'+c+'" stroke-width="7"/>'+Array.from({length:7},(_,j)=>'<path d="M150 '+(45+j*20)+'q-45-30-85-20M150 '+(45+j*20)+'q45-30 85-20" stroke="'+c+'" stroke-width="6"/>').join('');else if(k==='fish')s='<path d="M45 105Q115 40 215 105Q115 170 45 105ZM215 105l45-38v76z" fill="none" stroke="'+c+'" stroke-width="7"/><path d="M65 105h150M95 70l25 70M130 55l20 100M165 60l12 90" stroke="'+c+'" stroke-width="5"/>';else if(k==='track')s='<path d="M150 180c-25-35-25-60-5-75L95 45q-10-22 10-28q20 0 45 55q25-55 45-55q20 6 10 28l-50 60q20 15 5 75z" fill="'+d+'" stroke="'+c+'" stroke-width="8"/>';else if(k==='snail')s='<path d="M160 45c-80-15-105 75-35 100c55 20 92-35 62-67c-22-24-60-5-45 20c10 16 30 3 25-7" fill="none" stroke="'+c+'" stroke-width="13"/><path d="M160 145q60 0 85 35H115q18-28 45-35z" fill="'+d+'" stroke="'+c+'" stroke-width="6"/>';else if(k==='urchin')s='<circle cx="150" cy="105" r="78" fill="'+d+'" stroke="'+c+'" stroke-width="8"/><path d="M150 105l0-65M150 105l62-20M150 105l38 55M150 105l-38 55M150 105l-62-20" stroke="'+c+'" stroke-width="6"/>';else if(k==='coral')s=Array.from({length:15},(_,j)=>'<circle cx="'+(65+(j%5)*42)+'" cy="'+(55+Math.floor(j/5)*50)+'" r="18" fill="none" stroke="'+c+'" stroke-width="7"/>').join('');else if(k==='chamber')s='<path d="M45 165L255 45l-30 150Z" fill="'+d+'" stroke="'+c+'" stroke-width="8"/><path d="M90 140l15 40M125 120l18 48M160 100l20 55M195 80l22 60" stroke="'+c+'" stroke-width="5"/>';else s='<path d="M45 125c35-80 85 70 120-20c35-75 75 65 105-10" fill="none" stroke="'+c+'" stroke-width="24" stroke-linecap="round"/>';return '<svg class="glyph" viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>'}function resetWorld(){document.getElementById('drawers').innerHTML=Array.from({length:15},(_,k)=>'<span class="drawer">'+String(k+1).padStart(2,'0')+'</span>').join('')}function afterAnswer(){document.querySelectorAll('.drawer')[i].classList.add('done')}function show(){locked=false;let q=Q[i];document.getElementById('fossil').innerHTML=glyph(q.kind);renderOptions(q);document.getElementById('feedback').className='feedback';document.getElementById('next').style.display='none'}let i=0,score=0,locked=false;function renderOptions(q){let box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>answer(k);box.appendChild(b)})}function answer(k){if(locked)return;locked=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===k&&j!==q.a)b.classList.add('wrong')});if(k===q.a)score++;afterAnswer(k===q.a);let f=document.getElementById('feedback');f.className='feedback show';f.innerHTML='<strong>'+(k===q.a?'SPRÁVNĚ':'TENTOKRÁT NE')+'</strong>'+q.exp;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;if(i<Q.length)show();else finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / '+Q.length;document.getElementById('resText').textContent=score>=Math.ceil(Q.length*.85)?GOOD:score>=Math.ceil(Q.length*.6)?MID:LOW}document.getElementById('restart').onclick=()=>{i=0;score=0;locked=false;resetWorld();document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='';show()};resetWorld();show();</script></body></html>
