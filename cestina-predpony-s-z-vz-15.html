<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz z češtiny: S-, z-, vz-. Doplníte 15 běžných sloves bez chyby?</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101219;color:#f5f7ff;font-family:Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1120px;margin:auto;padding:12px}header{border:1px solid #4d5474;background:linear-gradient(135deg,#1d2140,#101219);border-radius:23px;padding:18px}.k{color:#9aa8ff;font-size:11px;font-weight:900;letter-spacing:.15em}h1{font-size:clamp(27px,4vw,47px);line-height:1.05;margin:6px 0}.lead{color:#bdc3d8;max-width:880px;line-height:1.45}.rail{margin-top:14px;border:1px solid #4d5474;border-radius:22px;background:#151826;padding:17px}.progress{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-bottom:16px}.p{height:8px;border-radius:8px;background:#303650}.p.done{background:#9aa8ff;box-shadow:0 0 8px #9aa8ff88}.signal{font-size:clamp(28px,5vw,56px);font-weight:1000;text-align:center;padding:36px 12px;border:1px dashed #4d5474;border-radius:18px;background:#0e111b}.blank{color:#ffd76b;border-bottom:5px solid #ffd76b;padding:0 8px}.switches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.opt{border:1px solid #505a82;background:#20253b;color:#fff;border-radius:15px;padding:16px;text-align:center;font-size:21px;font-weight:1000;cursor:pointer}.opt:hover{border-color:#9aa8ff}.correct{background:#dff6e8!important;color:#173723!important;border-color:#69d394!important}.wrong{background:#ffe1e5!important;color:#591722!important;border-color:#ff7685!important}.meta{display:flex;justify-content:space-between;color:#9098b3;font-size:12px;font-weight:900;margin-bottom:10px}.fb{display:none;margin-top:12px;border:1px solid #4d5474;border-radius:13px;padding:12px;color:#d7dbee}.fb.show{display:block}.next{display:none;margin:11px 0 0 auto;border:0;border-radius:12px;background:#9aa8ff;color:#111526;padding:12px 16px;font-weight:1000}.result{display:none;text-align:center;padding:38px}.result.show{display:block}.score{font-size:70px;font-weight:1000;color:#9aa8ff}@media(max-width:640px){.switches{grid-template-columns:1fr 1fr}.signal{padding:28px 8px}}
</style></head><body><div class="wrap"><header><div class="k">PŘEDPONOVÁ VÝHYBKA // 15 SLOVES</div><h1>Kvíz z češtiny: S-, z-, vz-. Doplníte 15 běžných sloves bez chyby?</h1><p class="lead">Kořen slovesa přijede doprostřed. Vyberete správnou kolej: s-, z-, vz-, nebo žádnou z nich? Kontext je vždy součástí otázky.</p></header><main class="rail"><div id="quiz"><div class="meta"><span id="n"></span><span id="word"></span></div><div class="progress" id="progress"></div><div class="signal" id="stem"></div><div class="switches" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">DALŠÍ VÝHYBKA →</button></div><section class="result" id="result"><div class="k">VÝHYBKY NASTAVENÉ</div><h2>Patnáct sloves projelo</h2><div class="score" id="score"></div><p id="rt"></p><button class="next" style="display:inline-block" id="restart">ZNOVU</button></section></main></div><script>
const Q=[{"stem":"___pojit dvě části dohromady","root":"pojit","a":0,"word":"spojit","e":"Předpona s- vyjadřuje směřování dohromady: spojit."},{"stem":"___hromáždit lidi na jednom místě","root":"hromáždit","a":0,"word":"shromáždit","e":"U významu soustředění dohromady píšeme shromáždit."},{"stem":"___mést drobky ze stolu","root":"mést","a":0,"word":"smést","e":"Směřování z povrchu pryč odpovídá předponě s-: smést."},{"stem":"___klonit hlavu dolů","root":"klonit","a":0,"word":"sklonit","e":"Směr dolů je typický význam předpony s-: sklonit."},{"stem":"___balit věci do jednoho balíku","root":"balit","a":0,"word":"sbalit","e":"Sbalit znamená dát věci dohromady do balíku."},{"stem":"___rušit starou smlouvu","root":"rušit","a":1,"word":"zrušit","e":"Správná podoba je zrušit se z-."},{"stem":"___lomit větev na dvě části","root":"lomit","a":1,"word":"zlomit","e":"Dokonavé zlomit píšeme se z-."},{"stem":"___tížit někomu práci","root":"tížit","a":1,"word":"ztížit","e":"Ztížit znamená učinit něco těžším; píše se z-."},{"stem":"___rychlit tempo práce","root":"rychlit","a":1,"word":"zrychlit","e":"Zrychlit = učinit rychlejším, proto z-."},{"stem":"___menšit obrázek na polovinu","root":"menšit","a":1,"word":"zmenšit","e":"Zmenšit = učinit menším, proto z-."},{"stem":"___létnout z ranveje","root":"létnout","a":2,"word":"vzlétnout","e":"Správná podoba je vzlétnout s předponou vz-."},{"stem":"___planout náhlým plamenem","root":"planout","a":2,"word":"vzplanout","e":"Správně vzplanout: začít prudce planout."},{"stem":"___tyčit stožár do svislé polohy","root":"tyčit","a":2,"word":"vztyčit","e":"Správně vztyčit, tedy postavit do vzpřímené polohy."},{"stem":"___budit někoho ze spánku","root":"budit","a":2,"word":"vzbudit","e":"Dokonavé vzbudit píšeme s vz-."},{"stem":"___pomenout si na staré heslo","root":"pomenout","a":2,"word":"vzpomenout","e":"Správná podoba je vzpomenout si."}],labels=['s-','z-','vz-','žádná'];let i=0,s=0,l=false;document.getElementById('progress').innerHTML=Array.from({length:15},()=>'<i class="p"></i>').join('');function show(){l=false;let q=Q[i];document.getElementById('n').textContent=`SLOVESO ${i+1} / 15`;document.getElementById('word').textContent='KOŘEN: '+q.root;document.getElementById('stem').innerHTML=q.stem.replace('___','<span class="blank">___</span>');let o=document.getElementById('opts');o.innerHTML='';labels.forEach((x,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>ans(j);o.appendChild(b)});document.getElementById('fb').className='fb';document.getElementById('next').style.display='none'}function ans(j){if(l)return;l=true;let q=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===j&&j!==q.a)b.classList.add('wrong')});if(j===q.a)s++;document.querySelectorAll('.p')[i].classList.add('done');let f=document.getElementById('fb');f.className='fb show';f.innerHTML=`<b>${j===q.a?'SPRÁVNĚ':'TENTOKRÁT NE'} — ${q.word}</b><br>${q.e}`;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<Q.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=s+' / 15';document.getElementById('rt').textContent=s>=13?'Výborně. Předpony držíte i bez autocorrectu.':s>=9?'Dobré. Významové vodítko většinou pomohlo, pár slov je ale potřeba si pamatovat.':'Druhé kolo zkuste s pravidlem: s- často směřuje dohromady nebo dolů, z- často mění stav; některé podoby je však nutné znát.'}document.getElementById('restart').onclick=()=>{i=0;s=0;document.querySelectorAll('.p').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='';show()};show();
</script></body></html>
