<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz z češtiny: Např., apod., č. j. Napíšete 15 běžných zkratek správně?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#ece8df;color:#26231f}.wrap{max-width:1100px;margin:auto;padding:18px}header{background:#fbfaf6;border:2px solid #6b665d;border-radius:18px;padding:18px;box-shadow:0 12px 24px #00000012}h1{margin:0;font-size:clamp(26px,4vw,42px);line-height:1.06}.sub{color:#5d5952;line-height:1.5}.desk{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:18px}.machine,.sheet{background:#f9f7f1;border:2px solid #777168;border-radius:16px}.machine{padding:16px;height:max-content;position:sticky;top:12px}.typewriter{background:#3f403e;border-radius:18px 18px 10px 10px;padding:16px;box-shadow:inset 0 -12px 0 #292a29}.paperstrip{background:white;color:#1f1f1f;height:115px;border:1px solid #aaa;padding:16px;font-family:'Courier New',monospace;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 #ddd}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}.key{height:22px;border-radius:50%;background:#d5d0c6;border:2px solid #868178}.marks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.mark{height:18px;border-radius:4px;background:#b6b0a5}.mark.on{background:#a73f36}.sheet{padding:20px;background:linear-gradient(90deg,#f7f5ef 0 36px,#d85e5e 36px 38px,#f7f5ef 38px)}.zone{display:inline-block;margin-left:28px;background:#e9e4db;border:1px solid #aaa196;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.q{font-family:'Courier New',monospace;font-size:clamp(20px,2.8vw,28px);font-weight:700;line-height:1.25;margin:14px 0 14px 28px}.answers{display:grid;gap:10px;margin-left:28px}.answer{background:#fff;border:2px solid #b6aea2;padding:13px;border-radius:9px;text-align:left;font-family:'Courier New',monospace;font-size:17px;cursor:pointer}.answer.correct{background:#e3f2e5;border-color:#4f8158}.answer.wrong{background:#f3dddd;border-color:#a14d4d}.answer.locked{pointer-events:none}.feedback{display:none;margin:14px 0 0 28px;padding:12px;border-left:5px solid #a73f36;background:#efebe3;line-height:1.5}.feedback.show{display:block}.next,.restart{margin:14px 0 0 28px;background:#3f403e;color:white;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:30px}.score{font-size:58px;font-weight:900;color:#a13e35}.band{max-width:620px;margin:10px auto;line-height:1.5}@media(max-width:780px){.desk{grid-template-columns:1fr}.machine{position:static}.q,.answers,.feedback,.next{margin-left:0}.zone{margin-left:0}}
</style></head><body><div class="wrap"><header><h1>Kvíz z češtiny: Např., apod., č. j. Napíšete 15 běžných zkratek správně?</h1><p class="sub">Pravopis a typografie zkratek — ne jejich význam.</p></header><div class="desk"><aside class="machine"><div class="typewriter"><div class="paperstrip" id="token">například</div><div class="keys"><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div></div></div><div style="margin-top:10px;font-weight:700">Korektura <span id="progressText">1 / 15</span></div><div class="marks"><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div><div class="mark"></div></div></aside><main class="sheet"><section id="quizArea"><div class="zone" id="zoneTag"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn" disabled>Další korektura</button></section><section class="result" id="resultArea"><h2>Sazba dokončena</h2><div class="score" id="scoreOut"></div><div class="band" id="bandOut"></div><button class="restart" id="restartBtn">Zkusit znovu</button></section></main></div></div>
<script>
const questions=[{"zone": "BĚŽNÉ", "token": "například", "q": "Která podoba zkratky slova „například“ je správně?", "options": ["např.", "např", "na př.", "nap.ř"], "correct": 0, "explanation": "Ustálená grafická zkratka je „např.“ s tečkou na konci."}, {"zone": "BĚŽNÉ", "token": "a podobně", "q": "Jak se správně zkracuje spojení „a podobně“?", "options": ["a.pod.", "apd.", "apod.", "apod"], "correct": 2, "explanation": "Ustálená podoba je „apod.“."}, {"zone": "BĚŽNÉ", "token": "a tak dále", "q": "Který zápis je správnou zkratkou „a tak dále“?", "options": ["a.t.d.", "atd", "at.d.", "atd."], "correct": 3, "explanation": "Správná ustálená podoba je „atd.“."}, {"zone": "BĚŽNÉ", "token": "to znamená", "q": "Která zkratka odpovídá spojení „to znamená“?", "options": ["tz.", "tzn.", "t.z.n.", "tzn"], "correct": 1, "explanation": "Správná grafická zkratka je „tzn.“."}, {"zone": "BĚŽNÉ", "token": "to jest", "q": "Která podoba je správně pro „to jest“?", "options": ["t.j.", "tj.", "tj", "t. j."], "correct": 1, "explanation": "Ustálená sloučená zkratka je „tj.“."}, {"zone": "ÚŘEDNÍ", "token": "popřípadě", "q": "Jak se běžně zkracuje „popřípadě“?", "options": ["popř.", "popř", "po.př.", "ppř."], "correct": 0, "explanation": "Internetová jazyková příručka uvádí ustálenou podobu „popř.“."}, {"zone": "ÚŘEDNÍ", "token": "mimo jiné", "q": "Která zkratka správně znamená „mimo jiné“?", "options": ["m.j.", "mj", "mj.", "m. j."], "correct": 2, "explanation": "Ustálená sloučená zkratka je „mj.“."}, {"zone": "ÚŘEDNÍ", "token": "circa", "q": "Jak se běžně píše zkratka „cca“ ve významu přibližně?", "options": ["cca.", "c.ca", "c. ca", "cca"], "correct": 3, "explanation": "„cca“ je kontrakční zkratka a tečka se za ní nepíše."}, {"zone": "SPOJENÍ", "token": "číslo jednací", "q": "Která z nabízených podob je správně zapsaná pro „číslo jednací“?", "options": ["č. j.", "č j.", "č.j", "č.j.."], "correct": 0, "explanation": "Podoba „č. j.“ je správná; ÚJČ připouští také sloučenou variantu „čj.“."}, {"zone": "SPOJENÍ", "token": "číslo popisné", "q": "Která z nabízených podob je správně pro „číslo popisné“?", "options": ["čp", "č. p", "č. p.", "č..p."], "correct": 2, "explanation": "Podoba „č. p.“ je správná; vedle ní existuje také sloučené „čp.“."}, {"zone": "SPOJENÍ", "token": "akciová společnost", "q": "Jak se správně zapisuje běžná zkratka „akciová společnost“?", "options": ["a.s.", "a. s.", "a s.", "a.s"], "correct": 1, "explanation": "Grafická zkratka je „a. s.“ s tečkami a mezerou mezi částmi."}, {"zone": "SPOJENÍ", "token": "společnost s ručením omezeným", "q": "Který zápis je správná podoba zkratky „společnost s ručením omezeným“?", "options": ["s.r.o", "s r o.", "s.r.o.", "s. r. o."], "correct": 3, "explanation": "Standardní grafická podoba je „s. r. o.“; příručka uvádí i delší „spol. s r. o.“."}, {"zone": "FINÁLE", "token": "veřejná obchodní společnost", "q": "Která podoba správně zkracuje „veřejná obchodní společnost“?", "options": ["v.o.s", "v o s", "v. o. s.", "v.o.s."], "correct": 2, "explanation": "Správná grafická podoba je „v. o. s.“."}, {"zone": "FINÁLE", "token": "komanditní společnost", "q": "Jak se správně zapisuje zkratka „komanditní společnost“?", "options": ["k. s.", "k.s.", "k s.", "k.s"], "correct": 0, "explanation": "Správná podoba je „k. s.“."}, {"zone": "FINÁLE", "token": "zapsaný spolek", "q": "Která podoba je správně pro „zapsaný spolek“?", "options": ["z.s.", "z. s.", "z s.", "z.s"], "correct": 1, "explanation": "Správná grafická podoba je „z. s.“."}];
let idx=0,score=0,answered=false;
const qEl=document.getElementById('question'), aEl=document.getElementById('answers'), fbEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), progressText=document.getElementById('progressText'), zoneTag=document.getElementById('zoneTag'), quizArea=document.getElementById('quizArea'), resultArea=document.getElementById('resultArea'), scoreOut=document.getElementById('scoreOut'), bandOut=document.getElementById('bandOut'), restartBtn=document.getElementById('restartBtn');
function render(){answered=false;nextBtn.disabled=true;fbEl.classList.remove('show');const q=questions[idx];zoneTag.textContent=q.zone;progressText.textContent=`${idx+1} / ${questions.length}`;qEl.textContent=q.q;document.getElementById('token').textContent=q.token;document.querySelectorAll('.mark').forEach((s,i)=>s.classList.toggle('on',i<idx));;aEl.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;b.onclick=()=>choose(i);aEl.appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[idx];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.add('locked');if(i===q.correct)b.classList.add('correct');if(i===choice&&i!==q.correct)b.classList.add('wrong');});const ok=choice===q.correct;if(ok)score++;fbEl.innerHTML=`<strong>${ok?'Správně.':'Tentokrát ne.'}</strong> ${q.explanation}`;fbEl.classList.add('show');nextBtn.disabled=false;}
nextBtn.onclick=()=>{idx++;if(idx>=questions.length)finish();else render();};
function finish(){quizArea.style.display='none';resultArea.style.display='block';scoreOut.textContent=`${score} / ${questions.length}`;let text='Dobrá práce.';if(score<=5)text='Tenhle svět vás trochu potrápil, ale o to víc jste si z něj odnesli.';else if(score<=10)text='Solidní výsledek. Většinu situací jste zvládli bez většího zaváhání.';else if(score<=13)text='Velmi dobré. V tomhle tématu se orientujete opravdu jistě.';else text='Výborně. Tohle už je skoro bezchybný průchod celým kvízem.';bandOut.textContent=text;document.querySelectorAll('.mark').forEach(s=>s.classList.add('on')); }
restartBtn.onclick=()=>{idx=0;score=0;quizArea.style.display='block';resultArea.style.display='none';document.querySelectorAll('.answer').forEach(x=>x.classList.remove('locked'));render();};
render();
</script></body></html>
