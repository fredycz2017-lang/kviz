<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz: kontrolky na palubní desce</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#202124;--muted:#666;--line:#d8d8d8;--accent:#2f6fed;--choice:#e8edff;--choice-border:#c8d3ff;--ok:#e9f7ee;--ok-border:#69a77a;--bad:#fdecec;--bad-border:#cf7777}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:100%;max-width:700px;margin:0 auto;padding:20px 10px 18px}.head{text-align:center;padding:0 10px 14px}
h1{margin:0 0 9px;font-size:28px;line-height:1.15}.sub{margin:0 auto 7px;max-width:620px;font-size:16px;line-height:1.45;color:#444}.note{margin:0;font-size:13px;color:var(--muted)}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 20px 22px;min-height:440px}
.progress{text-align:center;color:var(--muted);font-size:14px;margin:0 0 8px}.icon{text-align:center;font-size:42px;font-weight:800;min-height:55px;margin:3px 0 5px;color:#333}
.q{text-align:center;font-size:22px;line-height:1.28;color:var(--accent);margin:6px 0 18px}.answers{max-width:530px;margin:0 auto}
.answer{display:block;width:100%;border:1px solid var(--choice-border);background:var(--choice);color:var(--text);padding:15px 13px;margin:9px 0;font-size:16px;line-height:1.3;cursor:pointer}
.answer:hover{filter:brightness(.98)}.answer.correct{background:var(--ok);border-color:var(--ok-border)}.answer.wrong{background:var(--bad);border-color:var(--bad-border)}.answer:disabled{cursor:default;filter:none}
.feedback{display:none;max-width:555px;margin:17px auto 0;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.45;color:#444}.feedback.show{display:block}
.next{display:none;margin:15px auto 0;border:0;border-radius:6px;padding:12px 22px;background:#222;color:#fff;font-size:16px;cursor:pointer}.next.show{display:block}
.result{display:none;text-align:center;padding:34px 20px}.result.show{display:block}.score{font-size:48px;font-weight:800;margin:8px 0 12px}.retry{border:0;border-radius:6px;padding:12px 22px;background:#222;color:#fff;font-size:16px;cursor:pointer}
@media(max-width:560px){.app{padding-top:13px}h1{font-size:23px}.sub{font-size:15px}.quizbox{padding:10px 12px 18px;min-height:430px}.icon{font-size:37px}.q{font-size:19px}.answer{font-size:15px;padding:13px 11px}}
</style></head><body><div class="app"><div class="head"><h1>Poznáte kontrolky na palubní desce?</h1>
<p class="sub">Olej, brzdy, ABS, tlak v pneumatikách nebo airbag. Deset symbolů, které by měl řidič umět aspoň základně přečíst.</p>
<p class="note">Přesný vzhled a postup se může lišit podle vozu. Při skutečné výstraze se řiďte návodem konkrétního automobilu.</p></div>
<div class="quizbox"><div id="play"><div id="progress" class="progress"></div><div id="icon" class="icon"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next">Další otázka</button></div>
<div id="result" class="result"><div>Váš výsledek</div><div id="score" class="score"></div><p id="verdict"></p><button id="retry" class="retry">Zkusit znovu</button></div></div></div>
<script>
const questions=[{"icon": "🛢️", "q": "Rozsvítí se červený symbol olejničky. Co znamená nejčastěji?", "opts": ["Nízký tlak motorového oleje", "Nízkou hladinu kapaliny ostřikovačů", "Poruchu ABS", "Nízký tlak v pneumatikách"], "correct": 0, "explain": "Červená olejnička obvykle varuje před nízkým tlakem motorového oleje. Je to závažné varování a další postup má odpovídat návodu konkrétního vozu."}, {"icon": "⚠️", "q": "Červená kontrolka brzdového systému s vykřičníkem nebo písmenem P nejčastěji upozorňuje na:", "opts": ["Brzdový systém nebo zataženou parkovací brzdu", "Nízký stav paliva", "Zapnutý tempomat", "Vadnou žárovku potkávacích světel"], "correct": 0, "explain": "Červená brzdová kontrolka souvisí s parkovací brzdou nebo se závadou brzdového systému. Pokud nezhasne po uvolnění parkovací brzdy, je třeba situaci řešit podle návodu vozu."}, {"icon": "ABS", "q": "Co znamená žlutá kontrolka ABS, pokud po nastartování nezhasne?", "opts": ["Závadu antiblokovacího systému", "Přehřátí motoru", "Nízký tlak oleje", "Otevřený kufr"], "correct": 0, "explain": "Kontrolka ABS signalizuje problém s antiblokovacím systémem. Základní brzdy mohou fungovat, ale ABS nemusí být k dispozici."}, {"icon": "◉!", "q": "Žlutý symbol připomínající pneumatiku s vykřičníkem je obvykle:", "opts": ["TPMS – upozornění na tlak v pneumatikách", "Kontrolka airbagu", "Kontrolka alternátoru", "Kontrolka dálkových světel"], "correct": 0, "explain": "Jde o systém kontroly tlaku v pneumatikách. BESIP uvádí, že systém upozorní na ucházející nebo podhuštěnou pneumatiku rozsvícením výstražné kontrolky."}, {"icon": "🌡️", "q": "Červený teploměr nad vlnami značí nejčastěji:", "opts": ["Příliš vysokou teplotu chladicí kapaliny", "Nízkou teplotu venkovního vzduchu", "Závadu klimatizace", "Nízkou hladinu paliva"], "correct": 0, "explain": "Tento symbol souvisí s teplotou chladicí kapaliny a může upozorňovat na přehřívání motoru."}, {"icon": "🔋", "q": "Červený symbol baterie za jízdy nejčastěji znamená problém s:", "opts": ["Dobíjecí soustavou", "ABS", "Tlakem v pneumatikách", "Filtrací výfukových plynů"], "correct": 0, "explain": "Kontrolka baterie za běžícího motoru obvykle znamená problém v dobíjecí soustavě, například s alternátorem nebo jeho řízením."}, {"icon": "🚗", "q": "Žlutá kontrolka ve tvaru motoru („check engine“) upozorňuje na:", "opts": ["Závadu související s řízením motoru nebo emisním systémem", "Nutnost doplnit ostřikovače", "Zataženou ruční brzdu", "Zapnuté dálkové světlomety"], "correct": 0, "explain": "Kontrolka motoru souvisí s elektronikou řízení motoru a emisními systémy. Přesnou příčinu určí diagnostika a návod konkrétního vozidla."}, {"icon": "(•)", "q": "Symbol sedící postavy s kruhem před ní nejčastěji souvisí s:", "opts": ["Airbagem a zádržným systémem", "Pohonem všech kol", "Ostřikovači", "Parkovacími senzory"], "correct": 0, "explain": "Kontrolka postavy s kruhem před tělem obvykle označuje airbag nebo systém zádržných prvků."}, {"icon": "〰️", "q": "Žlutý symbol auta se smykovými stopami patří k systému:", "opts": ["Stabilizace a kontroly trakce", "Dobíjení akumulátoru", "Topení zadního okna", "Hlídání hladiny oleje"], "correct": 0, "explain": "Symbol smýkajícího se vozu souvisí s elektronickou stabilizací a kontrolou trakce. Při zásahu může blikat, trvalé svícení může podle vozu znamenat vypnutí nebo závadu."}, {"icon": "🔵", "q": "Modrá kontrolka světlometu na palubní desce zpravidla znamená:", "opts": ["Zapnutá dálková světla", "Poruchu potkávacích světel", "Zapnuté zadní mlhové světlo", "Automatické nouzové brzdění"], "correct": 0, "explain": "Modrá kontrolka světlometu standardně informuje o zapnutých dálkových světlech."}];let index=0,score=0,locked=false;
const progress=document.getElementById('progress'),icon=document.getElementById('icon'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),play=document.getElementById('play'),result=document.getElementById('result');
function renderQuestion(){locked=false;feedback.className='feedback';next.className='next';const item=questions[index];progress.textContent=`Otázka ${index+1} / ${questions.length}`;icon.textContent=item.icon;question.textContent=item.q;answers.innerHTML='';item.opts.forEach((opt,oi)=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=opt;btn.addEventListener('click',()=>choose(oi,btn));answers.appendChild(btn);});}
function choose(oi,clicked){if(locked)return;locked=true;const item=questions[index];const buttons=[...answers.querySelectorAll('.answer')];buttons.forEach((btn,i)=>{btn.disabled=true;if(i===item.correct)btn.classList.add('correct');});if(oi===item.correct)score++;else clicked.classList.add('wrong');feedback.textContent=item.explain;feedback.classList.add('show');next.textContent=index===questions.length-1?'Zobrazit výsledek':'Další otázka';next.classList.add('show');}
next.addEventListener('click',()=>{index++;if(index>=questions.length)showResult();else renderQuestion();});
function showResult(){play.style.display='none';result.classList.add('show');document.getElementById('score').textContent=`${score}/10`;let v='';if(score<=3)v='Palubka vás ještě umí překvapit. U červených kontrolek raději vždy zpozorněte.';else if(score<=6)v='Základ máte, ale pár symbolů by stálo za zopakování.';else if(score<=8)v='Velmi slušné. Většinu běžných kontrolek přečtete bez paniky.';else if(score===9)v='9/10. Jediná kontrolka vás nachytala.';else v='10/10. Palubní deska před vámi moc tajemství nemá.';document.getElementById('verdict').textContent=v;}
document.getElementById('retry').addEventListener('click',()=>{index=0;score=0;result.className='result';play.style.display='block';renderQuestion();});renderQuestion();
</script></body></html>
