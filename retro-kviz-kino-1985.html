<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro kvíz: Vstupenka, uvaděčka, filmový týdeník. Poznáte 15 věcí z návštěvy kina roku 1985?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#180d10;color:#f6e7d7;background-image:radial-gradient(circle at 50% 0,#4f1b20 0,#180d10 45%,#0f080a 100%)}.wrap{max-width:1120px;margin:auto;padding:18px}.marquee{border:3px solid #d4a84e;border-radius:20px;background:#2a1115;padding:18px;box-shadow:0 0 35px #7a2a2f66,inset 0 0 30px #000}.bulbs{height:12px;background:repeating-linear-gradient(90deg,#ffd980 0 10px,transparent 10px 24px);filter:drop-shadow(0 0 6px #ffd980)}h1{margin:12px 0 8px;font-size:clamp(26px,4vw,44px);line-height:1.05;color:#fff1c7}.sub{color:#e6cbb1;line-height:1.5}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}.ticketpanel,.stage{border:2px solid #8e563c;border-radius:18px;background:#251418;box-shadow:0 14px 30px #0008}.ticketpanel{padding:16px;position:sticky;top:12px;height:max-content}.ticket{background:#e7c992;color:#4b2d1f;border:2px dashed #68412b;border-radius:12px;padding:14px;position:relative}.ticket:before,.ticket:after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#251418;top:50%;transform:translateY(-50%)}.ticket:before{left:-14px}.ticket:after{right:-14px}.route{display:grid;gap:8px;margin-top:12px}.route span{padding:8px;border:1px solid #6b3b38;border-radius:9px;background:#34191e;font-size:12px}.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.seat{height:20px;border-radius:7px 7px 3px 3px;background:#5d2028;border:1px solid #9a3d49}.seat.on{background:#d8a34d;box-shadow:0 0 8px #d8a34d}.stage{padding:18px}.screen{background:#f3eadc;color:#29171a;border-radius:12px;padding:20px;box-shadow:inset 0 0 20px #9e8c7a55}.zone{display:inline-block;background:#5d2028;color:#ffdca1;border:1px solid #a9555e;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.q{font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.22;margin:14px 0}.answers{display:grid;gap:10px}.answer{background:#fffaf0;border:2px solid #d4bba0;color:#2a1a17;padding:13px;border-radius:12px;text-align:left;font-size:16px;cursor:pointer}.answer.correct{background:#def4e5;border-color:#2f855a}.answer.wrong{background:#f7dddd;border-color:#b34545}.answer.locked{pointer-events:none}.feedback{display:none;margin-top:14px;padding:13px;border-radius:12px;background:#2e1d21;border:1px solid #7c4d4e;line-height:1.5}.feedback.show{display:block}.next,.restart{margin-top:14px;border:0;background:#d6a34a;color:#2a1810;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:30px}.score{font-size:56px;font-weight:900;color:#ffd580}.band{max-width:620px;margin:12px auto;line-height:1.5}@media(max-width:780px){.layout{grid-template-columns:1fr}.ticketpanel{position:static}}
</style></head><body><div class="wrap"><header class="marquee"><div class="bulbs"></div><h1>Retro kvíz: Vstupenka, uvaděčka, filmový týdeník. Poznáte 15 věcí z návštěvy kina roku 1985?</h1><p class="sub">Jedna návštěva kina od pokladny po promítací kabinu. Žádné hlášky ani herci.</p><div class="bulbs"></div></header><div class="layout"><aside class="ticketpanel"><div class="ticket"><strong>VSTUPENKA / KINO 1985</strong><div style="margin-top:8px">Průchod: <span id="progressText">1 / 15</span></div></div><div class="route"><span>POKLADNA</span><span>FOYER</span><span>SÁL</span><span>PROJEKCE</span><span>DOMŮ</span></div><div class="seats" id="seats"><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div><div class="seat"></div></div></aside><main class="stage"><section id="quizArea"><div class="screen"><div class="zone" id="zoneTag"></div><div class="q" id="question"></div><div class="answers" id="answers"></div></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn" disabled>Další část programu</button></section><section class="result" id="resultArea"><h2>Konec projekce</h2><div class="score" id="scoreOut"></div><div class="band" id="bandOut"></div><button class="restart" id="restartBtn">Pustit znovu</button></section></main></div></div>
<script>
const questions=[{"zone": "POKLADNA", "q": "Na vstupence do kina je uvedena řada a číslo sedadla. Co tím divák získává?", "options": ["Čas, kdy má přijít do foyer", "Konkrétní místo v sále", "Číslo promítacího stroje", "Pořadí, v jakém se pouští film"], "correct": 1, "explanation": "Řada a číslo sedadla určují konkrétní místo diváka v hledišti."}, {"zone": "POKLADNA", "q": "Co patřilo mezi typické úkoly uvaděčky nebo uvaděče?", "options": ["Stříhat filmové kopie", "Prodávat filmová práva", "Kontrolovat vstupenky a pomáhat divákům najít místo", "Obsluhovat projektor v kabině"], "correct": 2, "explanation": "Uvaděčská služba kontrolovala vstupenky a pomáhala s orientací a usazením v sále."}, {"zone": "FOYER", "q": "Co v kině označuje slovo „foyer“?", "options": ["Vstupní a společenský prostor před sálem", "Promítací plátno", "Místnost se zvukovou aparaturou", "Sklad filmových kopií"], "correct": 0, "explanation": "Foyer je prostor před sálem, kde se diváci pohybují před projekcí nebo o přestávce."}, {"zone": "FOYER", "q": "K čemu sloužila programová vývěska nebo plakát kina?", "options": ["K měření délky filmu", "K evidenci sedadel", "K opravě filmového pásu", "K informaci, co a kdy se promítá"], "correct": 3, "explanation": "Programová vývěska či plakát informovaly o titulech a časech projekcí."}, {"zone": "SÁL", "q": "Co je promítací kabina?", "options": ["Místo pro prodej vstupenek", "Oddělená místnost s projektorem a projekční technikou", "Prostor pod jevištěm", "Šatna pro diváky"], "correct": 1, "explanation": "Promítací kabina je oddělený prostor, odkud se obsluhuje filmový projektor."}, {"zone": "SÁL", "q": "Který filmový formát je spojen s klasickou projekcí běžných celovečerních filmů v kinech?", "options": ["35mm film", "8mm domácí film", "Papírový pás", "Magnetická kazeta"], "correct": 0, "explanation": "35mm film byl standardním profesionálním formátem pro klasickou kinoprojekci a používá se archivně dodnes."}, {"zone": "PROJEKCE", "q": "Proč má filmový pás po okrajích pravidelné perforace?", "options": ["Aby propouštěly zvuk do sálu", "Aby se daly číst titulky", "Aby se pás ochlazoval", "Aby mechanismus projektoru mohl pás přesně posouvat"], "correct": 3, "explanation": "Perforace slouží k přesnému mechanickému vedení a posuvu filmu."}, {"zone": "PROJEKCE", "q": "Co je filmová cívka?", "options": ["Optická čočka projektoru", "Zařízení na kontrolu vstupenek", "Kotouč, na který se navíjí filmový pás", "Druh filmového plakátu"], "correct": 2, "explanation": "Filmová cívka je kotouč určený k navinutí a manipulaci s filmovým pásem."}, {"zone": "PROJEKCE", "q": "Co byl filmový týdeník?", "options": ["Krátký zpravodajský film s aktuálními událostmi", "Seznam zaměstnanců kina", "Týdenní přehled návštěvnosti", "Časopis rozdávaný na sedadlech"], "correct": 0, "explanation": "Filmové týdeníky byly krátké zpravodajské filmy; v různých obdobích mohly být součástí předprogramu."}, {"zone": "PROJEKCE", "q": "Co v kinodistribuci znamená „premiéra“?", "options": ["Poslední projekci filmu", "První veřejné uvedení filmu v daném kontextu", "Promítání bez zvuku", "Zkoušku projektoru před diváky"], "correct": 1, "explanation": "Premiéra označuje první veřejné uvedení filmu v určitém distribučním či místním kontextu."}, {"zone": "PROJEKCE", "q": "Co se myslí „předfilmem“ nebo součástí předprogramu?", "options": ["Film promítaný pozpátku", "Reklamní fotografie ve foyer", "Kratší film nebo program před hlavním celovečerním titulem", "První polovina hlavního filmu"], "correct": 2, "explanation": "Předprogram mohl tvořit kratší film či jiný program před hlavním celovečerním snímkem."}, {"zone": "DOMŮ", "q": "Co znamená, když je v programu uvedena „přestávka“?", "options": ["Film se zrušil", "Projektor se přestěhuje do jiného sálu", "Vstupenky přestávají platit", "Projekce se na určitou dobu přeruší a poté pokračuje"], "correct": 3, "explanation": "Přestávka je plánované přerušení programu; nebyla nutnou součástí každé projekce."}, {"zone": "DOMŮ", "q": "Jak se při klasické filmové projekci dostane obraz z filmového políčka na plátno?", "options": ["Políčko je osvětleno a obraz projde projekční optikou", "Film se přikládá přímo na plátno", "Obraz se vysílá rádiem do sálu", "Plátno si obraz samo nasnímá"], "correct": 0, "explanation": "Projektor prosvěcuje filmové políčko a pomocí optiky zvětšuje obraz na plátno."}, {"zone": "DOMŮ", "q": "K čemu slouží projekční objektiv?", "options": ["K navíjení pásu na cívku", "K vytvoření a zaostření obrazu na plátně", "K prodeji vstupenek", "K zaznamenání návštěvnosti"], "correct": 1, "explanation": "Objektiv vytváří a zaostřuje promítaný obraz na plátně."}, {"zone": "DOMŮ", "q": "Kde divák nejspíš hledal informace o dalších filmech kina?", "options": ["Na perforaci filmového pásu", "Na zadní straně sedadla", "V programu, plakátech nebo vývěsce kina", "Na projektorové lampě"], "correct": 2, "explanation": "Program, plakáty a vývěsky byly běžným místem, kde kino oznamovalo další projekce."}];
let idx=0,score=0,answered=false;
const qEl=document.getElementById('question'), aEl=document.getElementById('answers'), fbEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), progressText=document.getElementById('progressText'), zoneTag=document.getElementById('zoneTag'), quizArea=document.getElementById('quizArea'), resultArea=document.getElementById('resultArea'), scoreOut=document.getElementById('scoreOut'), bandOut=document.getElementById('bandOut'), restartBtn=document.getElementById('restartBtn');
function render(){answered=false;nextBtn.disabled=true;fbEl.classList.remove('show');const q=questions[idx];zoneTag.textContent=q.zone;progressText.textContent=`${idx+1} / ${questions.length}`;qEl.textContent=q.q;document.querySelectorAll('.seat').forEach((s,i)=>s.classList.toggle('on',i<idx));;aEl.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;b.onclick=()=>choose(i);aEl.appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[idx];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.add('locked');if(i===q.correct)b.classList.add('correct');if(i===choice&&i!==q.correct)b.classList.add('wrong');});const ok=choice===q.correct;if(ok)score++;fbEl.innerHTML=`<strong>${ok?'Správně.':'Tentokrát ne.'}</strong> ${q.explanation}`;fbEl.classList.add('show');nextBtn.disabled=false;}
nextBtn.onclick=()=>{idx++;if(idx>=questions.length)finish();else render();};
function finish(){quizArea.style.display='none';resultArea.style.display='block';scoreOut.textContent=`${score} / ${questions.length}`;let text='Dobrá práce.';if(score<=5)text='Tenhle svět vás trochu potrápil, ale o to víc jste si z něj odnesli.';else if(score<=10)text='Solidní výsledek. Většinu situací jste zvládli bez většího zaváhání.';else if(score<=13)text='Velmi dobré. V tomhle tématu se orientujete opravdu jistě.';else text='Výborně. Tohle už je skoro bezchybný průchod celým kvízem.';bandOut.textContent=text;document.querySelectorAll('.seat').forEach(s=>s.classList.add('on')); }
restartBtn.onclick=()=>{idx=0;score=0;quizArea.style.display='block';resultArea.style.display='none';document.querySelectorAll('.answer').forEach(x=>x.classList.remove('locked'));render();};
render();
</script></body></html>
