<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Výrazy v analyzovaném seznamu názvů</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#172033}
.wrap{max-width:700px;margin:0 auto}
.card{background:#fff;border:1px solid #d8e0e8;border-radius:14px;padding:18px;box-shadow:0 4px 18px rgba(20,44,72,.06)}
h2{margin:0 0 12px;color:#2d5f9f;font-size:22px;line-height:1.25}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:480px;border-collapse:separate;border-spacing:0;border:1px solid #ccd5df;border-radius:10px;overflow:hidden;font-size:15px}
thead th{background:#1f3d63;color:#fff;text-align:left;padding:10px 12px;font-weight:700;border-right:1px solid rgba(255,255,255,.18)}
thead th:last-child{border-right:0}
tbody td{padding:10px 12px;border-top:1px solid #d9dfe6;border-right:1px solid #d9dfe6;vertical-align:top}
tbody td:last-child{border-right:0}
tbody tr:nth-child(even) td{background:#f7f9fb}
tbody tr.highlight td{background:#eef4fb!important;font-weight:700}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{margin-top:12px;color:#5f6b7a;font-size:13px;line-height:1.45;font-style:italic}
@media(max-width:480px){body{padding:10px}.card{padding:14px;border-radius:10px}h2{font-size:20px}table{font-size:14px;min-width:420px}thead th,tbody td{padding:8px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h2>Výsledek: „zastávka“ vede s velkým náskokem</h2>
<div class="table-wrap">
<table aria-label="Kolikrát se vybrané výrazy objevují v analyzovaném seznamu">
<thead><tr><th>Výraz</th><th>Počet názvů</th></tr></thead>
<tbody>
<tr><td>hlavní nádraží</td><td class="num">16</td></tr>
<tr><td>město</td><td class="num">66</td></tr>
<tr class="highlight"><td>zastávka</td><td class="num">171</td></tr>
</tbody>
</table>
</div>
<p class="note">Vlastní výpočet nad analyzovaným seznamem 2 929 unikátních názvů.</p>
</section>
</main>
</body>
</html>
