<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Cihla, beton, sádrokarton. Poznáte 15 stavebních materiálů jen podle řezu?</title><style>*{box-sizing:border-box}body{margin:0;background:#071117;color:#eaf7f9;font-family:Arial,sans-serif}.lab{max-width:1220px;margin:auto;padding:18px}header{border:1px solid #25424e;background:#0d1b22;padding:20px;border-radius:18px;display:flex;justify-content:space-between;gap:20px}.k{font-size:11px;letter-spacing:.17em;color:#6cc7d8;font-weight:900}h1{font-size:34px;line-height:1.05;margin:7px 0}.gauge{font-size:36px;font-weight:1000;color:#f2b563}.grid{display:grid;grid-template-columns:1fr 250px;gap:16px;margin-top:16px}.bench{border:1px solid #25424e;background:#0b171d;border-radius:18px;padding:16px}.sample{max-width:780px;margin:auto}.q{font-size:25px;font-weight:900;line-height:1.2;margin:14px 3px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{background:#132630;border:1px solid #3b6371;color:#f4fbfc;border-radius:10px;padding:13px;text-align:left;font-size:16px;font-weight:800;cursor:pointer}.opt:hover{border-color:#f2b563}.opt.ok{background:#153b2e;border-color:#64b98f}.opt.bad{background:#4a1f27;border-color:#d46876}.fb{display:none;margin-top:12px;border-left:5px solid #f2b563;background:#172730;padding:13px;border-radius:8px;line-height:1.45}.next{display:none;margin:13px 0 0 auto;background:#f2b563;color:#1c160f;border:0;border-radius:9px;padding:12px 16px;font-weight:1000}.wall{border:1px solid #25424e;background:#0b171d;border-radius:18px;padding:14px}.wall h3{font-size:12px;letter-spacing:.14em;color:#7fd5e5}.slots{display:flex;flex-direction:column-reverse;gap:6px;height:560px}.slots i{height:28px;border:1px dashed #315361;border-radius:5px}.slots i.done{background:linear-gradient(90deg,#274a54,#f2b563)}.result{display:none;text-align:center;padding:45px}.score{font-size:78px;font-weight:1000;color:#f2b563}.restart{background:#5cc2d6;color:#071117;border:0;border-radius:9px;padding:13px 18px;font-weight:1000}@media(max-width:800px){.grid{grid-template-columns:1fr}.wall{order:-1}.slots{height:auto;display:grid;grid-template-columns:repeat(5,1fr)}.slots i{height:18px}.opts{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body><div class="lab"><header><div><div class="k">STAVEBNÍ LABORATOŘ // ŘEZ MATERIÁLEM</div><h1>Kvíz: Cihla, beton, sádrokarton. Poznáte 15 stavebních materiálů jen podle řezu?</h1></div><div class="gauge" id="prog">01/15</div></header><div class="grid"><main class="bench"><div id="quiz"><div class="sample" id="sample"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="next" id="next">DALŠÍ VZOREK →</button></div><div class="result" id="result"><div class="k">STĚNA SESTAVENA</div><div class="score" id="score"></div><h2 id="grade"></h2><p>Rozhodovala makrostruktura, vrstvy, póry, výztuž nebo tvar částic.</p><button class="restart" id="restart">NOVÁ LABORATOŘ</button></div></main><aside class="wall"><h3>MODELOVÁ STĚNA / 15 VZORKŮ</h3><div class="slots" id="slots"></div></aside></div></div><script>const Q=[{"name":"Plná cihla","kind":"bricksolid","q":"Vzorek je jednolitý keramický blok bez komor a otvorů. Co leží v laboratoři?","o":["Plná cihla","Pórobeton","OSB","XPS"],"a":0,"e":"Plná cihla má v řezu kompaktní keramické tělo bez systémových dutin."},{"name":"Dutinový keramický blok","kind":"brickholes","q":"Keramický řez ukazuje pravidelnou síť dlouhých dutin. O jaký materiál jde?","o":["Dutinový keramický blok","Plná cihla","Pórobeton","Železobeton"],"a":0,"e":"Moderní keramické bloky často využívají soustavu dutin, která je v řezu okamžitě patrná."},{"name":"Pórobeton","kind":"aac","q":"Světlý homogenní blok je posetý množstvím drobných pórů. Co to nejlépe odpovídá?","o":["Pórobeton","Beton","Sádrokarton","Korek"],"a":0,"e":"Autoklávovaný pórobeton je typický rovnoměrnou porézní strukturou."},{"name":"Beton","kind":"concrete","q":"V šedé matrici jsou nepravidelná zrna kameniva, ale žádné ocelové pruty. Co vidíte?","o":["Beton","Železobeton","Pórobeton","XPS"],"a":0,"e":"Běžný beton v řezu ukáže cementovou matrici s kamenivem; bez výztuže nejde o železobeton."},{"name":"Železobeton","kind":"rebar","q":"Stejná kamenivová matrice navíc obsahuje kruhové řezy ocelových prutů. Jak se materiál jmenuje?","o":["Železobeton","Beton prostý","OSB","Překližka"],"a":0,"e":"Železobeton kombinuje beton a ocelovou výztuž, kterou v příčném řezu vidíte jako pruty."},{"name":"Sádrokarton","kind":"drywall","q":"Deska má světlé sádrové jádro uzavřené mezi tenkými povrchovými vrstvami papíru. Co je to?","o":["Sádrokarton","Překližka","OSB","Cementotřísková deska"],"a":0,"e":"Sádrokartonová deska má sádrové jádro a papírový líc a rub."},{"name":"Kamenná vlna","kind":"wool","q":"Vzorek netvoří pěnové kuličky ani deska z třísek, ale hustá spleť jemných minerálních vláken. Co je to?","o":["Kamenná vlna","EPS","Korek","Dřevotříska"],"a":0,"e":"Kamenná minerální vlna je vláknitá izolace vyráběná z roztavených minerálních surovin, například bazaltu."},{"name":"OSB","kind":"osb","q":"V řezu i na ploše jsou jasně vidět dlouhé orientované dřevní štěpky v několika vrstvách. Co držíte?","o":["OSB","Dřevotříska","Překližka","Masivní dřevo"],"a":0,"e":"OSB se vyrábí z dlouhých orientovaných štěpek; jejich směr se mezi vrstvami mění."},{"name":"Překližka","kind":"plywood","q":"Vzorek se skládá z mnoha tenkých dýhových vrstev, jejichž směr vláken se střídá. Co je to?","o":["Překližka","OSB","Dřevotříska","Sádrokarton"],"a":0,"e":"Překližka je vrstvená z tenkých dýh, obvykle křížem orientovaných."},{"name":"EPS","kind":"eps","q":"Řez vypadá jako množství navzájem spojených kulatých pěnových perliček. Která izolace to je?","o":["EPS","XPS","Kamenná vlna","Pórobeton"],"a":0,"e":"Expandovaný polystyren vzniká z expandovaných perliček, které jsou ve struktuře viditelné."},{"name":"XPS","kind":"xps","q":"Pěnová deska je na řezu jemná a téměř homogenní, bez velkých viditelných perliček. Co nejlépe sedí?","o":["XPS","EPS","Pórobeton","Minerální vlna"],"a":0,"e":"Extrudovaný polystyren má uzavřenou jemnou buněčnou strukturu, která působí homogenněji než EPS."},{"name":"Keramická dlaždice","kind":"tile","q":"Tenký keramický střep má nahoře ještě velmi tenkou hladkou povrchovou vrstvu. Co je to?","o":["Glazovaná keramická dlaždice","Sádrokarton","Pórobeton","Asfaltový pás"],"a":0,"e":"U glazované dlaždice je nad keramickým tělem tenká povrchová glazura."},{"name":"Dřevotříska","kind":"chipboard","q":"Deska je slisovaná z velkého množství drobných dřevních částic bez dlouhých orientovaných štěpek. Co je to?","o":["Dřevotříska","OSB","Překližka","Masivní dřevo"],"a":0,"e":"Dřevotřísková deska používá menší dřevní částice; na rozdíl od OSB netvoří obraz dlouhých orientovaných štěpek."},{"name":"Masivní dřevo","kind":"wood","q":"V řezu jsou souvislé letokruhy a žádné lepené vrstvy nebo slisované částice. Co vidíte?","o":["Masivní dřevo","Překližka","OSB","Dřevotříska"],"a":0,"e":"Masivní dřevo si zachovává přirozenou kresbu a letokruhy kmene."},{"name":"Korek","kind":"cork","q":"Lehký hnědý řez je složený z nepravidelných korkových zrnek slisovaných do desky. Co je to?","o":["Korek","XPS","Pórobeton","Minerální vlna"],"a":0,"e":"Korkové desky mají typickou zrnitou buněčnou strukturu z korkového materiálu."}];let i=0,score=0;function drawSample(k){let s='';const edge='#25313b';
const base=(fill)=>`<rect x='120' y='95' width='540' height='330' rx='12' fill='${fill}' stroke='${edge}' stroke-width='8'/>`;
if(k==='bricksolid')s=base('#b66b4d')+`<path d='M150 160h480M150 250h480M150 340h480' stroke='#7a3e2b' stroke-width='6' opacity='.45'/>`;
if(k==='brickholes')s=base('#b66b4d')+`${Array.from({length:4},(_,r)=>Array.from({length:7},(_,c)=>`<rect x='${160+c*68}' y='${135+r*68}' width='40' height='42' rx='5' fill='#432c25' opacity='.8'/>`).join('')).join('')}`;
if(k==='aac')s=base('#dedbcf')+`${Array.from({length:55},(_,i)=>`<circle cx='${150+(i*83)%470}' cy='${125+(i*47)%270}' r='${5+(i%5)*2}' fill='#a8a79f'/>`).join('')}`;
if(k==='concrete'||k==='rebar')s=base('#a3a3a0')+`${Array.from({length:70},(_,i)=>`<ellipse cx='${150+(i*71)%470}' cy='${120+(i*53)%280}' rx='${5+i%8}' ry='${4+(i*3)%7}' fill='${i%2?'#777':'#c9c9c3'}'/>`).join('')}`+(k==='rebar'?`<circle cx='260' cy='210' r='34' fill='#4a4f55' stroke='#202326' stroke-width='6'/><circle cx='520' cy='320' r='34' fill='#4a4f55' stroke='#202326' stroke-width='6'/>`:'');
if(k==='drywall')s=`<rect x='120' y='120' width='540' height='280' fill='#efede4' stroke='${edge}' stroke-width='8'/><rect x='120' y='120' width='540' height='20' fill='#c4a77d'/><rect x='120' y='380' width='540' height='20' fill='#c4a77d'/><path d='M150 170h480M150 220h480M150 270h480M150 320h480' stroke='#d9d6ce' stroke-width='3'/>`;
if(k==='wool')s=base('#c8b98a')+`${Array.from({length:70},(_,i)=>`<path d='M${130+(i*39)%500} ${120+(i*61)%270} q${20+(i%5)*8} ${-25+(i%7)*8} ${45+(i%3)*15} ${20+(i%4)*12}' fill='none' stroke='${i%2?'#6d6654':'#ebe2c7'}' stroke-width='4'/>`).join('')}`;
if(k==='osb')s=base('#b88955')+`${Array.from({length:40},(_,i)=>`<rect x='${145+(i*67)%470}' y='${120+(i*41)%270}' width='${55+(i%5)*15}' height='12' rx='5' fill='${i%2?'#6c4728':'#d4aa72'}' transform='rotate(${(i%5)*22-40} ${145+(i*67)%470} ${120+(i*41)%270})'/>`).join('')}`;
if(k==='plywood')s=base('#d6ab75')+`${Array.from({length:9},(_,i)=>`<rect x='120' y='${100+i*36}' width='540' height='18' fill='${i%2?'#8f6238':'#e2bd8c'}'/><path d='M140 ${110+i*36}h500' stroke='#6b452a' stroke-width='2' stroke-dasharray='${i%2?'18 8':'4 8'}'/>`).join('')}`;
if(k==='eps')s=base('#f2f1ec')+`${Array.from({length:85},(_,i)=>`<circle cx='${145+(i*53)%490}' cy='${120+(i*73)%280}' r='${10+(i%4)*2}' fill='#fff' stroke='#b6b6b2' stroke-width='2'/>`).join('')}`;
if(k==='xps')s=base('#b8d7df')+`${Array.from({length:120},(_,i)=>`<circle cx='${140+(i*31)%500}' cy='${115+(i*47)%290}' r='2.5' fill='#7faeb8' opacity='.65'/>`).join('')}`;
if(k==='tile')s=`<rect x='120' y='170' width='540' height='230' fill='#be8060' stroke='${edge}' stroke-width='8'/><rect x='120' y='145' width='540' height='35' fill='#e7ecef' stroke='${edge}' stroke-width='4'/><path d='M150 210h480M150 260h480M150 310h480' stroke='#8d543b' stroke-width='4' opacity='.5'/>`;
if(k==='chipboard')s=base('#b58b5d')+`${Array.from({length:95},(_,i)=>`<rect x='${145+(i*41)%490}' y='${120+(i*61)%280}' width='${8+i%14}' height='${5+(i*3)%10}' fill='${i%2?'#6f4c30':'#dab384'}' transform='rotate(${i*29%180} ${145+(i*41)%490} ${120+(i*61)%280})'/>`).join('')}`;
if(k==='wood')s=base('#c28d55')+`<ellipse cx='390' cy='260' rx='220' ry='120' fill='none' stroke='#73451f' stroke-width='8'/><ellipse cx='390' cy='260' rx='170' ry='88' fill='none' stroke='#8d592c' stroke-width='6'/><ellipse cx='390' cy='260' rx='115' ry='58' fill='none' stroke='#73451f' stroke-width='5'/><path d='M390 140v240' stroke='#7a4c27' stroke-width='5'/>`;
if(k==='cork')s=base('#b88a59')+`${Array.from({length:80},(_,i)=>`<path d='M${145+(i*47)%490} ${120+(i*59)%280} l${12+i%10} ${5+i%7} l-${5+i%8} ${12+i%6}z' fill='${i%2?'#795532':'#dab17d'}'/>`).join('')}`;
return `<svg viewBox='0 0 780 520'><rect width='780' height='520' rx='24' fill='#0d1b22'/><g transform='skewX(-2)'>${s}</g><path d='M90 465h600' stroke='#5cc2d6' stroke-width='3'/><path d='M120 450v30M660 450v30' stroke='#5cc2d6' stroke-width='3'/><text x='390' y='500' fill='#7fd5e5' text-anchor='middle' font-size='13'>MAKROŘEZ // VZOREK 1:4</text></svg>`}for(let n=0;n<15;n++)slots.innerHTML+=`<i data-w="${n}"></i>`;function show(){let x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;sample.innerHTML=sampleArt=sampleFn(x.kind);}function sampleFn(k){return drawSample(k)}function render(){let x=Q[i];prog.textContent=`${String(i+1).padStart(2,'0')}/15`;document.getElementById('sample').innerHTML=sampleFn(x.kind);q.textContent=x.q;opts.innerHTML='';[0,1,2,3].map(n=>(n+((i*3+1)%4))%4).forEach(j=>{let v=x.o[j],b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>ans(j);opts.appendChild(b)});fb.style.display='none';next.style.display='none'}function ans(j){let x=Q[i];[...document.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a)score++;document.querySelector(`[data-w="${i}"]`).classList.add('done');fb.style.display='block';fb.innerHTML=`<b>${j===x.a?'VZOREK ZAŘAZEN.':'LABORATOŘ HLÁSÍ NESOULAD.'}</b> ${x.e}`;next.style.display='block'}next.onclick=()=>{i++;i<15?render():finish()};function finish(){quiz.style.display='none';result.style.display='block';document.getElementById('score').textContent=`${score} / 15`;grade.textContent=score>=13?'Mistr makrořezu':score>=9?'Stavbou byste prošli':'Pár vzorků by chtělo druhý řez'}document.getElementById('restart').onclick=()=>{i=0;score=0;result.style.display='none';quiz.style.display='block';document.querySelectorAll('.slots i').forEach(x=>x.classList.remove('done'));render()};render();</script></body></html>
