<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nultá léta 2000–2009</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#18202a;--muted:#687386;--line:#e6eaf1;--accent1:#3655d8;--accent2:#7a4de8;--good:#168a55;--good-bg:#eaf8f1;--bad:#c4414f;--bad-bg:#fff0f2;--shadow:0 18px 48px rgba(24,32,42,.10)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}body{padding:12px}
.quiz{width:min(700px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.hero{padding:20px 22px 16px;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff}
.kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
h1{font-size:clamp(22px,4.3vw,32px);line-height:1.08;margin:12px 0 7px;letter-spacing:-.025em}.subtitle{margin:0;color:rgba(255,255,255,.88);font-size:14px;line-height:1.45;max-width:58ch}
.status{padding:14px 22px 0}.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:13px;color:var(--muted);font-weight:700}.score-pill{padding:6px 10px;border-radius:999px;background:#f0f3f8;color:#475368}
.bar{height:8px;border-radius:999px;background:#edf0f5;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:inherit;transition:width .35s ease}
.stage{padding:20px 22px 22px}.question{font-size:clamp(20px,3.8vw,27px);line-height:1.22;letter-spacing:-.018em;margin:0 0 16px;font-weight:800}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit}.answer{text-align:left;border:1px solid var(--line);background:#fbfcfe;color:var(--text);border-radius:14px;padding:13px 14px;min-height:56px;cursor:pointer;font-weight:700;line-height:1.25;transition:transform .12s ease,border-color .12s ease,background .12s ease}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#c9d2e2;background:#fff}.answer:disabled{cursor:default}.answer.correct{border-color:#97d9b8;background:var(--good-bg);color:#0f6d42}.answer.wrong{border-color:#efb1b9;background:var(--bad-bg);color:#a33340}
.feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45;border:1px solid var(--line);background:#f8fafc}.feedback.show{display:block}.feedback.good{border-color:#b9e5cf;background:var(--good-bg)}.feedback.bad{border-color:#f2c5ca;background:var(--bad-bg)}.feedback strong{display:block;margin-bottom:3px}
.next{display:none;width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px 16px;color:#fff;background:linear-gradient(135deg,var(--accent1),var(--accent2));font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(45,74,165,.18)}.next.show{display:block}
.result{display:none;padding:28px 22px 26px;text-align:center}.result.show{display:block}.result-badge{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;font-size:28px;font-weight:900;box-shadow:0 12px 30px rgba(45,74,165,.22)}.result h2{margin:0 0 7px;font-size:27px}.result p{margin:0 auto 16px;color:var(--muted);max-width:46ch;line-height:1.5}.restart{border:0;border-radius:14px;padding:12px 18px;background:#18202a;color:#fff;font-weight:800;cursor:pointer}.fine{margin-top:14px;color:#929baa;font-size:11px}
@media(max-width:560px){body{padding:8px}.quiz{border-radius:17px}.hero{padding:17px 16px 14px}.status{padding:12px 16px 0}.stage{padding:16px}.answers{grid-template-columns:1fr;gap:8px}.answer{min-height:50px;padding:11px 12px}}
</style></head><body>
<main class="quiz" aria-live="polite">
<section class="hero"><div class="kicker">RETRO KVÍZ • 15 OTÁZEK</div><h1>Nultá léta 2000–2009</h1><p class="subtitle">ICQ, Windows XP, Nokia, YouTube i vypalovaná CD. Kolik detailů z digitálního dospívání si ještě vybavíš?</p></section>
<section id="play"><div class="status"><div class="status-row"><span id="counter">Otázka 1 z 15</span><span class="score-pill" id="score">Skóre 0</span></div><div class="bar" aria-hidden="true"><div id="progress"></div></div></div><div class="stage"><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Další otázka</button></div></section>
<section class="result" id="result"><div class="result-badge" id="resultScore">0/15</div><h2 id="resultTitle">Hotovo!</h2><p id="resultText"></p><button class="restart" id="restart">Zkusit znovu</button><div class="fine">Kvíz hodnotí pouze znalosti v tomto tématu.</div></section>
</main>
<script>
const questions=[{"q": "Ve kterém roce se začala prodávat původní Nokia 3310?", "opts": ["1998", "2000", "2002", "2004"], "correct": 1, "explain": "Původní Nokia 3310 byla uvedena v roce 2000 a rychle se stala jedním ze symbolů éry klasických mobilů."}, {"q": "Ve kterém roce se Windows XP dostaly do celosvětového prodeje?", "opts": ["1999", "2000", "2001", "2003"], "correct": 2, "explain": "Microsoft spustil celosvětový prodej Windows XP 25. října 2001."}, {"q": "Jak se jmenovalo první video nahrané na YouTube?", "opts": ["Hello Internet", "Me at the Zoo", "First Upload", "Broadcast Yourself"], "correct": 1, "explain": "Prvním videem na YouTube bylo „Me at the Zoo“, nahrané 23. dubna 2005."}, {"q": "Ve kterém roce vyšla první veřejná beta prohlížeče Google Chrome?", "opts": ["2005", "2006", "2008", "2009"], "correct": 2, "explain": "Google uvolnil první veřejnou betu Chrome v září 2008."}, {"q": "Ve kterém roce se začal prodávat první iPhone?", "opts": ["2005", "2006", "2007", "2009"], "correct": 2, "explain": "První iPhone šel v USA do prodeje 29. června 2007."}, {"q": "Kdy Google spustil Gmail pro veřejnost?", "opts": ["2002", "2003", "2004", "2006"], "correct": 2, "explain": "Gmail byl spuštěn 1. dubna 2004. Datum bylo tak neobvyklé, že část lidí jej považovala za aprílový žert."}, {"q": "Ve kterém roce Nintendo uvedlo konzoli Wii?", "opts": ["2004", "2005", "2006", "2008"], "correct": 2, "explain": "Nintendo představilo Wii v roce 2006. Konzole proslula hlavně pohybovým ovládáním."}, {"q": "Ve kterém roce se PlayStation 2 začala prodávat v Evropě?", "opts": ["1999", "2000", "2001", "2002"], "correct": 1, "explain": "PlayStation 2 dorazila do Evropy 24. listopadu 2000."}, {"q": "Které médium bylo v nultých letech typicky spojované s kapacitou kolem 700 MB?", "opts": ["3,5″ disketa", "CD-R", "DVD-9", "Blu-ray"], "correct": 1, "explain": "Běžné CD-R nabízelo zhruba 700 MB prostoru. Pro hudbu, fotky i data to tehdy byla velmi praktická kapacita."}, {"q": "Co se nejčastěji ukládá ve formátu MP3?", "opts": ["Video", "Textové dokumenty", "Zvuk", "Fotografie"], "correct": 2, "explain": "MP3 je formát ztrátové komprese digitálního zvuku a v nultých letech se stal synonymem pro hudbu v počítači i přehrávači."}, {"q": "K čemu sloužilo ICQ?", "opts": ["K okamžitému posílání zpráv", "K vypalování CD", "K úpravě fotografií", "K antivirové kontrole"], "correct": 0, "explain": "ICQ bylo populární komunikační prostředí pro instant messaging. Typickým poznávacím znakem účtu bylo číselné UIN."}, {"q": "Co znamenalo označení CD-RW?", "opts": ["Disk pouze pro hudbu", "Přepisovatelný disk", "Dvoustranný disk", "Disk s ochranou proti kopírování"], "correct": 1, "explain": "CD-RW bylo možné opakovaně mazat a znovu zapisovat, na rozdíl od běžného CD-R."}, {"q": "Co znamenalo „vypálit CD“?", "opts": ["Fyzicky disk zahřát", "Zapsat na něj data pomocí vypalovačky", "Smazat z něj data magnetem", "Převést CD na kazetu"], "correct": 1, "explain": "„Vypálení“ označovalo zapsání dat na zapisovatelné optické médium pomocí CD/DVD mechaniky."}, {"q": "Který konektor se v nultých letech masově prosadil pro flash disky, tiskárny a další periferie?", "opts": ["USB", "SCART", "VGA", "PS/2"], "correct": 0, "explain": "USB se stalo univerzálním rozhraním pro obrovské množství periferií a přenosných úložišť."}, {"q": "S čím si většina uživatelů spojovala program Winamp?", "opts": ["S přehráváním hudby", "S tvorbou tabulek", "S vypalováním BIOSu", "S prohlížením map"], "correct": 0, "explain": "Winamp byl známý hlavně jako hudební a multimediální přehrávač s výraznými skiny a playlisty."}];let index=0,score=0,locked=false;
const el={play:document.getElementById('play'),result:document.getElementById('result'),question:document.getElementById('question'),answers:document.getElementById('answers'),feedback:document.getElementById('feedback'),next:document.getElementById('next'),progress:document.getElementById('progress'),counter:document.getElementById('counter'),score:document.getElementById('score'),resultScore:document.getElementById('resultScore'),resultTitle:document.getElementById('resultTitle'),resultText:document.getElementById('resultText'),restart:document.getElementById('restart')};
function renderQuestion(){locked=false;const item=questions[index];el.question.textContent=item.q;el.answers.innerHTML='';el.feedback.className='feedback';el.feedback.innerHTML='';el.next.className='next';el.counter.textContent=`Otázka ${index+1} z ${questions.length}`;el.score.textContent=`Skóre ${score}`;el.progress.style.width=`${(index/questions.length)*100}%`;item.opts.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=opt;btn.addEventListener('click',()=>choose(i));el.answers.appendChild(btn)})}
function choose(choice){if(locked)return;locked=true;const item=questions[index];const buttons=[...el.answers.querySelectorAll('.answer')];buttons.forEach((btn,i)=>{btn.disabled=true;if(i===item.correct)btn.classList.add('correct')});const right=choice===item.correct;if(right)score++;else buttons[choice].classList.add('wrong');el.score.textContent=`Skóre ${score}`;el.feedback.className=`feedback show ${right?'good':'bad'}`;el.feedback.innerHTML=`<strong>${right?'Správně.':'Tentokrát ne.'}</strong>${item.explain}`;el.next.textContent=index===questions.length-1?'Zobrazit výsledek':'Další otázka';el.next.className='next show';el.progress.style.width=`${((index+1)/questions.length)*100}%`}
function showResult(){el.play.style.display='none';el.result.classList.add('show');el.resultScore.textContent=`${score}/${questions.length}`;if(score>=13){el.resultTitle.textContent='Výborný výsledek';el.resultText.textContent='Tady už bylo potřeba víc než jen pár náhodných vzpomínek. Téma máš opravdu v ruce.'}else if(score>=10){el.resultTitle.textContent='Velmi slušné';el.resultText.textContent='Většinu otázek jsi zvládl. Pár detailů ale ještě dokázalo překvapit.'}else if(score>=6){el.resultTitle.textContent='Solidní základ';el.resultText.textContent='Něco sedlo okamžitě, něco bylo záludnější. Druhý pokus může skóre rychle vytáhnout.'}else{el.resultTitle.textContent='Bylo to záludné';el.resultText.textContent='Tenhle kvíz měl pár pastí. Zkus ho ještě jednou a uvidíš, kolik odpovědí už zůstalo v hlavě.'}}
el.next.addEventListener('click',()=>{if(!locked)return;if(index<questions.length-1){index++;renderQuestion()}else showResult()});el.restart.addEventListener('click',()=>{index=0;score=0;locked=false;el.result.classList.remove('show');el.play.style.display='';renderQuestion()});renderQuestion();
</script></body></html>
