*{box-sizing:border-box}html,body{margin:0;background:#04111b;color:#eef9ff;font-family:Arial,sans-serif;overflow-x:hidden}body{padding:10px;background:radial-gradient(circle at 20% 0,#174f69,#03101a 62%)}.port{max-width:1200px;margin:auto;border:1px solid #2f718d;border-radius:22px;overflow:hidden;background:#061925;box-shadow:0 30px 80px #000}header{padding:19px 22px;background:linear-gradient(90deg,#0a3042,#071a26);border-bottom:1px solid #347690}.k{font:900 12px monospace;color:#67d8ff;letter-spacing:.16em}h1{font-size:clamp(26px,4vw,47px);line-height:1.03;margin:5px 0 7px}header p{margin:0;color:#b2d0df;max-width:900px;line-height:1.45}.grid{display:grid;grid-template-columns:250px 1fr;gap:12px;padding:12px}.radar,.dock{border:1px solid #28566c;border-radius:14px;background:#081e2b;padding:12px}.radarbox{aspect-ratio:1;border-radius:50%;border:1px solid #286d88;background:repeating-radial-gradient(circle,#0a2a3a 0 22px,#0b3344 23px 24px);position:relative;overflow:hidden}.radarbox:after{content:'';position:absolute;inset:50% 0 auto 50%;width:50%;height:2px;background:#5ce7ff;transform-origin:left;animation:sweep 4s linear infinite;box-shadow:0 0 18px #5ce7ff}@keyframes sweep{to{transform:rotate(360deg)}}.berths{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.berth{height:32px;border:1px solid #244f63;border-radius:5px;display:grid;place-items:center;font:800 10px monospace;color:#497b92}.berth.done{background:#17634d;color:#b4ffe2;border-color:#42c69c}.hud{display:flex;justify-content:space-between;background:#04131d;padding:8px 10px;border-radius:7px;font:900 12px monospace;color:#74e4ff}.sea{height:270px;border-radius:12px;margin:11px 0;background:linear-gradient(#78c3d8 0 43%,#247698 44% 48%,#075173 49%);position:relative;overflow:hidden;border:1px solid #4a9bb5}.sea:before{content:'';position:absolute;bottom:22px;left:-20%;width:140%;height:40px;background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 16px,#ffffff55 17px 18px);opacity:.45}.vessel{position:absolute;left:50%;top:50%;width:min(620px,88%);height:190px;transform:translate(-50%,-45%);transition:.6s}.vessel.dockin{transform:translate(18%,-45%) scale(.72);opacity:.65}.q{font-size:23px;font-weight:1000;margin:8px 0 11px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{background:#0c3042;color:white;border:1px solid #327c99;border-radius:9px;padding:12px;text-align:left;font-weight:900;cursor:pointer;min-height:54px}.answer.good{background:#11553f;border-color:#62d6ab}.answer.bad{background:#5f2730;border-color:#ff8292}.feedback{display:none;margin-top:10px;background:#0b2a39;border-left:5px solid #51d7ff;padding:11px;line-height:1.4}.feedback.show{display:block}.next{display:none;margin:10px 0 0 auto;background:#55d4fb;color:#04151e;border:0;border-radius:8px;padding:11px 16px;font-weight:1000}.result{display:none;text-align:center;padding:58px 20px}.result.show{display:block}.score{font-size:74px;font-weight:1000;color:#67e1ff}.restart{border:0;border-radius:8px;padding:12px 18px;background:#63dfff;color:#05202a;font-weight:1000}@media(max-width:790px){body{padding:4px}.grid{grid-template-columns:1fr;padding:7px}.radar{display:none}.sea{height:210px}.answers{grid-template-columns:1fr}}
</style></head><body><div class="port"><header><div class="k">PŘÍSTAVNÍ RADAR // 15 MOL</div><h1>Kvíz: Kajak, katamarán, remorkér. Poznáte 15 plavidel podle siluety a účelu?</h1><p>Bez vlajky, barvy a názvu. Rozhoduje fyzický tvar nebo jednoznačný účel plavidla — žádné zeměpisné hádání přístavů.</p></header><div class="grid"><aside class="radar"><div class="radarbox"></div><div class="berths" id="berths"></div></aside><main class="dock"><section id="quiz"><div class="hud"><span id="prog"></span><span>RADAR: AKTIVNÍ</span></div><div class="sea"><div class="vessel" id="vessel"></div></div><div class="q">Které plavidlo právě míří do doku?</div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">DALŠÍ MOLO →</button></section><section id="result" class="result"><h2>PŘÍSTAV ODBAVEN</h2><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">NOVÁ SMĚNA</button></section></main></div></div><script>
const questions=[{"v":"kayak","name":"Kajak","o":["Kajak","Kanoe","Veslice","Katamarán"],"c":0,"e":"Kajak je úzké pádlované plavidlo; typicky se používá dvoulisté pádlo."},{"v":"canoe","name":"Kanoe","o":["Kajak","Kanoe","Pramice","Veslice"],"c":1,"e":"Kanoe je otevřenější pádlované plavidlo a běžně se pohání jednolistým pádlem."},{"v":"cat","name":"Katamarán","o":["Trimarán","Katamarán","Trajekt","Jachta"],"c":1,"e":"Katamarán má dva rovnoběžné trupy."},{"v":"sail","name":"Plachetnice","o":["Plachetnice","Remorkér","Rychlý člun","Bárka"],"c":0,"e":"Plachetnice se v siluetě prozradí stěžněm a plachtami."},{"v":"ferry","name":"Trajekt","o":["Kontejnerová loď","Výletní loď","Trajekt","Tanker"],"c":2,"e":"Trajekt je určen k pravidelné přepravě cestujících a často i vozidel mezi břehy."},{"v":"tug","name":"Remorkér","o":["Remorkér","Rybářský trawler","Záchranný člun","Bárka"],"c":0,"e":"Remorkér je kompaktní pracovní plavidlo určené k tažení nebo tlačení jiných lodí."},{"v":"barge","name":"Bárka / nákladní člun","o":["Tanker","Bárka / nákladní člun","Trajekt","Vznášedlo"],"c":1,"e":"Bárka je nízké nákladní plavidlo s velkou užitnou plochou, často bez vlastního oceánského pohonu."},{"v":"container","name":"Kontejnerová loď","o":["Kontejnerová loď","Tanker","Výletní loď","Trajekt"],"c":0,"e":"Kontejnerová loď nese na palubě pravidelné bloky kontejnerů."},{"v":"tanker","name":"Tanker","o":["Kontejnerová loď","Tanker","Výletní loď","Remorkér"],"c":1,"e":"Tanker má velkou uzavřenou nákladní část pro kapalný náklad a nemá stohy kontejnerů."},{"v":"cruise","name":"Výletní loď","o":["Trajekt","Výletní loď","Kontejnerová loď","Trawler"],"c":1,"e":"Výletní loď se pozná podle vysoké hotelové nástavby s mnoha palubami."},{"v":"sub","name":"Ponorka","o":["Vznášedlo","Ponorka","Rychlý člun","Tanker"],"c":1,"e":"Ponorka je podvodní plavidlo; siluetu charakterizuje dlouhý trup a věž."},{"v":"hover","name":"Vznášedlo","o":["Katamarán","Trajekt","Vznášedlo","Bárka"],"c":2,"e":"Vznášedlo se pohybuje na vzduchovém polštáři a má výraznou pružnou zástěru kolem spodní části."},{"v":"trawler","name":"Rybářský trawler","o":["Remorkér","Rybářský trawler","Záchranný člun","Plachetnice"],"c":1,"e":"Trawler je pracovní rybářské plavidlo s vybavením pro vlečené sítě."},{"v":"speed","name":"Rychlý motorový člun","o":["Rychlý motorový člun","Kanoe","Bárka","Ponorka"],"c":0,"e":"Rychlý motorový člun má nízký, štíhlý trup a výrazně sportovní profil."},{"v":"lifeboat","name":"Záchranný člun","o":["Výletní loď","Záchranný člun","Tanker","Katamarán"],"c":1,"e":"Záchranný člun je kompaktní, robustní plavidlo určené pro zásah a záchranu."}];window.__QUIZ={questions};let i=0,score=0,locked=false;let bs=document.getElementById('berths');for(let n=0;n<questions.length;n++){let d=document.createElement('div');d.className='berth';d.id='b'+n;d.textContent=n+1;bs.appendChild(d)}

r='12' fill='none' stroke='#fff' stroke-width='5'/>`;if(v==='barge')s=`<path d='M55 115 H345 V155 H70Z' fill='#1b4350' stroke='#fff' stroke-width='4'/><rect x='90' y='92' width='220' height='24' fill='#496879' stroke='#fff' stroke-width='3'/>`;if(v==='container')s=`<path d='M45 120 H350 L320 165 H80Z' fill='#153c4a' stroke='#fff' stroke-width='4'/><g fill='#bfefff' stroke='#082635' stroke-width='2'>$<rect x='80' y='65' width='34' height='27'/><rect x='118' y='65' width='34' height='27'/><rect x='156' y='65' width='34' height='27'/><rect x='194' y='65' width='34' height='27'/><rect x='232' y='65' width='34' height='27'/><rect x='270' y='65' width='34' height='27'/><rect x='80' y='35' width='34' height='27'/><rect x='118' y='35' width='34' height='27'/><rect x='156' y='35' width='34' height='27'/><rect x='194' y='35' width='34' height='27'/><rect x='232' y='35' width='34' height='27'/><rect x='270' y='35' width='34' height='27'/></g><rect x='300' y='70' width='30' height='50' fill='#eafcff'/>`;if(v==='tanker')s=`<path d='M45 118 H350 L320 164 H80Z' fill='#133947' stroke='#fff' stroke-width='4'/><rect x='87' y='85' width='210' height='33' rx='15' fill='#aacdda' stroke='#fff' stroke-width='3'/><rect x='305' y='73' width='32' height='45' fill='#eafcff'/>`;if(v==='cruise')s=`<path d='M50 125 H350 L315 172 H85Z' fill='#143845' stroke='#fff' stroke-width='4'/><path d='M105 48 H300 V128 H88Z' fill='#e9fbff' stroke='#fff' stroke-width='3'/><g fill='#164153'>$<rect x='115' y='60' width='15' height='9'/><rect x='143' y='60' width='15' height='9'/><rect x='171' y='60' width='15' height='9'/><rect x='199' y='60' width='15' height='9'/><rect x='227' y='60' width='15' height='9'/><rect x='255' y='60' width='15' height='9'/><rect x='115' y='82' width='15' height='9'/><rect x='143' y='82' width='15' height='9'/><rect x='171' y='82' width='15' height='9'/><rect x='199' y='82' width='15' height='9'/><rect x='227' y='82' width='15' height='9'/><rect x='255' y='82' width='15' height='9'/><rect x='115' y='104' width='15' height='9'/><rect x='143' y='104' width='15' height='9'/><rect x='171' y='104' width='15' height='9'/><rect x='199' y='104' width='15' height='9'/><rect x='227' y='104' width='15' height='9'/><rect x='255' y='104' width='15' height='9'/></g>`;if(v==='sub')s=`<ellipse cx='200' cy='135' rx='145' ry='38' fill='#173946' stroke='#fff' stroke-width='4'/><rect x='178' y='82' width='48' height='42' rx='8' fill='#173946' stroke='#fff' stroke-width='4'/><line x1='200' y1='80' x2='200' y2='55' stroke='#fff' stroke-width='4'/>`;if(v==='hover')s=`<path d='M65 105 H325 L350 142 L322 175 H78 L48 142Z' fill='#194655' stroke='#fff' stroke-width='4'/><path d='M58 150 Q200 178 340 150' fill='none' stroke='#92d8eb' stroke-width='13'/><rect x='140' y='70' width='120' height='40' fill='#e8fbff' stroke='#fff' stroke-width='3'/>`;if(v==='trawler')s=`<path d='M65 120 H325 L300 165 H95Z' fill='#173e4c' stroke='#fff' stroke-width='4'/><rect x='130' y='82' width='80' height='40' fill='#e8fbff'/><line x1='225' y1='70' x2='285' y2='120' stroke='#fff' stroke-width='4'/><line x1='250' y1='72' x2='250' y2='120' stroke='#fff' stroke-width='4'/>`;if(v==='speed')s=`<path d='M50 130 L315 108 L350 142 L285 160 H85Z' fill='#17495a' stroke='#fff' stroke-width='4'/><path d='M165 95 H265 L298 112 H145Z' fill='#dff8ff'/>`;if(v==='lifeboat')s=`<path d='M65 120 H330 L300 165 H95Z' fill='#1b5060' stroke='#fff' stroke-width='5'/><rect x='125' y='77' width='150' height='45' rx='20' fill='#e8fbff' stroke='#fff' stroke-width='4'/><circle cx='105' cy='138' r='12' fill='none' stroke='#fff' stroke-width='4'/><circle cx='290' cy='138' r='12' fill='none' stroke='#fff' stroke-width='4'/>`;return `<svg viewBox='0 0 400 210' xmlns='http://www.w3.org/2000/svg'>${s}</svg>`}
function show(){locked=false;let x=questions[i];document.getElementById('prog').textContent=`MOLO ${i+1} / ${questions.length}`;let v=document.getElementById('vessel');v.className='vessel';v.innerHTML=ship(x.v);let a=document.getElementById('answers');a.innerHTML='';x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=k;b.textContent=t;b.onclick=()=>answer(k);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;if(ok)score++;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});if(ok)document.getElementById('vessel').classList.add('dockin');document.getElementById('b'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=x.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<questions.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=`${score} / 15`;document.getElementById('res').textContent=score>=13?'Přístavní radar máte v oku.':score>=9?'Většinu flotily odbavíte bez nápovědy.':'Přístavní směna si říká o repete.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.berth').forEach(b=>b.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();</script></body></html>
