<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: Zrcadlo, čočka, stín. Vyřešíte 20 optických situací jen podle obrázku?</title><style>
*{box-sizing:border-box}:root{--bg:#f4f4f5;--card:#fff;--line:#d4d4d8;--text:#18181b;--muted:#71717a;--a:#2563eb;--b:#1d4ed8;--ok:#166534;--bad:#991b1b}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}:root{--bg:#07111f;--card:#0d1b2d;--line:#24466a;--text:#eff8ff;--muted:#a8c3dd;--a:#22d3ee;--b:#0ea5e9}.stage{background:#050b13}.opt{background:#10243a;color:#fff}.feedback{background:#102236}.cell{background:#173653;border-color:#24466a}.cell.done{background:#22d3ee}.side{background:linear-gradient(180deg,#0d2239,#081422)}
.wrap{max-width:1160px;margin:auto;padding:16px}header{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 34px #00000012}h1{margin:0;font-size:clamp(28px,4vw,45px);line-height:1.04}.sub{margin:10px 0 0;color:var(--muted);line-height:1.5}.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;margin-top:16px}.side,.main{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 28px #0000000e}.side{padding:16px}.main{padding:18px}.world{font-size:12px;font-weight:900;letter-spacing:.09em;color:var(--b)}.prog{font-size:35px;font-weight:900;margin:7px 0;color:var(--b)}.mini{color:var(--muted);line-height:1.45;font-size:13px}.q{font-size:24px;font-weight:900;line-height:1.2;margin:10px 0 14px}.stage{min-height:260px;border-radius:18px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:15px;background:#fff}.stage svg{width:100%;max-width:620px;height:250px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{border:2px solid var(--line);border-radius:15px;background:#fff;padding:13px 14px;text-align:left;font-size:16px;font-weight:750;cursor:pointer;color:var(--text)}.opt:hover{border-color:var(--a);transform:translateY(-1px)}.opt.correct{border-color:#22c55e;background:#f0fdf4;color:var(--ok)}.opt.wrong{border-color:#ef4444;background:#fef2f2;color:var(--bad)}.feedback{display:none;margin-top:12px;border-radius:14px;padding:13px;background:#fafafa;border:2px solid var(--line);line-height:1.45}.feedback.show{display:block}.next{display:none;margin-top:12px;margin-left:auto;border:0;border-radius:13px;padding:11px 16px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));font-weight:900;cursor:pointer}.result{display:none;text-align:center;padding:25px}.result.show{display:block}.score{font-size:56px;font-weight:900;color:var(--b)}.restart{border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font-weight:900;font-size:17px;cursor:pointer}.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.cell{height:16px;border-radius:999px;background:#e4e4e7;border:1px solid #d4d4d8}.cell.done{background:var(--a);border-color:transparent}@media(max-width:820px){.layout{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.stage{min-height:220px}.q{font-size:21px}}
</style></head><body><div class="wrap"><header><div class="world">20 DIAGRAMOVÝCH MISÍ NA OPTICKÉ LAVICI</div><h1>Kvíz ze školy: Zrcadlo, čočka, stín. Vyřešíte 20 optických situací jen podle obrázku?</h1><p class="sub">20 diagramových misí na optické lavici.</p></header><div class="layout"><aside class="side"><div class="prog" id="prog">1 / 20</div><div class="mini">Po odpovědi se hned dozvíte správné řešení a krátké vysvětlení.</div><div style="margin-top:14px;height:72px;border-radius:12px;background:linear-gradient(90deg,#22d3ee22,#fde04722);position:relative;overflow:hidden"><div style="position:absolute;left:8px;right:8px;top:35px;height:2px;background:#67e8f9"></div><div style="position:absolute;left:20%;top:26px;width:4px;height:18px;background:#fff"></div><div style="position:absolute;left:50%;top:26px;width:4px;height:18px;background:#fff"></div><div style="position:absolute;left:80%;top:26px;width:4px;height:18px;background:#fff"></div></div><p class="mini">20 bodů na optické lavici = 20 samostatných situací.</p><div class="cells" id="cells"></div></aside><main class="main"><div id="quiz"><div class="world" id="cat"></div><div class="q" id="qtext"></div><div class="stage" id="stage"></div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button class="next" id="next">Další otázka</button></div><div class="result" id="result"><div class="score" id="score"></div><p id="resText"></p><button class="restart" id="restart">Zkusit znovu</button></div></main></div></div><script>
const questions=[{"category": "ODRAZ", "kind": "mirror_equal", "q": "Paprsek dopadá na rovinné zrcadlo pod úhlem 30° vůči kolmici. Jaký je úhel odrazu vůči kolmici?", "options": ["30°", "60°", "90°", "15°"], "correct": 0, "explanation": "Podle zákona odrazu se úhel odrazu rovná úhlu dopadu, oba se měří vůči kolmici."}, {"category": "ODRAZ", "kind": "plane_image", "q": "Jaký obraz vytváří rovinné zrcadlo?", "options": ["Zdánlivý, vzpřímený a stejně velký", "Skutečný a převrácený", "Vždy zmenšený", "Vždy zvětšený"], "correct": 0, "explanation": "Rovinné zrcadlo vytváří virtuální obraz stejné velikosti, vzpřímený a symetricky za zrcadlem."}, {"category": "ODRAZ", "kind": "distance", "q": "Předmět je 1 m před rovinným zrcadlem. Jak daleko za zrcadlem se zdánlivě nachází obraz?", "options": ["1 m", "0,5 m", "2 m", "Na ploše zrcadla"], "correct": 0, "explanation": "Obraz v rovinném zrcadle je zdánlivě stejně daleko za zrcadlem, jako je předmět před ním."}, {"category": "STÍN", "kind": "shadow_close", "q": "Když neprůhledný předmět posunete blíže k bodovému zdroji a stínítko necháte na místě, co se stane se stínem?", "options": ["Zvětší se", "Zmenší se", "Zmizí", "Vždy zůstane stejný"], "correct": 0, "explanation": "Při bodovém zdroji blíže k předmětu se paprsky více rozbíhají a stín na vzdáleném stínítku se zvětší."}, {"category": "STÍN", "kind": "shadow_opaque", "q": "Co je nutnou podmínkou pro vznik plného stínu za předmětem?", "options": ["Předmět musí bránit průchodu světla", "Předmět musí být průhledný", "Musí být vakuum", "Zdroj musí být modrý"], "correct": 0, "explanation": "Stín vzniká tam, kam kvůli neprůhlednému předmětu nedopadá světlo."}, {"category": "LOM", "kind": "air_glass", "q": "Paprsek přechází z opticky řidšího prostředí (vzduch) do opticky hustšího (sklo). Jak se obvykle lomí?", "options": ["Ke kolmici", "Od kolmice", "Vždy přesně o 90°", "Nelomí se nikdy"], "correct": 0, "explanation": "Při přechodu do opticky hustšího prostředí se paprsek obvykle láme ke kolmici."}, {"category": "LOM", "kind": "glass_air", "q": "Paprsek přechází ze skla do vzduchu. Jak se obvykle lomí, pokud nedojde k úplnému odrazu?", "options": ["Od kolmice", "Ke kolmici", "Po kolmici bez ohledu na dopad", "Zastaví se"], "correct": 0, "explanation": "Při přechodu z opticky hustšího do řidšího prostředí se paprsek láme od kolmice."}, {"category": "LOM", "kind": "normal", "q": "Paprsek dopadá na rozhraní přesně po kolmici. Co se stane se směrem paprsku při běžném lomu?", "options": ["Směr se nezmění", "Otočí se zpět", "Vždy se ohne o 45°", "Rozdělí se na dvě stejně silné větve"], "correct": 0, "explanation": "Při kolmém dopadu se směr paprsku nemění, i když se změní jeho rychlost v prostředí."}, {"category": "ČOČKY", "kind": "convex_shape", "q": "Která čočka je uprostřed silnější než u okrajů?", "options": ["Spojka", "Rozptylka", "Rovinné zrcadlo", "Hranol"], "correct": 0, "explanation": "Spojná čočka je typicky uprostřed silnější než na okrajích."}, {"category": "ČOČKY", "kind": "concave_shape", "q": "Která čočka je uprostřed tenčí než u okrajů?", "options": ["Rozptylka", "Spojka", "Rovinné zrcadlo", "Kužel"], "correct": 0, "explanation": "Rozptylná čočka je uprostřed tenčí."}, {"category": "ČOČKY", "kind": "parallel_convex", "q": "Co udělá ideální spojná čočka s paprsky rovnoběžnými s hlavní optickou osou?", "options": ["Soustředí je do ohniska", "Rozptýlí je tak, jako by vycházely z ohniska před čočkou", "Vrátí je zpět", "Nezmění jejich směr"], "correct": 0, "explanation": "Rovnoběžné paprsky po průchodu spojkou procházejí jejím obrazovým ohniskem."}, {"category": "ČOČKY", "kind": "parallel_concave", "q": "Co udělá ideální rozptylka s paprsky rovnoběžnými s hlavní osou?", "options": ["Rozptýlí je tak, jako by vycházely z ohniska před čočkou", "Soustředí je do reálného ohniska za čočkou", "Odrazí je", "Nemění je"], "correct": 0, "explanation": "Rozptylka způsobí rozbíhavý svazek, jehož prodloužení se protíná ve virtuálním ohnisku před čočkou."}, {"category": "OBRAZ", "kind": "real_screen", "q": "Který typ obrazu lze zachytit na stínítku?", "options": ["Skutečný obraz", "Zdánlivý obraz v rovinném zrcadle", "Jen obraz v oku", "Žádný obraz nelze zachytit"], "correct": 0, "explanation": "Skutečný obraz vzniká skutečným průsečíkem paprsků a lze ho promítnout na stínítko."}, {"category": "OBRAZ", "kind": "virtual_screen", "q": "Lze virtuální obraz z rovinného zrcadla přímo zachytit na stínítko umístěné za zrcadlem?", "options": ["Ne", "Ano vždy", "Jen v noci", "Jen s barevným filtrem"], "correct": 0, "explanation": "Virtuální obraz není tvořen skutečným průsečíkem paprsků za zrcadlem, takže ho nelze přímo promítnout na stínítko."}, {"category": "ZRCADLA", "kind": "concave", "q": "Které zrcadlo může soustředit rovnoběžné paprsky do ohniska?", "options": ["Duté (konkávní) zrcadlo", "Vypuklé zrcadlo", "Rovinné zrcadlo", "Matná deska"], "correct": 0, "explanation": "Duté zrcadlo může rovnoběžné paprsky soustředit do reálného ohniska."}, {"category": "ZRCADLA", "kind": "convex", "q": "Jaký typ obrazu běžně vytváří vypuklé zrcadlo?", "options": ["Zdánlivý, vzpřímený a zmenšený", "Skutečný, převrácený a zvětšený", "Stejně velký jako rovinné zrcadlo", "Vždy bez obrazu"], "correct": 0, "explanation": "Vypuklé zrcadlo dává virtuální, vzpřímený a zmenšený obraz a rozšiřuje zorné pole."}, {"category": "PAPRSEK", "kind": "normal_line", "q": "K čemu se v optickém diagramu kreslí kolmice (normála) k rozhraní?", "options": ["Jako referenční směr pro měření úhlů dopadu, odrazu a lomu", "Jako směr větru", "Jako stínítko", "Jako zdroj světla"], "correct": 0, "explanation": "Úhly dopadu, odrazu a lomu se měří vzhledem k normále."}, {"category": "PAPRSEK", "kind": "focus", "q": "Co je ohnisko spojné čočky?", "options": ["Bod, kde se po průchodu čočkou sbíhají paprsky rovnoběžné s hlavní osou", "Střed skla bez optického významu", "Místo na okraji čočky", "Zdroj světla"], "correct": 0, "explanation": "Obrazové ohnisko spojky je místo průsečíku rovnoběžných paprsků po lomu."}, {"category": "BARVY", "kind": "prism", "q": "Co může udělat hranol s bílým světlem?", "options": ["Rozložit ho na spektrum barev", "Změnit ho vždy jen na červené", "Úplně ho pohltit bez výjimky", "Zvětšit předmět jako lupa"], "correct": 0, "explanation": "Kvůli disperzi se různé vlnové délky lámou rozdílně a bílé světlo se může rozložit na spektrum."}, {"category": "FINÁLE", "kind": "periscope", "q": "Jednoduchý periskop se dvěma rovinnými zrcadly funguje hlavně díky…", "options": ["Odrazu světla", "Lomu ve spojce", "Disperzi v hranolu", "Pohlcení světla"], "correct": 0, "explanation": "Periskop mění směr světelných paprsků pomocí odrazu na zrcadlech."}];window.quizData=questions;let i=0,score=0,locked=false;const $=id=>document.getElementById(id);for(let n=0;n<questions.length;n++){const c=document.createElement('div');c.className='cell';$('cells').appendChild(c)}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function visual(q){function art(k){const base=`<line x1='40' y1='130' x2='380' y2='130' stroke='#274c70' stroke-width='2' stroke-dasharray='7 7'/>`;if(k==='mirror_equal')return base+`<line x1='235' y1='45' x2='235' y2='210' stroke='#e2e8f0' stroke-width='7'/><line x1='235' y1='80' x2='235' y2='180' stroke='#94a3b8' stroke-width='1'/><path d='M70 70 L235 130 L360 85' stroke='#22d3ee' stroke-width='5' fill='none'/>`;if(k==='plane_image'||k==='distance')return base+`<line x1='210' y1='45' x2='210' y2='210' stroke='#e2e8f0' stroke-width='7'/><circle cx='120' cy='105' r='18' fill='#f59e0b'/><path d='M120 123 V190' stroke='#f59e0b' stroke-width='7'/><circle cx='300' cy='105' r='18' fill='none' stroke='#f59e0b' stroke-width='3' stroke-dasharray='5 5'/><path d='M300 123 V190' stroke='#f59e0b' stroke-width='5' stroke-dasharray='5 5'/>`;if(k.startsWith('shadow'))return `<circle cx='70' cy='125' r='20' fill='#fde047'/><rect x='190' y='85' width='34' height='80' fill='#64748b'/><rect x='340' y='55' width='8' height='140' fill='#e2e8f0'/><path d='M90 110 L340 55 M90 140 L340 195' stroke='#facc15' stroke-width='3'/><rect x='340' y='55' width='8' height='140' fill='#111827' opacity='.7'/>`;if(k==='air_glass'||k==='glass_air'||k==='normal')return `<rect x='210' y='35' width='175' height='180' fill='#60a5fa' opacity='.18'/><line x1='210' y1='35' x2='210' y2='215' stroke='#e2e8f0' stroke-width='4'/><line x1='210' y1='50' x2='210' y2='200' stroke='#64748b' stroke-width='2' stroke-dasharray='6 6'/>${k==='normal'?`<path d='M60 125 L360 125' stroke='#22d3ee' stroke-width='5'/>`:`<path d='M65 65 L210 125 L360 ${k==='air_glass'?165:75}' stroke='#22d3ee' stroke-width='5' fill='none'/>`}`;if(k.includes('shape'))return base+`${k==='convex_shape'?`<path d='M190 50 Q240 130 190 210 Q250 130 190 50' fill='#60a5fa55' stroke='#60a5fa' stroke-width='4'/>`:`<path d='M185 50 Q225 130 185 210 L255 210 Q215 130 255 50 Z' fill='#60a5fa33' stroke='#60a5fa' stroke-width='4'/>`}`;if(k.includes('parallel_'))return base+`<path d='M210 50 Q250 130 210 210 Q170 130 210 50' fill='#60a5fa33' stroke='#60a5fa' stroke-width='4'/><path d='M50 80 L205 80 ${k==='parallel_convex'?'L330 130':'L340 50'}' stroke='#22d3ee' stroke-width='4' fill='none'/><path d='M50 130 L205 130 ${k==='parallel_convex'?'L330 130':'L340 130'}' stroke='#22d3ee' stroke-width='4' fill='none'/><path d='M50 180 L205 180 ${k==='parallel_convex'?'L330 130':'L340 210'}' stroke='#22d3ee' stroke-width='4' fill='none'/>`;if(k==='concave'||k==='convex')return `<path d='M225 45 Q${k==='concave'?145:305} 130 225 215' fill='none' stroke='#e2e8f0' stroke-width='8'/><path d='M55 80 L220 95 ${k==='concave'?'L330 130':'L340 65'}' stroke='#22d3ee' stroke-width='4' fill='none'/><path d='M55 130 L220 130 ${k==='concave'?'L330 130':'L340 130'}' stroke='#22d3ee' stroke-width='4' fill='none'/>`;if(k==='prism')return `<polygon points='200,55 110,205 310,205' fill='#60a5fa33' stroke='#60a5fa' stroke-width='4'/><path d='M45 125 L155 125' stroke='#fff' stroke-width='5'/><path d='M155 125 L340 85' stroke='#ef4444' stroke-width='3'/><path d='M155 125 L340 115' stroke='#f59e0b' stroke-width='3'/><path d='M155 125 L340 145' stroke='#22c55e' stroke-width='3'/><path d='M155 125 L340 175' stroke='#3b82f6' stroke-width='3'/>`;if(k==='periscope')return `<rect x='120' y='45' width='180' height='165' rx='16' fill='#334155'/><line x1='135' y1='65' x2='200' y2='115' stroke='#e2e8f0' stroke-width='8'/><line x1='220' y1='150' x2='285' y2='200' stroke='#e2e8f0' stroke-width='8'/><path d='M50 65 L165 90 L252 175 L360 200' stroke='#22d3ee' stroke-width='4' fill='none'/>`;return base+`<circle cx='75' cy='130' r='16' fill='#fde047'/><path d='M90 130 L330 130' stroke='#22d3ee' stroke-width='5'/><circle cx='330' cy='130' r='8' fill='#fff'/>`;}stage.innerHTML=`<svg viewBox='0 0 420 250' xmlns='http://www.w3.org/2000/svg'><rect width='420' height='250' fill='#050b13'/><text x='20' y='28' fill='#67e8f9' font-size='14' font-weight='800'>OPTICKÁ LAVICE</text>${art(q.kind)}</svg>`;}
function show(){locked=false;const q=questions[i];$('prog').textContent=`${i+1} / ${questions.length}`;$('cat').textContent=q.category;$('qtext').textContent=q.q;$('opts').innerHTML='';$('fb').className='feedback';$('next').style.display='none';visual(q);q.options.forEach((o,n)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+n)}.</b> ${esc(o)}`;b.onclick=()=>answer(n);$('opts').appendChild(b)})}function answer(n){if(locked)return;locked=true;const q=questions[i],[...buttons]=$('opts').children;buttons.forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('correct');if(j===n&&j!==q.correct)b.classList.add('wrong')});if(n===q.correct)score++;$('fb').className='feedback show';$('fb').innerHTML=`<b>${n===q.correct?'Správně.':'Tady to nesedlo.'}</b> ${esc(q.explanation)}`;$('cells').children[i].classList.add('done');$('next').style.display='block'}$('next').onclick=()=>{i++;if(i<questions.length)show();else finish()};function finish(){$('quiz').style.display='none';$('result').classList.add('show');$('score').textContent=`${score} / ${questions.length}`;const p=score/questions.length;$('resText').textContent=p>=.9?'Výborný výsledek. Tohle máte opravdu v ruce.':p>=.7?'Velmi slušné. Většinu jste zvládli jistě.':p>=.5?'Dobrý základ, ale pár detailů ještě umí překvapit.':'Tenhle svět má svoje chytáky. Příště už budete vědět víc.'}$('restart').onclick=()=>{i=0;score=0;[...$('cells').children].forEach(c=>c.className='cell');$('quiz').style.display='block';$('result').classList.remove('show');show()};show();
</script></body></html>
