<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Česká mapa bez nápovědy – 10 míst</title>
<style>
:root{--bg:#f3f3f2;--navy:#21324a;--muted:#70757d;--accent:#9a5a0a;--soft:#f7f6f3;--good:#16783a;--goodbg:#ecf8ef;--bad:#b42318;--badbg:#fff0ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f2024}body{padding:32px 14px}
.shell{max-width:700px;margin:auto;background:#fff;border:1px solid #d7dbe1;border-radius:24px;overflow:hidden}.head{padding:28px 28px 20px}
.kicker{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
h1{font-size:31px;line-height:1.05;color:var(--navy);margin:0 0 14px;font-weight:900}.lead{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 24px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;font-weight:800}.score{padding:9px 14px;border:1px solid #dcdfe4;background:var(--soft);border-radius:999px}
.bar{height:9px;background:#ebe9e6;border-top:1px solid #e2dfdb;border-bottom:1px solid #e2dfdb}.prog{height:100%;width:0;background:#b06b13;transition:.25s}
.main{padding:28px}.tag{font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.place{font-size:31px;line-height:1.15;font-weight:900;color:var(--navy);margin:0 0 22px}
.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid #dde1e6;background:#fff;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.35;font-weight:700;cursor:pointer}
.answer:hover:not(:disabled){border-color:#aeb7c2;background:#fbfbfc}.answer:disabled{cursor:default}.answer.correct{border-color:var(--good);background:var(--goodbg);color:#0e5c2a}.answer.wrong{border-color:var(--bad);background:var(--badbg);color:#8e1d15}
.feedback{display:none;margin-top:18px;padding:15px 17px;border-radius:13px;background:#f7f7f7;border:1px solid #e0e2e6;font-size:15px;line-height:1.5;color:#3f444c}.feedback.show{display:block}
.controls{display:none;justify-content:flex-end;margin-top:18px}.controls.show{display:flex}.next,.restart{border:0;border-radius:12px;background:var(--navy);color:#fff;padding:13px 20px;font-size:15px;font-weight:900;cursor:pointer}
.result{display:none;text-align:center}.result.show{display:block}.rscore{font-size:54px;line-height:1;font-weight:900;color:var(--navy);margin:4px 0 10px}.rtitle{font-size:25px;font-weight:900;margin:0 0 10px}.rtext{font-size:16px;line-height:1.5;color:#5f6670;max-width:540px;margin:0 auto 22px}.footer{padding:0 28px 24px;text-align:center;color:#8a8f97;font-size:12px}
@media(max-width:520px){body{padding:12px 8px}.shell{border-radius:18px}.head{padding:22px 20px 16px}h1{font-size:27px}.main{padding:22px 20px}.place{font-size:27px}.answer{padding:14px 15px;font-size:15px}}
</style>
</head>
<body>
<div class="shell">
<section class="head">
<div class="kicker">MAPA ČESKA • 10 MÍST</div>
<h1>Česká mapa bez nápovědy</h1>
<p class="lead">Dostanete jen název místa. Žádná řeka, žádná památka navíc. Dokážete určit správný kraj?</p>
<div class="meta"><span id="counter">Místo 1 z 10</span><span class="score">Skóre <span id="score">0</span></span></div>
</section>
<div class="bar"><div class="prog" id="prog"></div></div>
<main class="main">
<section id="quiz">
<div class="tag" id="tag"></div>
<h2 class="place" id="place"></h2>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback"></div>
<div class="controls" id="controls"><button class="next" id="next">Další místo</button></div>
</section>
<section class="result" id="result">
<div class="rscore"><span id="final">0</span>/10</div>
<h2 class="rtitle" id="rtitle"></h2>
<p class="rtext" id="rtext"></p>
<button class="restart" id="restart">Zkusit znovu</button>
</section>
</main>
<div class="footer">Každé místo patří právě do jednoho správného kraje.</div>
</div>
<script>
const q=[{"place": "Panská skála", "tag": "Kam patří?", "a": ["Liberecký kraj", "Ústecký kraj", "Karlovarský kraj", "Královéhradecký kraj"], "c": 0, "e": "Panská skála leží u Kamenického Šenova v Libereckém kraji."}, {"place": "Tiské stěny", "tag": "Kam patří?", "a": ["Ústecký kraj", "Liberecký kraj", "Středočeský kraj", "Karlovarský kraj"], "c": 0, "e": "Tiské stěny leží v Ústeckém kraji, nedaleko Tisé a Českého Švýcarska."}, {"place": "Kladruby nad Labem", "tag": "Kam patří?", "a": ["Pardubický kraj", "Královéhradecký kraj", "Středočeský kraj", "Kraj Vysočina"], "c": 0, "e": "Kladruby nad Labem leží v Pardubickém kraji a jsou známé národním hřebčínem a krajinou UNESCO."}, {"place": "Štramberk", "tag": "Kam patří?", "a": ["Moravskoslezský kraj", "Zlínský kraj", "Olomoucký kraj", "Jihomoravský kraj"], "c": 0, "e": "Štramberk leží v Moravskoslezském kraji, v okrese Nový Jičín."}, {"place": "Holašovice", "tag": "Kam patří?", "a": ["Jihočeský kraj", "Plzeňský kraj", "Kraj Vysočina", "Středočeský kraj"], "c": 0, "e": "Holašovice leží v Jihočeském kraji a jejich historická vesnická rezervace je zapsaná na seznamu UNESCO."}, {"place": "Kutná Hora", "tag": "Kam patří?", "a": ["Středočeský kraj", "Pardubický kraj", "Kraj Vysočina", "Královéhradecký kraj"], "c": 0, "e": "Kutná Hora patří do Středočeského kraje."}, {"place": "Telč", "tag": "Kam patří?", "a": ["Kraj Vysočina", "Jihočeský kraj", "Jihomoravský kraj", "Pardubický kraj"], "c": 0, "e": "Telč leží v Kraji Vysočina."}, {"place": "Lednice", "tag": "Kam patří?", "a": ["Jihomoravský kraj", "Zlínský kraj", "Olomoucký kraj", "Kraj Vysočina"], "c": 0, "e": "Lednice leží v Jihomoravském kraji a je součástí Lednicko-valtického areálu."}, {"place": "Kroměříž", "tag": "Kam patří?", "a": ["Zlínský kraj", "Olomoucký kraj", "Jihomoravský kraj", "Moravskoslezský kraj"], "c": 0, "e": "Kroměříž leží ve Zlínském kraji."}, {"place": "Bečov nad Teplou", "tag": "Kam patří?", "a": ["Karlovarský kraj", "Plzeňský kraj", "Ústecký kraj", "Středočeský kraj"], "c": 0, "e": "Bečov nad Teplou leží v Karlovarském kraji, jižně od Karlových Varů."}];
let i=0,s=0,lock=false;
const counter=document.getElementById('counter'),score=document.getElementById('score'),prog=document.getElementById('prog'),tag=document.getElementById('tag'),place=document.getElementById('place'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),controls=document.getElementById('controls'),next=document.getElementById('next'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
function render(){
 lock=false;const x=q[i];counter.textContent=`Místo ${i+1} z ${q.length}`;score.textContent=s;prog.style.width=`${i/q.length*100}%`;tag.textContent=x.tag;place.textContent=x.place;answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';controls.className='controls';
 x.a.forEach((t,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>pick(n);answers.appendChild(b)});
}
function pick(n){
 if(lock)return;lock=true;const x=q[i],bs=[...answers.querySelectorAll('.answer')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('correct')});
 if(n===x.c){s++;score.textContent=s;feedback.innerHTML=`<strong>Správně.</strong> ${x.e}`;}else{bs[n].classList.add('wrong');feedback.innerHTML=`<strong>Tentokrát ne.</strong> ${x.e}`;}
 feedback.classList.add('show');controls.classList.add('show');prog.style.width=`${(i+1)/q.length*100}%`;next.textContent=i===q.length-1?'Zobrazit výsledek':'Další místo';
}
function finish(){
 quiz.style.display='none';result.classList.add('show');counter.textContent='Hotovo';prog.style.width='100%';document.getElementById('final').textContent=s;let t,p;
 if(s===10){t='Českou mapu máte v hlavě';p='Plný počet. Ani méně nápadná místa vás neposlala do špatného kraje.';}
 else if(s>=8){t='Velmi silná orientace';p='Jedna nebo dvě lokality zaskočily, jinak se po republice orientujete velmi dobře.';}
 else if(s>=5){t='Mapa drží napůl';p='Známější místa sedla, ale několik lokalit už zamotalo hranice krajů.';}
 else{t='Bez mapy to tentokrát bolelo';p='Přesně proto je tenhle formát zákeřný: místo člověk zná, ale kraj už si tak jistý není.';}
 document.getElementById('rtitle').textContent=t;document.getElementById('rtext').textContent=p;
}
next.onclick=()=>{if(i<q.length-1){i++;render()}else finish()};
document.getElementById('restart').onclick=()=>{i=0;s=0;quiz.style.display='';result.classList.remove('show');render()};
render();
</script>
</body>
</html>
