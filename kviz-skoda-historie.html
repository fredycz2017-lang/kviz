<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze světa Škody</title><style>
:root{--bg:#f4f4f1;--card:#fff;--text:#171717;--muted:#696969;--line:#e7e7e2;--accent:#d99100;--ok:#16784c;--oksoft:#eaf7f0;--bad:#b83a3a;--badsoft:#fff0f0;--shadow:0 18px 50px rgba(0,0,0,.08)}*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}body{padding:12px}.quiz{width:min(700px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.hero{padding:26px 28px 20px;background:radial-gradient(circle at 100% 0%,rgba(217,145,0,.16),transparent 32%),linear-gradient(180deg,#fff 0%,#fbfbf8 100%);border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}h1{font-size:clamp(25px,5vw,34px);line-height:1.05;margin:0 0 10px;letter-spacing:-.03em}.subtitle{font-size:15px;line-height:1.5;color:var(--muted);margin:0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:20px}.counter,.scorepill{font-size:13px;font-weight:700;color:var(--muted)}.scorepill{padding:7px 11px;border-radius:999px;background:#f4f4f0;border:1px solid var(--line)}.progress{height:7px;background:#eeeeea}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#b87500,#e4a51a);transition:width .28s ease}.main{padding:26px 28px 28px}.question{font-size:22px;line-height:1.28;font-weight:800;letter-spacing:-.015em;margin:0 0 20px}.answers{display:grid;gap:10px}.answer{width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--text);padding:15px 16px;border-radius:15px;font-size:15px;line-height:1.35;font-weight:650;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease}.answer:hover:not(:disabled){transform:translateY(-1px);border-color:#cfcfc8;box-shadow:0 6px 18px rgba(0,0,0,.05)}.answer:disabled{cursor:default}.answer.correct{border-color:#9bd5b8;background:var(--oksoft);color:#0d5f3a}.answer.wrong{border-color:#e1aaaa;background:var(--badsoft);color:#902b2b}.feedback{display:none;margin-top:16px;padding:14px 15px;border-radius:14px;font-size:14px;line-height:1.48;background:#f7f7f4;border:1px solid var(--line)}.feedback.show{display:block;animation:fade .18s ease}.feedback strong{display:block;margin-bottom:3px}.next{display:none;margin-top:16px;width:100%;border:0;border-radius:14px;padding:14px 16px;background:#171717;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.next.show{display:block}.result{display:none;text-align:center;padding:38px 28px 36px}.result.show{display:block}.result .big{font-size:52px;font-weight:900;letter-spacing:-.05em;margin:8px 0}.result h2{font-size:25px;margin:0 0 8px}.result p{color:var(--muted);line-height:1.5;margin:0 auto 20px;max-width:500px}.retry{border:0;border-radius:14px;background:#171717;color:#fff;padding:13px 20px;font-weight:800;cursor:pointer}.micro{font-size:11px;color:#8a8a84;text-align:center;padding:0 20px 18px}@keyframes fade{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}@media(max-width:560px){body{padding:8px}.quiz{border-radius:18px}.hero,.main{padding-left:18px;padding-right:18px}.hero{padding-top:21px}.question{font-size:19px}.answer{padding:13px 14px;font-size:14px}}
</style></head><body><div class="quiz"><section id="play"><div class="hero"><div class="eyebrow">15 otázek • historie automobilky</div><h1>Kvíz ze světa Škody</h1><p class="subtitle">Od bicyklů Slavia přes 1000 MB až po Enyaq. Kolik z 15 otázek zvládnete?</p><div class="topline"><div id="counter" class="counter">Otázka 1 z 15</div><div id="scorepill" class="scorepill">Skóre 0</div></div></div><div class="progress"><div id="bar"></div></div><main class="main"><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next">Další otázka →</button></main></section><section id="result" class="result"><div class="eyebrow">Hotovo</div><h2>Vaše skóre</h2><div id="bigscore" class="big">0/15</div><p id="resulttext"></p><button id="retry" class="retry">Zkusit znovu</button></section><div class="micro">Kvíz je pouze znalostní a slouží pro zábavu.</div></div><script>const questions=[{"q": "Ve kterém roce vznikla firma Laurin & Klement, z níž vyrostla dnešní Škoda Auto?", "opts": ["1895", "1901", "1905", "1925"], "correct": 0, "explain": "Václav Laurin a Václav Klement založili podnik v Mladé Boleslavi v roce 1895."}, {"q": "Která dvojice stála u zrodu firmy Laurin & Klement?", "opts": ["Emil Škoda a Václav Klement", "Václav Laurin a Emil Škoda", "Václav Laurin a Václav Klement", "František Křižík a Václav Laurin"], "correct": 2, "explain": "Zakladateli byli mechanik Václav Laurin a knihkupec Václav Klement."}, {"q": "Co firma Laurin & Klement vyráběla na úplném začátku?", "opts": ["Nákladní automobily", "Jízdní kola", "Traktory", "Lokomotivy"], "correct": 1, "explain": "Podnik začal výrobou jízdních kol značky Slavia; motocykly a auta přišly později."}, {"q": "Jak se jmenoval první automobil Laurin & Klement představený v roce 1905?", "opts": ["Popular", "Rapid", "Tudor", "Voiturette A"], "correct": 3, "explain": "Prvním automobilem firmy byl malý dvoumístný L&K Voiturette A."}, {"q": "Ve kterém roce se Laurin & Klement spojila s plzeňským koncernem Škoda?", "opts": ["1918", "1925", "1934", "1946"], "correct": 1, "explain": "K fúzi Laurin & Klement s plzeňským koncernem Škoda došlo v roce 1925."}, {"q": "Který z těchto názvů používala Škoda jako model už ve 30. letech 20. století?", "opts": ["Kodiaq", "Scala", "Superb", "Kamiq"], "correct": 2, "explain": "Jméno Superb se u vozů Škoda používalo už ve 30. letech; vrcholný Superb se vyráběl od roku 1934."}, {"q": "Ve kterém roce se poprvé objevil model se jménem Octavia?", "opts": ["1959", "1964", "1976", "1996"], "correct": 0, "explain": "První Škoda Octavia se objevila v roce 1959. Moderní Octavia stejného jména přišla až v roce 1996."}, {"q": "Který model zahájil v roce 1964 éru škodovek s motorem vzadu?", "opts": ["Felicia", "Favorit", "Octavia", "1000 MB"], "correct": 3, "explain": "Škoda 1000 MB přišla v roce 1964 se samonosnou karoserií a motorem vzadu."}, {"q": "Který model z roku 1987 přinesl Škodě přední motor a pohon předních kol?", "opts": ["105", "Favorit", "Rapid", "110 R"], "correct": 1, "explain": "Favorit znamenal zásadní konstrukční obrat: motor vpředu, přední pohon a moderní koncepci."}, {"q": "Ve kterém roce se Škoda stala součástí koncernu Volkswagen?", "opts": ["1989", "1996", "1991", "2000"], "correct": 2, "explain": "Škoda se součástí koncernu Volkswagen stala v roce 1991."}, {"q": "Kdy se představila první moderní generace Octavie?", "opts": ["1991", "1999", "2001", "1996"], "correct": 3, "explain": "Moderní Octavia byla uvedena v roce 1996 a stala se jedním z klíčových modelů značky."}, {"q": "Který model značky Škoda se začal vyrábět v roce 2009 a patřil mezi její první SUV/crossovery?", "opts": ["Yeti", "Karoq", "Kodiaq", "Kamiq"], "correct": 0, "explain": "Škoda Yeti se vyráběla od roku 2009 do roku 2017."}, {"q": "Které kupé se vyrábělo v letech 1970 až 1980?", "opts": ["Škoda Favorit", "Škoda Yeti", "Škoda 110 R", "Škoda Roomster"], "correct": 2, "explain": "Elegantní Škoda 110 R Coupé patří mezi nejznámější československé sportovně laděné vozy své éry."}, {"q": "Jak se jmenuje první sériová Škoda postavená na čistě elektrické platformě MEB koncernu Volkswagen?", "opts": ["Citigo", "Enyaq iV", "Scala", "Elroq"], "correct": 1, "explain": "Enyaq iV byl prvním modelem Škoda postaveným na čistě elektrické platformě MEB."}, {"q": "Která značka kol stála na úplném začátku příběhu Laurin & Klement?", "opts": ["Popular", "Bohemia", "Spartak", "Slavia"], "correct": 3, "explain": "První jízdní kola Laurin & Klement nesla značku Slavia."}];let index=0,score=0,locked=false;const qEl=document.getElementById('question'),aEl=document.getElementById('answers'),fEl=document.getElementById('feedback'),nEl=document.getElementById('next'),cEl=document.getElementById('counter'),sEl=document.getElementById('scorepill'),bar=document.getElementById('bar'),play=document.getElementById('play'),result=document.getElementById('result');function render(){locked=false;const item=questions[index];cEl.textContent=`Otázka ${index+1} z ${questions.length}`;sEl.textContent=`Skóre ${score}`;bar.style.width=`${(index/questions.length)*100}%`;qEl.textContent=item.q;aEl.innerHTML='';fEl.className='feedback';fEl.innerHTML='';nEl.className='next';item.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.addEventListener('click',()=>answer(i,b));aEl.appendChild(b)})}function answer(choice,button){if(locked)return;locked=true;const item=questions[index];const buttons=[...aEl.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);buttons[item.correct].classList.add('correct');if(choice===item.correct){score++;fEl.innerHTML=`<strong>Správně.</strong>${item.explain}`}else{button.classList.add('wrong');fEl.innerHTML=`<strong>Tentokrát ne.</strong>Správná odpověď je <b>${item.opts[item.correct]}</b>. ${item.explain}`}sEl.textContent=`Skóre ${score}`;fEl.className='feedback show';nEl.textContent=index===questions.length-1?'Zobrazit výsledek →':'Další otázka →';nEl.className='next show'}nEl.addEventListener('click',()=>{if(index<questions.length-1){index++;render()}else{finish()}});function finish(){bar.style.width='100%';play.style.display='none';result.className='result show';document.getElementById('bigscore').textContent=`${score}/${questions.length}`;let t='';if(score===15)t='Perfektní jízda. Historii Škody máte opravdu v malíku.';else if(score>=12)t='Výborný výsledek. V historii mladoboleslavské automobilky se orientujete velmi dobře.';else if(score>=8)t='Solidní výkon. Základy sedí, ale pár modelů a letopočtů vás nachytalo.';else t='Tentokrát to bylo těžší. Druhý pokus může dopadnout výrazně lépe.';document.getElementById('resulttext').textContent=t}document.getElementById('retry').addEventListener('click',()=>{index=0;score=0;locked=false;result.className='result';play.style.display='block';render()});render();</script></body></html>
