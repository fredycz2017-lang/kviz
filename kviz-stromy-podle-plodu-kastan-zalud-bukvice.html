<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Kaštan, žalud, bukvice. Poznáte 15 českých stromů jen podle plodu?</title><style>
*{box-sizing:border-box}body{margin:0;background:#1f2a20;color:#26321f;font-family:Arial,sans-serif;background-image:radial-gradient(#ffffff0a 1px,transparent 1px);background-size:20px 20px}.wrap{max-width:1160px;margin:auto;padding:18px}.sign{background:#efe3bd;border:8px solid #7b5834;border-radius:14px;padding:17px 20px;box-shadow:0 14px 30px #0005}h1{margin:0;font-size:clamp(28px,4vw,43px);line-height:1.06}.sign p{margin:8px 0 0;color:#665a43}.cabinet{margin-top:18px;background:#8b643c;border:10px solid #5b3c22;border-radius:18px;padding:16px;box-shadow:0 20px 45px #0007}.drawers{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}.drawer{height:45px;background:linear-gradient(#c6945a,#9c6d3d);border:2px solid #5e3c20;border-radius:4px;display:grid;place-items:center;color:#3e2917;font-weight:900;position:relative}.drawer:after{content:'';width:26px;height:6px;border-radius:5px;background:#4d351f;position:absolute;bottom:6px}.drawer.open{transform:translateY(7px);background:#ddb878;color:#31522b}.table{display:grid;grid-template-columns:430px 1fr;gap:18px;background:#efe3bd;border-radius:12px;padding:18px;border:3px solid #5b3c22}.display{background:#f7f0d6;border:1px solid #b69e6e;border-radius:50%;aspect-ratio:1;max-height:330px;display:grid;place-items:center;margin:auto;width:min(100%,330px);box-shadow:inset 0 0 30px #8b643c22}.display svg{width:88%;height:88%}.zone{font-weight:900;font-size:12px;color:#6b4d29;letter-spacing:.1em}.clue{margin:8px 0;padding:9px 11px;border-left:5px solid #8b643c;background:#f7f0d6;font-weight:700}.q{font-size:24px;font-weight:900;line-height:1.2;margin:14px 0}.answers{display:grid;gap:9px}.answer{border:2px solid #ad9164;background:#fffaf0;border-radius:12px;padding:13px;text-align:left;font-weight:800;font-size:16px;cursor:pointer}.answer.correct{background:#e7f3e4;border-color:#558354}.answer.wrong{background:#fde8e4;border-color:#a94a3d}.feedback{display:none;background:#f8f0d9;padding:12px;border-radius:10px;margin-top:10px}.feedback.show{display:block}#nextBtn,.restart{display:none;border:0;background:#34552f;color:white;padding:12px 18px;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}.restart{display:inline-block}#result{display:none;text-align:center;color:#3b301f;padding:28px;background:#efe3bd;border-radius:12px}#score{font-size:56px;font-weight:900;color:#34552f}@media(max-width:820px){.table{grid-template-columns:1fr}.drawers{grid-template-columns:repeat(5,1fr)}.drawer{height:37px;font-size:12px}}
</style></head><body><div class="wrap"><header class="sign"><h1>Kvíz: Kaštan, žalud, bukvice. Poznáte 15 českých stromů jen podle plodu?</h1><p>Podzimní herbář bez listů a bez fotografie koruny. Jen plod, semeno nebo plodenství.</p></header><main class="cabinet"><div class="drawers" id="drawers"></div><section class="table" id="quiz"><div class="display" id="display"></div><div><div class="zone" id="cat"></div><div class="clue" id="clue"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button id="nextBtn">Otevřít další zásuvku</button></div></section><section id="result"><div id="score"></div><p id="resultText"></p><button class="restart" id="restartBtn">Projít herbář znovu</button></section></main></div><script>const questions=[{"cat":"LES","fruit":"acorn","clue":"Jedno semeno v miskovité číšce.","q":"Kterému stromu patří tento plod?","o":["Dub","Buk","Jasan","Lípa"],"a":0,"e":"Žalud je plod dubu a sedí v nápadné číšce."},{"cat":"LES","fruit":"beechnut","clue":"Trojboké oříšky uvnitř ostnité číšky.","q":"Kterému stromu patří tento plod?","o":["Jírovec","Olše","Buk","Javor"],"a":2,"e":"Bukvice jsou plody buku a bývají ukryté v ostnité číšce."},{"cat":"PARK","fruit":"horsechestnut","clue":"Velké lesklé hnědé semeno v zelené ostnité tobolce.","q":"Který strom vytváří známé „kaštany“ z parků?","o":["Kaštanovník setý","Jírovec maďal","Dub letní","Ořešák královský"],"a":1,"e":"Běžný parkový „kaštan“ je semeno jírovce maďalu, nikoli jedlého kaštanovníku."},{"cat":"KŘÍDLATÁ SEMENA","fruit":"maple","clue":"Dvě spojená křídla, dětské „nosy“.","q":"Který strom má typické párové křídlaté dvounažky?","o":["Jasan","Jilm","Bříza","Javor"],"a":3,"e":"Javor je typický párovými křídlatými plody, často přezdívanými „nosy“."},{"cat":"ALEJ","fruit":"linden","clue":"Drobné oříšky visí pod dlouhým blanitým listenem.","q":"Kterému stromu patří tento nápadný plod s listenem?","o":["Lípa","Habr","Buk","Olše"],"a":0,"e":"Plody lípy jsou drobné oříšky na stopce spojené s výrazným listenem."},{"cat":"KŘÍDLATÁ SEMENA","fruit":"ash","clue":"Úzké jednosemenné nažky visí ve svazcích.","q":"Kterému stromu patří svazečky úzkých křídlatých nažek?","o":["Javor","Bříza","Jasan","Jírovec"],"a":2,"e":"Jasan tvoří protáhlé křídlaté nažky často ve výrazných svazcích."},{"cat":"LES","fruit":"hornbeam","clue":"Malý oříšek nese nápadný trojlaločný listen.","q":"Kterému stromu patří oříšek s trojlaločným listenem?","o":["Lípa","Habr","Dub","Jeřáb"],"a":1,"e":"Habr má drobné oříšky s typickými trojlaločnými listeny."},{"cat":"ALEJ","fruit":"birch","clue":"Drobounká křídlatá semena dozrávají v rozpadavých jehnědách.","q":"Který strom má množství velmi drobných křídlatých nažek v jehnědách?","o":["Olše","Jilm","Topol","Bříza"],"a":3,"e":"Bříza vytváří drobné křídlaté nažky v plodenstvích připomínajících šištičku či jehnědu."},{"cat":"VODA","fruit":"alder","clue":"Dřevnaté tmavé plodenství vypadá jako malá šištička.","q":"Kterému listnatému stromu patří drobná „šištička“?","o":["Olše","Buk","Javor","Jasan"],"a":0,"e":"Olše má dřevnatá samičí plodenství, která připomínají malé šištice."},{"cat":"PARK","fruit":"rowan","clue":"Husté trsy oranžově červených malvic.","q":"Který strom nese na podzim nápadné trsy oranžově červených plodů?","o":["Jírovec","Habr","Jeřáb ptačí","Lípa"],"a":2,"e":"Jeřáb ptačí tvoří nápadné trsy oranžově až červeně zbarvených malvic."},{"cat":"PARK","fruit":"locust","clue":"Plochý podlouhlý lusk se semeny.","q":"Kterému běžnému stromu patří ploché lusky?","o":["Dub","Trnovník akát","Jilm","Buk"],"a":1,"e":"Trnovník akát patří mezi bobovité a vytváří ploché lusky."},{"cat":"KŘÍDLATÁ SEMENA","fruit":"elm","clue":"Semeno je uprostřed téměř kulatého papírového křídla.","q":"Který strom má ploché kulaté křídlaté nažky?","o":["Jasan","Javor","Bříza","Jilm"],"a":3,"e":"Jilm vytváří charakteristické ploché okrouhlé křídlaté nažky."},{"cat":"PARK","fruit":"plane","clue":"Kulovité chlupaté plodenství visí na dlouhé stopce.","q":"Který parkový strom má nápadné kulovité plodenství?","o":["Platan","Lípa","Olše","Jírovec"],"a":0,"e":"Platan má charakteristické kulovité plodenství visící na stopce."},{"cat":"VODA","fruit":"willow","clue":"Tobolky uvolňují drobná semena s chmýrem.","q":"Který strom rozšiřuje semena pomocí bílého chmýru z tobolek?","o":["Buk","Jasan","Vrba","Dub"],"a":2,"e":"Vrby uvolňují z tobolek velmi drobná semena opatřená chmýrem."},{"cat":"ALEJ","fruit":"walnut","clue":"Velký ořech je ukrytý v dužnatém zeleném oplodí.","q":"Který strom nese tento známý ořech?","o":["Líska","Ořešák královský","Jírovec","Habr"],"a":1,"e":"Vlašský ořech je plod ořešáku královského."}];const drawers=document.getElementById('drawers');for(let j=0;j<15;j++){let d=document.createElement('div');d.className='drawer';d.textContent=String(j+1).padStart(2,'0');drawers.appendChild(d)}
function fruitArt(k){let a='';if(k==='acorn')a=`<path d='M145 105 Q200 65 255 105 L242 132 Q200 145 158 132Z' fill='#8b5a2b'/><ellipse cx='200' cy='150' rx='38' ry='52' fill='#9a632f'/><path d='M173 105 Q200 85 227 105' stroke='#5b3a20' stroke-width='5' fill='none'/>`;else if(k==='beechnut')a=`<path d='M120 145 Q200 70 280 145 Q245 205 200 205 Q155 205 120 145Z' fill='#997a4f'/><path d='M140 130 L120 95 M165 110 L155 70 M200 100 L200 60 M235 110 L245 70 M260 130 L280 95' stroke='#6b5036' stroke-width='6'/><polygon points='170,155 200,110 230,155 200,195' fill='#6b4728'/>`;else if(k==='horsechestnut')a=`<circle cx='200' cy='150' r='55' fill='#7a3d1d'/><circle cx='180' cy='130' r='16' fill='#d8b38b'/><path d='M105 120 Q200 40 295 120 Q270 85 200 75 Q130 85 105 120Z' fill='#6b8e23'/><path d='M120 110 L100 80 M150 90 L140 55 M200 80 L200 45 M250 90 L260 55 M280 110 L300 80' stroke='#405c19' stroke-width='5'/>`;else if(k==='maple')a=`<path d='M200 145 L105 80 Q95 70 110 65 Q165 72 205 120' fill='#c9a45b' stroke='#8b6a2c' stroke-width='4'/><path d='M200 145 L295 80 Q305 70 290 65 Q235 72 195 120' fill='#d4b36a' stroke='#8b6a2c' stroke-width='4'/><circle cx='200' cy='145' r='16' fill='#7d5a24'/>`;else if(k==='linden')a=`<path d='M120 75 Q210 55 290 85 Q230 105 150 105Z' fill='#cbbf72'/><path d='M205 95 L205 145' stroke='#7c6b39' stroke-width='5'/><circle cx='190' cy='162' r='15' fill='#887337'/><circle cx='220' cy='170' r='15' fill='#887337'/>`;else if(k==='ash')a=`<path d='M200 75 L200 185' stroke='#7c5b2e' stroke-width='5'/>`+Array.from({length:6},(_,j)=>`<path d='M200 ${95+j*15} Q ${155-(j%2)*15} ${90+j*13} ${135-(j%2)*10} ${105+j*12} Q170 ${118+j*11} 200 ${110+j*14}Z' fill='#bd9a54'/>`).join('');else if(k==='hornbeam')a=`<path d='M200 70 L200 190' stroke='#6b5533' stroke-width='5'/><path d='M200 105 L130 145 L175 150 L145 190 L200 160 L255 190 L225 150 L270 145Z' fill='#b8a762'/><ellipse cx='200' cy='160' rx='18' ry='25' fill='#80653a'/>`;else if(k==='birch')a=`<path d='M200 60 L200 190' stroke='#795a31' stroke-width='5'/><ellipse cx='200' cy='130' rx='35' ry='72' fill='#8a7442'/><path d='M170 90 L230 105 M168 115 L232 130 M168 140 L232 155 M175 165 L225 178' stroke='#d6c78c' stroke-width='5'/>`;else if(k==='alder')a=`<ellipse cx='175' cy='140' rx='35' ry='50' fill='#5c4b34'/><ellipse cx='235' cy='140' rx='35' ry='50' fill='#6b583d'/><path d='M150 115 L200 175 M210 100 L255 175' stroke='#8a7450' stroke-width='5'/>`;else if(k==='rowan')a=`${[[160,120],[195,105],[230,120],[145,155],[180,150],[215,155],[250,150],[180,185],[220,185]].map(([x,y])=>`<circle cx='${x}' cy='${y}' r='18' fill='#c6452d'/>`).join('')}<path d='M205 70 L195 108' stroke='#6f532d' stroke-width='5'/>`;else if(k==='locust')a=`<path d='M110 115 Q200 75 295 105 Q250 140 120 155Z' fill='#8b6b2d' stroke='#5c4b28' stroke-width='4'/><circle cx='150' cy='130' r='7' fill='#4b3a1e'/><circle cx='190' cy='120' r='7' fill='#4b3a1e'/><circle cx='230' cy='115' r='7' fill='#4b3a1e'/><circle cx='265' cy='115' r='7' fill='#4b3a1e'/>`;else if(k==='elm')a=`<ellipse cx='200' cy='140' rx='75' ry='58' fill='#c8b66e' stroke='#8b783f' stroke-width='4'/><circle cx='200' cy='140' r='11' fill='#76602f'/><path d='M200 80 L200 200 M130 140 L270 140' stroke='#b29a52' stroke-width='2'/>`;else if(k==='plane')a=`<path d='M200 60 L200 100' stroke='#6b4b2b' stroke-width='5'/><circle cx='200' cy='155' r='62' fill='#8b6b3f'/><path d='M150 120 L250 190 M145 160 L245 120 M180 100 L220 210' stroke='#5f452d' stroke-width='4'/>`;else if(k==='willow')a=`<path d='M200 70 L200 165' stroke='#6a5532' stroke-width='5'/><ellipse cx='180' cy='145' rx='18' ry='32' fill='#967347'/><ellipse cx='220' cy='145' rx='18' ry='32' fill='#967347'/>${[[135,105],[120,145],[280,110],[290,160],[150,190],[250,195]].map(([x,y])=>`<circle cx='${x}' cy='${y}' r='22' fill='#fff' opacity='.9'/><circle cx='${x}' cy='${y}' r='4' fill='#705a34'/>`).join('')}`;else if(k==='walnut')a=`<circle cx='200' cy='145' r='70' fill='#8c6a39'/><path d='M200 78 Q170 110 200 145 Q230 180 200 212 M155 100 Q210 115 245 100 M155 185 Q200 170 245 185' fill='none' stroke='#5b4328' stroke-width='6'/>`;return `<svg viewBox='0 0 400 280' xmlns='http://www.w3.org/2000/svg'>${a}</svg>`}
function render(){locked=false;let x=questions[i];document.getElementById('display').innerHTML=fruitArt(x.fruit);document.getElementById('cat').textContent=x.cat+' · ZÁSUVKA '+(i+1)+'/15';document.getElementById('clue').textContent=x.clue;document.getElementById('q').textContent=x.q;document.getElementById('answers').innerHTML=x.o.map((o,j)=>'<button class="answer">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('');document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('nextBtn').style.display='none';wireAnswers();}function markProgress(idx,ok){drawers.children[idx].classList.add('open');drawers.children[idx].textContent=ok?'✓':'×'}function resetProgress(){[...drawers.children].forEach((d,j)=>{d.className='drawer';d.textContent=String(j+1).padStart(2,'0')})}
let i=0,score=0,locked=false; const total=15;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function wireAnswers(){document.querySelectorAll('.answer').forEach((b,idx)=>b.onclick=()=>choose(idx,b));}
function choose(idx,btn){if(locked)return;locked=true;const q=questions[i];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===idx&&j!==q.a)b.classList.add('wrong')});if(idx===q.a)score++;document.getElementById('feedback').innerHTML='<b>'+(idx===q.a?'Správně.':'Tentokrát ne.')+'</b> '+esc(q.e);document.getElementById('feedback').classList.add('show');document.getElementById('nextBtn').style.display='inline-block';markProgress(i,idx===q.a);}
document.getElementById('nextBtn').onclick=()=>{i++;if(i<total)render();else finish();};
function finish(){document.getElementById('quiz').style.display='none';const r=document.getElementById('result');r.style.display='block';document.getElementById('score').textContent=score+' / '+total;document.getElementById('resultText').textContent=score>=13?'Výborný výsledek.':score>=10?'Velmi slušné skóre.':score>=7?'Dobrá polovina, ale pár pastí tu bylo.':'Tenhle svět umí překvapit. Zkuste to ještě jednou.';}
document.getElementById('restartBtn').onclick=()=>{i=0;score=0;locked=false;resetProgress();document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';render();};
render();</script></body></html>
