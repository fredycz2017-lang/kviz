<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvíz pro pamětníky</title>
<style>
:root {
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#202124;
  --muted:#6b6b6b;
  --line:#d8d8d8;
  --accent:#2f6fed;
  --choice:#e8edff;
  --choice-border:#c8d3ff;
  --ok:#e9f7ee;
  --ok-border:#69a77a;
  --bad:#fdecec;
  --bad-border:#cf7777;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
.app { width:100%; max-width:700px; margin:0 auto; padding:24px 10px 18px; }
.head { text-align:center; padding:0 10px 14px; }
h1 { margin:0 0 10px; font-size:30px; line-height:1.15; }
.sub { margin:0 auto 8px; max-width:620px; font-size:16px; line-height:1.45; color:#444; }
.note { margin:0; font-size:13px; color:var(--muted); }
.quizbox {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:12px 20px 22px;
  min-height:420px;
}
.progress { text-align:center; color:var(--muted); font-size:14px; margin:0 0 12px; }
.q { text-align:center; font-size:24px; line-height:1.25; color:var(--accent); margin:12px 0 22px; }
.answers { max-width:460px; margin:0 auto; }
.answer {
  display:block; width:100%; border:1px solid var(--choice-border); background:var(--choice);
  color:var(--text); border-radius:0; padding:17px 14px; margin:10px 0;
  font-size:18px; cursor:pointer; transition:.12s ease;
}
.answer:hover { filter:brightness(.98); transform:translateY(-1px); }
.answer.correct { background:var(--ok); border-color:var(--ok-border); }
.answer.wrong { background:var(--bad); border-color:var(--bad-border); }
.answer:disabled { cursor:default; transform:none; filter:none; }
.feedback {
  display:none; max-width:520px; margin:18px auto 0; padding:12px 14px;
  border-top:1px solid var(--line); font-size:15px; line-height:1.45; color:#444;
}
.feedback.show { display:block; }
.next {
  display:none; margin:16px auto 0; border:0; border-radius:6px; padding:12px 22px;
  background:#222; color:white; font-size:16px; cursor:pointer;
}
.next.show { display:block; }
.result { display:none; text-align:center; padding:34px 20px; }
.result.show { display:block; }
.score { font-size:48px; font-weight:800; margin:8px 0 12px; }
.retry { border:0; border-radius:6px; padding:12px 22px; background:#222; color:#fff; font-size:16px; cursor:pointer; }
@media (max-width:560px) {
  .app { padding-top:16px; }
  h1 { font-size:24px; }
  .sub { font-size:15px; }
  .quizbox { padding:10px 12px 18px; min-height:400px; }
  .q { font-size:21px; margin-bottom:18px; }
  .answer { font-size:16px; padding:15px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>Kvíz pro pamětníky</h1>
    <p class="sub">10 věcí, které znal skoro každý Čech před internetem. Kolik z nich poznáte bez nápovědy?</p>
    <p class="note">Jen pro zábavu – nejde o test inteligence, paměti ani zdravotního stavu.</p>
  </div>

  <div class="quizbox">
    <div id="play">
      <div id="progress" class="progress"></div>
      <div id="question" class="q"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="next">Další otázka</button>
    </div>

    <div id="result" class="result">
      <div>Váš výsledek</div>
      <div id="score" class="score"></div>
      <p id="verdict"></p>
      <button id="retry" class="retry">Zkusit znovu</button>
    </div>
  </div>
</div>

<script>
const questions = [{"q": "Co byl Tuzex?", "opts": ["Síť obchodů, kde se prodávalo hlavně za valuty a tuzexové poukázky", "Státní podnik pro opravy televizorů", "Značka československých ledniček", "Cestovní kancelář pro zájezdy do Jugoslávie"], "correct": 0, "explain": "Tuzex byla síť prodejen s dovozovým a jinak hůře dostupným zbožím; nakupovalo se zde za valuty nebo tuzexové poukázky, známé jako bony."}, {"q": "K čemu sloužila remoska?", "opts": ["K ohřívání vody", "Jako elektrická pečicí mísa", "K sušení prádla", "Jako přenosné rádio"], "correct": 1, "explain": "Remoska je elektrická pečicí mísa s topným tělesem ve víku. Patří k českým domácím klasikám."}, {"q": "Čím šla často ručně převinout audiokazeta?", "opts": ["Tužkou nebo propiskou", "Magnetem z lednice", "Minci o hodnotě 1 Kč", "Kolíčkem na prádlo"], "correct": 0, "explain": "Otvor v cívce audiokazety šel často otáčet tužkou nebo propiskou a pásku tak ručně převinout."}, {"q": "Co byl teletext?", "opts": ["První český e-mailový program", "Textové informace přenášené společně s televizním signálem", "Telefonní seznam uložený na disketě", "Systém titulků pouze pro videokazety"], "correct": 1, "explain": "Teletext zobrazoval na televizoru textové stránky se zprávami, počasím, sportem, programem a dalšími informacemi."}, {"q": "Co člověk dělal s papírovou jízdenkou v řadě starších systémů MHD?", "opts": ["Podepsal ji", "Odevzdal ji řidiči při výstupu", "Označil ji v označovači", "Nalepil ji na průkazku"], "correct": 2, "explain": "Papírové jízdenky se po nástupu označovaly; podle města a období šlo o mechanické nebo později elektronické označovače."}, {"q": "Co byly „bony“ v běžné řeči před rokem 1989?", "opts": ["Body do věrnostního programu", "Tuzexové poukázky", "Stravenky do školní jídelny", "Losy státní loterie"], "correct": 1, "explain": "Bony byl běžný název pro tuzexové poukázky, za které se nakupovalo v prodejnách Tuzex."}, {"q": "K čemu sloužila telefonní budka?", "opts": ["K veřejnému telefonování", "K vyzvedávání doporučené pošty", "K tisku jízdních řádů", "K placení složenek"], "correct": 0, "explain": "Telefonní budky umožňovaly veřejně telefonovat bez vlastního telefonu."}, {"q": "Co byla spartakiáda?", "opts": ["Celostátní soutěž amatérských kuchařů", "Masová tělovýchovná a gymnastická přehlídka", "Automobilový závod", "Hudební festival mládeže"], "correct": 1, "explain": "Československé spartakiády byly masové tělovýchovné akce s hromadnými skladbami cvičenců."}, {"q": "K čemu sloužila klasická střešní televizní anténa?", "opts": ["K příjmu pozemního televizního vysílání", "K připojení k internetu", "K příjmu telefonního signálu", "K bezdrátovému napájení televizoru"], "correct": 0, "explain": "Střešní anténa sloužila k příjmu pozemního televizního vysílání."}, {"q": "Co se v domácnosti nejčastěji myslelo slovem „magnetofon“?", "opts": ["Přístroj pro nahrávání a přehrávání zvuku na magnetický pás", "Přenosný televizor", "Mechanický budík", "Domácí telefon u dveří"], "correct": 0, "explain": "Magnetofon zaznamenával a přehrával zvuk na magnetický pás, například na cívkách nebo audiokazetách."}];
let index = 0;
let score = 0;
let locked = false;

const progress = document.getElementById('progress');
const question = document.getElementById('question');
const answers = document.getElementById('answers');
const feedback = document.getElementById('feedback');
const next = document.getElementById('next');
const play = document.getElementById('play');
const result = document.getElementById('result');

function renderQuestion() {
  locked = false;
  feedback.className = 'feedback';
  next.className = 'next';
  const item = questions[index];
  progress.textContent = `Otázka ${index+1} / ${questions.length}`;
  question.textContent = item.q;
  answers.innerHTML = '';

  item.opts.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = opt;
    btn.addEventListener('click', () => choose(oi, btn));
    answers.appendChild(btn);
  });
}

function choose(oi, clicked) {
  if (locked) return;
  locked = true;
  const item = questions[index];
  const buttons = [...answers.querySelectorAll('.answer')];
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add('correct');
  });
  if (oi === item.correct) score++;
  else clicked.classList.add('wrong');

  feedback.textContent = item.explain;
  feedback.classList.add('show');
  next.textContent = index === questions.length - 1 ? 'Zobrazit výsledek' : 'Další otázka';
  next.classList.add('show');
}

next.addEventListener('click', () => {
  index++;
  if (index >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
});

function showResult() {
  play.style.display = 'none';
  result.classList.add('show');
  document.getElementById('score').textContent = `${score}/10`;
  let verdict = '';
  if (score <= 3) verdict = 'Retro svět vám možná utekl, nebo jste vyrůstali už v jiné době.';
  else if (score <= 6) verdict = 'Slušný základ. Některé věci jste trefili bez zaváhání.';
  else if (score <= 9) verdict = 'Výborný přehled. Většinu věcí z doby před internetem máte pořád v hlavě.';
  else verdict = 'Plný zásah. Tuzex, teletext ani remoska vás nepřekvapily.';
  document.getElementById('verdict').textContent = verdict;
}

document.getElementById('retry').addEventListener('click', () => {
  index = 0; score = 0;
  result.className = 'result';
  play.style.display = 'block';
  renderQuestion();
});

renderQuestion();
</script>
</body>
</html>
