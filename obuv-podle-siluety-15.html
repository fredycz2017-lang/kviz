*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font:inherit}
:root{--accent:#b6572f;--ok:#1e9e63;--bad:#d33f49;--ink:#18202a}

.quiz-wrap{width:min(1120px,100%);margin:0 auto;padding:22px}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.72}h1{font-size:clamp(28px,4vw,48px);line-height:1.02;margin:8px 0 10px}.lead{font-size:clamp(15px,2vw,19px);line-height:1.55;max-width:850px;margin:0 0 18px}.hud{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:14px 0}.progress{height:12px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.12)}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:.35s}.counter{font-weight:850;min-width:76px;text-align:right}.card{border-radius:24px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.12);overflow:hidden}.question{font-size:clamp(22px,3vw,34px);font-weight:900;line-height:1.15;margin:6px 0 18px}.visual{min-height:250px;display:grid;place-items:center;margin:8px 0 20px;position:relative}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:0;border-radius:15px;padding:14px 16px;text-align:left;font-weight:800;cursor:pointer;transition:.15s;min-height:54px}.answer:hover{transform:translateY(-1px)}.answer[disabled]{cursor:default}.answer.ok{background:var(--ok)!important;color:#fff!important}.answer.bad{background:var(--bad)!important;color:#fff!important}.feedback{min-height:70px;margin-top:14px;padding:13px 15px;border-radius:14px;line-height:1.45;display:none}.feedback.show{display:block}.next{display:none;margin-top:14px;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:900;cursor:pointer}.next.show{display:inline-block}.result{display:none;text-align:center;padding:34px 18px}.result.show{display:block}.result .score{font-size:clamp(54px,10vw,100px);font-weight:1000;line-height:.9;margin:16px 0}.restart{border:0;border-radius:14px;padding:13px 20px;background:var(--accent);color:#fff;font-w <div class="topline"><div class="eyebrow">14. 10. 2026 • KVÍZ</div><div class="mini-brand">ADAM HOLL</div></div>
<h1>Kvíz: Mokasíny, chelsea, lodičky. Poznáte 15 typů obuvi jen podle siluety?</h1><p class="lead">Bez loga, barvy a značky. Patnáct párů vstoupí do botníku jen jako čistá silueta a konstrukční detail.</p>
<div class="hud"><div class="progress"><i id="bar"></i></div><div class="counter" id="counter">01 / 15</div></div>
<section class="card" id="game"><div id="sceneMeta" class="scene-meta"></div><div class="question" id="question"></div><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">DALŠÍ →</button></section>
<section class="card result" id="result"><div class="eyebrow">HOTOVO</div><div class="score" id="score"></div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="restart" id="restart">HRÁT ZNOVU</button></section>
</main><script>
const Q=[{"q": "Který typ obuvi ukazuje tato nízká šněrovací silueta s pružnou podrážkou?", "a": "Teniska", "w": ["Mokasín", "Chelsea", "Lodička"], "v": "sneaker", "meta": "BOTNÍK • SILUETA 01", "explain": "Nízký šněrovací svršek a plochá pružná podrážka odpovídají tenisce.", "options": ["Teniska", "Mokasín", "Chelsea", "Lodička"], "correct": 0}, {"q": "Nazouvací bota bez tkaniček s charakteristickým prošitím kolem nártu je…", "a": "Mokasín", "w": ["Espadrilka", "Pantofel", "Balerína"], "v": "moccasin", "meta": "BOTNÍK • SILUETA 02", "explain": "Mokasín je nazouvací typ s měkkým svrškem a výrazným švem kolem nártu.", "options": ["Espadrilka", "Mokasín", "Pantofel", "Balerína"], "correct": 1}, {"q": "Kotníková bota s pružným bočním panelem a bez tkaniček se nazývá…", "a": "Chelsea", "w": ["Sněhule", "Holínka", "Kozačka"], "v": "chelsea", "meta": "BOTNÍK • SILUETA 03", "explain": "Pro chelsea jsou typické elastické vsadky po stranách kotníku a nazouvací konstrukce.", "options": ["Sněhule", "Holínka", "Chelsea", "Kozačka"], "correct": 2}, {"q": "Uzavřená dámská bota s vykrojeným nártem a podpatkem je…", "a": "Lodička", "w": ["Balerína", "Sandál", "Espadrilka"], "v": "pump", "meta": "BOTNÍK • SILUETA 04", "explain": "Lodička má uzavřenou špičku a patu, nízký svršek a typicky podpatek.", "options": ["Balerína", "Sandál", "Espadrilka", "Lodička"], "correct": 3}, {"q": "Nízká uzavřená dámská bota bez podpatku a bez tkaniček je…", "a": "Balerína", "w": ["Lodička", "Mokasín", "Pantofel"], "v": "ballet", "meta": "BOTNÍK • SILUETA 05", "explain": "Balerína je plochá, lehká a má nízký vykrojený svršek.", "options": ["Lodička", "Balerína", "Mokasín", "Pantofel"], "correct": 1}, {"q": "Plátěná nazouvací bota s nápadně provazovým opletem kolem podešve je…", "a": "Espadrilka", "w": ["Mokasín", "Teniska", "Dřevák"], "v": "espadrille", "meta": "BOTNÍK • SILUETA 06", "explain": "Espadrilku poznáte podle textilního svršku a typické jutové/provazové podešve.", "options": ["Mokasín", "Teniska", "Dřevák", "Espadrilka"], "correct": 3}, {"q": "Masivní nazouvací bota s pevnou, tradičně dřevěnou podrážkou je…", "a": "Dřevák", "w": ["Pantofel", "Sandál", "Holínka"], "v": "clog", "meta": "BOTNÍK • SILUETA 07", "explain": "Dřevák neboli clog má tuhou silnou spodní část a často otevřenou patu.", "options": ["Dřevák", "Pantofel", "Sandál", "Holínka"], "correct": 0}, {"q": "Otevřená letní obuv upevněná několika pásky kolem chodidla je…", "a": "Sandál", "w": ["Žabka", "Pantofel", "Balerína"], "v": "sandal", "meta": "BOTNÍK • SILUETA 08", "explain": "Sandál drží na chodidle pomocí pásků a nechává velkou část nohy odkrytou.", "options": ["Žabka", "Pantofel", "Sandál", "Balerína"], "correct": 2}, {"q": "Podešev s páskem ve tvaru Y mezi prsty patří k obuvi zvané…", "a": "Žabka", "w": ["Sandál", "Pantofel", "Espadrilka"], "v": "flipflop", "meta": "BOTNÍK • SILUETA 09", "explain": "Žabky mají typický pásek vedený mezi palcem a druhým prstem.", "options": ["Sandál", "Pantofel", "Espadrilka", "Žabka"], "correct": 3}, {"q": "Vysoká nepromokavá gumová bota bez tkaniček je…", "a": "Holínka", "w": ["Kozačka", "Sněhule", "Chelsea"], "v": "wellie", "meta": "BOTNÍK • SILUETA 10", "explain": "Holínka je jednoduchá vysoká nepromokavá bota, obvykle z gumy nebo PVC.", "options": ["Holínka", "Kozačka", "Sněhule", "Chelsea"], "correct": 0}, {"q": "Vysoká módní bota sahající přibližně ke kolenu se nazývá…", "a": "Kozačka", "w": ["Holínka", "Kotníková šněrovací bota", "Chelsea"], "v": "knee", "meta": "BOTNÍK • SILUETA 11", "explain": "Kozačka má vysoký svršek kryjící lýtko, často až ke kolenu.", "options": ["Holínka", "Kotníková šněrovací bota", "Kozačka", "Chelsea"], "correct": 2}, {"q": "Kotník kryje, ale zároveň má klasické šněrování. Jde o…", "a": "Kotníkovou šněrovací botu", "w": ["Chelsea", "Mokasín", "Holínku"], "v": "laceboot", "meta": "BOTNÍK • SILUETA 12", "explain": "Rozhodující je výška nad kotník a současně viditelné šněrování.", "options": ["Chelsea", "Kotníkovou šněrovací botu", "Mokasín", "Holínku"], "correct": 1}, {"q": "Nazouvací domácí či volnočasová obuv s otevřenou patou je…", "a": "Pantofel", "w": ["Mokasín", "Balerína", "Dřevák"], "v": "slipper", "meta": "BOTNÍK • SILUETA 13", "explain": "Pantofel má volnou patu a noha do něj jednoduše vklouzne.", "options": ["Pantofel", "Mokasín", "Balerína", "Dřevák"], "correct": 0}, {"q": "Objemná zateplená zimní bota s měkkým vysokým lemem je…", "a": "Sněhule", "w": ["Holínka", "Kozačka", "Chelsea"], "v": "snow", "meta": "BOTNÍK • SILUETA 14", "explain": "Sněhule je konstruovaná jako zateplená zimní bota a mívá masivnější svršek i podešev.", "options": ["Holínka", "Kozačka", "Chelsea", "Sněhule"], "correct": 3}, {"q": "Vysoký komín, špičatější tvar a výrazný podpatek odpovídají…", "a": "Kovbojské botě", "w": ["Kozačce", "Holínce", "Sněhuli"], "v": "cowboy", "meta": "BOTNÍK • SILUETA 15", "explain": "Kovbojská bota má charakteristický vysoký komín, podpatek a tradičně tvarovanou špičku.", "options": ["Kozačce", "Kovbojské botě", "Holínce", "Sněhuli"], "correct": 1}];
let idx=0,score=0,locked=false;
const $=id=>document.getElementById(id);
function render(){const q=Q[idx];locked=false;$('counter').textContent=String(idx+1).padStart(2,'0')+' / '+String(Q.length).padStart(2,'0');$('bar').style.width=(idx/Q.length*100)+'%';$('question').textContent=q.q;$('sceneMeta').textContent=q.meta||'';$('feedback').className='feedback';$('feedback').textContent='';$('next').className='next';$('answers').innerHTML=''; renderVisual(q,idx,false);q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>choose(i,b);$('answers').appendChild(b);})}
function choose(i,b){if(locked)return;locked=true;const q=Q[idx];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach(x=>x.disabled=true);buttons[q.correct].classList.add('ok');if(i!==q.correct)b.classList.add('bad');else score++;$('feedback').textContent=(i===q.correct?'✓ ':'✕ ')+q.explain;$('feedback').className='feedback show';renderVisual(q,idx,true,i===q.correct);$('next').textContent=idx===Q.length-1?'VÝSLEDEK →':'DALŠÍ →';$('next').className='next show';}
$('next').onclick=()=>{idx++;if(idx>=Q.length)finish();else render();};
function finish(){$('bar').style.width='100%';$('game').classList.add('hidden');$('result').classList.add('show');$('score').textContent=score+' / '+Q.length;const pct=score/Q.length;let t,x;if(pct>=.87){t='BOTNÍK BEZ CHYBY';x='Siluety čtete skoro jako katalog.'}else if(pct>=.6){t='DOBRÁ ORIENTACE';x='Většinu konstrukčních typů poznáte na první pohled.'}else{t='BOTNÍK CHCE JEŠTĚ PROJÍT';x='Pár podobných tvarů vás nachytal, ale druhé kolo už bude výrazně snazší.'}$('resultTitle').textContent=t;$('resultText').textContent=x;}
$('restart').onclick=()=>{idx=0;score=0;$('result').classList.remove('show');$('game').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};

function shoeSVG(type){const C='#26221e',S='#f0d8b8';let x='';
const sole=`<path d="M34 155 Q110 166 205 151 L207 164 Q105 180 31 167Z" fill="${C}" opacity=".88"/>`;
const lace=`<g stroke="${S}" stroke-width="3"><path d="M80 103l52 30M88 94l55 33M99 87l52 30"/></g>`;
switch(type){
case 'sneaker':x=`<path d="M37 142 Q56 122 70 105 L95 78 L145 100 L176 125 Q199 132 209 151 Q134 163 38 151Z" fill="${C}"/>${lace}${sole}`;break;
case 'moccasin':x=`<path d="M42 145 Q64 103 103 101 L161 116 Q183 123 204 146 Q122 160 42 151Z" fill="${C}"/><path d="M73 121 Q112 103 159 120" fill="none" stroke="${S}" stroke-width="4" stroke-dasharray="4 5"/>${sole}`;break;
case 'chelsea':x=`<path d="M50 145 L61 67 L113 61 L126 116 Q169 121 202 147 Q128 158 50 153Z" fill="${C}"/><rect x="77" y="78" width="28" height="46" rx="8" fill="${S}" opacity=".8"/>${sole}`;break;
case 'pump':x=`<path d="M45 145 Q62 105 93 105 L159 121 Q185 127 199 145 Q130 157 45 151Z" fill="${C}"/><path d="M159 150 L170 177 L178 177 L181 145Z" fill="${C}"/>`;break;
case 'ballet':x=`<path d="M43 145 Q58 112 94 108 Q147 109 198 143 Q127 158 43 151Z" fill="${C}"/>${sole}`;break;
case 'espadrille':x=`<path d="M43 143 Q62 108 98 108 L166 125 Q187 130 200 144 Q125 156 43 150Z" fill="${C}"/><g stroke="${S}" stroke-width="3"><path d="M48 151h148M55 156h133"/></g>`;break;
case 'clog':x=`<path d="M48 140 Q58 98 104 99 Q164 102 200 139 Q136 154 49 149Z" fill="${C}"/><path d="M55 151 L190 148 L181 174 L63 176Z" fill="#8a5b35"/>`;break;
case 'sandal':x=`<path d="M39 151 Q117 160 205 149 L204 161 Q116 174 38 164Z" fill="${C}"/><path d="M80 149 Q87 109 116 107 Q142 107 153 149" fill="none" stroke="${C}" stroke-width="14"/><path d="M103 149 Q109 119 134 116" fill="none" stroke="${C}" stroke-width="10"/>`;break;
case 'flipflop':x=`<path d="M56 160 Q65 78 120 73 Q173 75 189 159 Q130 176 56 160Z" fill="${C}"/><path d="M121 91 L94 136 M121 91 L151 136" stroke="${S}" stroke-width="7" fill="none"/>`;break;
case 'wellie':x=`<path d="M61 148 L65 49 L121 48 L123 123 Q169 126 196 147 Q128 158 61 153Z" fill="${C}"/>${sole}`;break;
case 'knee':x=`<path d="M63 149 L71 29 L128 29 L126 120 Q166 123 198 148 Q131 158 63 154Z" fill="${C}"/><path d="M157 151l14 25h11l-2-29z" fill="${C}"/>`;break;
case 'laceboot':x=`<path d="M54 146 L65 69 L122 66 L128 119 Q169 122 201 147 Q130 158 54 153Z" fill="${C}"/>${lace}${sole}`;break;
case 'slipper':x=`<path d="M48 148 Q64 111 104 111 Q158 115 201 146 Q128 159 48 153Z" fill="${C}"/><path d="M45 149 Q62 130 78 132" stroke="${S}" stroke-width="6" fill="none"/>${sole}`;break;
case 'snow':x=`<path d="M52 146 L60 71 L128 65 L135 119 Q176 122 203 145 Q130 160 52 154Z" fill="${C}"/><path d="M58 71 Q91 49 130 65" fill="none" stroke="${S}" stroke-width="12" stroke-linecap="round"/>${sole}`;break;
case 'cowboy':x=`<path d="M60 145 L72 46 L131 42 L119 119 Q162 120 199 144 Q130 158 60 153Z" fill="${C}"/><path d="M73 49 Q100 68 130 44" stroke="${S}" stroke-width="5" fill="none"/><path d="M157 150 L166 176 L184 176 L183 144Z" fill="${C}"/>`;break;
}
return `<svg viewBox="0 0 240 200" class="shoe-svg" aria-hidden="true">${x}</svg>`}
function renderVisual(q,i,after,correct=true){$('visual').innerHTML=`<div class="shelf"><div class="label">POLICE ${String(i+1).padStart(2,'0')}</div>${shoeSVG(q.v)}<div class="shadow"></div>${after?`<div class="placed ${correct?'yes':'no'}">${correct?'ZAŘAZENO':'OPRAVENO'}</div>`:''}</div>`}

render();
</script></body></html>
