<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Čeština bez slitování – maturitní level</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#202124;--muted:#666;--line:#d8d8d8;--accent:#2f6fed;--choice:#e8edff;--choice-border:#c8d3ff;--ok:#e9f7ee;--ok-border:#69a77a;--bad:#fdecec;--bad-border:#cf7777}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:100%;max-width:700px;margin:0 auto;padding:22px 10px 18px}.head{text-align:center;padding:0 10px 14px}h1{margin:0 0 10px;font-size:29px;line-height:1.15}
.sub{margin:0 auto 8px;max-width:630px;font-size:16px;line-height:1.45;color:#444}.note{margin:0;font-size:13px;color:var(--muted)}
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 20px 22px;min-height:450px}.progress{text-align:center;color:var(--muted);font-size:14px;margin:0 0 12px}
.q{text-align:center;font-size:22px;line-height:1.32;color:var(--accent);margin:12px 0 22px}.answers{max-width:550px;margin:0 auto}
.answer{display:block;width:100%;border:1px solid var(--choice-border);background:var(--choice);color:var(--text);padding:15px 14px;margin:10px 0;font-size:16px;line-height:1.35;cursor:pointer;text-align:left}
.answer:hover{filter:brightness(.98)}.answer.correct{background:var(--ok);border-color:var(--ok-border)}.answer.wrong{background:var(--bad);border-color:var(--bad-border)}.answer:disabled{cursor:default;filter:none}
.feedback{display:none;max-width:570px;margin:18px auto 0;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.5;color:#444}.feedback.show{display:block}
.next{display:none;margin:16px auto 0;border:0;border-radius:6px;padding:12px 22px;background:#222;color:white;font-size:16px;cursor:pointer}.next.show{display:block}
.result{display:none;text-align:center;padding:34px 20px}.result.show{display:block}.score{font-size:48px;font-weight:800;margin:8px 0 12px}.retry{border:0;border-radius:6px;padding:12px 22px;background:#222;color:#fff;font-size:16px;cursor:pointer}
@media(max-width:560px){.app{padding-top:14px}h1{font-size:23px}.sub{font-size:15px}.quizbox{padding:10px 12px 18px;min-height:430px}.q{font-size:19px;margin-bottom:18px}.answer{font-size:15px;padding:14px 11px}}
</style></head><body><div class="app"><div class="head"><h1>Čeština bez slitování: maturitní level</h1>
<p class="sub">Vnořené vedlejší věty, interpunkce, syntaktická závislost, shoda i jazykové chytáky. Tohle už není kvíz na „mě/mně“.</p>
<p class="note">15 otázek • záměrně bez příkladů, u nichž norma připouští více rovnocenných řešení</p></div>
<div class="quizbox"><div id="play"><div id="progress" class="progress"></div><div id="question" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next">Další otázka</button></div>
<div id="result" class="result"><div>Váš výsledek</div><div id="score" class="score"></div><p id="verdict"></p><button id="retry" class="retry">Zkusit znovu</button></div></div></div>
<script>
const questions=[{"q": "Která varianta má správnou interpunkci?", "opts": ["Věděl, že pokud se počasí zhorší, závod odloží.", "Věděl že, pokud se počasí zhorší závod odloží.", "Věděl, že pokud se počasí zhorší závod odloží.", "Věděl že pokud se počasí zhorší, závod odloží."], "correct": 0, "explain": "Vedlejší věta podmínková „pokud se počasí zhorší“ je vložena do vedlejší věty uvozené „že“, proto je z obou stran oddělena čárkami."}, {"q": "Která varianta správně odděluje vloženou vedlejší větu?", "opts": ["Bylo to v domě který patřil strýci, a všichni o tom věděli.", "Bylo to v domě, který patřil strýci a všichni o tom věděli.", "Bylo to v domě, který patřil strýci, a všichni o tom věděli.", "Bylo to, v domě který patřil strýci, a všichni o tom věděli."], "correct": 2, "explain": "Vztažná věta „který patřil strýci“ je vložená do první hlavní věty a musí se uzavřít čárkou ještě před spojkou „a“."}, {"q": "Která věta je interpunkčně správná?", "opts": ["Nestihl vlak a proto přišel pozdě.", "Nestihl vlak, a proto přišel pozdě.", "Nestihl, vlak a proto přišel pozdě.", "Nestihl vlak a, proto přišel pozdě."], "correct": 1, "explain": "Spojení „a proto“ zde vyjadřuje důsledkový poměr mezi dvěma větami, proto se před „a“ píše čárka."}, {"q": "Která varianta je správná?", "opts": ["Tvrdil, že přijde včas, a že přinese všechny podklady.", "Tvrdil že přijde včas a že přinese všechny podklady.", "Tvrdil, že přijde včas a že přinese všechny podklady.", "Tvrdil, že přijde včas a, že přinese všechny podklady."], "correct": 2, "explain": "Dvě vedlejší věty uvozené „že“ jsou souřadně spojeny slučovacím „a“, proto se mezi nimi čárka nepíše."}, {"q": "Ve které větě je čárka před „jako“ nutná?", "opts": ["Běžel rychle jako vítr.", "Dostal stejný počet bodů jako já.", "Pracoval stejně pečlivě, jako pracoval jeho předchůdce.", "Použili ho jako náhradníka."], "correct": 2, "explain": "Za „jako“ následuje celá vedlejší věta s přísudkem „pracoval“, proto ji oddělujeme čárkou. V ostatních větách „jako“ uvozuje jen větný člen."}, {"q": "Která věta je interpunkčně správná?", "opts": ["Ani Petr ani Jana, nepřišli.", "Ani Petr, ani Jana nepřišli.", "Ani, Petr ani Jana nepřišli.", "Ani Petr ani, Jana nepřišli."], "correct": 1, "explain": "U dvojitého spojovacího výrazu „ani – ani“ se čárka píše před druhým členem této dvojice."}, {"q": "Doplňte správný tvar přísudku: Eva, Jana a Petr ___ ze sálu jako poslední.", "opts": ["odešly", "odešli", "odešla", "odešlo"], "correct": 1, "explain": "V několikanásobném podmětu je Petr, tedy jméno rodu mužského životného. Tento rod má při shodě přednost, proto „odešli“."}, {"q": "Která věta má správnou shodu přísudku s podmětem?", "opts": ["Významné osobnosti se sešli v hlavním sále.", "Významné osobnosti se sešly v hlavním sále.", "Významné osobnosti se sešla v hlavním sále.", "Významné osobnosti se sešlo v hlavním sále."], "correct": 1, "explain": "Podstatné jméno „osobnost“ je rodu ženského. Shoda se řídí gramatickým rodem, nikoli tím, zda označuje muže či ženy: „osobnosti se sešly“."}, {"q": "Která podoba je správná?", "opts": ["Muž, s kterýž jsme mluvili, odešel.", "Muž, s nímž jsme mluvili, odešel.", "Muž, s němž jsme mluvili, odešel.", "Muž, s jejž jsme mluvili, odešel."], "correct": 1, "explain": "Předložka „s“ vyžaduje 7. pád. Správný tvar vztažného zájmena je „s nímž“."}, {"q": "Jaký druh vedlejší věty je část „Kdo se bojí“ v souvětí „Kdo se bojí, nesmí do lesa“?", "opts": ["Předmětná", "Podmětná", "Přívlastková", "Příslovečná příčinná"], "correct": 1, "explain": "Celek „Kdo se bojí“ zastupuje podmět hlavní věty: kdo nesmí do lesa? Ten, kdo se bojí. Jde o vedlejší větu podmětnou."}, {"q": "V souvětí „Řekl mi, že pokud bude mít čas, přijde“ je věta „pokud bude mít čas“:", "opts": ["vedlejší podmětná závislá přímo na „řekl“", "vedlejší příslovečná podmínková závislá na ději „přijde“", "vedlejší přívlastková rozvíjející slovo „čas“", "hlavní věta v poměru odporovacím"], "correct": 1, "explain": "„Pokud bude mít čas“ vyjadřuje podmínku, za níž nastane děj „přijde“. Je tedy vedlejší příslovečná podmínková uvnitř obsahové věty uvozené „že“."}, {"q": "Kolik vět obsahuje souvětí „Když Petr zjistil, že vlak odjel, matka mu zavolala, protože čekala doma“?", "opts": ["Tři", "Čtyři", "Pět", "Šest"], "correct": 1, "explain": "Jsou zde čtyři přísudkové základy: Petr zjistil / vlak odjel / matka zavolala / (matka) čekala. Souvětí tedy obsahuje čtyři věty."}, {"q": "Jaký významový vztah vyjadřuje vedlejší věta v souvětí „Ačkoli byl vyčerpaný, pokračoval v práci“?", "opts": ["Příčinu", "Účel", "Přípustku", "Podmínku"], "correct": 2, "explain": "Spojka „ačkoli“ uvádí okolnost, navzdory níž děj hlavní věty proběhl. Jde o vedlejší větu příslovečnou přípustkovou."}, {"q": "Která varianta je správně napsaná?", "opts": ["Byl neobyčejně zapomětlivý.", "Byl neobyčejně zapomnětlivý.", "Byl neobyčejně zapoměntlivý.", "Byl neobyčejně zapomětlívý."], "correct": 1, "explain": "Spisovná podoba je „zapomnětlivý“ s -mně-. Slovo souvisí se starším „pomnít“ a se slovesem „zapomínat“."}, {"q": "Která možnost přesně vystihuje stavbu souvětí „Vůbec nevěděl, kde má hledat člověka, který by mu pomohl, a kam se má vrátit v případě nouze“?", "opts": ["Čárka před „a“ je chyba, protože před slučovacím „a“ nikdy čárka být nesmí.", "Čárka před „a“ uzavírá vloženou větu „který by mu pomohl“; věty „kde má hledat…“ a „kam se má vrátit…“ jsou souřadně spojené.", "Všechny tři vedlejší věty jsou na stejné syntaktické úrovni.", "Věta „který by mu pomohl“ je hlavní a ostatní dvě jsou na ní závislé."], "correct": 1, "explain": "Vztažná věta „který by mu pomohl“ závisí na slově „člověka“ uvnitř první vedlejší věty. Čárka před „a“ ji uzavírá; „kde…“ a „kam…“ stojí o úroveň výš a jsou spojeny slučovacím „a“."}];let index=0,score=0,locked=false;
const progress=document.getElementById('progress'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback'),next=document.getElementById('next'),play=document.getElementById('play'),result=document.getElementById('result');
function renderQuestion(){locked=false;feedback.className='feedback';next.className='next';const item=questions[index];progress.textContent=`Otázka ${index+1} / ${questions.length}`;question.textContent=item.q;answers.innerHTML='';item.opts.forEach((opt,oi)=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=opt;btn.addEventListener('click',()=>choose(oi,btn));answers.appendChild(btn);});}
function choose(oi,clicked){if(locked)return;locked=true;const item=questions[index];const buttons=[...answers.querySelectorAll('.answer')];buttons.forEach((btn,i)=>{btn.disabled=true;if(i===item.correct)btn.classList.add('correct');});if(oi===item.correct)score++;else clicked.classList.add('wrong');feedback.textContent=item.explain;feedback.classList.add('show');next.textContent=index===questions.length-1?'Zobrazit výsledek':'Další otázka';next.classList.add('show');}
next.addEventListener('click',()=>{index++;if(index>=questions.length)showResult();else renderQuestion();});
function showResult(){play.style.display='none';result.classList.add('show');document.getElementById('score').textContent=`${score}/15`;let v='';if(score<=4)v='Tady už čeština vytáhla těžké dělostřelectvo. Souvětí si vyžádala oběť.';else if(score<=7)v='Základy drží, ale několik syntaktických pastí vás dostalo.';else if(score<=10)v='Slušný maturitní výkon. U těžších souvětí už ale rozhodují detaily.';else if(score<=13)v='Velmi silné. Interpunkce ani syntaktické vztahy vás jen tak nerozhodí.';else if(score===14)v='14/15. Jediná chyba od skoro čistého maturitního masakru.';else v='15/15. Tohle už není štěstí – těžkou češtinu máte opravdu pod kontrolou.';document.getElementById('verdict').textContent=v;}
document.getElementById('retry').addEventListener('click',()=>{index=0;score=0;result.className='result';play.style.display='block';renderQuestion();});renderQuestion();
</script></body></html>
