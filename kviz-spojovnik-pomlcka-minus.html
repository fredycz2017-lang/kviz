<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz z češtiny: Spojovník, pomlčka, mínus. Vyberete správné znaménko v 15 větách?</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e3db;color:#222;font-family:Georgia,serif}.desk{max-width:1120px;margin:auto;padding:18px}.paper{background:#fffdf7;min-height:720px;border:1px solid #c8c1b4;box-shadow:0 20px 60px #544a3a30;position:relative;padding:34px 34px 30px 92px;overflow:hidden}.paper:before{content:'';position:absolute;left:68px;top:0;bottom:0;width:2px;background:#e9a0a0}.ruler{position:absolute;left:18px;top:36px;width:38px;color:#777;font:12px Arial;text-align:center}.ruler div{height:32px;border-top:1px solid #aaa}h1{margin:0;font-size:clamp(29px,4vw,44px);line-height:1.08}.lead{font:15px/1.45 Arial;color:#666;max-width:800px}.proofmarks{display:flex;gap:7px;margin:20px 0;flex-wrap:wrap}.mark{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;border:2px solid #c7beb0;font:bold 13px Arial;color:#978c7f}.mark.done{border-color:#b91c1c;color:#b91c1c;transform:rotate(-8deg)}.sheet{border-top:1px solid #d9d2c7;padding-top:22px}.meta{font:800 12px Arial;color:#b91c1c;letter-spacing:.1em}.sample{margin:16px 0;padding:22px 18px;background:repeating-linear-gradient(#fff 0 35px,#ede9df 36px);border-left:4px solid #b91c1c;font-size:clamp(25px,4vw,40px);line-height:1.35;word-break:break-word}.q{font:800 20px Arial;margin:14px 0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{font:700 17px Arial;background:#fff;border:2px solid #cfc7ba;padding:14px;border-radius:6px;cursor:pointer;text-align:left}.answer:hover{border-color:#b91c1c}.answer.correct{background:#ecfdf5;border-color:#4d8b5d}.answer.wrong{background:#fff1f2;border-color:#be5656}.feedback{display:none;font:15px/1.45 Arial;margin-top:12px;padding:12px;border-left:4px solid #b91c1c;background:#f7f3eb}.feedback.show{display:block}#nextBtn,.restart{display:none;font:800 14px Arial;border:0;background:#b91c1c;color:white;padding:11px 16px;margin-top:12px;cursor:pointer}.restart{display:inline-block}#result{display:none;text-align:center;padding:50px 10px;font:18px Arial}#score{font:900 64px Arial;color:#b91c1c}@media(max-width:650px){.paper{padding:26px 16px 24px 45px}.paper:before{left:34px}.ruler{display:none}.answers{grid-template-columns:1fr}}
</style></head><body><div class="desk"><article class="paper"><div class="ruler"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div>16</div></div><h1>Kvíz z češtiny: Spojovník, pomlčka, mínus. Vyberete správné znaménko v 15 větách?</h1><p class="lead">Korektorský stůl: jeden jediný micro-skill. Spojovník, pomlčka a matematické mínus nejsou totéž.</p><div class="proofmarks" id="marks"></div><section class="sheet" id="quiz"><div class="meta" id="cat"></div><div class="sample" id="sample"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button id="nextBtn">Další korektura</button></section><section id="result"><div id="score"></div><p id="resultText"></p><button class="restart" id="restartBtn">Začít novou korekturu</button></section></article></div><script>const questions=[{"cat":"SPOJOVNÍK","txt":"technicko□ekonomický","q":"Který znak patří na místo □ v zápisu „technicko□ekonomický“?","o":["spojovník (-)","pomlčka (–)","mínus (−)","dvojtečka (:)"],"a":0,"e":"U souřadně spojených složek složeného přídavného jména se píše spojovník bez mezer."},{"cat":"SPOJOVNÍK","txt":"malíř□lakýrník","q":"Který znak patří na místo □ v zápisu „malíř□lakýrník“?","o":["pomlčka (–)","mínus (−)","dvojtečka (:)","spojovník (-)"],"a":3,"e":"Těsné spojení dvou podstatných jmen označujících jednu profesi se píše se spojovníkem."},{"cat":"SPOJOVNÍK","txt":"propan□butan","q":"Který znak patří na místo □ v zápisu „propan□butan“?","o":["mínus (−)","spojovník (-)","pomlčka (–)","dvojtečka (:)"],"a":1,"e":"Propan-butan je těsné souřadné spojení a píše se se spojovníkem."},{"cat":"SPOJOVNÍK","txt":"Frýdek□Místek","q":"Který znak patří na místo □ v zápisu „Frýdek□Místek“?","o":["dvojtečka (:)","pomlčka (–)","spojovník (-)","mínus (−)"],"a":2,"e":"U tohoto složeného místního jména se píše spojovník."},{"cat":"POMLČKA","txt":"10□12 hodin","q":"Který znak patří na místo □ v zápisu „10□12 hodin“?","o":["spojovník (-)","mínus (−)","pomlčka (–)","dvojtečka (:)"],"a":2,"e":"Rozsah „od 10 do 12“ se mezi jednoslovnými údaji zapisuje pomlčkou natěsno."},{"cat":"POMLČKA","txt":"1914□1918","q":"Který znak patří na místo □ v zápisu „1914□1918“?","o":["pomlčka (–)","spojovník (-)","dvojtečka (:)","mínus (−)"],"a":0,"e":"Rozmezí let se standardně zapisuje pomlčkou."},{"cat":"POMLČKA","txt":"trasa Praha□Brno","q":"Který znak patří na místo □ v zápisu „trasa Praha□Brno“?","o":["mínus (−)","dvojtečka (:)","spojovník (-)","pomlčka (–)"],"a":3,"e":"Vztah mezi dvěma jednoslovnými místními názvy lze vyjádřit pomlčkou natěsno."},{"cat":"POMLČKA","txt":"zápas Sparta□Slavia","q":"Který znak patří na místo □ v zápisu „zápas Sparta□Slavia“?","o":["dvojtečka (:)","pomlčka (–)","mínus (−)","spojovník (-)"],"a":1,"e":"Význam „Sparta versus Slavia“ se mezi jednoslovnými výrazy zapisuje pomlčkou."},{"cat":"POMLČKA","txt":"Tohle rozhodnutí □ a to definitivní □ všechno změnilo.","q":"Který znak patří na místo □ v zápisu „Tohle rozhodnutí □ a to definitivní □ všechno změnilo.“?","o":["pomlčka (–)","dvojtečka (:)","spojovník (-)","mínus (−)"],"a":0,"e":"Pomlčka může ve větě oddělit vloženou část nebo dodatkové sdělení."},{"cat":"POMLČKA","txt":"Kniha □ můj nejlepší přítel □ ležela na stole.","q":"Který znak patří na místo □ v zápisu „Kniha □ můj nejlepší přítel □ ležela na stole.“?","o":["spojovník (-)","mínus (−)","dvojtečka (:)","pomlčka (–)"],"a":3,"e":"Vložené vysvětlení lze vymezit pomlčkami."},{"cat":"MÍNUS","txt":"5 □ 3 = 2","q":"Který znak patří na místo □ v zápisu „5 □ 3 = 2“?","o":["dvojtečka (:)","mínus (−)","spojovník (-)","pomlčka (–)"],"a":1,"e":"V matematickém výrazu jde o znaménko mínus, nikoli spojovník ani interpunkční pomlčku."},{"cat":"MÍNUS","txt":"□5 °C","q":"Který znak patří na místo □ v zápisu „□5 °C“?","o":["pomlčka (–)","spojovník (-)","mínus (−)","dvojtečka (:)"],"a":2,"e":"Před zápornou hodnotou stojí matematické znaménko mínus."},{"cat":"MÍNUS","txt":"interval od □2 do 4","q":"Který znak patří na místo □ v zápisu „interval od □2 do 4“?","o":["mínus (−)","dvojtečka (:)","pomlčka (–)","spojovník (-)"],"a":0,"e":"U záporného čísla se použije mínus; kvůli záměně s pomlčkou je vhodné rozsah vyjádřit slovem „až“ nebo „do“."},{"cat":"POMLČKA","txt":"písmena A□Z","q":"Který znak patří na místo □ v zápisu „písmena A□Z“?","o":["spojovník (-)","pomlčka (–)","dvojtečka (:)","mínus (−)"],"a":1,"e":"Rozsah od A do Z se zapisuje pomlčkou."},{"cat":"POMLČKA","txt":"strany 24□31","q":"Který znak patří na místo □ v zápisu „strany 24□31“?","o":["mínus (−)","spojovník (-)","dvojtečka (:)","pomlčka (–)"],"a":3,"e":"Rozsah stran se zapisuje pomlčkou natěsno."}];const marks=document.getElementById('marks');for(let j=0;j<15;j++){let d=document.createElement('div');d.className='mark';d.textContent=j+1;marks.appendChild(d)}function render(){locked=false;let x=questions[i];document.getElementById('cat').textContent=x.cat+' · KOREKTURA '+(i+1)+'/15';document.getElementById('sample').textContent=x.txt.replace('□','▯');document.getElementById('q').textContent=x.q;document.getElementById('answers').innerHTML=x.o.map((o,j)=>'<button class="answer">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('');document.getElementById('feedback').className='feedback';document.getElementById('feedback').innerHTML='';document.getElementById('nextBtn').style.display='none';wireAnswers();}function markProgress(idx,ok){marks.children[idx].classList.add('done');marks.children[idx].textContent=ok?'✓':'×'}function resetProgress(){[...marks.children].forEach((m,j)=>{m.className='mark';m.textContent=j+1})}
let i=0,score=0,locked=false; const total=15;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function wireAnswers(){document.querySelectorAll('.answer').forEach((b,idx)=>b.onclick=()=>choose(idx,b));}
function choose(idx,btn){if(locked)return;locked=true;const q=questions[i];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');if(j===idx&&j!==q.a)b.classList.add('wrong')});if(idx===q.a)score++;document.getElementById('feedback').innerHTML='<b>'+(idx===q.a?'Správně.':'Tentokrát ne.')+'</b> '+esc(q.e);document.getElementById('feedback').classList.add('show');document.getElementById('nextBtn').style.display='inline-block';markProgress(i,idx===q.a);}
document.getElementById('nextBtn').onclick=()=>{i++;if(i<total)render();else finish();};
function finish(){document.getElementById('quiz').style.display='none';const r=document.getElementById('result');r.style.display='block';document.getElementById('score').textContent=score+' / '+total;document.getElementById('resultText').textContent=score>=13?'Výborný výsledek.':score>=10?'Velmi slušné skóre.':score>=7?'Dobrá polovina, ale pár pastí tu bylo.':'Tenhle svět umí překvapit. Zkuste to ještě jednou.';}
document.getElementById('restartBtn').onclick=()=>{i=0;score=0;locked=false;resetProgress();document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';render();};
render();</script></body></html>
