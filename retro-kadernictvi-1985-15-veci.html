<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro kvíz: Natáčky, trvalá, břitva. Poznáte 15 věcí z kadeřnictví roku 1985?</title><style>
*{box-sizing:border-box}:root{--ink:#24272e;--rose:#c55d76;--cream:#fff7f1;--gold:#e9c98d;--mint:#6cae9d}body{margin:0;background:linear-gradient(135deg,#f6e6df,#f8f2ea 48%,#eadfd6);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:1200px;margin:auto;padding:18px}.salon{display:grid;grid-template-columns:260px 1fr;gap:18px}.mirror{background:#fffaf6;border:14px solid #2e3138;border-radius:160px 160px 34px 34px;min-height:690px;position:relative;box-shadow:0 24px 60px #4a2e2e24;padding:85px 22px 24px}.bulbs{position:absolute;inset:16px 10px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.bulb{width:24px;height:24px;border-radius:50%;margin:auto;background:#d8d0c7;box-shadow:0 0 0 3px #4b4b4b}.bulb.on{background:#ffe49a;box-shadow:0 0 17px #e9be57,0 0 0 3px #4b4b4b}.kicker{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--rose)}h1{font-size:30px;line-height:1.05;margin:8px 0}.sub{font-size:13px;color:#666;line-height:1.5}.ticket{margin-top:20px;border-top:1px dashed #c8b9ae;padding-top:14px}.ticket b{font-size:34px}.ledger{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}.ledger span{font-size:10px;border:1px solid #e5d8cf;padding:7px;border-radius:8px;background:#fff}.ledger span.done{background:#e6f4ee;border-color:#82b9a9}.station{background:#fff;border:1px solid #d9c9be;border-radius:28px;box-shadow:0 24px 70px #52352a20;overflow:hidden}.stationTop{padding:18px 22px;background:#2b2d33;color:white;display:flex;justify-content:space-between;align-items:center}.stationTop b{color:#ffd9a0}.main{padding:20px}.toolscene{max-width:780px;margin:auto}.q{font-size:25px;font-weight:850;line-height:1.2;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.opt{border:1px solid #d7c7be;background:#fffaf7;border-radius:14px;padding:14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;min-height:58px}button.opt:hover{border-color:var(--rose);transform:translateY(-1px)}button.opt.ok{background:#dff4e9;border-color:#4e9b7e}button.opt.bad{background:#ffe2e5;border-color:#c65d70}.feedback{display:none;margin-top:12px;background:#fff8df;border-left:5px solid var(--gold);padding:13px 15px;border-radius:10px;line-height:1.45}.next{display:none;margin:14px 0 0 auto;background:var(--rose);color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:900;cursor:pointer}.result{display:none;text-align:center;padding:50px 20px}.score{font-size:72px;font-weight:1000;color:var(--rose)}.restart{background:#2b2d33;color:#fff;border:0;padding:13px 20px;border-radius:12px;font-weight:900}@media(max-width:820px){.salon{grid-template-columns:1fr}.mirror{min-height:auto;border-radius:26px;padding:78px 18px 18px}.ledger{grid-template-columns:repeat(3,1fr)}.answers{grid-template-columns:1fr}.q{font-size:21px}}
</style></head><body><div class="wrap"><div class="salon"><aside class="mirror"><div class="bulbs" id="bulbs"></div><div class="kicker">KADEŘNICTVÍ 1985 // OBJEDNÁVKA</div><h1>Jedna návštěva salonem</h1><div class="sub">15 nástrojů a úkonů. Nezkoušíme univerzální ceník ani jednu „správnou“ podobu všech provozoven.</div><div class="ticket"><span>POŘADÍ</span><br><b id="prog">01 / 15</b></div><div class="ledger" id="ledger"></div></aside><section class="station"><div class="stationTop"><span>ZRCADLO č. 3</span><b id="name">—</b></div><div class="main"><div id="quiz"><div class="toolscene" id="scene"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">DALŠÍ ZÁKAZNICE →</button></div><div class="result" id="result"><div class="kicker">OBJEDNÁVKOVÁ KNIHA UZAVŘENA</div><div class="score" id="score"></div><h2 id="grade"></h2><p id="restxt"></p><button class="restart" id="restart">PROJÍT SALON ZNOVU</button></div></div></section></div></div><script>const Q=[{"name":"Natáčky","kind":"roller","q":"Co je na kartě zákaznice nakreslené jako několik dutých válečků, kolem kterých se navíjejí prameny?","o":["Natáčky","Břitva","Síťka na vlasy","Ručník"],"a":0,"e":"Natáčky dávají vlasům při sušení nebo úpravě tvar a objem. V osmdesátých letech byly běžnou součástí salonního stylingu."},{"name":"Sušák s kapucí","kind":"hood","q":"Které zařízení umožní klientce sedět pod velkou kapucí a rovnoměrně sušit vlasy, často už natočené?","o":["Ruční fén","Sušák s kapucí","Mycí box","Rozprašovač"],"a":1,"e":"Stacionární sušák s kapucí vhání teplý vzduch kolem hlavy; jde o ikonický salonní přístroj používaný dávno před rokem 1985."},{"name":"Břitva","kind":"razor","q":"Který nástroj má sklápěcí rukojeť a velmi ostrou čepel používanou pro holení nebo specifické techniky střihu?","o":["Břitva","Kadeřnické nůžky","Hřeben","Kulmofén"],"a":0,"e":"Sklápěcí břitva má jedinou ostrou čepel; nesmí se zaměňovat s běžnými kadeřnickými nůžkami."},{"name":"Kadeřnické nůžky","kind":"scissors","q":"Dva prstence, středový šroub a dvě dlouhé čepele: co leží na pracovní poličce?","o":["Kadeřnické nůžky","Kleštičky na nehty","Břitva","Pinzeta"],"a":0,"e":"Kadeřnické nůžky poznáte podle dvou ok a dvojice čepelí spojených šroubem."},{"name":"Hřeben","kind":"comb","q":"Co má řadu hustých zubů a při střihu pomáhá pramen srovnat, napnout nebo oddělit?","o":["Hřeben","Natáčka","Síťka na vlasy","Pláštěnka"],"a":0,"e":"Hřeben slouží k rozčesání, oddělování a vedení vlasů při střihu i úpravě."},{"name":"Síťka na vlasy","kind":"net","q":"Co se po natočení může přetáhnout přes účes, aby natáčky a prameny držely pohromadě při sušení?","o":["Síťka na vlasy","Pláštěnka","Ručník","Papírový límec"],"a":0,"e":"Síťka drží upravené nebo natočené vlasy na místě a nechává přes ně proudit vzduch."},{"name":"Rozprašovač","kind":"spray","q":"Která nádoba s páčkou vytváří jemnou mlhu a zvlhčí pramen před dalším zpracováním?","o":["Rozprašovač","Oxidant v misce","Šamponová dóza","Termoska"],"a":0,"e":"Rozprašovač dává jemnou vodní mlhu, takže lze vlasy průběžně zvlhčovat bez úplného namočení."},{"name":"Mycí box","kind":"sink","q":"Kde klientka zakloní hlavu do tvarovaného umyvadla, když je potřeba vlasy umýt nebo opláchnout?","o":["Mycí box","Sušák s kapucí","Objednávkový pult","Sterilizátor"],"a":0,"e":"Salonní mycí box kombinuje křeslo a tvarované umyvadlo pro mytí a oplach vlasů."},{"name":"Natáčecí tyčinky na trvalou","kind":"permrod","q":"Co jsou malé perforované válečky s gumičkou, na které se při chemické ondulaci navíjejí prameny?","o":["Tyčinky na trvalou","Natáčky na spaní","Hřebeny","Sponky do vlasů"],"a":0,"e":"Perm rods neboli natáčecí tyčinky drží pramen v požadovaném tvaru během chemické trvalé."},{"name":"Ruční fén","kind":"dryer","q":"Co drží kadeřnice v ruce a směruje proud vzduchu přímo na kartáč nebo konkrétní pramen?","o":["Ruční fén","Sušák s kapucí","Kulma","Rozprašovač"],"a":0,"e":"Ruční fén umožňuje cílený proud vzduchu a práci současně s kartáčem."},{"name":"Kulatý kartáč","kind":"brush","q":"Která pomůcka má válcové tělo se štětinami a při foukané pomáhá vytvářet oblouk a objem?","o":["Kulatý kartáč","Plochý hřeben","Natáčka","Štětka na krk"],"a":0,"e":"Kulatý kartáč se používá při foukané pro napnutí pramene, zakulacení konců a objem."},{"name":"Kadeřnická pláštěnka","kind":"cape","q":"Co se zapíná kolem krku klienta, aby odstřižené vlasy a přípravky nekončily na oblečení?","o":["Kadeřnická pláštěnka","Síťka na vlasy","Ručník","Zástěra kadeřnice"],"a":0,"e":"Pláštěnka kryje oděv klienta během střihu a dalších úkonů."},{"name":"Ručník","kind":"towel","q":"Která textilie čeká u mycího boxu na odsátí vody z vlasů po oplachu?","o":["Ručník","Pláštěnka","Síťka","Objednávkový list"],"a":0,"e":"Ručník po mytí odsaje přebytečnou vodu; jeho role je jiná než u ochranné pláštěnky."},{"name":"Sponky / pinety","kind":"clips","q":"Co se používá k dočasnému oddělení pramenů a přichycení sekce, se kterou se právě nepracuje?","o":["Sponky / pinety","Natáčecí papírky","Břitva","Náhradní čepel"],"a":0,"e":"Kadeřnické sponky drží jednotlivé sekce vlasů oddělené při střihu, foukané i natáčení."},{"name":"Objednávková kniha","kind":"book","q":"Je rok 1985 a salon si vede termíny ručně. Kam se zapíše jméno, čas a služba další zákaznice?","o":["Do objednávkové knihy","Na pokladní kotouč","Na záruční list","Na docházkovou kartu"],"a":0,"e":"Objednávková kniha je jednoduchý papírový plán termínů. Kvíz záměrně netvrdí, že všechny provozovny používaly totožný formulář."}];let i=0,score=0;function art(k){let x='';const c='#f4c9b8',d='#31363f',a='#e88da0',g='#f4e6c9';
if(k==='roller')x=`<g fill='none' stroke='${a}' stroke-width='8'>${[210,300,390,480].map(y=>`<rect x='300' y='${y-25}' width='180' height='50' rx='24'/><path d='M330 ${y-25}v50M365 ${y-25}v50M400 ${y-25}v50M435 ${y-25}v50'/>`).join('')}</g>`;
if(k==='hood')x=`<path d='M285 170 Q390 55 495 170 L475 245 H305Z' fill='${g}' stroke='${d}' stroke-width='8'/><path d='M390 245v130M345 380h90' stroke='${d}' stroke-width='12'/><circle cx='390' cy='230' r='45' fill='${c}'/><path d='M345 222 Q390 160 435 222' fill='none' stroke='${a}' stroke-width='15'/>`;
if(k==='razor')x=`<path d='M220 330 L500 170 L540 205 L260 365Z' fill='${g}' stroke='${d}' stroke-width='7'/><path d='M500 170 L630 120 L645 145 L540 205Z' fill='#d7dde5' stroke='${d}' stroke-width='7'/>`;
if(k==='scissors')x=`<circle cx='300' cy='320' r='55' fill='none' stroke='${a}' stroke-width='12'/><circle cx='420' cy='320' r='55' fill='none' stroke='${a}' stroke-width='12'/><path d='M340 285 L630 120 M380 285 L620 230' stroke='${d}' stroke-width='12'/><circle cx='360' cy='285' r='13' fill='${g}'/>`;
if(k==='comb')x=`<rect x='180' y='170' width='430' height='75' rx='18' fill='${g}' stroke='${d}' stroke-width='7'/>${Array.from({length:18},(_,i)=>`<path d='M${205+i*21} 245v115' stroke='${d}' stroke-width='6'/>`).join('')}`;
if(k==='net')x=`<ellipse cx='390' cy='255' rx='170' ry='120' fill='none' stroke='${a}' stroke-width='7'/>${Array.from({length:8},(_,i)=>`<path d='M${240+i*42} 155 L${540-i*20} 355' stroke='${a}' stroke-width='3' opacity='.7'/>`).join('')}${Array.from({length:8},(_,i)=>`<path d='M${240+i*42} 355 L${540-i*20} 155' stroke='${a}' stroke-width='3' opacity='.7'/>`).join('')}`;
if(k==='spray')x=`<path d='M330 220h160l25 190H305Z' fill='${c}' stroke='${d}' stroke-width='7'/><rect x='365' y='160' width='90' height='70' rx='15' fill='${g}' stroke='${d}' stroke-width='7'/><path d='M450 175h120l40 25h-150' fill='none' stroke='${d}' stroke-width='12'/><path d='M580 190 l80 -20' stroke='${a}' stroke-width='5' stroke-dasharray='10 10'/>`;
if(k==='sink')x=`<path d='M230 170 Q390 110 550 170 L520 265 Q390 330 260 265Z' fill='${g}' stroke='${d}' stroke-width='7'/><path d='M390 290v100M310 390h160' stroke='${d}' stroke-width='10'/><path d='M385 150v-45q0-45 55-45' fill='none' stroke='${a}' stroke-width='10'/>`;
if(k==='permrod')x=`${[230,330,430].map((y,i)=>`<rect x='245' y='${y-25}' width='290' height='50' rx='20' fill='${i%2?c:g}' stroke='${d}' stroke-width='7'/><circle cx='280' cy='${y}' r='8' fill='${d}'/><circle cx='330' cy='${y}' r='8' fill='${d}'/><circle cx='380' cy='${y}' r='8' fill='${d}'/><circle cx='430' cy='${y}' r='8' fill='${d}'/><circle cx='480' cy='${y}' r='8' fill='${d}'/>`).join('')}`;
if(k==='dryer')x=`<path d='M240 175h250l90 55-90 55H240Z' fill='${g}' stroke='${d}' stroke-width='8'/><path d='M320 280 l-35 145 h80 l35-145' fill='${c}' stroke='${d}' stroke-width='8'/><path d='M580 230h95' stroke='${a}' stroke-width='10'/>`;
if(k==='brush')x=`<rect x='170' y='235' width='430' height='75' rx='35' fill='${c}' stroke='${d}' stroke-width='7'/>${Array.from({length:18},(_,i)=>`<path d='M${210+i*20} 225v-45M${210+i*20} 320v45' stroke='${d}' stroke-width='4'/>`).join('')}<rect x='600' y='252' width='110' height='40' rx='20' fill='${g}' stroke='${d}' stroke-width='7'/>`;
if(k==='cape')x=`<path d='M390 115 Q475 120 555 210 L625 430 H155 L225 210 Q305 120 390 115Z' fill='${a}' opacity='.55' stroke='${d}' stroke-width='8'/><circle cx='390' cy='145' r='42' fill='#fff4ee' stroke='${d}' stroke-width='7'/>`;
if(k==='towel')x=`<rect x='235' y='130' width='310' height='300' rx='16' fill='${g}' stroke='${d}' stroke-width='8'/><path d='M265 170h250M265 215h250' stroke='${a}' stroke-width='8'/>`;
if(k==='clips')x=`${[0,1,2].map((_,i)=>`<path d='M${225+i*120} ${180+i*30} q90 70 0 140 q-25 15 -45 -10 q70-55 15-115Z' fill='${i%2?g:c}' stroke='${d}' stroke-width='7'/>`).join('')}`;
if(k==='book')x=`<path d='M190 130h205q35 0 35 35v270H225q-35 0-35-35Z' fill='#fff9ee' stroke='${d}' stroke-width='7'/><path d='M430 165q0-35 35-35h125v270q0 35-35 35H430Z' fill='#fff9ee' stroke='${d}' stroke-width='7'/><path d='M245 205h130M245 250h130M475 205h75M475 250h75' stroke='${a}' stroke-width='7'/>`;
return `<svg viewBox='0 0 780 520' aria-label='stylizovaná kadeřnická pomůcka'><rect width='780' height='520' rx='24' fill='#fff8f4'/><path d='M30 60h720M30 455h720' stroke='#eadbd3' stroke-width='2'/>${x}</svg>`}
const bulbs=document.getElementById('bulbs'),ledger=document.getElementById('ledger');for(let n=0;n<15;n++){bulbs.innerHTML+=`<i class="bulb" data-b="${n}"></i>`;ledger.innerHTML+=`<span data-l="${n}">${String(n+1).padStart(2,'0')} TERMÍN</span>`}
function show(){let x=Q[i];document.getElementById('prog').textContent=`${String(i+1).padStart(2,'0')} / 15`;document.getElementById('name').textContent=x.name;document.getElementById('scene').innerHTML=art(x.kind);document.getElementById('q').textContent=x.q;let A=document.getElementById('answers');A.innerHTML='';[0,1,2,3].map(n=>(n+((i*3+1)%4))%4).forEach(j=>{let v=x.o[j],b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(j);A.appendChild(b)});document.getElementById('fb').style.display='none';document.getElementById('next').style.display='none'}
function answer(j){let x=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===j&&k!==x.a)b.classList.add('bad')});if(j===x.a){score++;document.querySelector(`[data-b="${i}"]`).classList.add('on')}document.querySelector(`[data-l="${i}"]`).classList.add('done');let f=document.getElementById('fb');f.style.display='block';f.innerHTML=`<b>${j===x.a?'SEDÍ.':'TADY BY SE STŘÍHALO VEDLE.'}</b> ${x.e}`;document.getElementById('next').style.display='block'}
document.getElementById('next').onclick=()=>{i++;i<Q.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=`${score} / 15`;document.getElementById('grade').textContent=score>=13?'Zrcadlo bez zaváhání':score>=9?'Salon byste zvládli':'Objednávková kniha má pár škrtanců';document.getElementById('restxt').textContent='Kvíz je postavený na konkrétních nástrojích a funkcích, ne na tvrzení, že každé kadeřnictví roku 1985 vypadalo stejně.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';document.querySelectorAll('.bulb').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.ledger span').forEach(x=>x.classList.remove('done'));show()};show();</script></body></html>
