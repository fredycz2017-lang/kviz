<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz ze školy: IV, IX, XL. Přečtete 15 římských čísel bez jediné chyby?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#d9d0c3;color:#2c2925;background-image:linear-gradient(90deg,#d2c7b8 1px,transparent 1px),linear-gradient(#d2c7b8 1px,transparent 1px);background-size:48px 48px}.wrap{max-width:1080px;margin:auto;padding:18px}header{background:#efe9df;border:1px solid #a79b8a;border-radius:16px;padding:18px;box-shadow:0 12px 24px #675d4b22}h1{margin:0;font-size:clamp(26px,4vw,43px);line-height:1.08}.sub{font-family:Arial,sans-serif;color:#655c51;line-height:1.5}.grid{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-top:18px}.monument,.paper{background:#f3eee5;border:1px solid #a99c8b;border-radius:16px}.monument{padding:16px;height:max-content;position:sticky;top:12px}.stone{height:190px;border:8px double #8c8071;border-radius:8px;background:linear-gradient(135deg,#cfc5b6,#e7dfd3);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 30px #8c807144}.glyph{font-size:52px;font-weight:700;letter-spacing:.05em;text-shadow:1px 1px 0 #fff}.steps{display:grid;gap:7px;margin-top:12px;font-family:Arial,sans-serif;font-size:12px}.steps span{border-left:5px solid #8d7d67;padding:7px 9px;background:#e7dfd3}.paper{padding:20px}.zone{font-family:Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;color:#675845}.q{font-size:clamp(22px,3vw,30px);font-weight:700;margin:12px 0 16px;line-height:1.25}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{padding:14px;border-radius:10px;border:1px solid #a99b89;background:#fffdf9;text-align:left;font-size:17px;cursor:pointer}.answer.correct{background:#e2f0e3;border-color:#517e56}.answer.wrong{background:#f3dddd;border-color:#9a4e4e}.answer.locked{pointer-events:none}.feedback{display:none;margin-top:14px;padding:12px;background:#ece5da;border-left:5px solid #80705a;line-height:1.5}.feedback.show{display:block}.next,.restart{margin-top:14px;background:#51483e;color:#fff;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4}.result{display:none;text-align:center;padding:32px}.score{font-size:58px;font-weight:700}.band{max-width:620px;margin:10px auto;font-family:Arial,sans-serif;line-height:1.5}@media(max-width:760px){.grid{grid-template-columns:1fr}.monument{position:static}.answers{grid-template-columns:1fr}.stone{height:130px}}
</style></head><body><div class="wrap"><header><h1>Kvíz ze školy: IV, IX, XL. Přečtete 15 římských čísel bez jediné chyby?</h1><p class="sub">Čistý test jedné školní dovednosti: čtení a zápis římských číslic.</p></header><div class="grid"><aside class="monument"><div class="stone"><div class="glyph" id="glyph">IV</div></div><div style="font-family:Arial,sans-serif;margin-top:10px;font-weight:700">Deska <span id="progressText">1 / 15</span></div><div class="steps"><span>I–X</span><span>DESÍTKY</span><span>KOMBINACE</span><span>LETOPOČTY</span><span>FINÁLE</span></div></aside><main class="paper"><section id="quizArea"><div class="zone" id="zoneTag"></div><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn" disabled>Vytesat další</button></section><section class="result" id="resultArea"><h2>Reliéf dokončen</h2><div class="score" id="scoreOut"></div><div class="band" id="bandOut"></div><button class="restart" id="restartBtn">Zkusit znovu</button></section></main></div></div>
<script>
const questions=[{"zone": "I–X", "roman": "IV", "q": "Jaké číslo zapisuje římské IV?", "options": ["6", "14", "4", "9"], "correct": 2, "explanation": "IV znamená 5 − 1, tedy 4."}, {"zone": "I–X", "roman": "IX", "q": "Jaké číslo zapisuje římské IX?", "options": ["9", "11", "6", "19"], "correct": 0, "explanation": "IX znamená 10 − 1, tedy 9."}, {"zone": "I–X", "roman": "XIV", "q": "Jaké číslo zapisuje XIV?", "options": ["16", "11", "19", "14"], "correct": 3, "explanation": "XIV = 10 + 4 = 14."}, {"zone": "DESÍTKY", "roman": "XL", "q": "Jaké číslo zapisuje XL?", "options": ["60", "40", "45", "90"], "correct": 1, "explanation": "XL znamená 50 − 10, tedy 40."}, {"zone": "DESÍTKY", "roman": "LXV", "q": "Jaké číslo zapisuje LXV?", "options": ["55", "75", "65", "45"], "correct": 2, "explanation": "LXV = 50 + 10 + 5 = 65."}, {"zone": "DESÍTKY", "roman": "XC", "q": "Jaké číslo zapisuje XC?", "options": ["110", "90", "60", "95"], "correct": 1, "explanation": "XC znamená 100 − 10, tedy 90."}, {"zone": "KOMBINACE", "roman": "CXL", "q": "Jaké číslo zapisuje CXL?", "options": ["140", "160", "110", "190"], "correct": 0, "explanation": "CXL = 100 + 40 = 140."}, {"zone": "KOMBINACE", "roman": "CD", "q": "Jaké číslo zapisuje CD?", "options": ["600", "450", "900", "400"], "correct": 3, "explanation": "CD znamená 500 − 100, tedy 400."}, {"zone": "KOMBINACE", "roman": "D", "q": "Jakou hodnotu má samostatné D?", "options": ["100", "500", "1000", "50"], "correct": 1, "explanation": "D je římský symbol pro 500."}, {"zone": "LETOPOČTY", "roman": "CM", "q": "Jaké číslo zapisuje CM?", "options": ["1100", "600", "900", "950"], "correct": 2, "explanation": "CM znamená 1000 − 100, tedy 900."}, {"zone": "LETOPOČTY", "roman": "MCMLXXXIX", "q": "Jaký letopočet představuje MCMLXXXIX?", "options": ["1989", "1999", "1889", "2009"], "correct": 0, "explanation": "M + CM + LXXX + IX = 1000 + 900 + 80 + 9 = 1989."}, {"zone": "LETOPOČTY", "roman": "MMXXVI", "q": "Jaké číslo je MMXXVI?", "options": ["2016", "2126", "2026", "1926"], "correct": 2, "explanation": "MMXXVI = 2000 + 20 + 6 = 2026."}, {"zone": "FINÁLE", "roman": "49", "q": "Který zápis správně vyjadřuje číslo 49?", "options": ["IL", "XXXXIX", "XLVIV", "XLIX"], "correct": 3, "explanation": "49 se standardně zapisuje XLIX: 40 + 9."}, {"zone": "FINÁLE", "roman": "94", "q": "Který římský zápis odpovídá číslu 94?", "options": ["XCIV", "ICIV", "LXXXXIV", "XCVI"], "correct": 0, "explanation": "94 = 90 + 4, tedy XCIV."}, {"zone": "FINÁLE", "roman": "444", "q": "Který zápis odpovídá číslu 444?", "options": ["CCCCXXXXIIII", "CDXLIV", "CDIVXL", "XDVLIV"], "correct": 1, "explanation": "444 = 400 + 40 + 4, tedy CDXLIV."}];
let idx=0,score=0,answered=false;
const qEl=document.getElementById('question'), aEl=document.getElementById('answers'), fbEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), progressText=document.getElementById('progressText'), zoneTag=document.getElementById('zoneTag'), quizArea=document.getElementById('quizArea'), resultArea=document.getElementById('resultArea'), scoreOut=document.getElementById('scoreOut'), bandOut=document.getElementById('bandOut'), restartBtn=document.getElementById('restartBtn');
function render(){answered=false;nextBtn.disabled=true;fbEl.classList.remove('show');const q=questions[idx];zoneTag.textContent=q.zone;progressText.textContent=`${idx+1} / ${questions.length}`;qEl.textContent=q.q;document.getElementById('glyph').textContent=q.roman;;aEl.innerHTML='';q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<strong>${String.fromCharCode(65+i)}.</strong> ${opt}`;b.onclick=()=>choose(i);aEl.appendChild(b);});}
function choose(choice){if(answered)return;answered=true;const q=questions[idx];const bs=[...document.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.add('locked');if(i===q.correct)b.classList.add('correct');if(i===choice&&i!==q.correct)b.classList.add('wrong');});const ok=choice===q.correct;if(ok)score++;fbEl.innerHTML=`<strong>${ok?'Správně.':'Tentokrát ne.'}</strong> ${q.explanation}`;fbEl.classList.add('show');nextBtn.disabled=false;}
nextBtn.onclick=()=>{idx++;if(idx>=questions.length)finish();else render();};
function finish(){quizArea.style.display='none';resultArea.style.display='block';scoreOut.textContent=`${score} / ${questions.length}`;let text='Dobrá práce.';if(score<=5)text='Tenhle svět vás trochu potrápil, ale o to víc jste si z něj odnesli.';else if(score<=10)text='Solidní výsledek. Většinu situací jste zvládli bez většího zaváhání.';else if(score<=13)text='Velmi dobré. V tomhle tématu se orientujete opravdu jistě.';else text='Výborně. Tohle už je skoro bezchybný průchod celým kvízem.';bandOut.textContent=text;}
restartBtn.onclick=()=>{idx=0;score=0;quizArea.style.display='block';resultArea.style.display='none';document.querySelectorAll('.answer').forEach(x=>x.classList.remove('locked'));render();};
render();
</script></body></html>
