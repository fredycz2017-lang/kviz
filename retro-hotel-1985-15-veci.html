<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro kvíz: Recepce, klíč, budíček. Projdete hotelem roku 1985?</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#3b2617;color:#2a1b11}body{background:radial-gradient(circle at 50% -10%,#9a7548 0,#5a3b24 35%,#27170e 100%);padding:18px}.hotel{max-width:1220px;margin:auto;border:10px solid #2a160c;box-shadow:0 28px 70px #0009;background:#c7a878;min-height:94vh;position:relative}header{padding:22px 26px;background:linear-gradient(#4c2713,#2b160c);color:#f8e8c5;border-bottom:5px solid #ba8d4d}.kicker{font:700 12px Arial;letter-spacing:.18em;color:#e7bc73}h1{margin:5px 0 7px;font-size:clamp(28px,4vw,52px);line-height:1.03}header p{margin:0;max-width:900px;color:#e6d5b8;font:16px/1.45 Arial}.lobby{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:650px}.rack{background:linear-gradient(90deg,#5f351c,#744526);padding:18px;border-right:8px solid #3a1e0f;color:#f4e2c1}.rack h2{font:900 14px Arial;letter-spacing:.16em;margin:0 0 12px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room{height:72px;background:#2d180d;border:2px solid #ad7a3d;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 13px Arial;color:#d8b37c;position:relative}.room:after{content:"";width:24px;height:8px;border-radius:50%;border:3px solid #a6783c;margin-top:6px}.room.done{background:#345132;color:#e9f5db;border-color:#84a65f}.room.done:after{background:#d3a34f;box-shadow:0 0 8px #ffe39a}.desk{padding:22px;background:repeating-linear-gradient(90deg,#d0b07d 0 18px,#c7a370 18px 36px);position:relative}.card{background:#f4e7c7;border:1px solid #9e7747;box-shadow:8px 9px 0 #7e5b32;max-width:760px;margin:auto;padding:18px;min-height:510px;position:relative}.folio{display:flex;justify-content:space-between;font:700 12px Arial;color:#71532f;border-bottom:1px dashed #ad8c5f;padding-bottom:8px}.scene{height:210px;display:flex;align-items:center;justify-content:center;margin:12px 0;background:#e8d7b3;border:1px solid #b59668}.scene svg{width:100%;height:205px}.q{font:bold 23px/1.2 Arial;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{border:2px solid #8a683e;background:#fff8e8;padding:12px;text-align:left;font:700 15px Arial;cursor:pointer;min-height:58px}.answer:hover{background:#fff1cf}.answer.good{background:#dcebcf;border-color:#517441}.answer.bad{background:#f1c9bd;border-color:#9b3d2d}.feedback{display:none;margin-top:12px;padding:11px;background:#efe0bd;border-left:5px solid #865e2f;font:15px/1.4 Arial}.feedback.show{display:block}.next{display:none;margin:12px 0 0 auto;padding:11px 17px;border:0;background:#563019;color:#fff1d3;font-weight:900;cursor:pointer}.bell{position:absolute;right:25px;top:22px;width:58px;height:42px;border-radius:50% 50% 12px 12px;background:linear-gradient(#f7da72,#9b651e);box-shadow:0 5px 0 #5f3b16}.result{display:none;text-align:center;padding:60px 30px;font-family:Arial}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#5b331b}.restart{padding:13px 20px;background:#4c2713;color:#fff;border:0;font-weight:900}@media(max-width:820px){body{padding:6px}.hotel{border-width:5px}.lobby{grid-template-columns:1fr}.rack{border-right:0;border-bottom:6px solid #3a1e0f}.rooms{grid-template-columns:repeat(5,1fr)}.room{height:52px}.room:after{display:none}.desk{padding:12px}.card{box-shadow:4px 5px 0 #7e5b32;padding:12px}.scene{height:170px}.scene svg{height:165px}.answers{grid-template-columns:1fr}.q{font-size:20px}}@media(max-width:430px){.rooms{grid-template-columns:repeat(3,1fr)}header{padding:16px}}
</style></head><body><div class="hotel"><header><div class="kicker">HOTEL 1985 // MODELOVÁ NÁVŠTĚVA</div><h1>Recepce, klíč, budíček. Projdete hotelem roku 1985?</h1><p>Patnáct situací z jedné stylizované hotelové návštěvy. Nejde o tvrzení, že každý hotel vypadal stejně — testujeme funkce známých prvků provozu.</p></header><div class="lobby"><aside class="rack"><h2>STOJAN POKOJOVÝCH KLÍČŮ</h2><div class="rooms" id="rooms"></div></aside><main class="desk"><div class="bell"></div><section class="card" id="quiz"><div class="folio"><span id="prog">HOST 01 / 15</span><span>RECEPCE // 1985</span></div><div class="scene" id="scene"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button class="next" id="next">DALŠÍ POKOJ →</button></section><section class="result" id="result"><div>POBYT UZAVŘEN</div><div class="score" id="score"></div><p id="res"></p><button class="restart" id="restart">NOVÝ PŘÍJEZD</button></section></main></div></div><script>
const questions=[{"q": "Na recepčním pultu stojí malý kovový zvonek. Co jím host udělá?", "o": ["Přivolá obsluhu recepce", "Otevře pokojovou pokladnu", "Spustí požární poplach", "Nastaví čas budíčku"], "c": 0, "e": "Recepční zvonek slouží k upozornění obsluhy u pultu.", "v": "bell"}, {"q": "Na stojanu visí masivní klíč s velkým přívěskem „214“. Co označuje?", "o": ["Číslo stolu v restauraci", "Pořadí hosta ve frontě", "Číslo hotelového pokoje", "Číslo kufru v úschovně"], "c": 2, "e": "Velký přívěsek pomáhá spojit fyzický klíč s konkrétním pokojem.", "v": "key"}, {"q": "Host při příjezdu doplní jméno a údaje do formuláře. O jakou část pobytu jde?", "o": ["Úklid pokoje", "Check-in / registraci hosta", "Telefonní budíček", "Noční uzávěrku restaurace"], "c": 1, "e": "Při check-inu recepce ověřuje nebo zapisuje údaje hosta a přiděluje pokoj.", "v": "book"}, {"q": "Host žádá: „Prosím vzbudit v 6:30.“ Co má recepce zařídit?", "o": ["Pozdní check-out", "Úschovu zavazadel", "Pokojovou službu", "Telefonní budíček"], "c": 3, "e": "Wake-up call je domluvené probuzení hosta telefonátem v určený čas.", "v": "wake"}, {"q": "Host už odevzdal pokoj, ale vlak mu jede až večer. Kam může odložit kufr?", "o": ["Do úschovy zavazadel", "Do výtahové šachty", "Za barový pult", "Do libovolného volného pokoje"], "c": 0, "e": "Úschova zavazadel řeší dočasné uložení kufrů před check-inem nebo po check-outu.", "v": "luggage"}, {"q": "Na pokoji stojí pevný telefon s číslem recepce. K čemu je v hotelovém provozu?", "o": ["K odemykání pokoje tónovou volbou", "K měření délky pobytu", "Ke spojení hosta s recepcí a hotelovými službami", "K potvrzení úklidu bez hovoru"], "c": 2, "e": "Pokojový telefon umožňuje kontaktovat recepci či další hotelová pracoviště.", "v": "phone"}, {"q": "Za recepcí je panel s čísly pokojů a stavem klíčů. Co personálu hlavně pomáhá sledovat?", "o": ["Teplotu ve všech pokojích", "Přehled pokojů a vydaných či vrácených klíčů", "Obsah hotelového menu", "Jízdní řády vlaků"], "c": 1, "e": "Klíčový stojan nebo panel je provozní pomůcka pro přehled o fyzických klíčích.", "v": "rack"}, {"q": "Zaměstnankyně mění povlečení, doplňuje ručníky a připravuje pokoj pro dalšího hosta. Kam patří?", "o": ["Recepce", "Údržba výtahu", "Směnárna", "Housekeeping / pokojská služba"], "c": 3, "e": "Přípravu a úklid pokojů zajišťuje housekeeping.", "v": "housekeeping"}, {"q": "Host se ptá, od kolika se podává snídaně. Kde má nejlogičtěji získat provozní informaci?", "o": ["V kotelně", "Na recepci nebo v informacích pro hosta", "U nouzového východu", "V úschovně prádla"], "c": 1, "e": "Recepce běžně poskytuje hostům informace o provozu hotelových služeb.", "v": "breakfast"}, {"q": "Na kolečkách přijíždí vysoký vozík s několika kufry. K čemu slouží?", "o": ["K přepravě zavazadel", "K rozvozu teplé vody", "K přepravě ložního prádla výhradně do prádelny", "K opravě výtahu"], "c": 0, "e": "Zavazadlový vozík usnadňuje přesun více kufrů mezi recepcí a pokojem.", "v": "cart"}, {"q": "Na klice pokoje visí cedulka „NERUŠIT“. Co tím host sděluje?", "o": ["Žádá okamžitý úklid", "Objednává snídani", "Žádá personál, aby do pokoje nyní nevstupoval", "Hlásí poruchu zámku"], "c": 2, "e": "Cedulka „Nerušit“ je žádost o soukromí a odložení vstupu personálu.", "v": "dnd"}, {"q": "U výtahu se rozsvítí číslo „5“. Co údaj znamená?", "o": ["Číslo hotelu v řetězci", "Počet volných pokojů", "Čas do snídaně", "Patro, ve kterém se výtah nachází nebo k němu míří"], "c": 3, "e": "Patrový indikátor informuje o poloze nebo směru výtahu.", "v": "elevator"}, {"q": "Host ráno vrací klíč, vyrovná účet a ukončuje pobyt. Jak se tato fáze jmenuje?", "o": ["Check-in", "Check-out", "No-show", "Wake-up call"], "c": 1, "e": "Check-out je odhlášení hosta a uzavření pobytu.", "v": "checkout"}, {"q": "Host právě dorazil, recepce ověřila rezervaci a předává mu klíč. Jak se tato fáze jmenuje?", "o": ["Check-out", "Housekeeping", "Check-in", "Lost and found"], "c": 2, "e": "Check-in je příjezdová registrace a přidělení pokoje.", "v": "checkin"}, {"q": "Na pokoji nesvítí lampa a recepce zapisuje požadavek k opravě. Kdo má řešit technickou závadu?", "o": ["Údržba / technický personál", "Pokojská jako jediná možnost", "Host sám bez hlášení", "Obsluha restaurace"], "c": 0, "e": "Technické závady se předávají údržbě; recepce je může přijmout a předat dál.", "v": "maintenance"}];let i=0,score=0,locked=false;const rooms=document.getElementById('rooms');for(let n=0;n<15;n++){let d=document.createElement('div');d.className='room';d.id='r'+n;d.innerHTML='<b>'+String(101+n)+'</b>';rooms.appendChild(d)}
function visual(v){let x='';const c='#6f4a2b',g='#d7ae5a',dark='#422716'; if(v==='bell')x=`<ellipse cx='300' cy='150' rx='100' ry='18' fill='#78501f'/><path d='M220 145 Q230 70 300 62 Q370 70 380 145Z' fill='#d6a94f' stroke='#7a4f1d' stroke-width='6'/><circle cx='300' cy='52' r='16' fill='#e7c36b'/>`;if(v==='key')x=`<circle cx='205' cy='105' r='42' fill='none' stroke='${g}' stroke-width='14'/><path d='M245 105 H420 v26 h-38 v30 h-35 v-30 h-102z' fill='${g}'/><rect x='420' y='76' width='100' height='70' rx='10' fill='#6b391d'/><text x='470' y='120' fill='#f1d68c' text-anchor='middle' font-size='32' font-weight='900'>214</text>`;if(v==='book')x=`<rect x='130' y='55' width='380' height='150' rx='8' fill='#f7edd3' stroke='${c}' stroke-width='5'/><path d='M320 55 v150' stroke='${c}' stroke-width='4'/><path d='M155 90 H290 M155 120 H290 M155 150 H290 M345 90 H485 M345 120 H485 M345 150 H485' stroke='#ad8d62' stroke-width='3'/>`;if(v==='wake')x=`<rect x='180' y='58' width='270' height='140' rx='20' fill='#3e2a21'/><circle cx='315' cy='128' r='55' fill='#d8c5a5'/><path d='M315 128 L315 92 M315 128 L350 145' stroke='#4e3422' stroke-width='7'/><path d='M165 70 q-55 25 -20 70 M465 70 q55 25 20 70' fill='none' stroke='#9f6f3d' stroke-width='18'/>`;if(v==='luggage')x=`<rect x='210' y='65' width='210' height='155' rx='12' fill='#744324' stroke='#3e2417' stroke-width='5'/><path d='M265 65 v-25 h100 v25' fill='none' stroke='#3e2417' stroke-width='10'/><path d='M235 100 H395 M235 135 H395' stroke='#b98449' stroke-width='5'/>`;if(v==='phone')x=`<rect x='220' y='85' width='200' height='120' rx='12' fill='#26221f'/><circle cx='320' cy='150' r='42' fill='#d7d0bf'/><circle cx='320' cy='150' r='24' fill='#26221f'/><path d='M205 80 Q320 25 435 80' fill='none' stroke='#171513' stroke-width='28' stroke-linecap='round'/>`;if(v==='rack')x=`<rect x='110' y='40' width='420' height='190' fill='#5a3019' stroke='#2c180e' stroke-width='8'/>`+Array.from({length:12},(_,k)=>`<rect x='${135+(k%4)*95}' y='${65+Math.floor(k/4)*55}' width='70' height='35' fill='#2f180d' stroke='#b7813e'/><circle cx='${170+(k%4)*95}' cy='${88+Math.floor(k/4)*55}' r='8' fill='#d1a64f'/>`).join('');if(v==='housekeeping')x=`<rect x='210' y='70' width='220' height='130' rx='8' fill='#8d765f'/><rect x='235' y='92' width='170' height='50' fill='#f2ead9'/><path d='M235 165 H405' stroke='#f2ead9' stroke-width='24'/><circle cx='245' cy='215' r='13' fill='#302116'/><circle cx='395' cy='215' r='13' fill='#302116'/>`;if(v==='breakfast')x=`<circle cx='300' cy='135' r='85' fill='#f7f0df' stroke='#9c784a' stroke-width='5'/><circle cx='300' cy='135' r='48' fill='#e4b64c'/><path d='M205 55 v160 M430 55 v160' stroke='#7a5d3d' stroke-width='9'/><path d='M445 55 v160 M420 80 h50' stroke='#7a5d3d' stroke-width='5'/>`;if(v==='cart')x=`<path d='M180 205 H460 M220 205 Q230 70 320 55 Q410 70 420 205' fill='none' stroke='#a2733e' stroke-width='10'/><rect x='245' y='110' width='150' height='80' fill='#795034'/><circle cx='220' cy='220' r='15'/><circle cx='420' cy='220' r='15'/>`;if(v==='dnd')x=`<path d='M240 70 h160 v160 h-160z' fill='#8b1e24'/><circle cx='320' cy='105' r='18' fill='#d9c28a'/><text x='320' y='160' text-anchor='middle' fill='#f7e7bf' font-size='24' font-weight='900'>NERUŠIT</text><text x='320' y='190' text-anchor='middle' fill='#f7e7bf' font-size='14'>DO NOT DISTURB</text>`;if(v==='elevator')x=`<rect x='220' y='35' width='200' height='205' fill='#6d645d' stroke='#322b27' stroke-width='8'/><path d='M320 35 v205' stroke='#322b27' stroke-width='5'/><rect x='280' y='52' width='80' height='42' fill='#151515'/><text x='320' y='83' text-anchor='middle' fill='#e8b745' font-size='30'>5</text>`;if(v==='checkout')x=`<rect x='150' y='80' width='240' height='120' fill='#f2e5c8' stroke='${c}' stroke-width='5'/><text x='270' y='125' text-anchor='middle' fill='${dark}' font-size='20'>ÚČET</text><path d='M180 150 H350 M180 172 H330' stroke='#a38258' stroke-width='4'/><path d='M430 70 l70 70 -70 70' fill='none' stroke='#8d3c28' stroke-width='16'/>`;if(v==='checkin')x=`<rect x='145' y='72' width='230' height='135' fill='#f4e7c7' stroke='${c}' stroke-width='5'/><path d='M175 105 H345 M175 135 H320 M175 165 H335' stroke='#a78961' stroke-width='4'/><path d='M405 140 H520' stroke='${g}' stroke-width='18'/><circle cx='405' cy='140' r='30' fill='none' stroke='${g}' stroke-width='12'/>`;if(v==='maintenance')x=`<path d='M220 65 l55 55 -95 95 35 35 95-95 55 55 45-45 -55-55 45-45 -35-35-45 45-55-55z' fill='#6e7780' stroke='#3a3f44' stroke-width='5'/><circle cx='395' cy='80' r='28' fill='#d9b24e'/>`;return `<svg viewBox='0 0 640 270' xmlns='http://www.w3.org/2000/svg'><rect width='640' height='270' fill='#e8d7b3'/>${x}</svg>`}
function show(){locked=false;let q=questions[i];document.getElementById('prog').textContent='HOST '+String(i+1).padStart(2,'0')+' / 15';document.getElementById('scene').innerHTML=visual(q.v);document.getElementById('q').textContent=q.q;let a=document.getElementById('answers');a.innerHTML='';q.o.forEach((t,j)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=j;b.textContent=t;b.onclick=()=>pick(j);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}
function pick(j){if(locked)return;locked=true;let q=questions[i],ok=j===q.c;if(ok)score++;document.querySelectorAll('.answer').forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');if(k===j&&k!==q.c)b.classList.add('bad')});document.getElementById('r'+i).classList.add('done');let f=document.getElementById('fb');f.textContent=q.e;f.className='feedback show';document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<15?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=score+' / 15';document.getElementById('res').textContent=score>=13?'Recepci jste prošli skoro bez zaváhání.':score>=9?'Solidní směna. Většinu hotelového provozu čtete správně.':'Modelový hotel vás párkrát zamotal. Zkuste druhý příjezd.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.room').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
