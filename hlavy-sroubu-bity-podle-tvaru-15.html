<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kvíz: Plochá, křížová, Torx, imbus. Poznáte 15 hlav šroubů a bitů jen podle tvaru?</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#24211e;color:#f3efe9;font-family:Arial,sans-serif;overflow-x:hidden}body{padding:14px;background:radial-gradient(circle at 50% -10%,#5f5142,#25211d 45%,#12110f)}.case{max-width:1200px;margin:auto;background:#3b332b;border:7px solid #151310;border-radius:18px;box-shadow:0 25px 70px #000c;overflow:hidden}header{padding:20px 24px;background:linear-gradient(#4c4136,#312a24);border-bottom:3px solid #7f6d59}.kicker{font-size:12px;letter-spacing:.15em;color:#ffbc55;font-weight:900}h1{margin:5px 0 8px;font-size:clamp(27px,4vw,48px);line-height:1.04}header p{margin:0;max-width:900px;color:#d3c9bd;line-height:1.45}.body{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px}.tray{background:#1d1b18;border:2px inset #665847;border-radius:14px;padding:14px}.tray h2{font-size:12px;letter-spacing:.14em;color:#c8bda9}.bits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bit{height:58px;background:#11110f;border:1px solid #50473e;border-radius:9px;display:grid;place-items:center;color:#5b5147;font-weight:900;position:relative}.bit.done{color:#ffc46a;border-color:#d18b33;background:#2f281f}.bit.done:after{content:'✓';position:absolute;font-size:22px}.work{background:#29241f;border:1px solid #5c5045;border-radius:14px;padding:15px;min-width:0}.progress{font-family:monospace;color:#ffbd5c;font-weight:900}.macro{margin:12px auto;max-width:620px;aspect-ratio:1.7;background:#151513;border-radius:50%;border:18px solid #595149;box-shadow:inset 0 0 0 5px #948677,0 10px 25px #0009;display:grid;place-items:center;overflow:hidden}.macro svg{width:100%;height:100%}.q{font-size:23px;font-weight:900;margin:10px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{background:#41382f;color:#fff;border:1px solid #796958;border-radius:8px;padding:13px;text-align:left;font-weight:900;cursor:pointer}.answer.good{background:#2e4b31;border-color:#7bd483}.answer.bad{background:#5a2d2a;border-color:#f48177}.feedback{display:none;margin-top:12px;padding:12px;border-left:5px solid #e39a3e;background:#383027;line-height:1.45}.feedback.show{display:block}.next{display:none;margin:12px 0 0 auto;border:0;background:#e39a3e;color:#22170a;padding:12px 18px;font-weight:1000;border-radius:8px}.result{display:none;text-align:center;padding:58px 20px}.result.show{display:block}.score{font-size:76px;font-weight:1000;color:#ffbd5c}.restart{border:0;background:#e39a3e;padding:13px 20px;font-weight:900}@media(max-width:760px){body{padding:5px}.body{grid-template-columns:1fr;padding:8px}.bits{grid-template-columns:repeat(5,1fr)}.bit{height:36px}.work{padding:9px}.macro{border-width:10px;margin:9px auto}.answers{grid-template-columns:1fr}}
</style></head><body><div class="case"><header><div class="kicker">KAZETA BITŮ // MAKRODETAIL</div><h1>Plochá, křížová, Torx, imbus. Poznáte 15 hlav šroubů a bitů jen podle tvaru?</h1><p>Žádný svěrák ani vrtačka. Makrolupa ukáže jediný profil shora a vy musíte sáhnout po správném bitu.</p></header><div class="body"><aside class="tray"><h2>VOLNÉ BITY</h2><div class="bits" id="bits"></div></aside><main class="work"><section id="quiz"><div class="progress" id="prog"></div><div class="macro" id="scene"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="fb"></div><button id="next" class="next">ZACVAKNOUT DALŠÍ →</button></section><section id="result" class="result"><h2>KAZETA KOMPLETNÍ</h2><div class="score" id="score"></div><p id="res"></p><button id="restart" class="restart">ROZSYPAT BITY</button></section></main></div></div><script>
const questions=[{"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["One-way drážka", "Phillips PH", "Drážka (slotted)", "Robertson / čtyřhran"], "c": 2, "e": "Klasická drážka je jediný přímý zářez přes hlavu šroubu.", "v": "slot", "name": "Drážka (slotted)"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Phillips PH", "Pozidriv PZ", "Torq-Set", "Drážka (slotted)"], "c": 0, "e": "Phillips má jednoduchý symetrický kříž bez dalších pomocných žeber.", "v": "phillips", "name": "Phillips PH"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Phillips PH", "Torq-Set", "XZN / Triple Square", "Pozidriv PZ"], "c": 3, "e": "Pozidriv má hlavní kříž a mezi jeho rameny ještě čtyři jemnější pomocné zářezy.", "v": "pozidriv", "name": "Pozidriv PZ"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Torx Security", "Torx", "Pentalobe", "XZN / Triple Square"], "c": 1, "e": "Torx má pravidelný šestilaločný hvězdicový profil.", "v": "torx", "name": "Torx"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Torx", "Spanner / Snake Eyes", "Torx Security", "Pentalobe"], "c": 2, "e": "Torx Security je Torx doplněný středovým čepem, takže potřebuje bit s otvorem.", "v": "torx-sec", "name": "Torx Security"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Vnitřní šestihran / imbus", "Robertson / čtyřhran", "Torx", "Trojúhelník"], "c": 0, "e": "Imbus je pravidelný vnitřní šestihran.", "v": "hex", "name": "Vnitřní šestihran / imbus"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Vnitřní šestihran / imbus", "Robertson / čtyřhran", "Trojúhelník", "Clutch Head"], "c": 1, "e": "Robertson má jednoduchý vnitřní čtyřhran.", "v": "square", "name": "Robertson / čtyřhran"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Torq-Set", "Pentalobe", "Phillips PH", "Tri-Wing"], "c": 3, "e": "Tri-Wing tvoří tři zakřivená křídla rozložená po 120 stupních.", "v": "triwing", "name": "Tri-Wing"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Spanner / Snake Eyes", "Torx Security", "Clutch Head", "One-way drážka"], "c": 0, "e": "Spanner neboli Snake Eyes tvoří dvě samostatné kruhové dírky.", "v": "spanner", "name": "Spanner / Snake Eyes"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Torx", "Tri-Wing", "Pentalobe", "XZN / Triple Square"], "c": 2, "e": "Pentalobe má pět zaoblených laloků.", "v": "pentalobe", "name": "Pentalobe"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Robertson / čtyřhran", "Trojúhelník", "Vnitřní šestihran / imbus", "Clutch Head"], "c": 1, "e": "Trojúhelníkový bezpečnostní profil má jednoduchý třístranný otvor.", "v": "triangle", "name": "Trojúhelník"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Phillips PH", "Pozidriv PZ", "Tri-Wing", "Torq-Set"], "c": 3, "e": "Torq-Set připomíná kříž, ale jeho ramena jsou vůči sobě asymetricky odsazená.", "v": "torqset", "name": "Torq-Set"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Clutch Head", "Robertson / čtyřhran", "Spanner / Snake Eyes", "One-way drážka"], "c": 0, "e": "Clutch Head má charakteristický „motýlkový“ / přesýpací profil.", "v": "clutch", "name": "Clutch Head"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Torx", "Pozidriv PZ", "XZN / Triple Square", "Vnitřní šestihran / imbus"], "c": 2, "e": "XZN neboli Triple Square má 12 výrazných vnitřních hrotů.", "v": "xzn", "name": "XZN / Triple Square"}, {"q": "Jaký profil hlavy šroubu nebo bitu ukazuje makrolupa?", "o": ["Drážka (slotted)", "One-way drážka", "Spanner / Snake Eyes", "Clutch Head"], "c": 1, "e": "One-way drážka připomíná plochý zářez, ale má zkosení, které ztěžuje povolení běžným plochým bitem.", "v": "oneway", "name": "One-way drážka"}];let i=0,score=0,locked=false;let bits=document.getElementById('bits');for(let n=0;n<15;n++){let d=document.createElement('div');d.className='bit';d.id='b'+n;d.textContent=String(n+1).padStart(2,'0');bits.appendChild(d)}
function profile(v){let p='';const c='#d8dde0',s='#768087';if(v==='slot')p=`<rect x='145' y='55' width='310' height='190' rx='92' fill='${s}'/><rect x='180' y='137' width='240' height='26' rx='7' fill='#171717'/>`;if(v==='phillips')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><path d='M270 62h60v58h58v60h-58v58h-60v-58h-58v-60h58z' fill='#171717'/>`;if(v==='pozidriv')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><path d='M270 62h60v58h58v60h-58v58h-60v-58h-58v-60h58z' fill='#171717'/><g stroke='#171717' stroke-width='18'><line x1='225' y1='75' x2='375' y2='225'/><line x1='375' y1='75' x2='225' y2='225'/></g>`;if(v==='torx'||v==='torx-sec'){let pts=[];for(let k=0;k<12;k++){let a=(-90+k*30)*Math.PI/180,r=k%2===0?92:48;pts.push(`${300+r*Math.cos(a)},${150+r*Math.sin(a)}`)}p=`<circle cx='300' cy='150' r='112' fill='${s}'/><polygon points='${pts.join(' ')}' fill='#171717'/>`+(v==='torx-sec'?`<circle cx='300' cy='150' r='18' fill='${c}'/>`:'')}if(v==='hex')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><polygon points='230,150 265,90 335,90 370,150 335,210 265,210' fill='#171717'/>`;if(v==='square')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><rect x='245' y='95' width='110' height='110' rx='6' fill='#171717' transform='rotate(2 300 150)'/>`;if(v==='triwing')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><g fill='#171717'><path d='M300 145 C255 140 235 105 250 78 C273 86 300 102 315 132Z'/><path d='M310 158 C325 200 365 212 390 193 C377 171 350 151 320 145Z'/><path d='M290 160 C270 198 232 199 210 177 C224 155 250 140 281 142Z'/></g>`;if(v==='spanner')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><circle cx='255' cy='150' r='25' fill='#171717'/><circle cx='345' cy='150' r='25' fill='#171717'/>`;if(v==='pentalobe'){let pts=[];for(let k=0;k<10;k++){let a=(-90+k*36)*Math.PI/180,r=k%2===0?92:45;pts.push(`${300+r*Math.cos(a)},${150+r*Math.sin(a)}`)}p=`<circle cx='300' cy='150' r='112' fill='${s}'/><polygon points='${pts.join(' ')}' fill='#171717'/>`}if(v==='triangle')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><polygon points='300,82 370,205 230,205' fill='#171717'/>`;if(v==='torqset')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><g fill='#171717' transform='rotate(12 300 150)'><rect x='280' y='66' width='42' height='168' rx='12'/><rect x='216' y='130' width='168' height='42' rx='12'/></g>`;if(v==='clutch')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><path d='M220 102 C265 116 277 125 300 150 C323 125 335 116 380 102 L350 150 L380 198 C335 184 323 175 300 150 C277 175 265 184 220 198 L250 150Z' fill='#171717'/>`;if(v==='xzn'){let pts=[];for(let k=0;k<24;k++){let a=(-90+k*15)*Math.PI/180,r=k%2===0?94:58;pts.push(`${300+r*Math.cos(a)},${150+r*Math.sin(a)}`)}p=`<circle cx='300' cy='150' r='112' fill='${s}'/><polygon points='${pts.join(' ')}' fill='#171717'/>`}if(v==='oneway')p=`<circle cx='300' cy='150' r='112' fill='${s}'/><path d='M185 135 H415 L380 165 H220Z' fill='#171717'/>`;return `<svg viewBox='0 0 600 300' xmlns='http://www.w3.org/2000/svg'><defs><radialGradient id='g'><stop stop-color='#f0f2f3'/><stop offset='.55' stop-color='#a7afb4'/><stop offset='1' stop-color='#626b70'/></radialGradient></defs><circle cx='300' cy='150' r='128' fill='url(#g)' stroke='#ccd1d4' stroke-width='5'/>${p}</svg>`}
function show(){locked=false;let x=questions[i];document.getElementById('prog').textContent=`BIT ${String(i+1).padStart(2,'0')} / 15`;document.getElementById('scene').innerHTML=profile(x.v);document.getElementById('q').textContent=x.q;let a=document.getElementById('answers');a.innerHTML='';x.o.forEach((t,k)=>{let b=document.createElement('button');b.className='answer';b.dataset.index=k;b.textContent=t;b.onclick=()=>answer(k);a.appendChild(b)});document.getElementById('fb').className='feedback';document.getElementById('next').style.display='none'}function answer(k){if(locked)return;locked=true;let x=questions[i],ok=k===x.c;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===x.c)b.classList.add('good');if(j===k&&j!==x.c)b.classList.add('bad')});if(ok)score++;document.getElementById('b'+i).classList.add('done');let f=document.getElementById('fb');f.className='feedback show';f.textContent=x.e;document.getElementById('next').style.display='block'}document.getElementById('next').onclick=()=>{i++;i<questions.length?show():finish()};function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').classList.add('show');document.getElementById('score').textContent=`${score} / 15`;document.getElementById('res').textContent=score>=13?'Makroprofily máte v oku.':score>=9?'Většinu kazety byste poskládali správně.':'Torx, PZ a bezpečnostní profily se ještě trochu pletou.'}document.getElementById('restart').onclick=()=>{i=0;score=0;document.querySelectorAll('.bit').forEach(x=>x.classList.remove('done'));document.getElementById('result').classList.remove('show');document.getElementById('quiz').style.display='block';show()};show();
</script></body></html>
